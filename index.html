<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="theme-color" content="#3b4fa3"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BioEdu"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style>
<title>BioEdu 8-сынып</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<style>
/* Layout: lab-notebook tool — sticky lesson rail on the left (desktop), module tabs on top, one working sheet in the middle.
   Palette from histology stains: hematoxylin blue-violet (accent) and eosin pink (highlight) on a faintly green slide-glass neutral. */
:root{
  --bg:#f3f6f3; --sheet:#ffffff; --ink:#17221d; --muted:#5b6b63; --line:#d5ddd8; --soft:#e8eeea;
  --hema:#3b4fa3; --hema-soft:#e6e9f6; --eosin:#b8406f; --eosin-soft:#f8e5ed;
  --ok:#2f7d4f; --ok-soft:#e1f1e7; --warn:#a46a12; --warn-soft:#f8eedb; --bad:#b33a3a; --bad-soft:#f7e2e2;
  --f-display:"Literata",Georgia,"Times New Roman",serif; --f-body:"PT Sans","Segoe UI",Arial,sans-serif; --f-mono:"PT Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --sheet:#161e1b; --ink:#e3ebe6; --muted:#9baba3; --line:#2b3732; --soft:#1d2723;
  --hema:#9aa9f0; --hema-soft:#232a48; --eosin:#ec8fb4; --eosin-soft:#3a2230;
  --ok:#7fd1a0; --ok-soft:#1c3326; --warn:#e8b866; --warn-soft:#3a2e17; --bad:#f09a9a; --bad-soft:#3d2121; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --sheet:#161e1b; --ink:#e3ebe6; --muted:#9baba3; --line:#2b3732; --soft:#1d2723;
  --hema:#9aa9f0; --hema-soft:#232a48; --eosin:#ec8fb4; --eosin-soft:#3a2230;
  --ok:#7fd1a0; --ok-soft:#1c3326; --warn:#e8b866; --warn-soft:#3a2e17; --bad:#f09a9a; --bad-soft:#3d2121; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--hema)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:20px;letter-spacing:.01em}
.brand h1 b{color:var(--eosin)}
.brand span{color:var(--muted);font-size:13px}
.grades{display:flex;gap:4px}
.grades button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}
.grades button[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--sheet)}
.grades button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:transparent;padding:8px 12px 9px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--eosin);font-weight:700}

/* frame */
.frame{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);align-self:start;max-height:calc(100vh - 130px);overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.rail-head{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.rail-head input{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--bg)}
.q-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px;font-weight:700}
.ls{list-style:none;margin:0;padding:0 6px 8px}
.ls button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;width:100%;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:13px;line-height:1.3}
.ls button:hover{background:var(--soft)}
.ls button[aria-current="true"]{background:var(--hema-soft);color:var(--ink);font-weight:700}
.ls .no{color:var(--muted);font-family:var(--f-mono);font-size:12px;padding-top:1px}
.ls .tag{display:inline-block;font-size:10px;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px;font-weight:700}
.tag.lab{background:var(--ok-soft);color:var(--ok)} .tag.bjb{background:var(--eosin-soft);color:var(--eosin)} .tag.tjb{background:var(--warn-soft);color:var(--warn)}
.mobile-pick{display:none}
main{min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.sheet + .sheet{margin-top:16px}
.lesson-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 20px;margin-bottom:14px}
.lesson-head h2{font-size:22px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--hema)}
.btn.pri{background:var(--hema);border-color:var(--hema);color:var(--sheet)}
.btn.sm{padding:3px 9px;font-size:13px}
.note{font-size:13px;color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.chip.a{background:var(--ok-soft);color:var(--ok)} .chip.b{background:var(--hema-soft);color:var(--hema)} .chip.c{background:var(--eosin-soft);color:var(--eosin)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:var(--r);font-size:14px;z-index:20}

/* lesson-plan tables (Word-like) */
.tw{overflow-x:auto}
table.kmzh{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.kmzh td,table.kmzh th{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
table.kmzh th{background:var(--soft);font-weight:700}
table.kmzh td.k{font-weight:700;width:24%;background:var(--soft)}
table.kmzh .stage{font-weight:700}
table.kmzh ul{margin:4px 0;padding-left:18px}
table.kmzh input.att{width:56px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;background:var(--bg)}
.cues{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0}
.cue{border:1px solid var(--line);border-radius:var(--r);text-align:center;padding:6px 4px;font-size:12px;background:var(--bg)}
.cue i{display:block;font-style:normal;font-size:30px;line-height:1.2}
.desc{margin:4px 0 0;padding-left:0;list-style:none}
.desc li::before{content:"– "}
.res a{word-break:break-word}

/* KTZh table */
table.grid{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.grid thead th{position:sticky;top:0;background:var(--soft);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
table.grid tr.qrow td{background:var(--hema-soft);font-weight:700;font-family:var(--f-display)}
table.grid tr.cur td{background:var(--eosin-soft)}
table.grid td.n{font-family:var(--f-mono);color:var(--muted);width:38px}
table.grid input[type=date]{border:1px solid var(--line);border-radius:4px;padding:2px 4px;background:var(--bg);font-size:13px}
.code{font-family:var(--f-mono);font-size:12.5px;color:var(--hema);white-space:nowrap}

/* worksheets & tasks */
.ws{display:grid;gap:16px}
.task{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.task h3{font-size:17px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.task .pts{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--eosin)}
.lines{border-bottom:1px dashed var(--line);height:26px}
.blank-table{width:100%;border-collapse:collapse;font-size:14px}
.blank-table td,.blank-table th{border:1px solid var(--line);padding:6px 8px;height:34px;text-align:left}
.blank-table th{background:var(--soft)}
.opts{list-style:none;padding:0;margin:4px 0 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.opts label{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.opts .right{color:var(--ok);font-weight:700} .opts .wrong{color:var(--bad);text-decoration:line-through}
.level-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.level{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.level h3{font-size:16px}
.level ol{margin:0;padding-left:20px;display:grid;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select{border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:var(--sheet)}

/* inclusive */
.incl-modes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.incl-modes button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer}
.incl-modes button[aria-pressed="true"]{background:var(--eosin);border-color:var(--eosin);color:var(--sheet)}
.big{font-size:22px;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;background:var(--bg)}
.card i{display:block;font-style:normal;font-size:40px}
.yn{display:flex;gap:8px;flex-wrap:wrap}
.yn button{font-size:20px;padding:8px 22px;border-radius:var(--r);border:2px solid var(--line);background:var(--sheet);cursor:pointer}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.bank span{border:1px dashed var(--hema);border-radius:4px;padding:2px 8px;color:var(--hema)}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--hema);color:var(--sheet);display:grid;place-items:center;font-weight:700}
.steps label{display:flex;gap:8px;align-items:flex-start}

/* labs */
.lab-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.lab-stage{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:12px;min-width:0}
.lab-stage canvas{width:100%;height:auto;display:block;background:var(--sheet);border-radius:4px}
.ctrl{display:grid;gap:10px;align-content:start}
.ctrl label{display:grid;gap:3px;font-size:14px}
.ctrl input[type=range]{width:100%}
.ctrl select,.ctrl input[type=number]{border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:var(--sheet)}
.readout{font-family:var(--f-mono);font-size:14px;background:var(--soft);border-radius:var(--r);padding:8px 10px;white-space:pre-wrap}
.ord{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.ord li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--sheet)}
.ord li.ok{border-color:var(--ok);background:var(--ok-soft)} .ord li.no{border-color:var(--bad);background:var(--bad-soft)}
.ord li span{flex:1}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px}
.match button{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:7px 9px;cursor:pointer;font-size:14px}
.match button.sel{border-color:var(--hema);background:var(--hema-soft)}
.match button.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.match button.err{border-color:var(--bad);background:var(--bad-soft)}
.tube-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.tube{display:grid;justify-items:center;gap:4px;font-size:12px;text-align:center;width:72px}
.ext{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ext a{border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;text-decoration:none;font-size:14px}

/* reflection catalog */
.refl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.rcard svg{width:100%;height:110px}
.rcard h3{font-size:16px}
.rcard p{margin:0;font-size:14px}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:14px;font-weight:700}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--bg);font-weight:400}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;gap:4px;align-items:center;font-weight:400;border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.wordsearch{display:inline-grid;gap:2px;font-family:var(--f-mono);font-size:16px}
.wordsearch span{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;cursor:pointer;user-select:none}
.wordsearch span.hit{background:var(--ok-soft);border-color:var(--ok)} .wordsearch span.sel{background:var(--hema-soft)}
.print-only{display:none}

@media (max-width: 980px){
  .frame{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-pick{display:flex;gap:6px;margin-bottom:12px}
  .mobile-pick select{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:7px;background:var(--sheet)}
  .lab-wrap,.two,.level-grid{grid-template-columns:minmax(0,1fr)}
}
.bnav,.sheet-menu{display:none}
@media (max-width: 760px){
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sheet);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;font-size:11px;color:var(--muted);cursor:pointer}
  .bnav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav button[aria-current="true"]{color:var(--eosin);font-weight:700}
  .sheet-menu:not([hidden]){display:block;position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.35)}
  .sheet-menu-in{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-radius:12px 12px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) 14px;display:grid;gap:4px}
  .sheet-menu-in button{border:0;background:transparent;text-align:left;padding:12px 10px;border-radius:6px;font-size:16px;cursor:pointer}
  .sheet-menu-in button[aria-current="true"]{background:var(--hema-soft);font-weight:700}
  .frame{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .top-in{padding-block:8px}
  .mobile-pick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4;background:var(--bg);padding-block:6px;margin:-6px 0 8px}
}
@media (max-width: 520px){
  .sheet{padding:14px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .cues{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand span{display:none}
}
@media print{
  .top,.rail,.mobile-pick,.actions,.noprint,body::before{display:none!important}
  .frame{display:block;padding:0}
  .sheet{border:0;padding:0}
  body,html{background:#fff;color:#000;font-family:"Times New Roman",serif;font-size:14pt}
  table.kmzh td,table.kmzh th,table.grid td,table.grid th{border:1px solid #000;color:#000;background:#fff!important}
  @page{size:A4 landscape;margin:10mm}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Bio<b>Edu</b></h1><span>7–9-сынып биология пәнін оқытуға арналған біртұтас цифрлық әдістемелік платформа</span></div>
    <div class="grades" role="group" aria-label="Сынып">
      <button type="button" id="g7" disabled title="7-сынып оқулығы (PDF) берілгенде қосылады">7-сынып</button>
      <button type="button" id="g8" aria-pressed="true">8-сынып</button>
      <button type="button" id="g9" disabled title="9-сынып оқулығы (PDF) берілгенде қосылады">9-сынып</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<div class="frame">
  <aside class="rail" aria-label="Сабақтар тізімі">
    <div class="rail-head">
      <div class="eyebrow">КТЖ · 68 сағат</div>
      <input id="railSearch" type="search" placeholder="Тақырыпты іздеу…" aria-label="Тақырыпты іздеу">
    </div>
    <div id="rail"></div>
  </aside>
  <main>
    <div class="mobile-pick">
      <button class="btn" id="prevM" type="button" aria-label="Алдыңғы сабақ">‹</button>
      <select id="mPick" aria-label="Сабақты таңдау"></select>
      <button class="btn" id="nextM" type="button" aria-label="Келесі сабақ">›</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<nav class="bnav" id="bnav" aria-label="Негізгі бөлімдер"></nav>

Т","Вакуоль","Жасушалық шырын"],"qs":{"Білу және түсіну":["«Прокариоттар» және «эукариоттар» деген түсініктерге анықтама беріңдер. Мысалдар келтіріңдер.","Жасуша органоидтерін атаңдар."],"Қолданылуы":["Жасуша қабырғасы мен ағзалардың қасиеттері арасындағы байланыс ты анықтаңдар.","Гольджи жиынтығы, тегіс және бұдыр ЭПТ рөлін салыстырыңдар."],"Талдау":["Өсімдік және жануар жасушаларындағы әртүрлі органоидтердің қалыптасу себептері туралы пікірлеріңді айтыңдар.","Суретті қарап, түсіндіріңдер."],"Синтез":["Жасуша типтерін, олардың органоидтерін, қабықша ерекшелігі мен ядроны сызба түрінде бейнелеңдер.","Ядроның рөлін бағалаңдар."],"Бағалау":["Жасушалардың қандай құрылымынсыз олардың тіршілігі мүмкін болмас еді? Неліктен бактерияларда рибосомалар мен мембраналар айқын көрінеді?","Әртүрлі типті жасушалар арасындағы туыстықты анықтап көріңдер. Олардың органоидтерін білу арқылы анықтауға бола ма?"],"Пікірталас":["Вирустар жасушадан тыс тіршіліктің болу мүмкіндігін дәлелдей ме? Осы тұжырымға «иә» және «жоқ» деп дәлел келтіріңдер."]},"gl":[["Ядро","көптеген біржасушалы және барлық көпжасушалы ағзалардың жасушаларының міндетті бөлігі."],["Ядрошық","эукариоттардың көбісінің жасушаларының ядросының ішіндегі тығыз денешік."],["Хромосомалар","гендерді тасымалдайтын және жасуша мен ағзаның тұқым қуалайтын қасиеттерін анықтайтын жасуша ядросының органоиды."],["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."],["Ферменттер","барлық тірі жасушаларда болатын және биологиялық катализатор рөлін атқаратын ерекше нәруыздар: генетикалық ақпараттар, барлық энергия және зат алмасу үдерістері жүзеге асырылады."]],"labs":[],"bjb":false,"c":["🦠 Бактерия","🧅 Пияз қабығы","🔬 Микроскоп","🧬 Ядро"],"cs":["Зертханада екі препарат шатасып қалды. Бірінші жасушада ядро жоқ, ДНҚ цитоплазмада сақина тәрізді жатыр. Екіншісінде ядро, митохондрия, хлоропласт және ірі вакуоль көрінеді.","Әр препараттың қай жасуша типіне жататынын анықта.","Шешіміңді екі белгімен дәлелде.","Екінші жасуша өсімдікке ме, жануарға ма тиесілі? Неге?"],"tb":["Прокариот пен эукариот жасушаларын салыстыру",["Белгі","Прокариот","Эукариот"],["Ядро","Мембраналы органоидтер","Рибосома","Мысалдар"]],"mc":[["Прокариоттарға жатады:",["Амёба","Бактерия","Саңырауқұлақ","Хлорелла"],1],["Нәруыз биосинтезін жүзеге асыратын органоид:",["Лизосома","Гольджи жиынтығы","Рибосома","Вакуоль"],2],["Тек өсімдік жасушасына тән құрылым:",["Митохондрия","Хлоропласт","Рибосома","Ядро"],1]],"tf":[["Бактерия жасушасында ядро болмайды",1],["Лизосомалар асқорыту ферменттеріне толы",1],["Жануар жасушасында ірі нағыз вакуоль болады",0]],"gr":["тарсия","Прокариот жасушасының құрылысын тарсия бөліктерінен құрастырып, бөліктерін атаңдар","Өсімдік жасушасының тарсиясын құрастырып, тек өсімдікке тән 3 құрылымды белгілеңдер","Жануар жасушасының тарсиясын құрастырып, органоидтердің қызметін жазыңдар"],"lab":"micro"},"2":{"n":2,"kind":"p","title":"Өсімдіктер мен жануарлардың ұлпаларын жіктеу","page":7,"sec":1,"codes":["8.4.2.1"],"goal":"Өсімдіктер мен жануарлардың ұлпаларын жіктеу","recall":"«Камбий, ксилема, флоэма, қабық, сүрек, эпидермис, эпиблема» дегеніміз не екенін еске түсіріңдер. «Ұлпа» түсінігіне анықтама беріңдер.","intro":"Ұлпа – құрылысы, шығу тегі және атқаратын қызметі бойынша ұқсас жасушалар тобы. Олардың әрбір типі белгілі бір тарихи кезеңде қалыптасты. Ұлпалар түзілгенге дейін тек төменгі сатыдағы өсімдіктер (балдырлар) мен қарапайым жануарлар (біржасушалылар немесе колония құрып тіршілік ететіндер) тіршілік етті. Жоғары сатыдағы өсімдік және жануар ағзалары әртүрлі ұлпа типтерінен құрылған (1, 2-сызбалар). Ұлпалардың әрбір типі тип тармақшаларынан тұрады. Өсімдіктерде ұлпалардың 6 типі: түзуші, негізгі, жабын, механикалық (тірек), өткізгіш және бөліп шығарушы болады (4, 5-суреттер). Түзуші ұлпа бірінші болып пайда болады. Тұқым ұрығының жасушалары осы ұлпадан тұрады. Ол барлық ұлпалар мен мүшелерді түзе","terms":["Өсімдік ұлпалары: түзуші","Негізгі","Жабын","Тірек","Өткізгіш","Бөліп шығарушы","Жануарлардың ұлпа лары: эпителий","Дәнекер","Бұлшық ет","Жүйке","Дендриттер","Аксон","Нейроглия"],"qs":{"Білу және түсіну":["«Ұлпа» түсінігіне анықтама беріңдер.","Өсімдіктерде қанша ұлпа түрлері бар?","Жануарларда қанша ұлпа түрлері бар? қолданылуы:","Өсімдіктердің жабын ұлпасының қызметін сипаттаңдар."],"Талдау":["Өсімдіктер мен жануарлардың жабын (эпителий) ұлпасының қызметін салыстырыңдар.","Өсімдіктердің өткізгіш және тірек ұлпасының қызметі мен жануарлардың дәнекер ұлпасының қызметін салыстырыңдар.","«Ұлпа қызметі» деген сызба сызып, өсімдіктер мен жануарлардың ұқсас қызмет атқаратын ұлпаларын бейнелеңдер."],"Синтез":["Өсімдіктерде қандай ұлпалар қалыптаспайтынын талқылаңдар.","Жануарларда қандай ұлпалар қалыптаспайтынын талқылаңдар.","Ұлпаны түзетін жасушалар қызметі мен олардың пішіндерінің өзара байланысы туралы эссе жазыңдар."],"Бағалау":["Өсімдік тіршілігіндегі ұлпалардың әрбір типтерінің рөлін бағалаңдар.","Қосымша ақпарат көздері мен өткен оқу жылындағы биологиядан алған білімдеріңді пайдаланып, реферат жазыңдар. Жоғары сатыдағы өсімдік топтарының (мүктер, қырықжапырақтәрізділер, ашықтұқымдылар, жабықтұқымдылар) пайда болуына қарай өсімдіктердің әртүрлі ұлпа типтерінің қалыптасуының эволюциялық ретін көрсетіңдер.","Қосымша ақпарат көздері мен өткен оқу жылындағы биологиядан алған білімдеріңді пайдаланып, реферат жазыңдар. Көпжасушалылар топтарының: губкалардың, ішекқуыстылардың, жалпақ құрттардың пайда болуына қарай жануарлардың әртүрлі ұлпа типтерінің қалыптасуының эволюциялық ретін көрсетіңдер. №1 зертханалық жұмыс. өсімдіктердің ұлпаларын жіктеу. 246-бетті қараңдар. №2 зертханалық жұмыс. Жануарлардың ұлпаларын жіктеу. 247-бетті қараңдар. 2-бөлім. Молекулалық биология"]},"gl":[["Дендрит","жүйке жасушасының тармақталған өсіндісі; жүйке импульсін нейрон денесіне өткізеді."],["Аксон","жүйке импульстарын бір жасушаның денесінен және дендриттерден келесі нейрон мен ағзаларға өткізетін нейронның ұзарған (1 м-ге дейін) цитоплазмалық өсіндісі. Акупунктура (лат. acus – ине және punctura – егу), инемен емдеу. Дененің жұмсақ тіндерінің белгілі бір нүктелеріне арнайы жасалған инелерді шаншу арқылы емдеу әдісі. Инемен емдеудің шығу тарихы Қытай, Корея, Жапония елдеріндегі ежелгі (дәстүрлі) медицинаның дамуымен тікелей байланысты."],["Нейроглия,   глия","жүйке ұлпаларының қосымша жасушаларының жиын тығы; нейрондар мен ми капиллярларының арасындағы кеңістікті толтырады."],["Шеміршек","тірек-механикалық қызмет атқаратын дәнекер ұлпаның бір түрі."],["Қозғыштық","тірі жасушалар, мүшелер мен тұтас ағзалардың тітіркендіргіш әсерін қабылдап, оларға қозу арқылы жауап беру қабілеті."],["Сіңір","қаңқа сүйектерін немесе жеке мүшелерді байланыстыратын тығыз, дәнекер ұлпалы желі және пластиналар."]],"labs":[[1,"Өсімдіктердің ұлпаларын жіктеу",246],[2,"Жануарлардың ұлпаларын жіктеу",247]],"bjb":false,"c":["🌿 Жапырақ","🦴 Сүйек","🩸 Қан","💪 Бұлшық ет"],"cs":["Оқушы микроскоппен екі препарат қарады. Біріншісінде жасушалары тығыз орналасқан, ұзынша, көлденең жолақты талшықтар көрінеді. Екіншісінде жасушалар арасында сұйық зат көп, жасушалар еркін жүзіп жүр.","Әр препарат қандай ұлпаға жатады?","Ұлпаның құрылысы мен қызметі арасындағы байланысты түсіндір.","Осы ұлпалар ағзаның қай мүшелерінде кездеседі?"],"tb":["Жануар ұлпаларының жіктелуі",["Ұлпа түрі","Құрылыс ерекшелігі","Қызметі"],["Эпителий ұлпасы","Дәнекер ұлпа","Бұлшық ет ұлпасы","Жүйке ұлпасы"]],"mc":[["Өсімдіктің өсуін қамтамасыз ететін ұлпа:",["Жабын","Түзуші (меристема)","Механикалық","Өткізгіш"],1],["Қан мен сүйек қай ұлпа түріне жатады?",["Эпителий","Бұлшық ет","Дәнекер","Жүйке"],2],["Ксилема мен флоэма қай ұлпаға жатады?",["Өткізгіш","Жабын","Негізгі","Түзуші"],0]],"tf":[["Қан – сұйық дәнекер ұлпа",1],["Жүйке ұлпасы нейрондардан тұрады",1],["Өсімдіктерде бұлшық ет ұлпасы болады",0]],"gr":["кластер","Өсімдік ұлпаларының кластерін құрып, әр түріне мысал келтіріңдер","Жануар ұлпаларының кластерін құрып, әр түріне мысал келтіріңдер","Өсімдік кезде аминқышқылдары белгілі бір ретпен химиялық байланыспен қосылады. Бірақ аминқышқылдарының қосылу реті ДНҚ-да жазылған және тұқым қуалау ақпараты деп аталады. Әрбір нәруыздың құрылысы ерекше болады. Аминқышқылдарының 20 түрі әртүрлі ретпен қосылады, олардың саны түрлі болуы мүмкін (16-сурет). Нәруыздардың молекулалары әртүрлі үйле сімде бірнеше данадан мыңдаған данаға дейінгі аминқышқылдарынан тұрады. Сондықтан нәруыздар 16-сурет. Нәруыз молекуласының дың алуантүрлілігі шексіз. Адам ағзасында нәр құрылысы уыздар","terms":["Биополимерлер","Аминқышқылдар","Тұқым қуалай тын ақпарат","Ферменттер","Гормондар","Инсулин","Гликоген","Фибриноген","Антиденелер","Оссеин","Коллаген","Актин","Миозин","Гемоглобин","Меланин"],"qs":{"Білу және түсіну":["Нәруыздарға анықтама беріңдер.","Аминқышқылдары дегеніміз не?","Тірі ағза нәруыздарының құрамына қанша аминқышқылдары кіреді?","Нәруыздар ыдыраған кезде қанша энергия бөлінеді? қолданылуы:"],"Талдау":["Аталған нәруыздардың әрқайсысының рөлін талдаңдар: коллаген, фибрин, пепсин, гемоглобин, оссеин, инсулин, меланин, актин, миозин.","Нәруыз алмасуын сызба түрінде бейнелеңдер. Олардың ағзаға тамақпен бірге түсуінен бастап (өздерінің нәруыздарын түзуі арқылы) қартаюына және энергия бөлініп ыдырауына дейін сипаттап, мүмкіндігінше ферменттер мен органоидтерді көрсетіңдер.","Нәруыздардың шексіз алуан түрлі болу себебі туралы өз пікірлеріңді айтыңдар."],"Синтез":["Әртүрлі ағзалардағы нәруыздардың түрлі қызметін критерий бойынша жүйелеңдер.","Нәруыздардың сигнал беру, жылу оқшаулау және т.б. қызметі туралы эссе жазыңдар."],"Бағалау":["«ДНҚ белгілі бір уақытта, белгілі бір жағдайда, белгілі бір ферменттерді түзу арқылы жасуша тіршілігін басқарады» деген пікірді бағалаңдар.","Неліктен микроскопиялық жасушаларда бір мезгілде жүздеген, тіпті мыңдаған алуан түрлі химиялық реакциялар жүрсе де, жасуша «жарылып» кетпейді? Яғни осы реакция өнімдері бір-бірімен ретсіз өзара әрекеттеспейтіні туралы өз пікірлеріңді айтыңдар.","Неліктен нәруыздардағы әртүрлі мономерлер – 20, ал ДНҚ молекуласында бар-жоғы 4-еу?"],"Пікірталас":["Неліктен ДНҚ жасушадағы нәруыздарды анықтайды? 3-бөлім. Тірі ағзалардың КӨПтүрлілігі"]},"gl":[["Ферменттер","барлық тірі жасушаларда болатын және биологиялық катализатор рөлін атқаратын ерекше нәруыздар: генетикалық ақпараттар, барлық энергия және зат алмасу үдерістері жүзеге асырылады."],["Гормондар","ішкі секреция бездері бөлетін биологиялық белсенді заттар. Басқа мүшелер мен ұлпаларға мақсатты әсер етеді."],["Инсулин","ұйқы безі бөлетін нәруызды гормон."],["Гликоген","глюкоза қалдықтарынан түзілген          полисахарид. Адам мен жануарлардың негізгі көмірсу қоры."],["Фибриноген","қанның ұюына қатысатын нәурыз."],["Антиденелер немесе қарсы денелер","адам мен жануарлар ағзасына енген жат бөгде ірі молекулалы протеиндік заттарға (антигендерге) қарсы иммундық реакциялар нәтижесінде түзіліп, олардың зиянды әсерлерін жоятын протеиндік заттар."],["Миозин","жуан бұлшық ет талшықтарын түзетін нәруыз."],["Гемоглобин","қанның қызыл тыныс алу пигменті. Оттекті тыныс алу мүшелерінен ұлпаларға және көмірқышқыл газын ұлпалардан тыныс алу мүшелеріне апарады."]],"labs":[],"bjb":true,"c":["🥩 Ет","🥚 Жұмыртқа ағы","💇 Шаш","🛡️ Қалқан"],"cs":["Жұмыртқаны қайнатқанда оның мөлдір ақуызы ақ түске еніп қатаяды, ал кейін қанша салқындатса да бұрынғы қалпына келмейді.","Жұмыртқа ақуызымен не болды? Бұл құбылыс қалай аталады?","Нәруыз құрылымының қандай деңгейлері бұзылды?","Неліктен жоғары температура адам ағзасы үшін қауіпті?"],"tb":["Нәруыздардың қызметтері",["Қызметі","Мысалы","Ағзадағы рөлі"],["Катализдік (ферменттік)","Тасымалдаушы","Қорғаныш","Құрылыс"]],"mc":[["Оттекті тасымалдайтын нәруыз:",["Инсулин","Гемоглобин","Кератин","Амилаза"],1],["Нәруыз құрылымының бұзылуы қалай аталады?",["Денатурация","Ренатурация","Гидролиз","Синтез"],0],["Антиденелер атқаратын қызмет:",["Қозғалыс","Қорғаныш","Энергетикалық","Құрылыс"],1]],"tf":[["Ферменттер – нәруыздар",1],["Нәруыздың мономері – нуклеотид",0],["Кератин шаш п мдіктер бөлімдерінің қалыптасу кезеңдерін талдаңдар. Олардың біртіндеп пайда болғанын дәлелдеңдер.","Жоғары сатыдағы өсімдіктердің ұлпалары мен мүшелерінің пайда болуын сызба түрінде сипаттаңдар.","Өсімдіктердің әртүрлі бөлімдерінің түрлі мүшелері пайда болу себептері туралы өз пікірлеріңді айтыңдар."],"Синтез":["Құрлығы жоқ ғаламшарда жоғары сатыдағы өсімдіктер қалыптаса ма? Талқылаңдар.","Егер мүктер тек бауыр мүктерден тұратын болса, олар жоғары сатыдағы өсімдіктерге жатқызыла ма? Бағалаңдар."],"Бағалау":["Мынадай жойылып кеткен өсімдік топтары туралы реферат жазыңдар: псилофиттер немесе риниофиттер, тұқымды қырықжапырақтар қандай жүйелік топтарға жатқызылатын еді?","Қазіргі кезде өсетін өсімдіктер: вельвичия, гинкго билоба, саговниктәрізділер, қылша (эфедра) туралы реферат жазыңдар. Олар қандай жүйелік топтарға жатады? Қандай ерекшеліктері бар? Қазақстанда табиғи жағдайда қайсылары өседі?"],"Пікірталас":["Келешекте өсімдіктердің эволюциясы жүруі мүмкін бе? Олардың қандай бағыттары болуы мүмкін? Талқылаңдар. №3 зертханалық жұмыс. өсімдік бөлімдерінің ерекше белгілерін анықтау. 248-бетті қара."]},"gl":[["Ризоидтар","тамыр қызметін атқаратын мүктердегі жіптәрізді түзілістер; қырықжапырақтардағы, қыналардағы, кейбір балдырлар мен саңырауқұлақтардағы өскіншелер."],["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."],["Аталық без","сперматозоидтер мен жыныс гормондары (тестостерон және т.б.) түзілетін аталық жыныс бездері."],["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."],["Аналық без","жұмыртқа жасушалары түзілетін және жетілетін аналық жыныс безі."],["Табан","аяқтың төменгі бөлімі."]],"labs":[[3,"Өсімдік бөлімдерінің (балдырлар, мүктәрізділер, қырықжапырақтәрізділер, ашықтұқымдылар мен жабықтұқымдылар) ерекше белгілерін анықтау",248]],"bjb":false,"c":["🌊 Балдыр","🟢 Мүк","🌿 Қырықжапырақ","🌲 Шырша"],"cs":["Экскурсия кезінде оқушылар үш өсімдік тапты: тамыры жоқ, ризоидпен бекінген жасыл кілем тәрізді өсімдік; жапырағының астыңғы бетінде қоңыр дақтары бар өсімдік; бүрлері бар мәңгі жасыл ағаш.","Әр өсімдік қай бөлімге жатады?","Қоңыр дақтар деген не, олардың қызметі қандай?","Үшеуінің ішінде құрғақ жерде тіршілікке ең жақсы бейімделгені қайсысы? Неге?"],"tb":["Өсімдік бөлімдерінің ерекше белгілері",["Бөлім","Мүшелері","Көбеюі","Мысал"],["Балдырлар","Мүктәрізділер","Қырықжапырақтәрізділер","Ашықтұқымдылар"]],"mc":[["Шын мәнінде тамыры жоқ, ризоиды бар өсімдік:",["Қырықжапырақ","Көкек зығыр мүгі","Қарағай","Бидай"],1],["Тұқымы жеміс ішінде дамитын өсімдіктер:",["Ашықтұқымдылар","Жабықтұқымдылар","Мүктер","Балдырлар"],1],["Спорангийлері жапырақтың астыңғы бетінде болатын өсімдік:",["Қырықжапырақ","Шырша","Ламинария","Раушан"],0]],"tf":[["Балдырлардың денесі – таллом",1],["Қарағай – жабықтұқымды өсімдік",0],["Мүктер спора арқылы көбейеді",1]],"gr":["постер","«Балдырлар мен мүктер» постерін жасап, ерекше белгілерін көрсетіңдер","«Қырықжапырақтәрізділер» постерін жасап, ерекше белгілерін көрсетіңдер","«Ашық және жабықтұқымдылар» постерін жасап, айырмашылығын көрсетіңдер"],"lab":"key"},"7":{"n":7,"kind":"p","title":"Саңырауқұлақтар – тірі ағзалардың ерекше патшалығы","page":30,"sec":3,"codes":["8.1.1.2"],"goal":"Саңырауқұлақтардың негізгі белгілерін сипаттау","recall":"Тірі ағзалардың қанша патшалығын бөліп көрсететінін айтыңдар. Осы патшалықтардың қандай басты ерекшеліктері бар? Өсімдіктер мен саңырауқұлақтардың қандай ұқсастықтары бар? Сапрофиттер дегеніміз не? Гликоген және хитин дегеніміз не?","intro":"Саңырауқұлақтар – тірі ағзалардың жеке патшалығы. Са ңырауқұлақтар – өсімдіктердің де, жануарлардың да белгілері бар, бірақ олардың екеуіне де жатпайтын ағзалар. Осы белгілерді кесте түрінде қарастырайық: 1-кесте. Саңырауқұлақтардағы өсімдіктер мен жануарлардың белгілерін салыстыру Саңырауқұлақтардағы өсімдіктердің Саңырауқұлақтардағы жануарлардың белгілері белгілері 1. Жасушасы қатты жасуша 1. Жасуша ішкі қабықшасы хитин қабырғасымен жабылған нен тұрады 2. Қозғалмайды, нағыз вакуолі 2. Қоректік қор заты – гликоген бар 3. Бүкіл тіршілік бойы өседі 3. Хлоропластары жоқ 4. Қоректік заттарды жануарлар 4. Дайын органикалық заттармен сияқты жемейді, денесінің бетімен қоректенеді сіңіреді 5. Спора","terms":["Қыналар төменгі сатыдағы өсімдіктерге жатады. Олардың құрылысы және тіршілік әрекеті ерекше болғандықтан","Соңғы кезде саңырауқұлақтар дүниесінің бөлімі ретінде қарастырылады. Қына денесінің екі құрамбөлігі (балдыр және саңырауқұлақ) селбесіп тіршілік етеді. Балдырлар","Мүктер","Қырықжапырақтәрізділер","Ашық тұқымдылар","Жабықтұқымдылар","Саңырау құлақтар"],"qs":{"Білу және түсіну":["Неліктен саңырауқұлақтарды жеке патшалыққа жатқызады?","Өздеріңе белгілі саңырауқұлақ топтарын атаңдар.","Саңырауқұлақтарды өсімдіктерге жатқызуға бола ма? қолданылуы:","Саңырауқұлақтардағы жануарлардың белгілері арасындағы байланысты анықтаңдар."],"Талдау":["Саңырауқұлақтардың қалыптасу кезеңдерін талдаңдар. Олардың қайсысы эволюция барысында ертерек, қайсысы кейін пайда болды?","Қалпақшалы саңырауқұлақтардың құрылысын сызба түрінде бейнелеңдер.","Саңырауқұлақтар тек споралары арқылы ғана көбеймейтінін мысалдар келтіріп дәлелдеңдер."],"Синтез":["Саңырауқұлақтар өсімдіктерге жатқызылатын болса, олар «жоғары сатыдағыларға» жатқызылатын ба еді, әлде «төменгі сатыдағыларға» ма? 3–3459 33","«Саңырауқұлақтардың табиғаттағы рөлі» деген тақырыпқа эссе жазыңдар.","Саңырауқұлақтардың адам өміріндегі рөлін бағалаңдар."],"Бағалау":["«Микориза – толыққанды орман массивтерінің қалыптасуының міндетті түрдегі жағдайы» немесе «Саңырауқұлақтар – өсімдіктердің паразиттері»; «Саңырауқұлақтар – адам және жануарлардың паразиттері» деген тақырыптардың біріне реферат жазыңдар.","Улы саңырауқұлақтармен уланудың алдын алу шаралары туралы өз пікірлеріңді айтыңдар."],"Пікірталас":["«Заманауи ғарыштық зерттеулер зең саңырауқұлақтарының спора лары ашық ғарышта да тіршілік қабілетін сақтай алатынын дәлелдеді. Ал қынадағы саңырауқұлақтың жасушалары (балдырлармен селбесіп тіршілік етуде) – ғарыш кемесінің бортынан тыс болса да, бір апта бойы тіршілігін жоймаған». Саңырауқұлақтардың жерден тыс шығу тегі туралы болжамды талқылаңдар. Әртүрлі гипотезаларға (ғылыми болжам) қатысты дәлелдер келтіріңдер."]},"gl":[["Ашытқылар","типтік мицелийі жоқ, жеке бүршіктенетін немесе бөлінетін жасушалар мен олардың колониясы түрінде болатын саңырауқұлақтардың жиналған тобы."],["Сіңір","қаңқа сүйектерін немесе жеке мүшелерді байланыстыратын тығыз, дәнекер ұлпалы желі және пластиналар."]],"labs":[],"bjb":false,"c":["🍄 Саңырауқұлақ","🍞 Зеңді нан","🍺 Ашытқы","🌳 Ағаш"],"cs":["Әжесі банкадағы тосаптың бетінде көкшіл-жасыл зең пайда болғанын байқап, зеңді қасықпен алып тастап, қалғанын жеуге болады деді.","Зең саңырауқұлақ денесінің қай бөлігі көрініп тұр?","Неліктен зеңді ғана алып тастау жеткіліксіз?","Тосапты зеңнен сақтаудың 2 жолын ұсын."],"tb":["Саңырауқұлақтардың өсімдіктер мен жануарларға ұқсастығы",["Белгі","Өсімдікке ұқсас","Жануарға ұқсас"],["Қоректенуі","Жасуша қабырғасы","Өсуі","Қор заты"]],"mc":[["Саңырауқұлақтардың жасуша қабырғасы құрамында болатын зат:",["Целлюлоза","Хитин","Крахмал","Пектин"],1],["Саңырауқұлақтың денесі:",["Таллом","Мицелий","Тамыр","Сабақ"],1],["Біржасушалы саңырауқұлақ:",["Ашытқы","Ақсаңырауқұлақ","Мукор","Пеницилл"],0]],"tf":[["Саңырауқұлақтар – гетеротрофтар",1],["Саңырауқұлақтар фотосинтез жасайды",0],["Микориза – саңырауқұлақ пен тамырдың селбесуі",1]],"gr":["тарсия","Қалпақшалы саңырауқұлақтың құрылысын тарсиядан құрастырып, бөліктерін атаңдар","Зең саңырауқұлақтарының (мукор, пеницилл) пайдасы мен зиянын тарсия-кестеге түсіріңдер","Ашытқылардың адам өміріндегі маңызын тарсия түрінде көрсетіңдер"],"lab":"key"},"8":{"n":8,"kind":"p","title":"Даражарнақты және қосжарнақты өсімдіктер","page":34,"sec":3,"codes":["8.1.1.3"],"goal":"Даражарнақты және қосжарнақты өсімдіктерді негізгі белгілеріне қарай ажырату","recall":"Гүлді өсімдіктердің бөлімдерін қанша класқа бөледі? Олардың қандай айырмашылықтары бар? Камбий дегеніміз не? Ол қандай қызмет атқарады?","intro":"Гүлді немесе жабықтұқымды өсімдіктердің бөлімдері даражарнақты және қосжарнақты өсімдіктер болып екі класқа бөлінеді. Осы екі класқа жататын өсімдіктердің айқын айырмашылығы бар. Оларды нақты қарастырайық. Тұқымның құрылысы тұқымжарнағы арқылы ажыратылады (26-сурет). Даражарнақты өсімдіктердің тұқымында тек бір тұқымжар нағы болады. Сәйкесінше, қосжарнақты өсімдіктердің тұқымында екі тұқымжарнағы бар. Әрине, ұсақ тұқымдардың тұқымжарнағының санын ажырату қиын, бірақ қосжарнақтылардың ірі тұқымдары екі жарты бөлікке – тұқымжарнағына оңай бөлінеді. Оларға: бұршақ, үрмебұршақ, жержаңғақ, грек жаңғағы, орман жаңғағы, пісте; асқабақ, қарбыз және т.б. тұқымдар жатады. Осы өсімдіктердің барлығы қос","terms":["Даражарнақты","Қосжарнақты","Кіндік және шашақ тамыр жүйесі","Жүйкелену","Камбий","Тіршілік формасы."],"qs":{"Білу және түсіну":["Гүлді өсімдіктердің екі класын атаңдар.","Олар неліктен осылай аталатынын түсіндіріңдер.","«Кіндік және шашақ тамыр жүйесі» деген терминдерді түсіндіріңдер.","Даражарнақты және қосжарнақты өсімдіктерге мысал келтіріңдер. қолданылуы:"],"Талдау":["Гүлді өсімдіктер мүшелерінің құрылысына байланысты белгілі бір класқа жатқызылуын талдаңдар.","Даражарнақты және қосжарнақты өсімдіктердің вегетативті мүшелерінің құрылысын сызба түрінде бейнелеңдер.","Сендерге белгілі қандай өсімдіктер даражарнақты, қайсысы қосжарнақтыларға жататынын мысалдар келтіріп дәлелдеңдер."],"Синтез":["Қылқанжапырақтыларды жақсы дамыған сүрегі және осы тіршілік формасында болуына байланысты қосжарнақтыларға жатқызуға бола ма? Талқылаңдар.","Критерий бойынша даражарнақты және қосжарнақты өсімдіктерді жүйелеңдер."],"Бағалау":["Жолжелкен даражарнақтылардың белгісі бар, бірақ қосжарнақты ларға жататын өсімдік. Ал қарғакөз керісінше қосжарнақтылардың белгісі бар, бірақ даражарнақтыларға жатады. Осы өсімдіктердің құрылысының ерекшелігі туралы хабарлама дайындаңдар.","Алған білімдеріңнің негізінде қандай белгілер бірінші дәрежелі болып табылатын "sec":4,"codes":["8.1.2.2"],"goal":"Әртүрлі типті тістердің құрылысы мен қызметі арасындағы байланысты және тісті күту ережелерін сипаттау","recall":"Тістер не үшін керек және олар қайда орналасқан? Неліктен адам ауру немесе жұлынған тістерінің орнын толтыруға тырысады?","intro":"Тістердің қызметі – асты тістеу және шайнау, яғни механикалық үгу. Сонымен қатар олар сөйлеуге қатысады. Тістердің құрылысы. Әрбір тістің тіс қаптамасы, мойны және түбірі болады (33-сурет). Қызылиектен шығып тұратын тіс бөлігін тіс қаптамасы деп айтады. Тістің келесі бөлігі – мойны. Ол қызылиекпен жабылған. Тістің үшінші бөлігі – түбірі. Ол тіс ұяшығына бекінген. Тістің қаптамасы мен мойны тіс цементімен қапталған. Тамыр ұшында жүйке талшықтары мен қан тамырларының жұмсақұлпасына (пульпа) түсетін тесік болады. Әрбір тіс 3 қабаттан тұрады: сыртқы – кіреуке (эмаль), ортанғы – дентин, ішкі – тістің жұмсақ ұлпасы (пульпа). Кіреуке тек тіс қаптамасын қаптайды. Бұл – ағзаның ең қатты ұлпасы. Оның ","terms":["Тіс қаптамасы","Тіс түбірі","Пульпа","Кіреуке","Ит тістер","Күрек тістер","Азу тістер","Сүт тістер","Ақыл тіс"],"qs":{"Білу және түсіну":["Ағзаға тіс не үшін қажет екенін түсіндіріңдер.","Кіреуке дегеніміз не? Ол қандай рөл атқарады?","Тістің сыртқы және ішкі бөліктері мен қабаттарын атаңдар. қолданылуы:","Тіс қаптамасы, мойны мен түбірінің қызметін сипаттаңдар."],"Талдау":["Тістің зақымдану себептері туралы пікірлеріңді айтыңдар.","33-суретті қарап, бейнеленген тіс бөліктерінің қызметін түсіндіріңдер.","Гигиена ережелерін сақтау тістерді сақтауға мүмкіндік беретінін мысалдар келтіріп дәлелдеңдер."],"Синтез":["Типтерге бөлінген тістер неліктен тек сүтқоректілерде пайда болғанын талқылаңдар.","«Адам тістерінің жеке және тарихи даму барысында өзгеруі» деген тақырыпқа эссе жазыңдар."],"Бағалау":["«Тісті сақтауға арналған жаднама» жасаңдар. Оны жарнама өнімі ретінде түрлі түсті буклет және т.б. түрінде рәсімдеңдер.","М. Әлімбаевтің: «Асығыс жеген тамақ асқазанға түскен тас сияқты» деген пікірі мен қазақ халқының «Ауру ауыз арқылы кіреді» деген мәтелін талқылаңдар және бағалаңдар. Кез келген тісте жүретін жұқпалы ауру үдерісі (инфекциялық) асқорыту мүшелеріне ғана емес, бүкіл ағзаға әсер ететінін дәлелдеңдер."]},"gl":[["Пульпа, жұмсақ ұлпа","тістің сауыты мен түбір қуысын толтыратын тіс ұлпасы."],["Сүт тістер","алғашқы тұрақсыз тістер, 14–15 жасқа қарай тұрақты тістермен алмасады."],["Тісжегі","тістің қатты ұлпасының бұзылуынан болатын ауру."],["Гигиена","өмір сүру және еңбек жағдайының адамның денсаулығына әсерін зерттейтін, аурулардың алдын алу, денсаулық сақтау және өмір сүру жасын ұзарту шараларын жасаумен айналысатын медицина саласы."]],"labs":[],"bjb":false,"c":["🦷 Тіс","🪥 Тіс щеткасы","🍬 Кәмпит","👩‍⚕️ Стоматолог"],"cs":["Арман күніне бірнеше рет газдалған сусын ішіп, кәмпит жейді, ал тісін тек таңертең тазалайды. Соңғы кезде суық су ішкенде тісі ауыратын болды.","Арманның тісінде қандай ауру басталуы мүмкін?","Ауру тістің қай қабаттарын бұзады?","Арманға 3 гигиеналық кеңес бер."],"tb":["Тіс түрлері және олардың қызметі",["Тіс түрі","Саны (ересекте)","Пішіні","Қызметі"],["Күрек тістер","Сүйір тістер","Кіші азу тістер","Үлкен азу тістер"]],"mc":[["Ересек адамда неше тұрақты тіс бар?",["20","28","32","36"],2],["Тістің ең қатты сыртқы қабаты:",["Дентин","Кіреукіс (эмаль)","Пульпа","Цемент"],1],["Тағамды ұсақтап үгітетін тістер:",["Күрек","Сүйір","Азу","Сүт"],2]],"tf":[["Сүт тістері саны – 20",1],["Пульпада қан тамырлары мен жүйкелер болмайды",0],["Тіс жегісін бактериялар туғызады",1]],"gr":["инфографика","«Тістің құрылысы» инфографикасын жасаңдар","«Тіс жегісі қалай пайда болады?» инфографикасын жасаңдар","«Тісті күту ережелері» инфографикасын жасаңдар"],"lab":"sort","srt":["Тістің құрылысы",{"Тәж":"Қызыл иектен шығып тұратын бөлігі","Мойын":"Қызыл иекпен жабылған бөлігі","Түбір":"Жақ сүйек ұяшығында орналасқан бөлігі","Пульпа":"Қан тамырлары мен жүйкелер орналасқан қуыс","Кіреукіс":"Тәжді жабатын ең қатты ұлпа"}]},"12":{"n":12,"kind":"p","title":"Адамның асқорыту жүйесінің құрылысы","page":54,"sec":4,"codes":["8.1.2.3"],"goal":"Адамның асқорыту жүйесінің құрылысы мен қызметтері арасындағы өзара байланысты анықтау","recall":"Сүтқоректілер мен адамның асқорыту жүйесінің қандай бөлімдері бар? Олар қандай ретпен орналасқан? Сүтқоректілер мен адамға асқорыту бездерінің қандай типтері тән?","intro":"Адамның асқорыту жүйесінің құрылысы. Асқорыту жолының бірінші мүшесіне ауыз қуысы жатады (36-сурет). Онда тамақ тістер арқылы ұсақталып, сілекеймен шыланады және көмірсуларға ыдырайды. Сонымен, тамақтың дәмін сезесің. Тіл – ауыз қуысында орналасқан бұлшық етті мүше. Ол жұтуға қатысады, тамақты сілекеймен араластырады және еріген заттардың дәмін анықтайды. Жұтқыншақ – бұлшық етті түтік. Одан тамақ өңешке, ол жерден асқазанға түседі. Адамның асқазаны бір бөлімді. Асқазанда асқазан сөлі түзіледі. Ол тамақ нәруыздарын аминқышқылдарына дейін ыдыратады. Тамақ асқазаннан ашішекке түседі. Ашішектің бірінші бөліміне бауыр және Сілекей Ауыз бездері қуысы Жұтқыншақ Өңеш Бауыр Көкет Асқазан Өт қабы Ұйқы","terms":["Асқорыту жүйесі","Ауыз қуысы","Жұтқыншақ","Өңеш","Асқазан","Ашішек","Тоқішек","Ұйқы безі және асқорыту бездері","Бауыр."],"qs":{"Білу және түсіну":["Адамның асқорыту жүйесінің бөлімдерін дұрыс ретпен атаңдар.","Адамның асқорыту бездерін дұрыс ретпен атаңдар.","Асқорыту мүшелері болмаса адам өмір сүре ала ма? қолданылуы:","Ағзадағы ең үлкен бездің рөлін анықтаңдар."],"Талдау":["Адамның асқорыту мүшелерінің құрылысы мен қызметі арасындағы байланысты дәлелдеңдер.","Астың асқорыту жолы бойынша жылжыған кездегі ретпен өзгеруін сызба түрінде бейнелеңдер.","36-суретті қарап, асқорыту мүшелері мен оларда жүретін үдерістерді сәйкестендіріңдер."],"Синтез":["Кестені толтырыңдар. Мүше Бөлігі (құрылысының Қызметі ерекшеліктері) Ауыз Тістер Тамақты тістеу және ұсақтау Тіл Сілекей (сілекей бездері) Жұтқыншақ Бұлшық етті түтікше Өңеш Бұлшық етті түтікше Асқазан Бұлшық еттің үш қабаты Тамақтың асқазан сөлімен араласуы Біржасушалы бездер Асқазан сөлі Бауыр Ұйқы безі Ашішектің бірінші бөлімі Ашішектің қалған бөлімі аш Ішек бүрлері Ішек Соқырішек, аппендикс Тоқішектің негізгі бөлігі тоқ Тоқішектің соңғы бөлігі Тамақтың қорытылмаған қалдықтарын жою"],"Бағалау":["Адамның асқорыту жүйесінің эволюциялық үдерісі туралы реферат жазыңдар.","«Тамақ жеу үшін емес, өмір сүру үшін тамақ жеу керек» деген ежелгі гректердің қанатты сөзін талқылап, өз пікірлеріңді айтыңдар."]},"gl":[["Өт қабы","ұзындығы 10–14 см, қабырғасы жұқа, алмұрт пішінді қалташық."],["Аппендикс","пішіні құрт тәріздес соқырішек өсіндісі."],["Аппендицит","құрт тәрізді өсіндінің (аппендикстің) ісінуі және қабынуы."],["Гликоген","глюкоза қалдықтарынан түзілген          полисахарид. Адам мен жануарлардың негізгі көмірсу қоры."],["Дәрумендер","аз мөлшерде тамақтануға, зат алмасуға және ағза тіршілігіне қажет химиялық құрамы әртүрлі органикалық заттар."],["Сіңір","қаңқа сүйектерін немесе жеке мүшелерді байланыстыратын тығыз, дәнекер ұлпалы желі және пластиналар."],["Ұлтабар, он екі елі ішек","ашішектің (асқазанның шығаберістегі тесігінен ашішекке дейінгі) бастапқы кесіндісі."]],"labs":[],"bjb":false,"c":["👄 Ауыз","🫃 Асқазан","🟤 Бауыр","🌀 Ішек"],"cs":["Нанды ұзақ шайнағанда оның дәмі тәттіленеді.","Бұл құбылыс қандай фермент әсерімен жүреді?","Крахмал қандай затқа дейін ыдырайды?","Тағамды неге асықпай, жақсылап шайнау керек?"],"tb":["Асқорыту мүшелері және олардың қызметі",["Мүше","Бөлінетін сөл/фермент","Қорытылатын зат"],["Ауыз қуысы","Асқазан","Он екі елі ішек","Ащы ішек"]],"mc":[["Қоректік заттар қанға негізінен сіңетін бөлім:",["Асқазан","Ащы ішек","Өңеш","Тік ішек"],1],["Майларды эмульгирлейтін сұйықтық:",["Сілекей","Өт","Қарын сөлі","Шырыш"],1],["Асқазан сөлінің құрамындағы қышқыл:",["Сірке","Тұз","Күкірт","Сүт"],1]],"tf":[["Сілекей амилазасы крахмалды ыдыратады",1],["Өт ұйқы безінде түзіледі",0],["Бүрлер ащы ішектің сіңіру бетін ұлғайтады",1]],"gr":["тарсия","Асқорыту жолының мүшелерін тарсиядан ретімен құрастырыңдар","Асқорыту бездері мен олардың с  сұйықтықтар ішкі орта құрамына кіретінін және олардың әрқайсысының рөлі қандай екенін түсіндіріңдер."],"Қолданылуы":["Лимфаның қызметін сипаттаңдар.","Қан, ұлпа сұйықтығы және лимфа арасындағы байланысты анықтаңдар.","Лимфа неден тұрады?","Қан плазмасы мен лимфа құрамын салыстырыңдар."],"Талдау":["Сұйықтықтардың ағзада қозғалу үдерісін талдаңдар және олардың қалай өзгеретінін айтыңдар.","1) Су; 2) көмірсулар; 3) нәруыздар (аминқышқылдар); 4) майлар (глицерин мен май қышқылдары); 5) тұздардың молекулаларының ағзаға түсуінен бастап, ағзаның ішкі ортасына дейін қозғалуының сызбасын сызыңдар.","Қан, ұлпа сұйықтығы және лимфа қызметі арасындағы айырма шылықты айтыңдар."],"Синтез":["«Гомеостаз» түсінігі жалпы ағзаүстілік сипатқа ие екенін мысалдар келтіріп дәлелдеңдер. Жасушада, популяция, түр, биогеоценоз, экожүйе, қауымдастық деңгейінде гомеостаздың болатынын дәлелдеңдер.","Біздің ағзамыздағы барлық сұйықтық өзара қалай байланысқан? Алған білімдеріңді жүйелеңдер.","Адам ағзасында үш сұйық ортаның қалыптасуының эволюциялық мәні неде?","Мынадай жағдайдың моделін жасаңдар: ағзада а) қан; ә) ұлпа сұйықтығы; б) лимфа сұйықтықтарының бірі болмай қалса, қандай өзгерістер жүреді?"],"Бағалау":["Дәрігерге қаралу жүйке жүйесі жұмысының бұзылуына байланыс ты болмаса да, диагноз қою кезінде талдауға көбінесе жұлыннан сұйықтық алады. Диагноз қоюдың осы әдісінің мәнін талдаңдар және негіздеңдер.","Буын аурулары ағза проблемасының жалпы көрінісі болып табылады деп есептейсіңдер ме? Алған білімдеріңе сүйеніп, жауаптарыңды негіздеңдер.","Жер жүзіндегі тіршілікті қолдаудағы гомеостаз құбылысының маңызын сипаттаңдар."]},"gl":[["Лимфа","қан плазмасынан оны ұлпааралық кеңістікке және одан лимфа жүйесіне сүзу арқылы түзілетін түссіз сұйықтық."],["Лимфоциттер","түйіршікті емес лейкоциттердің бір түрі."],["Капиллярлар","мүшелер мен ұлпаларға енетін ұсақ тамырлар."],["Аппендикс","пішіні құрт тәріздес соқырішек өсіндісі."],["Аппендицит","құрт тәрізді өсіндінің (аппендикстің) ісінуі және қабынуы. ұлпа жасушаларына, ал көмір қышқыл газын жасушалардан өкпеге тасымалдайды; лейко •асқорыту мүшелерінен қоректік заттарды жасуша циттер, ларға жеткізеді; тромбо- •жасушалардан зиянды заттарды шығарып тастайды; циттер •заттардың ыдырау өнімдерін бүйрекке және басқа эритро да сыртқа шығару мүшелеріне тасымалдайды; циттер •бауыр және бұлшық еттегі жылуды тері мен өкпеге тасымалдайды. Қорғаныш қызметі: 48-сурет. •ағзаны зиянды заттардан және ауру тудыратын Қанның құрамы микроағзалардан қорғайды; • микроағзалармен күресетін заттарды қалыптастырады; •дене температ","terms":["Қан","Плазма","Физиологиялық ерітінді","Эритроциттер","Тромбоциттер","Лейкоциттер","Гемоглобин","Қаназдық (анемия)","Жалған аяқтар","Лейкоцитоздық формула","Тромб","Фибриноген","Гемофилия."],"qs":{"Білу және түсіну":["Неліктен қан плазмасында әртүрлі заттар көп болатынын түсіндіріңдер.","Тромбтың қашан және қалай түзілетінін айтыңдар.","Мынадай: «физиологиялық ерітінді, гемоглобин, жалған аяқтар, лейкоцитоздықформула»деген терминдерге анықтама беріңдер.","Қан жасушаларының әрбір типінің рөлі қандай екенін анықтаңдар."],"Талдау":["Тромбтың түзілу кезеңдерін сызба түрінде талдап, бейнелеңдер.","Қан плазмасы құрамында болатын еритін нәруыздардың рөлін мысалдар келтіріп дәлелдеңдер.","Қан жасушалары құрылысының атқаратын қызметіне тәуелділігін анықтап, талдаңдар."],"Синтез":["Қанның кез келген құрамбөлігі немесе оның жасушаларының кез келген типі жойылып кетсе не болатынын талдаңдар.","«Микробатискаф арқылы қанда саяхаттау» деген тақырыпқа фантастикалық эссе жазыңдар.","Неліктен тасбақа эритроциттері он жылдай, құстардың эритроциттері бірнеше жыл, лама мен түйелердің эритроциттері 1–2 жыл, ал адамның эритроциттері бар-жоғы 4 айдай тіршілік ететіні туралы интернет желісін пайдаланып, ақпарат табыңдар."],"Бағалау":["«Омыртқасыз және омыртқалы жануарлар қатарында қан және оның элементтерінің пайда болуы мен эволюциясы» деген тақырыпқа реферат жазыңдар.","Қан құю станциясында кальцийсіздендірілген (кальцийінен айырылған) және дефибриляцияланған (фибриногеннен айырылған) қан сақталатыны белгілі. Қандай қан сақтауға және құюға, ал қайсысы қан топтарын анықтау үшін жарамды екені туралы өз пікірлеріңді айтыңдар. Жауаптарыңды негіздеңдер.","Мынадай ерекшеліктердің маңызын бағалаңдар: қаны болмайтын омыртқасыз жануарлар, қаны көкшіл түсті жануарлар, қаны түссіз жәндіктер де бар екені белгілі. Ал барлық омыртқалы жануарлардың қаны қызыл түсті. №6 зертханалық жұмыс. Түрлі ағзалар қанының формалы элементтерін зерттеу. 251-бетті қара."]},"gl":[["Эритроциттер","қанның қызыл жасушалары."],["Лейкоциттер","қызметі бойынша әртүрлі, түссіз қан жасушалары."],["Гемоглобин","қанның қызыл тыныс алу пигменті. Оттекті тыныс алу мүшелерінен ұлпаларға және көмірқышқыл газын ұлпалардан тыныс алу мүшелеріне апарады."],["Фибриноген","қанның ұюына қатысатын нәурыз."],["Гемофилия","қан ұю жүйесінің жеткіліксіздігіне байланысты туындайтын тұқым қуалайтын ауру; қанағыштық байқалады."],["Қанның ұюы","қан плазмасында фибриногеннің ерімейтін фибринге еруі нәтижесінде сұйық қанның эластикалық ұйысқан қанға айналуы."],["Фибрин","қан плазмасының құрамында болатын қанның ұюына қатысатын нәруыз."],["Анемия","қанда эритроциттердің азайып, гемоглобиннің кемуінен болатын ауру. Анестезия, жансыздану. Анестетик күшімен сезімнен айырылу. Белгілі бір жерінің ауырғанын сезбейтіндей етіп жансыздандыру."]],"labs":[[6,"Түрлі ағзалар қанының формалы элементтерін зерттеу",251]],"bjb":false,"c":["🔴 Эритроцит","⚪ Лейкоцит","🩹 Жара","🧪 Пробирка"],"cs":["Талдау нәтижесінде науқастың қанында эритроциттер мен гемоглобин мөлшері қалыптан төмен шықты. Ол тез шаршайды, бас айналады, терісі бозарған.","Науқаста қандай жағдай байқалады?","Гемоглобиннің қызметін түсіндір.","Қандай азық-түлік гемоглобинді көтеруге көмектеседі?"],"tb":["Қанның формалы элементтері",["Жасуша","Пішіні","Ядросы","Қызметі"],["Эритроцит","Лейкоцит","Тромбоцит","Плазма"]],"mc":[["Адам эритроцитінің пішіні:",["Шар","Екі жағы ойыс диск","Жұлдыз","Таяқша"],1],[" миндерге анықтама беріңдер."],"Талдау":["Ағзаның иммундық жауап беру кезеңдерінің қалыптасуын талдаңдар.","Жасушалық және гуморальдық иммунитет кезіндегі иммундық жауапты сызба түрінде талдаңдар.","Лейкоциттердің әрбір типінің ағзаға керек екенін мысалдар келтіріп дәлелдеңдер."],"Синтез":["Иммундық жасушаның кез келген түрінің жұмысы туралы эссе жазыңдар.","Фагоциттерге жалпы сипаттама беріңдер. Олардың иммунитеттегі рөлі қандай?","Жасушалық және гуморальдық иммунитет арасындағы айыр машылықты мынадай пункт бойынша атаңдар: 1) жасуша типтері (атауы); 2) қоздырғышқа жауап беру реакцияларының типтері; 3) қоздырғышқа жауап беру уақыты; 4) ағза үшін маңызы; 5) жасушалардың құрылысы мен қызметінің ерекшелігі.","«Жасушалық және ұлпалық иммунитет: әрекеттесуі, белсенді элементтер, кезеңдері, жауап беру уақыты» деген сызба сызыңдар."],"Бағалау":["Комикс немесе аниме жасаңдар: ағзаның иммундық жауап беруін көрсету үшін басты кейіпкер ретінде лейкоциттердің әртүрлі типтерін қолданыңдар.","ЖИТС ауруы емделетін ауру деп есептейсіңдер ме? Жауаптарыңды дәлелдеңдер.","Табиғаттағы иммундық реакциялардың маңызын түсіндіріңдер. Неліктен иммундық механизмдер күрделі?"]},"gl":[["Фагоцитоз","ағзаның қорғаныштық реакциясы."],["Антиденелер немесе қарсы денелер","адам мен жануарлар ағзасына енген жат бөгде ірі молекулалы протеиндік заттарға (антигендерге) қарсы иммундық реакциялар нәтижесінде түзіліп, олардың зиянды әсерлерін жоятын протеиндік заттар."],["Антигендер","ағзаға әртүрлі жолмен енген және оған қарсы жүретін иммундық реакциялар нәтижесінде адам мен жануарлар денелерінде қарсыденелер (антиденелер) түзілетін, табиғаты ағзаға жат ірі молекулалы протеиндік заттар және полисахаридтер."],["Нейтрофилдер","қорғаныштық қызмет атқаратын түйіршікті лейкоцит жасушалары."],["Моноциттер","қорғаныштық қызмет атқаратын түйіршіксіз лейкоцит жасушалары."],["Эозинофилдер","түйіршікті лейкоцит жасушаларының бір тобы."],["Иммунитет","ағзаның өзінің тұтастығын және биологиялық даралығын сақтау қабілеті; жұқпалы аурулармен ауырмау."],["Фагоциттер","микроағзаларды жоятын жасушалар тобы."]],"labs":[],"bjb":false,"c":["🛡️ Қалқан","🦠 Микроб","⚪ Лейкоцит","💉 Шприц"],"cs":["Бала саусағын тікенге кіргізіп алды. Келесі күні саусағы қызарып, ісінді, іріңдеді.","Ірің неден түзіледі?","Бұл жерде иммунитеттің қай түрі жұмыс істеді?","Фагоцитоз құбылысын кім ашты?"],"tb":["Гуморальдық және жасушалық иммунитет",["Белгі","Гуморальдық","Жасушалық"],["Негізгі жасушалар","Әсер ету тәсілі","Нысанасы","Мысал"]],"mc":[["Фагоцитозды ашқан ғалым:",["Л. Пастер","И. Мечников","Э. Дженнер","Р. Кох"],1],["Антиденелерді түзетін жасушалар:",["В-лимфоциттер","Эритроциттер","Тромбоциттер","Нейрондар"],0],["Т-лимфоциттер жетілетін мүше:",["Айырша без (тимус)","Бауыр","Бүйрек","Өкпе"],0]],"tf":[["Антиген – ағзаға бөтен зат",1],["Иммунитетке тек эритроциттер жауап береді",0],["Макрофагтар фагоцитоз жасайды",1]],"gr":["рөлдік ойын","«Фагоцитоз» процесін рөлдік ойынмен көрсетіңдер","«Антиген мен антидене» кездесуін рөлдік ойынмен көрсетіңдер","«Т-киллер жұқтырылған жасушаны жояды» көрінісін ойнаңдар"],"lab":"sir"},"19":{"n":19,"kind":"p","title":"Жұқпалы аурулар және олардың алдын алу шаралары","page":85,"sec":5,"codes":["8.4.3.1"],"goal":"Қарапайымдар, саңырауқұлақтар, бактериялар мен вирустар келтіріп шығарған аурулардың ерекшеліктерін сипаттау","recall":"Сендер қандай жұқпалы ауруларды білесіңдер? Олардың ерекшеліктері мен алдын алу шаралары қандай?","intro":"Әртүрлі паразит ағзалар жұқпаларды қоздырушылар болуы мүмкін. Ауру қоздырушылары: вирустар, бактериялар, қарапайымдар (біржасушалы ағзалар), патогендік саңырауқұлақтар. Жұқпа қоз дырушылары ағзаға әртүрлі жолмен түсуі мүмкін. Бірақ көбінесе олар адам денесіне асқорыту және тыныс алу жолдары арқылы енеді. Тері арқылы, қан соратын жәндіктер шаққан кезде, жарақаттанғанда және т.б. жағдайда енетін қоздырушылар да бар. Зақымданған ағзаға қоздырушылардың қандай топқа жататыны, қай жолмен түскені маңызды емес. Жұқпаның ағзаға қаншалықты зиян келтіруі де оның ену жолдарымен байланысты емес. Белгілі бір жұқпалар өлімге апарып соғуы мүмкін, кейбір жұқпалар аса қауіпті емес. Себебі адам ағзасы көп жағд","terms":["Жұқпалы аурулар","Қоздырушылар","Амёба дизентериясы","Фитофтороз","Тырысқақ (холера)","Күл (дифтерия)","Лейшманиоз","Герпес."],"qs":{"Білу және түсіну":["Жұқпаның жұғу жолдары дегеніміз не? Олар көбінесе қандай болады?","Ауру кезінде жекебас гигиенасын және санитарлық талаптарды не үшін сақтау керек?","«Жұқпалы аурулар», «қоздырушылар» деген терминдерге анықтама беріңдер.","Жұқпалы аурулар қоздырушыларының түрлерін сипаттаңдар."],"Талдау":["Жұқпалы аурулардың жұғу жолдарын және олардың ену жолдарының алдын алу шараларын сызба түрінде бейнелеңдер.","Орта ғасырларда және ХХ ғасырдың басында Еуропада жаппай індет (эпидемия) кезінде жұқпалы аурулардың таралу себептері туралы пікірлеріңді айтыңдар.","Ауру жұқтырудың алдын алуда жұқпа қоздырушылары туралы ақпаратқа ие болу маңыздылығын дәлелдеңдер."],"Синтез":["Параграфта сипатталған ауруларды еркін критерий бойынша жүйе леңдер.","Өмірде естіген, кең таралған жұқпалы аурулар туралы эссе жазыңдар.","Параграфта сипатталған аурулар туралы кесте-сызба сызыңдар. Міндетті құрамбөліктерін сипаттайтын кесте бағандары мен жолдарын тұжырымдаңдар.","Мынадай жағдайдың моделін жасаңдар: сендер тұратын аймаққа сырттан алып келінген қарбызда тырысқақ ауруының қоздырушылары анықталды. Сендер қандай әрекет жасайсыңдар?"],"Бағалау":["Мемлекет деңгейінде қолданылатын жұқпалы аурулардың алдын алу шаралары туралы пікірлеріңді айтыңдар. Дұрыс ретпен орналастырыңдар.","Осы бөлім бойынша алған білімдеріңді қажет деңгейге сәйкес деп есептейсіңдер ме? Сендер қаншалықты қажет ақпарат алғандарыңды бағалаңдар. Жағдайды жақсарту үшін не істеу керек? Жауаптарыңды дәлелдеңдер."]},"gl":[["Дизентерия","тоқішекті зақымдайтын және жалпы улану байқалатын өткір жұқпалы ауру (іштің өтуі)."],["Тырысқақ, холера","тырысқақ вибрионы тудыратын карантиндік ауру. Ауру адамнан, бұзылған тамақ, лас қол және т.б. арқылы жұғады."],["Гигиена","өмір сүру және еңбек жағдайының адамның денсаулығына әсерін зерттейтін, аурулардың алдын алу, денсаулық сақтау және өмір сүру жасын ұзарту шараларын жасаумен айналысатын медицина саласы."],["Тасымалдаушылары","безгек масасы."]],"labs":[],"bjb":true,"c":["🦟 Маса","🤧 Түшкіру","😷 Бетперде","🦠 Вирус"],"cs":["Сыныпта бір оқушы қызылшамен ауырып қалды. Екпе алмаған екі оқушыда бір аптадан кейін бөртпе шықты, ал екпе алғандар ауырмады.","Қызылшаның қоздырғышы кім: бактерия ма, вирус па?","Ауру қалай берілді?","Неге екпе алғандар ауырмады?"],"tb":["Жұқпалы аурулар",["Қоздырғыш тобы","Ауру мысалы","Берілу жолы","Алдын алу"],["Вирустар","Бактериялар","Саңырауқұлақтар","Қарапайымдар"]],"mc":[["Безгекті (малярияны) тудыратын:",["Вирус","Бактерия","Қарапайым (плазмодий)","Саңырауқұлақ"],2],["Туберкулездің қоздырғышы:",["Кох таяқшасы","Тұмау вирусы","Амёба","Ашытқы"],0],["Ауа-тамшы арқылы берілетін ауру:",["Тұмау","Безгек","Дизентерия","Сіреспе"],0]],"tf":[["Антибиотиктер вирустарға әсер етпейді",1],["Безгекті вирус тудырады",0],["Қолды жуу жұқпалы аурулардың алдын алады",1]],"gr":["инфографика","«Вирустық аурулар және олардың алдын алу» инфографикасын жасаңдар","«Бактериялық аурулар» инфографикасын жасаңдар","«Қарапайымдар мен саңырауқұлақтар тудыратын аурулар» инфографикасын жасаңдар"],"lab":"sir"},"20":{"n":20,"kind":"p","title":"Туа біткен және жүре пайда болған иммунитет түрлері","page":88,"sec":5,"codes":["8.1.3.6"],"goal":"Аурудың алдын алудағы вакцинацияның рөлін бағалау","recall":"Иммунитет туралы не білесіңдер? Иммунитеттің қандай түрлері бар? Неліктен қайтадан ауру жұқтырған кезде ағза көптеген жұқпалармен жеңіл күреседі? «Иммундық есте сақтауға» қандай жасушалар жауапты? Антидене және антиген дегеніміз не?","intro":"Иммунитет құбылысын лейкоциттердің алуан түрі қамтамасыз етеді. Жасушалық иммунитетті фагоциттер тез арада жүзеге асырады: микрофагтар – нейтрофилдер мен макрофагтар – моноциттер. Сонымен қатар қоздырушыларды «танитын» және «есте сақтайтын» едәуір күрделі иммунитетті Т-лимфоциттер жүзеге асырады. Олардың жұмысынан кейін В-лимфоциттер жұмыс істейді – арнайы нәруыздарды – антиденелерді жасайды. Бұл – жасушалық иммунитет. Әрбір антидене белгілі бір қоздырушыға – антигенге қарсы арнайы жасалады. Яғни бұл нақты бір «жауға» қарсы «жеке қару». Қоздырушылармен неғұрлым жиі кездессе, оны жоятын антиденелер соғұрлым тезірек жасалады. Бірақ иммунитет тек жасушалық қана емес, ұлпалық та болады. Сонымен ","terms":["Жасанды және табиғи иммунитет","Туа біткен және жүре пайда болған иммунитет","Сарысу","Аурудың алдын алатын вакциналар."],"qs":{"Білу және түсіну":["Сарысуды не үшін енгізу керек екенін түсіндіріңдер.","Өздеріңе белгілі иммунитет түрлерін атаңдар.","Жасанды және табиғи иммунитет арасында қандай айырмашылық бар? Адамзат медицина пайда болғанға дейін иммунитеттің қандай түрлеріне ие болғанын атаңдар. қолданылуы:","Адам ағзасында жұқпалы аурудың бастапқы сатысы жүріп жатқан кезде оған не енгізу керек екенін анықтаңдар."],"Талдау":["«Иммунитет түрлері» деген сызба сызыңдар. Оларды туа біткен және жүре пайда болған иммунитет деп бөліңдер. Оған жасушалық және ұлпалық иммунитетті қосыңдар.","Табиғи жүре пайда болған иммунитеттің қалыптасу үдерісін талдаңдар. Ол қандай аурулардан пайда болады?","Иммунитет түрлері арасындағы айырмашылықты көрсетіңдер."],"Синтез":["Өздеріңе белгілі вакцина мен сарысуға мысалдар келтіріңдер.","Қосымша ақпарат көздерін пайдаланып, БЦЖ, шешек, АКДС және сіреспеге қарсы екпенің қандай вакцинаға немесе сарысуға жататынын негіздеп ұсыныңдар.","Қандай жағдайда вакцина енгізуге болмайды және себебі неде? Жауаптарыңды негіздеңдер.","Жұқпалы ауру қоздырушыларының бұзылған құрамбөліктері сарысу негізі болып табылады деп ойлайсың ба? Ал вакцина ше? Жауаптарыңды дәлелдеңдер."],"Бағалау":["Иммунитет түрлері тұрғысынан неліктен сапасыз дайындалған вакцина қауіп тудыруы мүмкін екенін бағалаңдар. Оның әсерін ауру қоздырушыларының әсерімен теңестіруге бола ма? Жауаптарыңды негіздеңдер.","Табиғаттағы табиғи иммунитет түрлерінің маңызы туралы түсіндіріңдер. Неліктен Эбола вирусымен күресуде ең тиімді деп есептелетін сарысуды жылқы қанынан алғанын түсіндіріңдер.","Мынадай құбылыстардың маңызын түсіндіріңдер: энцефалит, ұйқы ауруы сияқты кейбір жұқпалардың «табиғи ошағы» бар. Неліктен осы аурулардың қоздырушыларының табиғи тасымалдаушылары, яғни жануарлар өлмейді?"]},"gl":[["Иммунитет","ағзаның өзінің тұтастығын және биологиялық даралығын сақтау қабілеті; жұқпалы аурулармен ауырмау."],["Вакцина","жұқпалы аурулардың қоздырғыштарының әлсіздендірілген (немесе өлтірілген) себіндісінен алынған медициналық препарат. Аурулардың алдын алу және емдеу мақсатында қолданылады."],["Лимфоциттер","түйіршікті емес лейкоциттердің бір түрі."],["Туа біткен дақ","терінің дамуының кемшілігі; оның белгілі бір жасушаларының шамадан тыс өсуі. Тамырлы, пигментті, сүйелді дақ болып бөлінеді."],["Есте сақтау, жады","өткен жеке тәжірибелерді қайта жаңғырту, еске түсіру қабілеті."],["Табиғи иммунитет","ағзаның туа пайда болған ауруға қарсы тұру қабілеті."]],"labs":[],"bjb":false,"c":["👶 Нәресте","🍼 Ана сүті","💉 Вакцина","🐄 Сиыр шешегі"],"cs":["1796 жылы Эдвард Дженнер сиыр шешегімен ауырған сауыншылардың адам шешегімен ауырмайтынын байқап, балаға сиыр шешегінің іріңін екті.","Дженнердің тәжірибесі иммунитеттің қай түріне негізделген?","Вакцина мен емдік сарысудың айырмашылығы неде?","Вакцинация неге бүкіл қоғам үшін маңызды?"],"tb":["Иммунитет түрлері",["Түрі","Қалай пайда болады","Мысал"],["Туа біткен","Табиғи жүре пайда болған","Белсенді жасанды (вакцина)","Енжар жасанды (сарысу)"]],"mc":[["Вакцина құрамында болады:",["Дайын антиденелер","Әлсіретілген немесе өлі қоздырғыштар","Антибиотиктер","Дәрумендер"],1],["Ана сүтімен берілетін иммунитет:",["Табиғи енжар","Жасанды белсенді","Туа біткен түрлік","Жасанды енжар"],0],["Алғашқы вакцинаны жасаған:",["Э. Дженнер","Р. Кох","А. Флеминг","И. Павлов"],0]],"tf":[["Емдік сарысуда дайын антиденелер болады",1],["Вакцина ауру бас
