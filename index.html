уіпсіз болады. Құстарға шабуыл жасайтын жыртқыштар ірі қара тұяқ тылар","terms":["Симбиоз","Мутуализм","Комменсализм (серіктестік)","Пәтерлестік."],"qs":{"Білу және түсіну":["Симбиоз дегеніміз не? Симбиоздың қандай түрлері бар және оларға анықтама беріңдер.","«Мутуализм», «комменсализм», «пәтерлестік» дегенді қалай түсінесіңдер? қолданылуы:","Мутуализм барысындағы ағзалардың өзара әсерін анықтаңдар. Оны нақты мысалдармен көрсетіңдер.","Пәтерлестік пен комменсализмді салыстырыңдар."],"Талдау":["Ағзалардың жағымды әсерлерін және олардың түрлері мен өзара айырмашылықтарын сызба түрінде бейнелеңдер.","Табиғатта симбиоздың түзілу себептері туралы өз пікірлеріңді айтыңдар."],"Синтез":["Жағымды әсерлердің әр түріне мысалдар келтіріңдер. Олардың бірбірінен қандай айырмашылықтары бар?","Жағымды әсерлердің эволюциялық маңызы қандай? Ағзалардың дамуына қандай жеңілдіктер тудырады?"],"Бағалау":["«Микориза және оның тұрақты орман бірлестігін түзудегі рөлі» тақырыбына реферат жазыңдар.","Әртүрлі жануарлардың асқорыту жүйесінде симбиозды тіршілік ететін эукариотты және прокариотты біржасушалы ағзалар болады. Құрттарда кірпікшелілер, тұяқты жануарларда кірпікшелілер мен бактериялар, жыртқыштарда бактериялар. «Симбионаттарсыз толыққанды асқорыту мүлдем болмайды», – деген жалпы түсінік туралы өз пікірлеріңді айтыңдар. Эволюция барысында мұндай қарымқатынастар қалай қалыптасады?"]},"gl":[["Симбиоз","әр түрге жататын екі ағзаның бірлесіп тіршілік ету формасы."],["Мутуализм","симбионттардың бірі екіншісіне қандай да бір пайда әкелетін симбиоздың бір түрі."],["Комменсализм, серіктестік","симбионттардың бірі басқасының есебінен оған қандай да бір зиян тигізбестен тіршілік ететін селбесудің (симбиоз) бір түрі."]],"labs":[],"bjb":false,"c":["🐝 Ара","🌸 Гүл","🦈 Акула","🐟 Балық"],"cs":["Өсімдік биті мен құмырсқа арасында қызық байланыс бар: құмырсқалар өсімдік битін жыртқыштардан қорғайды, ал бит құмырсқаларға тәтті бөліндісін береді.","Бұл қарым-қатынастың түрін анықта.","Екі жақ та пайда ала ма? Дәлелде.","Мутуализм мен комменсализмге бір-бір мысал келтір."],"tb":["Тірі ағзалардың қарым-қатынас түрлері",["Түрі","1-ағзаға","2-ағзаға","Мысал"],["Мутуализм","Комменсализм","Бәсекелестік","Бейтараптық"]],"mc":[["Екі түрге де пайдалы қарым-қатынас:",["Мутуализм","Паразитизм","Бәсекелестік","Жыртқыштық"],0],["Жабысқақ балық пен акула:",["Комменсализм","Паразитизм","Бәсекелестік","Жыртқыштық"],0],["Бұршақ тұқымдас пен түйнек бактериялары:",["Мутуализм (симбиоз)","Паразитизм","Бейтараптық","Бәсекелестік"],0]],"tf":[["Қыналар – саңырауқұлақ пен балдырдың селбесуі",1],["Бәсекелестікте екі түр де пайда көреді",0],["Бейтараптықта түрлер бір-біріне тікелей әсер етпейді",1]],"gr":["тарсия","Қарым-қатынас түрлері мен анықтамаларын тарсия арқылы сәйкестендіріңдер","Қарым-қатынас түрлері мен мысалдарды тарсия арқылы сәйкестендіріңдер","«+ / – / 0» белгілерімен қарым-қатынас кестесін тарсиядан құрастырыңдар"],"lab":"sort","srt":["Қарым-қатынас түрі және мысал",{"Мутуализм":"Ара мен гүл","Комменсализм":"Жабысқақ балық пен акула","Паразитизм":"Бит пен адам","Жыртқыштық":"Қасқыр мен қоян","Бәсекелестік":"Бір жайылымдағы сиыр мен жылқы","Бейтараптық":"Тиін мен бұлан"}]},"57":{"n":57,"kind":"p","title":"Тірі ағзалардың бір-біріне жағымсыз әсерлері","page":231,"sec":13,"codes":["8.3.1.5"],"goal":"Жыртқыш-құрбан қарым-қатынасы мысалында популяция санының өзгеру себептерін анықтау","recall":"Сендер ағзалардың өзара қарым-қатынас түрлері туралы қандай мысалдар білесіңдер? Олардың қайсыбірі жағымсыз?","intro":"Тірі ағзалардың бір-біріне жағымсыз әсері әртүрлі формада болуы мүмкін. Жыртқыштық түрлердің арасындағы кең тараған жағымсыз әсерлердің бір түрі болып табылады. Жыртқыштық дегеніміз – жануарлардың (өсімдіктердің кейбір түрлерінде де болады) бірін-бірі қорек етуі. Жырт қыштыққа мыналар мысал бола алады. Арыс тан мен киік, қасқыр мен қоян, құстар мен бу нақденелілердің және т.б. тірі ағзалардың өзара қарым-қатынасы (112-сурет). Жыртқыштық біржасушалылардың арасында да кездеседі. Жыртқыштықтың кең тараған түрі – кан 112-сурет. Жыртқыштық – нибализм, бір түрдің арасында бірін-бірі қорек жануарлардың қоректену әдісі етуі. Бұл кезде жас ағзаларды ересектерінің қорек етуі (шортан) немесе аналықтардың аталықтарды жеп қоюы (көптеген өрмекшітәрізділер мен бунақденелілер) кездеседі. Эволюция барысында «жыртқыш-жемтік» қарым-қатынасы ертеден келе жатқан тіршілік үшін күрестің бір түрі болып табылады","terms":["Жыртқыштық","Паразитизм","Бәсекелестік","Бей та раптық (нейтрализм)."],"qs":{"Білу және түсіну":["Жағымсыз қарым-қатынас дегеніміз не? Мысалдар келтіріңдер.","Жағымсыз қарым-қатынас түрлерін атаңдар. қолданылуы:","Тіршілік үшін күрес, табиғи сұрыпталу және жағымсыз қарымқатынас түрлерін атаңдар.","Жыртқыштық пен паразитизмді салыстырыңдар. Олардың ұқсастықтары мен айырмашылықтарын табыңдар."],"Талдау":["Жағымсыз қарым-қатынастың қалыптасу себептері туралы өз пікірлеріңді айтыңдар.","Жағымсыз қарым-қатынастар эволюциялық түр түзілуге әсер ететінін мысалдар келтіре отырып дәлелдеңдер."],"Синтез":["Жағымсыз қарым-қатынастарды белгілері бойынша жіктеңдер.","Экожүйенің тұрақтылығын сақтаудағы жағымсыз қарым-қатынастардың рөлі туралы эссе жазыңдар."],"Бағалау":["Паразитизм пайда болуының эволюциялық механизмі туралы өз пікірлеріңді айтыңдар.","Көптеген зерттеушілердің пікірі бойынша, неліктен жыртқыштар немесе симбионаттар паразитті тіршілік етуге көшеді? Бұл құбылысты талқылаңдар.","Табиғаттағы жағымсыз қарым-қатынастардың маңызын бағалаңдар. Жағымсыз қарым-қатынасы жоқ экожүйе болуы мүмкін бе? Өз болжамдарыңды дәлелдеңдер және талқылаңдар."],"Пікірталас":["«Паразиттерсіз өмір» болуы мүмкін бе? Осы тақырыпқа сыныпта пікірталас ұйымдастырыңдар."]},"gl":[["Паразиттік аурулар","инвазиялық аурулар."],["Жұмыртқа","жұп аталық жыныс безі."]],"labs":[],"bjb":false,"c":["🐺 Қасқыр","🐇 Қоян","🦠 Паразит","📉 График"],"cs":["Канадада 90 жыл бойы терісі сатып алынған сілеусін мен ақ қоян санының өзгерісі тіркелген: қоян көбейгеннен кейін 1–2 жылдан соң сілеусін көбейіп, кейін қоян саны азайған.","Неге сілеусін саны қоян санынан кейін өзгереді?","Қоян саны азайғанда сілеусінмен не болады?","Жыртқыштар популяция үшін қандай пайда әкеледі?"],"tb":["Жағымсыз қарым-қатынас түрлері",["Түрі","Сипаттамасы","Мысал"],["Жыртқыштық","Паразитизм","Бәсекелестік","Аменсализм"]],"mc":[["Жыртқыш пен жемтік санының өзгерісі:",["Циклдік, кешігумен","Мүлдем өзгермейді","Бір мезетте өседі","Тек жыртқыш өседі"],0],["Эндопаразит:",["Жалпақ құрт (таспа құрт)","Бит","Кене","Бүрге"],0],["Бәсекелестік күшті болады:",["Бір экологиялық тауашадағы түрлер арасында","Әртүрлі ортадағы түрлер арасында","Продуцент пен редуцент арасында","Ешқашан"],0]],"tf":[["Жыртқыштар ауру және әлсіз жемтіктерді жиі ұстайды",1],["Паразит әдетте иесін бірден өлтіреді",0],["Бәсекелестік – түрішілік және түраралық болады",1]],"gr":["зерттеу","«Жыртқыш–жемтік» модельдеу ойынын (карточкалармен) өткізіп, нәтижені кестеге түсіріңдер","Нәтижелер бойынша популяция санының графигін салыңдар","Табиғаттағы «жыртқыш–жемтік» мысалдарын Қазақстан фаунасынан келтіріңдер"],"lab":"predator"},"58":{"n":58,"kind":"p","title":"Тірі ағзалардың қоршаған орта жағдайларына бейімделуі","page":234,"sec":13,"codes":["8.3.1.7"],"goal":"Тірі ағзалардың қоршаған ортаның өзгермелі жағдайларына бейімделу механизмдерін түсіндіру","recall":"Бейімделу деген не? Сендер бейімделудің қандай түрлерін білесіңдер? Жануарлар мен өсімдіктердің тіршілігін қандай факторлар шектейді?","intro":"Бейімделгіштік – тірі ағзалардың қоршаған ортаның нақты бір жағдайында тірі қалу мүмкіндігін арттыратын құрылысындағы, мінезқұлқындағы, физиологиясындағы қасиеттері. Барлық тірі ағзалардың міндеті – тіршілік үшін күресте өз экология лық қуысын табу. Сонымен, эволюция нәтижелерінің бірі – тірі ағзалардың қоршаған орта жағдайларына бейімделуі. Қоршаған орта – өзара күрделі әрекет ететін және бір-біріне әсер көрсететін жанды (тірі) және жансыз (өлі) нысандардың кешені. Орманда мекендейтін қоян өсімдіктермен және түлкімен тікелей әрекеттеседі. Топырақпен, топырақ ылғалының мөлшерімен жанама (өсімдіктер арқылы) әсерлеседі. Кез келген жануарлар мен өсімдіктер бейімделгіштікке мысал болып табылады.","terms":["Бейімделу","Экологиялық қуыс","Суккуленттер","Жы лу сүйгіш","Суыққа төзімді ағзалар","Ылғалсүйгіш","Құр ғақ шылыққа төзімді ағзалар"],"qs":{"Білу және түсіну":["Шектеуші, оптималды және максималды факторларға анықтама беріңдер.","Шөл өсімдіктерінің қоршаған орта жағдайларына бейімделуін сипаттаңдар. қолданылуы:","Қызыл балдырлардың үлкен тереңдікке түсу себебін айтыңдар.","Қандай ағзалар дене температурасын қалыпты сақтайды, ал қайсылары жоқ."],"Талдау":["Неліктен солтүстікте (борсық, аю) және ыстық аймақтарда жануарлар мекендейтін (дала тасбақасы) ұйқыға кетеді?","Неге көптеген шөл өсімдіктерінің жапырақтары өзгеріске ұшыраған?"],"Синтез":["Ағзалардың белгілі абиотикалық жағдайларға бейімделуіне мысалдар келтіріңдер."],"Бағалау":["Түйелердің түйе тікенді және кесірткелердің шөл өсімдіктерінің етжеңді жапырақтарын жеуі туралы өз пікірлеріңді айтыңдар.","Тірі ағзалардың экстремалды температурада тірі қалуына көмектесетін механизмдер туралы талқылаңдар. 14-бөлім. Адам қызметінің қоршаған ортаға әсері"]},"gl":[["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."]],"labs":[],"bjb":true,"c":["🐫 Түйе","🐻‍❄️ Ақ аю","🌵 Кактус","🦎 Кесіртке"],"cs":["Түйе шөлде 2 аптаға дейін сусыз жүре алады, ал ақ аю –40 °C аязда тоңбайды.","Түйенің шөлге 3 бейімделуін ата.","Ақ аюдың суыққа 3 бейімделуін ата.","Бейімделудің физиологиялық, морфологиялық және мінез-құлықтық түрлеріне мысал келтір."],"tb":["Ағзалардың бейімделу түрлері",["Түрі","Сипаттамасы","Мысал"],["Морфологиялық","Физиологиялық","Мінез-құлықтық","Қорғаныш бояу (мимикрия)"]],"mc":[["Кактус жапырағының тікенге айналуы:",["Морфологиялық бейімделу","Мінез-құлықтық","Физиологиялық","Мутация"],0],["Аюдың қысқы ұйқысы:",["Физиологиялық-мінез-құлықтық бейімделу","Морфологиялық","Мимикрия","Комменсализм"],0],["Зиянсыз шыбынның араға ұқсауы:",["Мимикрия"," іну":["Неліктен адамдардың табиғатқа әсері артып отырғанын түсіндіріңдер.","Табиғи ресурстарды тиімді пайдалану дегенді қалай түсінесіңдер? қолданылуы:","Дүниежүзілік тұқым банкінің атқаратын қызметін сипаттаңдар. 16–3459 241","Көмірқышқыл газының, фреонның, күкірт пен азот оксидтерінің ауаға бөлінуі мен адамзаттың жаһандық экологиялық мәселелері: озон қабатының тесілуі, қышқыл жауын, жылыжайлық әсер арасында қандай байланыс бар екенін анықтаңдар."],"Талдау":["Адамдардың табиғатқа жағымсыз әсерлерінен туындайтын мәселелер, оның себеп-салдарын сызба түрінде бейнелеңдер.","Неліктен адамзаттың ғылымдағы ашқан жаңалықтары, жаңа тех нологиялар осы уақытқа дейін экологиялық мәселелерді шеше алмау себептері туралы өз пікірлеріңді айтыңдар.","Әрбір адам табиғатты сақтауға өз үлестерін қоса алатындығына мысалдар келтіріп дәлелдеңдер."],"Синтез":["Дүниежүзілік тұқым банкі мен ертеден келе жатқан Н.И. Вавиловтың дүниежүзілік тұқымдар топтамасының ұқсастығы мен айырмашылығын жүйелеңдер.","Талқылаңдар: 1) Қандай дамыған елдерде жылыжайлық әсер өте қауіпті және неліктен? 2) Қолда бар биологиялық алуантүрлілікті адамзат сақтай ала ма? 3) Жағдайды модельдеңдер:«Адамзат жаңа, экологиялық таза, тегін және таусылмайтын энергия көзін тапты». Бұның экология және экономика саласына қандай әсері болады?"],"Бағалау":["Экологиялық мәселелерді шешу және одан сақтандыру туралы «Рим клубы» ұйымы, Киото хаттамасы құжатын (ол қашан күшіне енді?) қашан және қандай мақсатта халықаралық Greenpeace ұйымы құрылғанын айта отырып реферат жазыңдар."]},"gl":[["Қышқыл жаңбыр","ауа құрамында SO2, NO2, HCl және т.б. өнеркәсіптік шығарындылар болғандықтан қышқылданған атмосфералық жауын-шашын."],["Генетика","ағзалардың тұқым қуалау және өзгергіштік заңдары мен оларды басқару әдістері туралы ғылым."],["Соңғы ми, үлкен ми","үлкен ми сыңарларын түзетін мидың ең ірі және басты бөлімі; мидың басқа бөлімдерінің және жұлынның қызметін басқаратын ОЖЖнің жоғары бөлімі."]],"labs":[],"bjb":false,"c":["🌍 Жер","🏭 Зауыт", ы, цистит жатады. Себептері: тоңу, инфекциялар, су аз ішу, тұзды тағам. Бүйрек істен шыққанда гемодиализ (жасанды бүйрек) немесе трансплантация қолданылады. Жеткілікті су ішу, тоңбау, гигиена – алдын алудың негізі.","recall":"Бүйрек неге ауырады? Неге суық жерге отыруға болмайды?","cs":["Оқушы қыста мұздай орындыққа ұзақ отырды. Бірнеше күннен кейін белі ауырып, дене қызуы көтерілді, зәр шығару ауыр болды.","Қандай ауру басталуы мүмкін?","Бұл аурудың себебі қандай?","Алдын алудың 3 ережесін жаз."],"tb":["Зәр шығару жүйесінің аурулары",["Ауру","Себебі","Белгілері","Алдын алу"],["Пиелонефрит","Цистит","Бүйрек тас ауруы","Бүйрек жеткіліксіздігі"]],"mc":[["Бүйрек жеткіліксіздігінде қанды тазарту әдісі:",["Гемодиализ","Рентген","УДЗ","Флюорография"],0],["Бүйрек тас ауруының қаупін азайтады:",["Жеткілікті су ішу","Тұзды көп жеу","Аз қозғалу","Су аз ішу"],0],["Пиелонефриттің жиі себебі:",["Бактериялық инфекция және тоңу","Дәрумендер","Спорт","Жеміс жеу"],0]],"tf":[["Тоңу бүйрек қабынуына себеп болуы мүмкін",1],["Бүйрек тасының пайда болуына су көп ішу себеп болады",0],["Гемодиализ бүйрек жұмысын уақытша алмастырады",1]],"gr":["инфографика","«Бүйректі қалай күтеміз?» инфографикасын жасаңдар","«Гемодиализ қалай жұмыс істейді?» сызбасын жасаңдар","«Донорлық – өмір сыйы» әлеуметтік постерін жасаңдар"],"lab":"sort","qs":{"Білу және түсіну":["Бүйректің 3 ауруын ата.","Гемодиализ дегеніміз не?"],"Талдау":["Тұзды тағамның бүйрекке әсерін талда."],"Синтез":["Бүйрек денсаулығына арналған апталық мәзір құр."],"Бағалау":["Органдар донорлығы туралы өз пікіріңді дәлелде."]},"labs":[],"gl":[],"page":null,"bjb":false,"srt":["Ауру және оның себебі",{"Пиелонефрит":"Бактериялық инфекция, тоңу","Цистит":"Қуықтың қабынуы, гигиена бұзылуы","Бүйрек тас ауруы":"Тұз алмасуының бұзылуы, аз су","Бүйрек жеткіліксіздігі":"Нефрондардың зақымдалуы","Ісіну":"Судың бөлінуінің бұзылуы"}],"n":"u20"},"u21":{"kind":"t","sec":7,"codes":["9.1.5.5"],"title":"Тіршілік ортасы мен зат алмасудың соңғы өнімдері","goa itle":"Эволюциялық ілімнің қалыптасуы. Линней, Ламарк, Дарвин","goal":"К. Линней мен Ж.Б. Ламарктың негізгі идеяларын білу және Ч. Дарвиннің эволюциялық теорияны қалыптастырудағы рөлін түсіндіру","terms":["Эволюция","Ламарк теориясы","табиғи сұрыпталу","тіршілік үшін күрес","Ч. Дарвин"],"c":["📖 Кітап","🐦 Галапагос шымшығы","🦒 Керік","⛵ Бигль кемесі"],"intro":"К. Линней түрлерді жүйелеп, бинарлық номенклатураны енгізді, бірақ түрлерді өзгермейді деп санады. Ж.Б. Ламарк алғашқы эволюциялық теорияны ұсынды: мүшелерді жаттықтыру мен «жүре пайда болған белгілердің тұқым қуалауы» (дәлелденбеген). Ч. Дарвин «Түрлердің шығуы» (1859) еңбегінде эволюцияның қозғаушы күштерін – тұқым қуалайтын өзгергіштік, тіршілік үшін күрес және табиғи сұрыпталуды көрсетті.","recall":"Керіктің мойны неге ұзын? Ламарк пен Дарвин бұған қалай жауап берер еді?","cs":["Галапагос аралдарындағы шымшықтардың тұмсықтары әртүрлі: біреулері қатты тұқым жейді, енді біреулері жәндік ұстайды. Дарвин олар бір ата-тектен шыққан деп болжады.","Тұмсықтардың әртүрлілігін Дарвин қалай түсіндірді?","Мұны Ламарк қалай түсіндірер еді?","Қай түсіндірме қазіргі ғылымға сай?"],"tb":["Эволюциялық көзқарастар",["Ғалым","Негізгі идеясы","Қазіргі бағасы"],["К. Линней","Ж.Б. Ламарк","Ч. Дарвин","А. Уоллес"]],"mc":[["«Түрлердің шығуы» еңбегінің авторы:",["Ч. Дарвин","Ж.Б. Ламарк","К. Линней","Г. Мендель"],0],["«Жаттығатын мүше дамиды» деген идея кімдікі:",["Ж.Б. Ламарк","Ч. Дарвин","Г. Мендель","К. Линней"],0],["Дарвин бойынша эволюцияның басты бағыттаушы факторы:",["Табиғи сұрыпталу","Мүшені жаттықтыру","Құдайдың жаратуы","Кездейсоқтық қана"],0]],"tf":[["Линней түрлерді өзгермейді деп санады",1],["Жүре пайда болған белгілер тұқым қуалайды деген идея дәлелденді",0],["Дарвин эволюцияның қозғаушы күштерін көрсетті",1]],"gr":["рөлдік ойын","«Ламарк» рөлінде керіктің мойнын түсіндіріңдер","«Дарвин» рөлінде керіктің мойнын түсіндіріңдер","Әділқазылар екі түсіндірмені ғылыми деректермен бағаласын"],"lab":"sort","qs":{"Білу және т }

/* text-to-speech («Тыңдау» батырмасы) */
const TTS = { voices: [], rate: 0.9, btn: null, gen: 0, started: 0 };
function ttsOK() { return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window; }
function ttsLoad() { try { TTS.voices = speechSynthesis.getVoices() || []; } catch (e) { TTS.voices = []; } }

  if (!ttsOK()) return 'Бұл браузер дауыстап оқуды қолдамайды. Chrome, Edge немесе Safari арқылы ашыңыз.';
  const v = ttsVoice();
  if (!v) return 'Дауыс құрылғыдан жүктелуде. «Тыңдау» батырмасын басыңыз.';
  return /^kk/i.test(v.lang) ? `Дауыс: ${v.name} (қазақша)` : `Дауыс: ${v.name} (${v.lang}). Құрылғыда қазақ дауысы жоқ, сондықтан жақын дауыспен оқылады. Windows-та Microsoft Edge браузерінде қазақша дауыстар (Aigul, Daulet) бар.`;
}
function ttsChunks(t) {
  const out = []; let cur = '';
  for (const s of String(t).replace(/\s+/g, ' ').trim().split(/(?<=[.!?;:])\s+/)) {
    if (cur && (cur + ' ' + s).length > 180) { out.push(cur); cur = s; } else cur = cur ? cur + ' ' + s : s;

}
function ttsSet(btn, on) {
  if (!btn || !btn.isConnected) return;

}
function ttsStop() { TTS.gen++; try { if (ttsOK()) speechSynthesis.cancel(); } catch (e) {} ttsSet(TTS.btn, false); TTS.btn = null; }
function speak(text, btn) {

  const same = TTS.btn && TTS.btn === btn; ttsStop(); if (same) return;
  ttsLoad();
  const v = ttsVoice(), parts = ttsChunks(text), gen = TTS.gen; let k = 0;
  if (!parts.length) return;
  TTS.btn = btn; ttsSet(btn, true);
  const next = () => {
    if (gen !== TTS.gen) return;
    if (k >= parts.length) { ttsSet(btn, false); if (TTS.btn === btn) TTS.btn = null; return; }
    const u = new SpeechSynthesisUtterance(parts[k++]);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'kk-KZ';

}

function wordsearch(box, words, seed) {

  $$('span[data-y]', box).forEach(s => s.onclick = () => {
    const y = +s.dataset.y, x = +s.dataset.x;

    const p = placed.find(p => !p.done && ((p.y === first[0] && p.x === first[1] && p.y + p.dir[0] * (p.w.length - 1) === y && p.x + p.dir[1] * (p.w.length - 1) === x) || (p.y === y && p.x === x && p.y + p.dir[0] * (p.w.length - 1) === first[0] && p.x + p.dir[1] * (p.w.length - 1) === first[1])));

  });
}

function wordHTML(node) {

  html: () => `<div class="lab-wrap"><div class="lab-stage"><canvas id="sc"></canvas><canvas id="sch" style="margin-top:10px"></canvas></div><div class="ctrl">

   <div class="actions"><button class="btn pri" type="button" id="sGo">Бастау</button></div>
   <div class="readout" id="sOut"></div>
   <p class="note">Көк – сау (ауруға бейім), қызыл – ауру, сұр – жазылған, жасыл – вакцина алған. Вакцинация үлесін өзгертіп, ұжымдық иммунитеттің әсерін бақылаңыз.</p></div></div>`,
  init() {
    const cv = $('#sc'), c = canvasFit(cv, 600, 320); let raf;
    const run = () => {
      cancelAnimationFrame(raf);
      const V = +$('#sV').value / 100, P = +$('#sP').value / 100, r = rng(Date.now() & 0xffff), N = 220;
      const A = Array.from({ length: N }, (_, k) => ({ x: r() * 600, y: r() * 320, vx: (r() - .5) * 2, vy: (r() - .5) * 2, s: k < 3 ? 'I' : r() < V ? 'V' : 'S', t: 0 }));

        for (const a of A) { a.x += a.vx; a.y += a.vy; if (a.x < 0 || a.x > 600) a.vx *= -1; if (a.y < 0 || a.y > 320) a.vy *= -1; if (a.s === 'I' && ++a.t > 240) a.s = 'R'; }

        if (ill > 0 && tick < 1800) raf = requestAnimationFrame(step);

LAB.thermo = {

LAB.glucose = {
  title: 'Қандағы глюкозаны гормондар арқылы реттеу (модель)',
  html: () => `<div class="lab-wrap"><div class="lab-stage"><canvas id="gc"></canvas></div><div class="ctrl">
   ${selC('gP', 'Ағза', [['h', 'Сау адам'], ['d', 'Қант диабеті (инсулин аз)']], 'h')}
   <div class="actions"><button class="btn" type="button" data-ev="meal">🍞 Тамақтану</button><button class="btn" type="button" data-ev="run">🏃 Жаттығу</button><button class="btn" type="button" data-ev="ins">💉 Инсулин егу</button><button class="btn" type="button" data-ev="reset">Қайта бастау</button></div>
   <div class="readout" id="gOut"></div>
   <p class="note">Жасыл жолақ – қалыпты деңгей (3,3–5,5 ммоль/л). Инсулин (ұйқы безі) глюкозаны төмендетеді, глюкагон мен адреналин арттырады.</p></div></div>`,
  init() {
    let ev = [];
    const sim = () => {
      const dia = $('#gP').value === 'd'; let g = dia ? 7.5 : 4.8; const base = g, data = [];
      for (let t = 0; t <= 240; t += 2) {
        for (const e of ev) { const dt = t - e.t; if (dt < 0) continue; if (e.k === 'meal') g += (dt < 40 ? .14 : 0); if (e.k === 'run' && dt < 30) g -= .05; if (e.k === 'ins' && dt < 60) g -= .07; }
        const ins = dia ? .004 : .045; g -= (g - base) * ins; if (!dia && g < 3.6) g += .08; g = Math.max(2.5, g); data.push([t, g]);
      }
      lineChart($('#gc'), [{ data, color: cssv('--eosin'), label: 'Глюкоза, ммоль/л' }], { band: [3.3, 5.5], ymin: 2, ymax: 16, xl: 'уақыт, мин', yl: 'ммоль/л' });

LAB.selection = {
  title: 'Қолдан сұрыптау: сиыр табынының сүт беруі (модель)',
  html: () => `<div class="lab-wrap"><div class="lab-stage"><canvas id="slc"></canvas></div><div class="ctrl">
   ${rangeC('slP', 'Көбейтуге іріктелетін ең жақсы үлес (%)', 5, 100, 5, 20)}${rangeC('slH', 'Тұқым қуалау коэффициенті h² (×100)', 10, 60, 5, 30)}${rangeC('slG', 'Ұрпақ саны', 1, 20, 1, 10)}
   <div class="readout" id="slOut"></div><p class="note">Сұрыптау реакциясы R = h² × S (S – іріктелгендер мен табын орташасының айырмасы).</p></div></div>`,
  init() {
    bindRange(['slP', 'slH', 'slG'], () => {
      const p = +$('#slP').value / 100, h = +$('#slH').value / 100, G = +$('#slG').value, sd = 3; let m = 15; const d = [[0, m]], ctrl = [[0, 15]];
      const i = p >= 1 ? 0 : Math.exp(-Math.pow(-Math.sqrt(2) * erfinv(2 * (1 - p) - 1), 2) / 2) / Math.sqrt(2 * Math.PI) / p;
      for (let g = 1; g <= G; g++) { m += h * i * sd; d.push([g, m]); ctrl.push([g, 15]); }
      lineChart($('#slc'), [{ data: d, color: cssv('--eosin'), label: 'Сұрыптаумен', dots: true }, { data: ctrl, color: cssv('--muted'), label: 'Сұрыптаусыз' }], { xl: 'ұрпақ', yl: 'л/тәулік', ymin: 10 });
      $('#slOut').textContent = `Бастапқы орташа: 15,0 л/тәулік\n${G} ұрпақтан кейін: ${m.toFixed(1)} л/тәулік\nБір ұрпақтағы өсім: ${(h * i * sd).toFixed(2)} л`;
    });
  }
};
function erfinv(x) { const a = .147, ln = Math.log(1 - x * x), t = 2 / (Math.PI * a) + ln / 2; return Math.sign(x) * Math.sqrt(Math.sqrt(t * t - ln / a) - t); }
LAB.popgrowth = {
  title: 'Популяция санының өсуі (модель)',
  html: () => `<div class="lab-wrap"><div class="lab-stage"><canvas id="pgc"></canvas></div><div class="ctrl">
   ${rangeC('pgR', 'Өсу жылдамдығы r (×100)', 5, 80, 5, 30)}${rangeC('pgK', 'Орта сыйымдылығы K (дарақ)', 100, 2000, 100, 1000)}${rangeC('pgN', 'Бастапқы саны', 2, 100, 2, 10)}
   <div class="readout" id="pgOut"></div><p class="note">Экспоненциалды өсу – ресурс шексіз болғанда; логистикалық өсу – орта сыйымдылығы шектегенде (S-тәрізді қисық).</p></div></div>`,
  init() {
    bindRange(['pgR', 'pgK', 'pgN'], () => {
      const r = +$('#pgR').value / 100, K = +$('#pgK').value, N0 = +$('#pgN').value; const lg = [], ex = []; let n = N0, e = N0;
      for (let t = 0; t <= 40; t++) { lg.push([t, n]); if (e < K * 1.6) ex.push([t, e]); n += r * n * (1 - n / K); e *= 1 + r; }
      lineChart($('#pgc'), [{ data: lg, color: cssv('--ok'), label: 'Логистикалық' }, { data: ex, color: cssv('--eosin'), label: 'Экспоненциалды' }], { xl: 'уақыт (ұрпақ)', yl: 'дарақ саны', ymax: K * 1.6 });
      $('#pgOut').textContent = `40 ұрпақтан кейін: ${n.toFixed(0)} дарақ (K = ${K})\nЕң жылдам өсу N ≈ K/2 = ${K / 2} кезінде`;
    });
  }
};
LAB.predator = {

LAB.enzyme = {
  title: 'Ферменттің белсенділігіне температура мен pH әсері',
  html: () => `<div class="lab-wrap"><div class="lab-stage"><canvas id="enc"></canvas></div><div class="ctrl">
   ${selC('enE', 'Фермент', [['am', 'Амилаза (сілекей), оптимум pH 7'], ['pe', 'Пепсин (асқазан), оптимум pH 2'], ['li', 'Липаза (ұйқы безі), оптимум pH 8']], 'am')}
   ${rangeC('enT', 'Температура (°C)', 0, 80, 1, 37)}${rangeC('enP', 'Ортаның pH мәні', 1, 12, .5, 7)}
   <div class="readout" id="enOut"></div>
   <p class="note">Тәжірибе: крахмал + амилаза ерітіндісін йодпен тексергенде көк түс жоғалатын уақытты өлшейді. Белсенділік жоғары болса, уақыт қысқа.</p></div></div>`,
  init() {
    const OPT = { am: 7, pe: 2, li: 8 };

      const curve = []; for (let x = 0; x <= 80; x += 2) curve.push([x, act(x, ph, o)]);
      lineChart($('#enc'), [{ data: curve, color: cssv('--hema'), label: 'Белсенділік (pH ' + ph + ')' }, { data: [[t, a]], color: cssv('--eosin'), label: 'Қазіргі нүкте', dots: true }], { xl: 'температура, °C', yl: 'белсенділік, %', ymin: 0, ymax: 110 });
      $('#enOut').textContent = `Белсенділік: ${a.toFixed(0)}%\nКрахмалдың ыдырау уақыты ≈ ${a > 1 ? (300 / a).toFixed(1) + ' мин' : 'ыдырамайды'}\n${t > 50 ? 'Жоғары температура: фермент денатурацияланды (қайтымсыз).' : t < 15 ? 'Төмен температура: фермент баяу жұмыс істейді (қайтымды).' : 'Температура оптимумға жақын.'}\n${Math.abs(ph - o) > 3 ? 'pH оптимумнан алыс: белсенділік төмен.' : ''}`;

LAB.photo = {
  title: 'Фотосинтез жылдамдығына әсер ететін факторлар (элодея моделі)',
  html: () => `<div class="lab-wrap"><div class="lab-stage"><canvas id="phc"></canvas><canvas id="phg" style="margin-top:10px"></canvas></div><div class="ctrl">
   ${rangeC('phL', 'Жарық қарқындылығы (%)', 0, 100, 5, 50)}${rangeC('phC', 'CO₂ мөлшері (×0,01%)', 1, 10, 1, 4)}${rangeC('phT', 'Температура (°C)', 5, 45, 1, 25)}
   <div class="readout" id="phOut"></div>
   <p class="note">Элодея бұтағынан бөлінетін оттек көпіршіктерін 1 минутта санау арқылы фотосинтез жылдамдығын бағалайды. Ең аз жеткілікті фактор – шектеуші фактор.</p></div></div>`,
  init() {
    const rate = (l, c, t) => { const tf = Math.exp(-((t - 30) ** 2) / (2 * 9 ** 2)); return Math.min(l * .6, c * 7.5) * tf; };
    let raf, bubbles = [];
    const cv = $('#phc'), cx = canvasFit(cv, 600, 260);
    const loop = () => { if (!cv.isConnected) return; const r = rate(+$('#phL').value, +$('#phC').value, +$('#phT').value);
      cx.fillStyle = cssv('--sheet'); cx.fillRect(0, 0, 600, 260); cx.fillStyle = 'rgba(120,170,220,.25)'; cx.fillRect(200, 30, 200, 220);
      cx.strokeStyle = cssv('--ok'); cx.lineWidth = 6; cx.beginPath(); cx.moveTo(300, 240); cx.lineTo(300, 120); cx.stroke(); for (let k = 0; k < 6; k++) { cx.beginPath(); cx.moveTo(300, 230 - k * 18); cx.lineTo(300 + (k % 2 ? 26 : -26), 220 - k * 18); cx.stroke(); }
      if (Math.random() < r / 60) bubbles.push({ x: 300 + (Math.random() - .5) * 8, y: 118 });
      cx.fillStyle = cssv('--hema'); bubbles = bubbles.filter(b => (b.y -= 1.6) > 32); bubbles.forEach(b => { cx.beginPath(); cx.arc(b.x, b.y, 4, 0, 7); cx.fill(); });
      cx.fillStyle = '#e8b866'; cx.beginPath(); cx.arc(80, 60, 10 + +$('#phL').value / 5, 0, 7); cx.fill(); raf = requestAnimationFrame(loop); };
    bindRange(['phL', 'phC', 'phT'], () => {
      const l = +$('#phL').value, c = +$('#phC').value, t = +$('#phT').value, r = rate(l, c, t);
      const lim = l * .6 < c * 7.5 ? 'жарық' : 'көмірқышқыл газы'; const curve = []; for (let x = 0; x <= 100; x += 5) curve.push([x, rate(x, c, t)]);
      lineChart($('#phg'), [{ data: curve, color: cssv('--ok'), label: 'Көпіршік / мин' }, { data: [[l, r]], color: cssv('--eosin'), label: 'Қазіргі нүкте', dots: true }], { xl: 'жарық, %', yl: 'көпіршік/мин', ymin: 0, ymax: 80 });
      $('#phOut').textContent = `Оттек көпіршіктері: ≈ ${r.toFixed(0)} / мин\nШектеуші фактор: ${t < 12 || t > 40 ? 'температура' : lim}`;
    });
    cancelAnimationFrame(raf); loop();
  }
};

/* ---------- lab page ---------- */
function keyOf(L) { return KEYS[L.n] || L.key; }
function bookLabs() { return Object.values(D.lessons).flatMap(L => (L.labs || []).map(l => [l, L])); }
function engineFor(L) { if (L.lab === 'key' && !keyOf(L)) return 'sort'; if (L.lab === 'order' && !L.ord) return 'sort'; return LAB[L.lab] ? L.lab : 'sort'; }
function renderLab(i) {
  const L = getL(i), en = engineFor(L), E = LAB[en];
  return `<div class="sheet"><div class="lesson-head"><div><div class="eyebrow">Виртуалды зертхана · ${i + 1}-сабақ</div><h2>${esc(E.title)}</h2><p class="note">${esc(lessonLabel(i))}</p></div></div>
   ${E.html(L)}
   <div class="ext">${extLinks(L).filter(x => !/Wordwall|Quizizz|Өз видеоңыз/.test(x[0])).map(([t, u]) => link(t, u)).join('')}</div></div>
   ${bookLabs().length ? `<div class="sheet"><h3>Оқулықтағы ${bookLabs().length} зертханалық жұмыс</h3><ul>${bookLabs().map(([l, LL]) => { const si = SEQ.findIndex(s => s.ref === String(LL.n)); return `<li>№${l[0]}. ${inner('lab', si, l[1])} <span class="note">(§${LL.n}, ${l[2]}-бет)</span></li>`; }).join('')}</ul></div>` : ''}`;
}
function afterLab(i) { const L = getL(i), en = engineFor(L); if (LAB[en].init) LAB[en].init(L); }

readHash(); render();
