<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="theme-color" content="#3b4fa3"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BioEdu"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style>
<title>BioEdu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<style>
/* Layout: lab-notebook tool — sticky lesson rail on the left (desktop), module tabs on top, one working sheet in the middle.
   Palette from histology stains: hematoxylin blue-violet (accent) and eosin pink (highlight) on a faintly green slide-glass neutral. */
:root{
  --bg:#f3f6f3; --sheet:#ffffff; --ink:#17221d; --muted:#5b6b63; --line:#d5ddd8; --soft:#e8eeea;
  --hema:#3b4fa3; --hema-soft:#e6e9f6; --eosin:#b8406f; --eosin-soft:#f8e5ed;
  --ok:#2f7d4f; --ok-soft:#e1f1e7; --warn:#a46a12; --warn-soft:#f8eedb; --bad:#b33a3a; --bad-soft:#f7e2e2;
  --f-display:"Literata",Georgia,"Times New Roman",serif; --f-body:"PT Sans","Segoe UI",Arial,sans-serif; --f-mono:"PT Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --sheet:#161e1b; --ink:#e3ebe6; --muted:#9baba3; --line:#2b3732; --soft:#1d2723;
  --hema:#9aa9f0; --hema-soft:#232a48; --eosin:#ec8fb4; --eosin-soft:#3a2230;
  --ok:#7fd1a0; --ok-soft:#1c3326; --warn:#e8b866; --warn-soft:#3a2e17; --bad:#f09a9a; --bad-soft:#3d2121; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --sheet:#161e1b; --ink:#e3ebe6; --muted:#9baba3; --line:#2b3732; --soft:#1d2723;
  --hema:#9aa9f0; --hema-soft:#232a48; --eosin:#ec8fb4; --eosin-soft:#3a2230;
  --ok:#7fd1a0; --ok-soft:#1c3326; --warn:#e8b866; --warn-soft:#3a2e17; --bad:#f09a9a; --bad-soft:#3d2121; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--hema)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:20px;letter-spacing:.01em}
.brand h1 b{color:var(--eosin)}
.brand span{color:var(--muted);font-size:13px}
.grades{display:flex;gap:4px}
.grades button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}
.grades button[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--sheet)}
.grades button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:transparent;padding:8px 12px 9px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--eosin);font-weight:700}

/* frame */
.frame{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);align-self:start;max-height:calc(100vh - 130px);overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.rail-head{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.rail-head input{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--bg)}
.q-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px;font-weight:700}
.ls{list-style:none;margin:0;padding:0 6px 8px}
.ls button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;width:100%;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:13px;line-height:1.3}
.ls button:hover{background:var(--soft)}
.ls button[aria-current="true"]{background:var(--hema-soft);color:var(--ink);font-weight:700}
.ls .no{color:var(--muted);font-family:var(--f-mono);font-size:12px;padding-top:1px}
.ls .tag{display:inline-block;font-size:10px;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px;font-weight:700}
.tag.lab{background:var(--ok-soft);color:var(--ok)} .tag.bjb{background:var(--eosin-soft);color:var(--eosin)} .tag.tjb{background:var(--warn-soft);color:var(--warn)}
.mobile-pick{display:none}
main{min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.sheet + .sheet{margin-top:16px}
.lesson-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 20px;margin-bottom:14px}
.lesson-head h2{font-size:22px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--hema)}
.btn.pri{background:var(--hema);border-color:var(--hema);color:var(--sheet)}
.btn.sm{padding:3px 9px;font-size:13px}
.note{font-size:13px;color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.chip.a{background:var(--ok-soft);color:var(--ok)} .chip.b{background:var(--hema-soft);color:var(--hema)} .chip.c{background:var(--eosin-soft);color:var(--eosin)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:var(--r);font-size:14px;z-index:20}

/* lesson-plan tables (Word-like) */
.tw{overflow-x:auto}
table.kmzh{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.kmzh td,table.kmzh th{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
table.kmzh th{background:var(--soft);font-weight:700}
table.kmzh td.k{font-weight:700;width:24%;background:var(--soft)}
table.kmzh .stage{font-weight:700}
table.kmzh ul{margin:4px 0;padding-left:18px}
table.kmzh input.att{width:56px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;background:var(--bg)}
.cues{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0}
.cue{border:1px solid var(--line);border-radius:var(--r);text-align:center;padding:6px 4px;font-size:12px;background:var(--bg)}
.cue i{display:block;font-style:normal;font-size:30px;line-height:1.2}
.desc{margin:4px 0 0;padding-left:0;list-style:none}
.desc li::before{content:"– "}
.res a{word-break:break-word}

/* KTZh table */
table.grid{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.grid thead th{position:sticky;top:0;background:var(--soft);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
table.grid tr.qrow td{background:var(--hema-soft);font-weight:700;font-family:var(--f-display)}
table.grid tr.cur td{background:var(--eosin-soft)}
table.grid td.n{font-family:var(--f-mono);color:var(--muted);width:38px}
table.grid input[type=date]{border:1px solid var(--line);border-radius:4px;padding:2px 4px;background:var(--bg);font-size:13px}
.code{font-family:var(--f-mono);font-size:12.5px;color:var(--hema);white-space:nowrap}

/* worksheets & tasks */
.ws{display:grid;gap:16px}
.task{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.task h3{font-size:17px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.task .pts{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--eosin)}
.lines{border-bottom:1px dashed var(--line);height:26px}
.blank-table{width:100%;border-collapse:collapse;font-size:14px}
.blank-table td,.blank-table th{border:1px solid var(--line);padding:6px 8px;height:34px;text-align:left}
.blank-table th{background:var(--soft)}
.opts{list-style:none;padding:0;margin:4px 0 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.opts label{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.opts .right{color:var(--ok);font-weight:700} .opts .wrong{color:var(--bad);text-decoration:line-through}
.level-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.level{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.level h3{font-size:16px}
.level ol{margin:0;padding-left:20px;display:grid;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select{border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:var(--sheet)}

/* inclusive */
.incl-modes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.incl-modes button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer}
.incl-modes button[aria-pressed="true"]{background:var(--eosin);border-color:var(--eosin);color:var(--sheet)}
.big{font-size:22px;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;background:var(--bg)}
.card i{display:block;font-style:normal;font-size:40px}
.yn{display:flex;gap:8px;flex-wrap:wrap}
.yn button{font-size:20px;padding:8px 22px;border-radius:var(--r);border:2px solid var(--line);background:var(--sheet);cursor:pointer}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.bank span{border:1px dashed var(--hema);border-radius:4px;padding:2px 8px;color:var(--hema)}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--hema);color:var(--sheet);display:grid;place-items:center;font-weight:700}
.steps label{display:flex;gap:8px;align-items:flex-start}

/* labs */
.lab-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.lab-stage{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:12px;min-width:0}
.lab-stage canvas{width:100%;height:auto;display:block;background:var(--sheet);border-radius:4px}
.ctrl{display:grid;gap:10px;align-content:start}
.ctrl label{display:grid;gap:3px;font-size:14px}
.ctrl input[type=range]{width:100%}
.ctrl select,.ctrl input[type=number]{border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:var(--sheet)}
.readout{font-family:var(--f-mono);font-size:14px;background:var(--soft);border-radius:var(--r);padding:8px 10px;white-space:pre-wrap}
.ord{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.ord li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--sheet)}
.ord li.ok{border-color:var(--ok);background:var(--ok-soft)} .ord li.no{border-color:var(--bad);background:var(--bad-soft)}
.ord li span{flex:1}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px}
.match button{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:7px 9px;cursor:pointer;font-size:14px}
.match button.sel{border-color:var(--hema);background:var(--hema-soft)}
.match button.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.match button.err{border-color:var(--bad);background:var(--bad-soft)}
.tube-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.tube{display:grid;justify-items:center;gap:4px;font-size:12px;text-align:center;width:72px}
.ext{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ext a{border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;text-decoration:none;font-size:14px}

/* reflection catalog */
.refl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.rcard svg{width:100%;height:110px}
.rcard h3{font-size:16px}
.rcard p{margin:0;font-size:14px}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:14px;font-weight:700}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--bg);font-weight:400}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;gap:4px;align-items:center;font-weight:400;border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.wordsearch{display:inline-grid;gap:2px;font-family:var(--f-mono);font-size:16px}
.wordsearch span{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;cursor:pointer;user-select:none}
.wordsearch span.hit{background:var(--ok-soft);border-color:var(--ok)} .wordsearch span.sel{background:var(--hema-soft)}
.print-only{display:none}

@media (max-width: 980px){
  .frame{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-pick{display:flex;gap:6px;margin-bottom:12px}
  .mobile-pick select{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:7px;background:var(--sheet)}
  .lab-wrap,.two,.level-grid{grid-template-columns:minmax(0,1fr)}
}
.bnav,.sheet-menu{display:none}
@media (max-width: 760px){
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sheet);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;font-size:11px;color:var(--muted);cursor:pointer}
  .bnav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav button[aria-current="true"]{color:var(--eosin);font-weight:700}
  .sheet-menu:not([hidden]){display:block;position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.35)}
  .sheet-menu-in{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-radius:12px 12px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) 14px;display:grid;gap:4px}
  .sheet-menu-in button{border:0;background:transparent;text-align:left;padding:12px 10px;border-radius:6px;font-size:16px;cursor:pointer}
  .sheet-menu-in button[aria-current="true"]{background:var(--hema-soft);font-weight:700}
  .frame{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .top-in{padding-block:8px}
  .mobile-pick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4;background:var(--bg);padding-block:6px;margin:-6px 0 8px}
}
@media (max-width: 520px){
  .sheet{padding:14px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .cues{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand span{display:none}
}
@media print{
  .top,.rail,.mobile-pick,.actions,.noprint,body::before{display:none!important}
  .frame{display:block;padding:0}
  .sheet{border:0;padding:0}
  body,html{background:#fff;color:#000;font-family:"Times New Roman",serif;font-size:14pt}
  table.kmzh td,table.kmzh th,table.grid td,table.grid th{border:1px solid #000;color:#000;background:#fff!important}
  @page{size:A4 landscape;margin:10mm}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Bio<b>Edu</b></h1><span>7–9-сынып биология пәнін оқытуға арналған біртұтас цифрлық әдістемелік платформа</span></div>
    <div class="grades" role="group" aria-label="Сынып">
      <button type="button" id="g7" data-g="7" aria-pressed="false">7-сынып</button>
      <button type="button" id="g8" data-g="8" aria-pressed="true">8-сынып</button>
      <button type="button" id="g9" data-g="9" aria-pressed="false">9-сынып</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<div class="frame">
  <aside class="rail" aria-label="Сабақтар тізімі">
    <div class="rail-head">
      <div class="eyebrow">КТЖ · 68 сағат</div>
      <input id="railSearch" type="search" placeholder="Тақырыпты іздеу…" aria-label="Тақырыпты іздеу">
    </div>
    <div id="rail"></div>
  </aside>
  <main>
    <div class="mobile-pick">
      <button class="btn" id="prevM" type="button" aria-label="Алдыңғы сабақ">‹</button>
      <select id="mPick" aria-label="Сабақты таңдау"></select>
      <button class="btn" id="nextM" type="button" aria-label="Келесі сабақ">›</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<nav class="bnav" id="bnav" aria-label="Негізгі бөлімдер"></nav>

e":null,"sec":null},{"q":4,"kind":"R","ref":null,"title":"Қайталау сабағы: «Тұқымқуалаушылық. Көбею. Микробиология»","sec":12},{"q":4,"kind":"T","ref":null,"title":"4-тоқсанға арналған тоқсандық жиынтық бағалау (ТЖБ)","sec":12}],"book":{"title":"Биология. 7-сынып","authors":"Е. Очкур, Ж. Құрманғалиева, Б. Үсіпбек, Д. Инкарбекова","pub":"Алматы: Мектеп, 2025. – 288 бет"}},"8":{"sections":[{"n":1,"name":"Жасушалық биология"},{"n":2,"name":"Молекулалық биология"},{"n":3,"name":"Тірі ағзалардың көптүрлілігі"},{"n":4,"name":"Қоректену"},{"n":5,"name":"Заттардың тасымалдануы"},{"n":6,"name":"Тыныс алу"},{"n":7,"name":"Бөліп шығару"},{"n":8,"name":"Қозғалыс. Биофизика"},{"n":9,"name":"Координация және реттелу"},{"n":10,"name":"Көбею"},{"n":11,"name":"Өсу және даму"},{"n":12,"name":"Тұқымқуалаушылық және өзгергіштік заңдылықтары"},{"n":13,"name":"Биосфера, экожүйе, популяция"},{"n":14,"name":"Адам қызметінің қоршаған ортаға әсері"}],"lessons":{"1":{"n":1,"kind":"p","title":"Прокариот және эукариот жасушаларының құрылысы","page":4,"sec":1,"codes":["8.4.2.2"],"goal":"Прокариот және эукариот жасушаларының құрылысын салыстыру","recall":"Өсімдік және жануар жасушалары қандай үш бөліктен тұрады? Прокариот жасушаларының эукариот жасушаларынан қандай айырмашылығы бар? Оларға қандай ағзалар жатады? Жасуша қабығы, ядро, вакуоль мен пластидтер не үшін керек? Өсімдік жасушасының жануар жасушасынан қандай айырмашылығы бар?","intro":"Жасуша – тіршіліктің негізгі құрылымдық және қызметтік бірлігі. Барлық ағзалар жасушалардан тұрады. Әрбір жасушаға тірі ағзалардың қасиеттері: көбею, өсу, зат алмасу, тұқымқуалаушылық пен өзгер гіштік, қартаю және т.б. тән. Тірі ағзалардың барлық жасушалары өзара химиялық құрамы мен құрылысы бойынша ұқсас. Бактерия жасушасында ядро жоқ, тек қабықшасы мен цитоплазмасы болады. Сондықтан оларды прокариоттар – ядросы қалыптаспаған (ядро түзілгенге дейін пайда болған) деп атайды (1-сурет). Өсімдік, саңырауқұлақ және жануар жасушалары үш бөліктен: қабықша, цитоплазма мен ядродан тұрады (2, 3-сурет). прокариоттар мен эукариоттар. Бір сақиналы ДНҚ молекуласы тікелей цитоплазмада болады және эукариот","terms":["Қабықша","Цитоплазма","Ядро","Эукариоттар","Прокариоттар","Рибосомалар","Митохондрия","Гольджи жиынтығы","Ядрошық","Хромосомалар","Кариоплазма","Пластидтер","Автолиз","Лизосомалар","ЭПТ","Вакуоль","Жасушалық шырын"],"qs":{"Білу және түсіну":["«Прокариоттар» және «эукариоттар» деген түсініктерге анықтама беріңдер. Мысалдар келтіріңдер.","Жасуша органоидтерін атаңдар."],"Қолданылуы":["Жасуша қабырғасы мен ағзалардың қасиеттері арасындағы байланыс ты анықтаңдар.","Гольджи жиынтығы, тегіс және бұдыр ЭПТ рөлін салыстырыңдар."],"Талдау":["Өсімдік және жануар жасушаларындағы әртүрлі органоидтердің қалыптасу себептері туралы пікірлеріңді айтыңдар.","Суретті қарап, түсіндіріңдер."],"Синтез":["Жасуша типтерін, олардың органоидтерін, қабықша ерекшелігі мен ядроны сызба түрінде бейнелеңдер.","Ядроның рөлін бағалаңдар."],"Бағалау":["Жасушалардың қандай құрылымынсыз олардың тіршілігі мүмкін болмас еді? Неліктен бактерияларда рибосомалар мен мембраналар айқын көрінеді?","Әртүрлі типті жасушалар арасындағы туыстықты анықтап көріңдер. Олардың органоидтерін білу арқылы анықтауға бола ма?"],"Пікірталас":["Вирустар жасушадан тыс тіршіліктің болу мүмкіндігін дәлелдей ме? Осы тұжырымға «иә» және «жоқ» деп дәлел келтіріңдер."]},"gl":[["Ядро","көптеген біржасушалы және барлық көпжасушалы ағзалардың жасушаларының міндетті бөлігі."],["Ядрошық","эукариоттардың көбісінің жасушаларының ядросының ішіндегі тығыз денешік."],["Хромосомалар","гендерді тасымалдайтын және жасуша мен ағзаның тұқым қуалайтын қасиеттерін анықтайтын жасуша ядросының органоиды."],["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."],["Ферменттер","барлық тірі жасушаларда болатын және биологиялық катализатор рөлін атқаратын ерекше нәруыздар: генетикалық ақпараттар, барлық энергия және зат алмасу үдерістері жүзеге асырылады."]],"labs":[],"bjb":false,"c":["🦠 Бактерия","🧅 Пияз қабығы","🔬 Микроскоп","🧬 Ядро"],"cs":["Зертханада екі препарат шатасып қалды. Бірінші жасушада ядро жоқ, ДНҚ цитоплазмада сақина тәрізді жатыр. Екіншісінде ядро, митохондрия, хлоропласт және ірі вакуоль көрінеді.","Әр препараттың қай жасуша типіне жататынын анықта.","Шешіміңді екі белгімен дәлелде.","Екінші жасуша өсімдікке ме, жануарға ма тиесілі? Неге?"],"tb":["Прокариот пен эукариот жасушаларын салыстыру",["Белгі","Прокариот","Эукариот"],["Ядро","Мембраналы органоидтер","Рибосома","Мысалдар"]],"mc":[["Прокариоттарға жатады:",["Амёба","Бактерия","Саңырауқұлақ","Хлорелла"],1],["Нәруыз биосинтезін жүзеге асыратын органоид:",["Лизосома","Гольджи жиынтығы","Рибосома","Вакуоль"],2],["Тек өсімдік жасушасына тән құрылым:",["Митохондрия","Хлоропласт","Рибосома","Ядро"],1]],"tf":[["Бактерия жасушасында ядро болмайды",1],["Лизосомалар асқорыту ферменттеріне толы",1],["Жануар жасушасында ірі нағыз вакуоль болады",0]],"gr":["тарсия","Прокариот жасушасының құрылысын тарсия бөліктерінен құрастырып, бөліктерін атаңдар","Өсімдік жасушасының тарсиясын құрастырып, тек өсімдікке тән 3 құрылымды белгілеңдер","Жануар жасушасының тарсиясын құрастырып, органоидтердің қызметін жазыңдар"],"lab":"micro"},"2":{"n":2,"kind":"p","title":"Өсімдіктер мен жануарлардың ұлпаларын жіктеу","page":7,"sec":1,"codes":["8.4.2.1"],"goal":"Өсімдіктер мен жануарлардың ұлпаларын жіктеу","recall":"«Камбий, ксилема, флоэма, қабық, сүрек, эпидермис, эпиблема» дегеніміз не екенін еске түсіріңдер. «Ұлпа» түсінігіне анықтама беріңдер.","intro":"Ұлпа – құрылысы, шығу тегі және атқаратын қызметі бойынша ұқсас жасушалар тобы. Олардың әрбір типі белгілі бір тарихи кезеңде қалыптасты. Ұлпалар түзілгенге дейін тек төменгі сатыдағы өсімдіктер (балдырлар) мен қарапайым жануарлар (біржасушалылар немесе колония құрып тіршілік ететіндер) тіршілік етті. Жоғары сатыдағы өсімдік және жануар ағзалары әртүрлі ұлпа типтерінен құрылған (1, 2-сызбалар). Ұлпалардың әрбір типі тип тармақшаларынан тұрады. Өсімдіктерде ұлпалардың 6 типі: түзуші, негізгі, жабын, механикалық (тірек), өткізгіш және бөліп шығарушы болады (4, 5-суреттер). Түзуші ұлпа бірінші болып пайда болады. Тұқым ұрығының жасушалары осы ұлпадан тұрады. Ол барлық ұлпалар мен мүшелерді түзе","terms":["Өсімдік ұлпалары: түзуші","Негізгі","Жабын","Тірек","Өткізгіш","Бөліп шығарушы","Жануарлардың ұлпа лары: эпителий","Дәнекер","Бұлшық ет","Жүйке","Дендриттер","Аксон","Нейроглия"],"qs":{"Білу және түсіну":["«Ұлпа» түсінігіне анықтама беріңдер.","Өсімдіктерде қанша ұлпа түрлері бар?","Жануарларда қанша ұлпа түрлері бар? қолданылуы:","Өсімдіктердің жабын ұлпасының қызметін сипаттаңдар."],"Талдау":["Өсімдіктер мен жануарлардың жабын (эпителий) ұлпасының қызметін салыстырыңдар.","Өсімдіктердің өткізгіш және тірек ұлпасының қызметі мен жануарлардың дәнекер ұлпасының қызметін салыстырыңдар.","«Ұлпа қызметі» деген сызба сызып, өсімдіктер мен жануарлардың ұқсас қызмет атқаратын ұлпаларын бейнелеңдер."],"Синтез":["Өсімдіктерде қандай ұлпалар қалыптаспайтынын талқылаңдар.","Жануарларда қандай ұлпалар қалыптаспайтынын талқылаңдар.","Ұлпаны түзетін жасушалар қызметі мен олардың пішіндерінің өзара байланысы туралы эссе жазыңдар."],"Бағалау":["Өсімдік тіршілігіндегі ұлпалардың әрбір типтерінің рөлін бағалаңдар.","Қосымша ақпарат көздері мен өткен оқу жылындағы биологиядан алған білімдеріңді пайдаланып, реферат жазыңдар. Жоғары сатыдағы өсімдік топтарының (мүктер, қырықжапырақтәрізділер, ашықтұқымдылар, жабықтұқымдылар) пайда болуына қарай өсімдіктердің әртүрлі ұлпа типтерінің қалыптасуының эволюциялық ретін көрсетіңдер.","Қосымша ақпарат көздері мен өткен оқу жылындағы биологиядан алған білімдеріңді пайдаланып, реферат жазыңдар. Көпжасушалылар топтарының: губкалардың, ішекқуыстылардың, жалпақ құрттардың пайда болуына қарай жануарлардың әртүрлі ұлпа типтерінің қалыптасуының эволюциялық ретін көрсетіңдер. №1 зертханалық жұмыс. өсімдіктердің ұлпаларын жіктеу. 246-бетті қараңдар. №2 зертханалық бөліктерден тұрады? Нәруыздар мен ДНҚ-ның арасында қандай байланыс бар? Ген дегеніміз не? Неліктен барлық тірі жасушаларда рибосомалар болады?","intro":"Нәруыздар – мономерлері аминқышқылдары болып табылатын биополимерлер. Тірі ағзалардың нәруыздарының құрамына аминқышқылдарының 20 түрі кіреді. Нәруыздардың молекуласы қалыптасқан кезде аминқышқылдары белгілі бір ретпен химиялық байланыспен қосылады. Бірақ аминқышқылдарының қосылу реті ДНҚ-да жазылған және тұқым қуалау ақпараты деп аталады. Әрбір нәруыздың құрылысы ерекше болады. Аминқышқылдарының 20 түрі әртүрлі ретпен қосылады, олардың саны түрлі болуы мүмкін (16-сурет). Нәруыздардың молекулалары әртүрлі үйле сімде бірнеше данадан мыңдаған данаға дейінгі аминқышқылдарынан тұрады. Сондықтан нәруыздар 16-сурет. Нәруыз молекуласының дың алуантүрлілігі шексіз. Адам ағзасында нәр құрылысы уыздар","terms":["Биополимерлер","Аминқышқылдар","Тұқым қуалай тын ақпарат","Ферменттер","Гормондар","Инсулин","Гликоген","Фибриноген","Антиденелер","Оссеин","Коллаген","Актин","Миозин","Гемоглобин","Меланин"],"qs":{"Білу және түсіну":["Нәруыздарға анықтама беріңдер.","Аминқышқылдары дегеніміз не?","Тірі ағза нәруыздарының құрамына қанша аминқышқылдары кіреді?","Нәруыздар ыдыраған кезде қанша энергия бөлінеді? қолданылуы:"],"Талдау":["Аталған нәруыздардың әрқайсысының рөлін талдаңдар: коллаген, фибрин, пепсин, гемоглобин, оссеин, инсулин, меланин, актин, миозин.","Нәруыз алмасуын сызба түрінде бейнелеңдер. Олардың ағзаға тамақпен бірге түсуінен бастап (өздерінің нәруыздарын түзуі арқылы) қартаюына және энергия бөлініп ыдырауына дейін сипаттап, мүмкіндігінше ферменттер мен органоидтерді көрсетіңдер.","Нәруыздардың шексіз алуан түрлі болу себебі туралы өз пікірлеріңді айтыңдар."],"Синтез":["Әртүрлі ағзалардағы нәруыздардың түрлі қызметін критерий бойынша жүйелеңдер.","Нәруыздардың сигнал беру, жылу оқшаулау және т.б. қызметі туралы эссе жазыңдар."],"Бағалау":["«ДНҚ белгілі бір уақытта, белгілі бір жағдайда, белгілі бір ферменттерді түзу сімдіктер» деген түсінікке анықтама беріңдер.","Жоғары сатыдағы өсімдіктердің бөлімдерін атаңдар.","Өсімдіктердің белгілі бір топтарын қандай критерий бойынша «жоғары сатыдағы өсімдіктерге» жатқызады? қолданылуы:","Жоғары сатыдағы өсімдіктердің әртүрлі ұлпалары мен мүшелерінің қызметін сипаттаңдар."],"Талдау":["Жоғары сатыдағы өсімдіктер бөлімдерінің қалыптасу кезеңдерін талдаңдар. Олардың біртіндеп пайда болғанын дәлелдеңдер.","Жоғары сатыдағы өсімдіктердің ұлпалары мен мүшелерінің пайда болуын сызба түрінде сипаттаңдар.","Өсімдіктердің әртүрлі бөлімдерінің түрлі мүшелері пайда болу себептері туралы өз пікірлеріңді айтыңдар."],"Синтез":["Құрлығы жоқ ғаламшарда жоғары сатыдағы өсімдіктер қалыптаса ма? Талқылаңдар.","Егер мүктер тек бауыр мүктерден тұратын болса, олар жоғары сатыдағы өсімдіктерге жатқызыла ма? Бағалаңдар."],"Бағалау":["Мынадай жойылып кеткен өсімдік топтары туралы реферат жазыңдар: псилофиттер немесе риниофиттер, тұқымды қырықжапырақтар қандай жүйелік топтарға жатқызылатын еді?","Қазіргі кезде өсетін өсімдіктер: вельвичия, гинкго билоба, саговниктәрізділер, қылша (эфедра) туралы реферат жазыңдар. Олар қандай жүйелік топтарға жатады? Қандай ерекшеліктері бар? Қазақстанда табиғи жағдайда қайсылары өседі?"],"Пікірталас":["Келешекте өсімдіктердің эволюциясы жүруі мүмкін бе? Олардың қандай бағыттары болуы мүмкін? Талқылаңдар. №3 зертханалық жұмыс. өсімдік бөлімдерінің ерекше белгілерін анықтау. 248-бетті қара."]},"gl":[["Ризоидтар","тамыр қызметін атқаратын мүктердегі жіптәрізді түзілістер; қырықжапырақтардағы, қыналардағы, кейбір балдырлар мен саңырауқұлақтардағы өскіншелер."],["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."],["Аталық без","сперматозоидтер мен жыныс гормондары (тестостерон және т.б.) түзілетін аталық жыныс бездері."],["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."],["Аналық без","жұмыртқа жасушалары түзілетін және жетілетін аналық жыныс безі."],["Табан","аяқтың тө уіне де жатпайтын ағзалар. Осы белгілерді кесте түрінде қарастырайық: 1-кесте. Саңырауқұлақтардағы өсімдіктер мен жануарлардың белгілерін салыстыру Саңырауқұлақтардағы өсімдіктердің Саңырауқұлақтардағы жануарлардың белгілері белгілері 1. Жасушасы қатты жасуша 1. Жасуша ішкі қабықшасы хитин қабырғасымен жабылған нен тұрады 2. Қозғалмайды, нағыз вакуолі 2. Қоректік қор заты – гликоген бар 3. Бүкіл тіршілік бойы өседі 3. Хлоропластары жоқ 4. Қоректік заттарды жануарлар 4. Дайын органикалық заттармен сияқты жемейді, денесінің бетімен қоректенеді сіңіреді 5. Спора","terms":["Қыналар төменгі сатыдағы өсімдіктерге жатады. Олардың құрылысы және тіршілік әрекеті ерекше болғандықтан","Соңғы кезде саңырауқұлақтар дүниесінің бөлімі ретінде қарастырылады. Қына денесінің екі құрамбөлігі (балдыр және саңырауқұлақ) селбесіп тіршілік етеді. Балдырлар","Мүктер","Қырықжапырақтәрізділер","Ашық тұқымдылар","Жабықтұқымдылар","Саңырау құлақтар"],"qs":{"Білу және түсіну":["Неліктен саңырауқұлақтарды жеке патшалыққа жатқызады?","Өздеріңе белгілі саңырауқұлақ топтарын атаңдар.","Саңырауқұлақтарды өсімдіктерге жатқызуға бола ма? қолданылуы:","Саңырауқұлақтардағы жануарлардың белгілері арасындағы байланысты анықтаңдар."],"Талдау":["Саңырауқұлақтардың қалыптасу кезеңдерін талдаңдар. Олардың қайсысы эволюция барысында ертерек, қайсысы кейін пайда болды?","Қалпақшалы саңырауқұлақтардың құрылысын сызба түрінде бейнелеңдер.","Саңырауқұлақтар тек споралары арқылы ғана көбеймейтінін мысалдар келтіріп дәлелдеңдер."],"Синтез":["Саңырауқұлақтар өсімдіктерге жатқызылатын болса, олар «жоғары сатыдағыларға» жатқызылатын ба еді, әлде «төменгі сатыдағыларға» ма? 3–3459 33","«Саңырауқұлақтардың табиғаттағы рөлі» деген тақырыпқа эссе жазыңдар.","Саңырауқұлақтардың адам өміріндегі рөлін бағалаңдар."],"Бағалау":["«Микориза – толыққанды орман массивтерінің қалыптасуының міндетті түрдегі жағдайы» немесе «Саңырауқұлақтар – өсімдіктердің паразиттері»; «Саңырауқұлақтар – адам және жануарлардың паразиттері» деген тақырыптардың біріне реферат жазыңдар.","Улы саңырауқұлақтармен уланудың алдын алу шаралары туралы өз пікірлеріңді айтыңдар."],"Пікірталас":["«Заманауи ғарыштық зерттеулер зең саңырауқұлақтарының спора лары ашық ғарышта да тіршілік қабілетін сақтай алатынын дәлелдеді. Ал қынадағы саңырауқұлақтың жасушалары (балдырлармен селбесіп тіршілік етуде) – ғарыш кемесінің бортынан тыс болса да, бір апта бойы тіршілігін жоймаған». Саңырауқұлақтардың жерден тыс шығу тегі туралы болжамды талқылаңдар. Әртүрлі гипотезаларға (ғылыми болжам) қатысты дәлелдер келтіріңдер."]},"gl":[["Ашытқылар","типтік мицелийі жоқ, жеке бүршіктенетін немесе бөлінетін жасушалар мен олардың колониясы түрінде болатын саңырауқұлақтардың жиналған тобы."],["Сіңір","қаңқа сүйектерін немесе жеке мүшелерді байланыстыратын тығыз, дәнекер ұлпалы желі және пластиналар."]],"labs":[],"bjb":false,"c":["🍄 Саңырауқұлақ","🍞 Зеңді нан","🍺 Ашытқы","🌳 Ағаш"],"cs":["Әжесі банкадағы тосаптың бетінде көкшіл-жасыл зең пайда болғанын байқап, зеңді қасықпен алып тастап, қалғанын жеуге болады деді.","Зең саңырауқұлақ денесінің қай бөлігі көрініп тұр?","Неліктен зеңді ғана алып тастау жеткіліксіз?","Тосапты зеңнен сақтаудың 2 жолын ұсын."],"tb":["Саңырауқұлақтардың өсімдіктер мен жануарларға ұқсастығы",["Белгі","Өсімдікке ұқсас","Жануарға ұқсас"],["Қоректенуі","Жасуша қабырғасы","Өсуі","Қор заты"]],"mc":[["Саңырауқұлақтардың жасуша қабырғасы құрамында болатын зат:",["Целлюлоза","Хитин","Крахмал","Пектин"],1],["Саңырауқұлақтың денесі:",["Таллом","Мицелий","Тамыр","Сабақ"],1],["Біржасушалы саңырауқұлақ:",["Ашытқы","Ақсаңырауқұлақ","Мукор","Пеницилл"],0]],"tf":[["Саңырауқұлақтар – гетеротрофтар",1],["Саңырауқұлақтар фотосинтез жасайды",0],["Микориза – саңырауқұлақ пен тамырдың селбесуі",1]],"gr":["тарсия","Қалпақшалы саңырауқұлақтың құрылысын тарсиядан құрастырып, бөліктерін атаңдар","Зең саңырауқұлақтарының (мукор, пеницилл) пайдасы мен зиянын тарсия-кестеге түсіріңдер","Ашытқылардың адам өміріндегі маңызын тарсия түрінде көрсетіңдер"],"lab":"key"},"8":{"n":8,"kind":"p","title":"Даражарнақты және қосжарнақты өсімдіктер","page":34,"sec":3,"codes":["8.1.1.3"],"goal":"Даражарнақты және қосжарнақты өсімдіктерді негізгі белгілеріне қарай ажырату","recall":"Гүлді өсімдіктердің бөлімдерін қанша класқа бөледі? Олардың қандай айырмашылықтары бар? Камбий дегеніміз не? Ол қандай қызмет атқарады?","intro":"Гүлді немесе жабықтұқымды өсімдіктердің бөлімдері даражарнақты және қосжарнақты өсімдіктер болып екі класқа бөлінеді. Осы екі класқа жататын өсімдіктердің айқын айырмашылығы бар. Оларды нақты қарастырайық. Тұқымның құрылысы тұқымжарнағы арқылы ажыратылады (26-сурет). Даражарнақты өсімдіктердің тұқымында тек бір тұқымжар нағы болады. Сәйкесінше, қосжарнақты өсімдіктердің тұқымында екі тұқымжарнағы бар. Әрине, ұсақ тұқымдардың тұқымжарнағының санын ажырату қиын, бірақ қосжарнақтылардың ірі тұқымдары екі жарты бөлікке – тұқымжарнағына оңай бөлінеді. Оларға: бұршақ, үрмебұршақ, жержаңғақ, грек жаңғағы, орман жаңғағы, пісте; асқабақ, қарбыз және т.б. тұқымдар жатады. Осы өсімдіктердің барлығы қос","terms":["Даражарнақты","Қосжарнақты","Кіндік және шашақ тамыр жүйесі","Жүйкелену","Камбий","Тіршілік формасы."],"qs":{"Білу және түсіну":["Гүлді өсімдіктердің екі класын атаңдар.","Олар неліктен осылай аталатынын түсіндіріңдер.","«Кіндік және шашақ тамыр жүйесі» деген терминдерді түсіндіріңдер.","Даражарнақты және қосжарнақты өсімдіктерге мысал келтіріңдер. қолданылуы:"],"Талдау":["Гүлді өсімдіктер мүшелерінің құрылысына байланысты белгілі бір класқа жатқызылуын талдаңдар.","Даражарнақты және қосжарнақты өсімдіктердің вегетативті мүшелерінің құрылысын сызба түрінде бейнелеңдер.","Сендерге белгілі қандай өсімдіктер даражарнақты, қайсысы қосжарнақтыларға жататынын мысалдар келтіріп дәлелдеңдер."],"Синтез":["Қылқанжапырақтыларды жақсы дамыған сүрегі және осы тіршілік формасында болуына байланысты қосжарнақтыларға жатқызуға бола ма? Талқылаңдар.","Критерий бойынша даражарнақты және қосжарнақты өсімдіктерді жүйелеңдер."],"Бағалау":["Жолжелкен даражарнақтылардың белгісі бар, бірақ қосжарнақты ларға жататын өсімдік. Ал қарғакөз керісінше қосжарнақтылардың белгісі бар, бірақ даражарнақтыларға жатады. Осы өсімдіктердің құрылысының ерекшелігі туралы хабарлама дайындаңдар.","Алған білімдеріңнің негізінде қандай белгілер бірінші дәрежелі болып табылатыны туралы өз пікірлеріңді айтыңдар.","Гүлді өсімдіктердің кластарын анықтау кезінде тек бір белгіні пайдалануға болмайтынын дәлелдеңдер. №4 зертханалық жұмыс. Даражарнақты және қосжарнақты өсімдіктер кластарының белгілерін зерттеу. 249-бетті қара."]},"gl":[],"labs":[[4,"Даражарнақты және қосжарнақты өсімдіктер кластарының белгілерін зерттеу",249]],"bjb":false,"c":["🌾 Бидай","🌻 Күнбағыс","🌷 Қызғалдақ","🫘 Бұршақ"],"cs":["Бағбан екі өскіннің тұқымын жарып көрді: біріншісінде бір жарнақ және шашақ тамыр, екіншісінде екі жарнақ және кіндік тамыр бар.","Әр өскін қай класқа жатады?","Осы өсімдіктердің жапырақ жүйкеленуі қандай болуы мүмкін?","Әр класқа екі мәдени өсімдік мысал келтір."],"tb":["Дара және қосжарнақты өсімдіктерді салыстыру",["Белгі","Даражарнақты","Қосжарнақты"],["Ұрық жарнағы","Тамыр жүйесі","Жапырақ жүйкеленуі","Гүл бөліктерінің саны"]],"mc":[["Даражарнақты өсімдік:",["Бұршақ","Бидай","Алма","Картоп"],1],["Қосжарнақтыларға тән тамыр жүйесі:",["Шашақ","Кіндік","Ауа","Тіреу"],1],["Доғалы немесе параллель жүйкеленуі бар өсімдік:",["Жүгері","Емен","Қызылша","Күнбағыс"],0]],"tf":[["Астық тұқымдастары даражарнақтыларға жатады",1],["Қосжарнақтылардың гүл бөліктері 3-ке еселі",0],["Бұршақ – қосжарнақты өсімдік",1]],"gr":["кластер","Даражарнақты өсімдіктердің белгілері мен тұқымдастарының кластерін құрыңдар","Қосжарнақты өсімдіктердің белгілері мен тұқымдастарының кластерін құрыңдар","Гербарий (суреттер) бойынша 6 өсімдікті кластарға сұрыптап, дәлелдеңдер"],"lab":"key"},"9":{"n":9,"kind":"p","title":"Жануарлардың басым типтері мен олардың кластары","page":39,"sec":3,"codes":["8.1.1.4"],"goal":"Буынаяқтылар мен хордалы жануарлар кластарын ерекше белгілері бойынша тану","recall":"Жануарлардың қандай типтерін білесіңдер? Олардың қандай айырма шылықтары бар? Хитин, желі, сыртқы және ішкі қаңқа дегеніміз не? Олар қандай жануарларға тән?","intro":"Жануарлардың басым типтері. Қазіргі кезде жер жүзінде біржасу шалы және көпжасушалы жануарлардың әртүрлі типтері бар. Олардың барлығы эволюция барысында жетіліп, тіршілік ортасына жақсы бейімделді. Бірақ жануарлардың екі типі басқа жануарлар дүниесінен күрт ерекшеленеді. Бұлар – түрлер және дара саны ең көп буынаяқтылар типі. Екіншісі эволюция барысында ең соңында пайда болған, ең жетілген желілілер типі. Буынаяқтылар типінің сипаттамасы, олардың кластары. Буын аяқтылар типі сырттай желілілер типінен күрт ерекшеленеді. Бұл жануарлардың маңызды төрт белгісі бар. 1. Сыртқы қаңқасы – хитинді жабыны бар. 2. Денесі сегменттерден – буындардан тұрады. Денесі арғы тектеріндегі сияқты (сақина тәрізді","terms":["Буынаяқтылар","Желілілер","Желбезектер","Хелицерлер","Желі","Жүйке түтікшесі","Сүт бездері"],"qs":{"Білу және түсіну":["Желілілер типінің кластарын атаңдар.","Буынаяқтылар типінің кластарын атаңдар.","Буынаяқтылар туралы не білесіңдер? Неліктен оларды осылай атайды? қолданылуы:","Буынаяқтылар типіне жататын түрлерге сипаттама беріңдер."],"Талдау":["Буынаяқтылар типі кластарының арасында қандай айырмашылықтар мен ұқсастықтар болатынын талдаңдар.","Желілілер типі кластарының арасында қандай айырмашылықтар мен ұқсастықтар болатынын талдаңдар.","Буынаяқтылар типі кластарын сызба түрінде бейнелеңдер.","Желілілер типінің тип тармақтары мен кластарын сызба түрінде бейнелеңдер."],"Синтез":["Неліктен буынаяқтылар бунақденелілерден түр санының көптігімен басым тип болып саналатынын талқылаңдар.","Басым типтердің негізгі кластарының ұқсастықтары мен айыр машылықтарына жалпы сипаттама беріңдер. 4-бөлім. Қоректену"]},"gl":[["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."],["Көкірек","жүрек, кеңірдек және өңеш орналасқан кеуде қуысының бөлігі."]],"labs":[],"bjb":true,"c":["🕷 , майлары мен көмірсулары) қолжетімді ету үшін асқорыту мүшелері немесе асқорыту жүйесі керек. Яғни асқорыту мүшелері тамақты қорытады – қоректік заттарды құрамбөліктеріне дейін ыдыратады да, осы күйінде оларды дененің барлық жасушаларына бағыттайды. Мысалы, тамақтың барлық көмірсулары глюкозаға, майлар глицерин мен май қышқылдарына, ал нәруыздар аминқышқылдарына дейін қорытылады. Төмендегі асқорыту жүйесі едәуір жетілген болып есептеледі. 1) Асқорыту бездері асқоры","terms":["Асқорыту жүйесі","Сілекей безі","Үлкен қарын","Жасұнық","Қарын сөлі"],"qs":{"Білу және түсіну":["Асқорыту жүйесіне, асқорыту жолына және асқорыту бездеріне анықтама беріңдер.","Асқорыту дегеніміз не?","Асқорыту мүшелерінің рөлін қалай түсінесіңдер?"],"Қолданылуы":["Жауынқұрттың асқорыту жүйесінің әртүрлі бөлімдері мен қызметін сипаттаңдар.","Сиыр қарнының бөлімдері мен оларда жүретін үдерістер арасындағы байланысты анықтаңдар.","Басқа ағзада түзілген нәруыздар, майлар мен көмірсулар жасушаға түскен кезде өлім қаупі туындайды, ал аминқышқылдары, глюкоза, глицерин мен май қышқылдары ондай қауіп төндірмейтінін түсіндіріңдер."],"Талдау":["Асқорытудағы әртүрлі бездердің рөлі қандай екенін талдаңдар.","Асқорыту мүшесіндегі қоректің өзгеруін сызба түрінде бейнелеңдер.","Асқорыту мүшелерінің құрылысы пайдаланатын қорек типіне тәуелділігін мысалдар арқылы дәлелдеңдер."],"Синтез":["Сиырдың қарны төрт бөлімді, ал жылқынікі бір бөлімді және ішектері ұзын әсіресе бүйені едәуір ұзын екені белгілі болса, қандай қорытынды жасауға болатынын талдаңдар.","«Асқорыту мүшелерінің эволюциясы» деген тақырыпқа эссе жазыңдар."],"Бағалау":["Мынадай фактіні талдаңдар: «Тауық сорпасын, сүтті немесе концентрациясы 1% қант шәрбатын тамырға енгізген кезде адам неліктен бірден өледі? Пікір таластырып, өз ойларыңды айтыңдар.","Асқорыту мүшелері жоқ сүтқоректілер тіршілік етуі мүмкін бе? Егер мүмкін болса, олардың тіршілік ету жағдайларын болжаңдар. №1 модельдеу. Адам, сиыр және жауынқұрттың асқорыту жүйесінің құрылысын салысты да болғанын талқылаңдар.","«Адам тістерінің жеке және тарихи даму барысында өзгеруі» деген тақырыпқа эссе жазыңдар."],"Бағалау":["«Тісті сақтауға арналған жаднама» жасаңдар. Оны жарнама өнімі ретінде түрлі түсті буклет және т.б. түрінде рәсімдеңдер.","М. Әлімбаевтің: «Асығыс жеген тамақ асқазанға түскен тас сияқты» деген пікірі мен қазақ халқының «Ауру ауыз арқылы кіреді» деген мәтелін талқылаңдар және бағалаңдар. Кез келген тісте жүретін жұқпалы ауру үдерісі (инфекциялық) асқорыту мүшелеріне ғана емес, бүкіл ағзаға әсер ететінін дәлелдеңдер."]},"gl":[["Пульпа, жұмсақ ұлпа","тістің сауыты мен түбір қуысын толтыратын тіс ұлпасы."],["Сүт тістер","алғашқы тұрақсыз тістер, 14–15 жасқа қарай тұрақты тістермен алмасады."],["Тісжегі","тістің қатты ұлпасының бұзылуынан болатын ауру."],["Гигиена","өмір сүру және еңбек жағдайының адамның денсаулығына әсерін зерттейтін, аурулардың алдын алу, денсаулық сақтау және өмір сүру жасын ұзарту шараларын жасаумен айналысатын медицина саласы."]],"labs":[],"bjb":false,"c":["🦷 Тіс","🪥 Тіс щеткасы","🍬 Кәмпит","👩‍⚕️ Стоматолог"],"cs":["Арман күніне бірнеше рет газдалған сусын ішіп, кәмпит жейді, ал тісін тек таңертең тазалайды. Соңғы кезде суық су ішкенде тісі ауыратын болды.","Арманның тісінде қандай ауру басталуы мүмкін?","Ауру тістің қай қабаттарын бұзады?","Арманға 3 гигиеналық кеңес бер."],"tb":["Тіс түрлері және олардың қызметі",["Тіс түрі","Саны (ересекте)","Пішіні","Қызметі"],["Күрек тістер","Сүйір тістер","Кіші азу тістер","Үлкен азу тістер"]],"mc":[["Ересек адамда неше тұрақты тіс бар?",["20","28","32","36"],2],["Тістің ең қатты сыртқы қабаты:",["Дентин","Кіреукіс (эмаль)","Пульпа","Цемент"],1],["Тағамды ұсақтап үгітетін тістер:",["Күрек","Сүйір","Азу","Сүт"],2]],"tf":[["Сүт тістері саны – 20",1],["Пульпада қан тамырлары мен жүйкелер болмайды",0],["Тіс жегісін бактериялар туғызады",1]],"gr":["инфографика","«Тістің құрылысы» инфографикасын жасаңдар","«Тіс жегісі қалай пайда болады?» инфографикасын жасаңдар","«Тісті күту ережелері» ін үдерістерді сәйкестендіріңдер."],"Синтез":["Кестені толтырыңдар. Мүше Бөлігі (құрылысының Қызметі ерекшеліктері) Ауыз Тістер Тамақты тістеу және ұсақтау Тіл Сілекей (сілекей бездері) Жұтқыншақ Бұлшық етті түтікше Өңеш Бұлшық етті түтікше Асқазан Бұлшық еттің үш қабаты Тамақтың асқазан сөлімен араласуы Біржасушалы бездер Асқазан сөлі Бауыр Ұйқы безі Ашішектің бірінші бөлімі Ашішектің қалған бөлімі аш Ішек бүрлері Ішек Соқырішек, аппендикс Тоқішектің негізгі бөлігі тоқ Тоқішектің соңғы бөлігі Тамақтың қорытылмаған қалдықтарын жою"],"Бағалау":["Адамның асқорыту жүйесінің эволюциялық үдерісі туралы реферат жазыңдар.","«Тамақ жеу үшін емес, өмір сүру үшін тамақ жеу керек» деген ежелгі гректердің қанатты сөзін талқылап, өз пікірлеріңді айтыңдар."]},"gl":[["Өт қабы","ұзындығы 10–14 см, қабырғасы жұқа, алмұрт пішінді қалташық."],["Аппендикс","пішіні құрт тәріздес соқырішек өсіндісі."],["Аппендицит","құрт тәрізді өсіндінің (аппендикстің) ісінуі және қабынуы."],["Гликоген","глюкоза қалдықтарынан түзілген          полисахарид. Адам мен жануарлардың негізгі көмірсу қоры."],["Дәрумендер","аз мөлшерде тамақтануға, зат алмасуға және ағза тіршілігіне қажет химиялық құрамы әртүрлі органикалық заттар."],["Сіңір","қаңқа сүйектерін немесе жеке мүшелерді байланыстыратын тығыз, дәнекер ұлпалы желі және пластиналар."],["Ұлтабар, он екі елі ішек","ашішектің (асқазанның шығаберістегі тесігінен ашішекке дейінгі) бастапқы кесіндісі."]],"labs":[],"bjb":false,"c":["👄 Ауыз","🫃 Асқазан","🟤 Бауыр","🌀 Ішек"],"cs":["Нанды ұзақ шайнағанда оның дәмі тәттіленеді.","Бұл құбылыс қандай фермент әсерімен жүреді?","Крахмал қандай затқа дейін ыдырайды?","Тағамды неге асықпай, жақсылап шайнау керек?"],"tb":["Асқорыту мүшелері және олардың қызметі",["Мүше","Бөлінетін сөл/фермент","Қорытылатын зат"],["Ауыз қуысы","Асқазан","Он екі елі ішек","Ащы ішек"]],"mc":[["Қоректік заттар қанға негізінен сіңетін бөлім:",["Асқазан","Ащы ішек","Өңеш","Тік ішек"],1],["Майларды эмульгирлейтін сұйықтық:",["Сілекей","Өт","Қар Талдау":["Дәрумендердің ағзадағы қызметі мен олардың жетіспеушілігіне байланысты денсаулықтың бұзылуы арасындағы тәуелділікті анықтаңдар әрі талдаңдар.","Кестені толтырыңдар. Дәрумендердің Майда Өнімдердегі Дәрумендердің Авита Авитаминоз атауы не суда мөлшері рөлі миноз белгілері еритіндер Ақшам соқыр Мешел Берибери Құрқұлақ"],"Синтез":["Дәрумендердің ағзадағы рөліне жалпы сипаттама беріңдер.","Адамның дәруменсіз өмір сүре алмайтынын дәлелдеңдер.","Авитаминозға мысалдар келтіріңдер.","Дәрумендердің болуының эволюциялық мәні неде? Жауаптарыңды негіздеңдер."],"Бағалау":["Кейбір физиологтардың пікірі бойынша дәрумендерді ағзада синтезделмейтін «гормондар» деп атауға болады. Осы пікірге келісесіңдер ме? Дәрумендер мен гормондардың қандай ұқсастықтары мен айырмашылықтары бар? Жауаптарыңды негіздеңдер.","Табиғи тамаққа қарағанда қолдан (жасанды) дәрумендендірілген тамақ едәуір пайдалы деп ойлайсыңдар ма? Сыныпта осы тақырыпқа пікір таластырыңдар. 5-бөлім. ЗаттардыҢ тасымалдаНуЫ"]},"gl":[["Дәрумендер","аз мөлшерде тамақтануға, зат алмасуға және ағза тіршілігіне қажет химиялық құрамы әртүрлі органикалық заттар."],["Авитаминоз","тағамдағы дәрумендердің аздығынан ағзадағы зат алмасу үдерісінің бұзылуынан болатын ауру."],["Пеллагра","РР (никотин қышқылы) жетіспеуінен болатын ауру."],["Жұмыртқа","жұп аталық жыныс безі."],["Мешел","балаларда Д витамині түзілуінің бұзылуынан болатын ауру."],["Анемия","қанда эритроциттердің азайып, гемоглобиннің кемуінен болатын ауру. Анестезия, жансыздану. Анестетик күшімен сезімнен айырылу. Белгілі бір жерінің ауырғанын сезбейтіндей етіп жансыздандыру."],["Ашытқылар","типтік мицелийі жоқ, жеке бүршіктенетін немесе бөлінетін жасушалар мен олардың колониясы түрінде болатын саңырауқұлақтардың жиналған тобы."],["Зат алмасу, метаболизм","ағзада жүретін, оның өсуін, тіршілік әрекетін, өніп-өсуін, қоршаған ортамен тұрақты байланысы мен алмасуын қамтамасыз ететін химиялық айналымның жиынтығы."]],"labs":[],"bjb":true,"c":["🥦 Брокколи","🐟 Балық майы","🥛 Сүт","🍋 Лимон"],"cs":["Қыста Айгүлдің тез шаршайтын, жиі суық тиетін болды, қызыл иегі қанай бастады. Ол көбіне макарон, нан және тәттілер жейді.","Айгүлде қандай дәрумен жетіспейді деп ойлайсың?","Оның тамақтануындағы қателікті көрсет.","Айгүлге бір күндік дәруменге бай мәзір ұсын."],"tb":["Дәрумендерге бай азық-түлік тізімі",["Дәрумен","Азық-түлік (3 мысал)","Ағзадағы маңызы"],["А","В тобы","С","D"]],"mc":[["С дәруменіне ең бай өнім:",["Ақ нан","Итмұрын","Күріш","Қант"],1],["D дәрумені жетіспегенде балаларда дамитын ауру:",["Рахит","Цинга","Бери-бери","Пеллагра"],0],["Қанның ұюына қатысатын дәрумен:",["К","С","В1","А"],0]],"tf":[["Сәбіз А дәруменінің провитаминіне (каротинге) бай",1],["С дәрумені ұзақ қайнатқанда көбейеді",0],["Балық майында D дәрумені көп",1]],"gr":["постер","«Дәруменді табақ» постерін жасап, таңғы асқа мәзір құрыңдар","«Дәруменді табақ» постерін жасап, түскі асқа мәзір құрыңдар","«Дәруменді табақ» постерін жасап, кешкі асқа мәзір құрыңдар"],"lab":"vitc"},"16":{"n":16,"kind":"p","title":"Ағзаның ішкі ортасы және оның маңызы","page":71,"sec":5,"codes":["8.1.3.5"],"goal":"Лимфа жүйесінің қан, ұлпа сұйықтығы мен лимфа арасындағы өзара байланысты сипаттау","recall":"Қандай жануарларда ең алғаш қан және қан айналым жүйесі пайда болды?","intro":"Адам ағзасының ішкі ортасы негізгі үш сұйықтықтан: қан, лимфа, ұлпа сұйықтығынан тұрады. Осы үш сұйықтықтың біртұтас жүйе ретінде өзара әрекеттесуі эволюция барысында қалыптасты. Аталған әрбір сұйықтық өзіне тиесілі рөлді атқарады және құрамы соған сәйкес болады. Ағзаның осы үш сұйықтық ортасының өзара әрекеттесуі дене жасушаларын барынша оттекпен әрі қоректік заттармен қамтамасыз етуге және оны шлактан (тіршілік әрекетінің қалдықтары – зиянды заттардан) тазартуға бағытталған. Гомеостаз. Ағза үнемі әртүрлі: температураның өзгеруі, ағзаға түрлі заттардың түсуі, дене жүктемесі, ауру тудыратын микробтардың енуі, ұйқы мен сергектіктің ауысуы және т.б. әсерге ұшырап отырады. Ағза өзін сақтау үшін","terms":["Гомеостаз","Ұлпа сұйықтығы","Лимфа","Лимфоциттер","Қан"],"qs":{"Білу және түсіну":["Гомеостаз дегеніміз не?","Неліктен ағзаның негізгі үш сұйық ортасы өзара байланысты екенін түсіндіріңдер.","Ағзаның негізгі сұйық орталары қашан және қандай құрылымдар арқылы бір-біріне айналатынын айтыңдар.","Ағзаның негізгі үш сұйық ортасынан басқа қандай сұйықтықтар ішкі орта құрамына кіретінін және олардың әрқайсысының рөлі қандай екенін түсіндіріңдер."],"Қолданылуы":["Лимфаның қызметін сипаттаңдар.","Қан, ұлпа сұйықтығы және лимфа арасындағы байланысты анықтаңдар.","Лимфа неден тұрады?","Қан плазмасы мен лимфа құрамын салыстырыңдар."],"Талдау":["Сұйықтықтардың ағзада қозғалу үдерісін талдаңдар және олардың қалай өзгеретінін айтыңдар.","1) Су; 2) көмірсулар; 3) нәруыздар (аминқышқылдар); 4) майлар (глицерин мен май қышқылдары); 5) тұздардың молекулаларының ағзаға түсуінен бастап, ағзаның ішкі ортасына дейін қозғалуының сызбасын сызыңдар.","Қан, ұлпа сұйықтығы және лимфа қызметі арасындағы айырма шылықты айтыңдар."],"Синтез":["«Гомеостаз» түсінігі жалпы ағзаүстілік сипатқа ие екенін мысалдар келтіріп дәлелдеңдер. Жасушада, популяция, түр, биогеоценоз, экожүйе, қауымдастық деңгейінде гомеостаздың болатынын дәлелдеңдер.","Біздің ағзамыздағы барлық сұйықтық өзара қалай байланысқан? Алған білімдеріңді жүйелеңдер.","Адам ағзасында үш сұйық ортаның қалыптасуының эволюциялық мәні неде?","Мынадай жағдайдың моделін жасаңдар: ағзада а) қан; ә) ұлпа сұйықтығы; б) лимфа сұйықтықтарының бірі болмай қалса, қандай өзгерістер жүреді?"],"Бағалау":["Дәрігерге қаралу жүйке жүйесі жұмысының бұзылуына байланыс ты болмаса да, диагноз қою кезінде талдауға көбінесе жұлыннан сұйықтық алады. Диагноз қоюдың осы әдісінің мәнін талдаңдар және негіздеңдер.","Буын аурулары ағза проблемасының жалпы көрінісі болып табылады деп есептейсіңдер ме? Алған білімдеріңе сүйеніп, жауаптарыңды негіздеңдер.","Жер жүзіндегі тіршілікті қолдаудағы гомеостаз құбылысының маңызын сипаттаңдар."]},"gl":[["Лимфа","қан плазмасынан оны ұлпааралық кеңістікке және одан лимфа жүйесіне сүзу арқылы түзілетін түссіз сұйықтық."],["Лимфоциттер","түйіршікті емес лейкоциттердің бір түрі."],["Капиллярлар","мүшелер мен ұлпаларға енетін ұсақ тамырлар."],["Аппендикс","пішіні құрт тәріздес соқырішек өсіндісі."],["Аппендицит","құрт тәрізді өсіндінің (аппендикстің) ісінуі және қабынуы."],["Аденоидтар","мұрынжұтқыншақ бадамшалары."],["Артерия","қанды жүректен алып шығып, дене мүшелеріне тарататын тасымалдаушы ірі қан тамыры; оттегімен байытылған қанды жүректен ішкі мүшелерге тасымалдайтын қан тамырлары."],["Лейкоциттер","қызметі бойынша әртүрлі, түссіз қан жасушалары."]],"labs":[],"bjb":false,"c":["🩸 Қан","💧 Ұлпа сұйықтығы","🟡 Лимфа","🧪 Плазма"],"cs":["Адам аяғын жарақаттап алғанда, жараның маңы ісінді, ал шап маңындағы түйіндер ұлғайып, ауырсынды.","Шап маңындағы түйіндер не деп аталады?","Олар неге ұлғайды?","Лимфа жүйесі қан айналымымен қалай байланысты?"],"tb":["Ағзаның ішкі ортасының құрамбөліктері",["Құрамбөлік","Қайда орналасқан","Құрамы","Қызметі"],["Қан","Ұлпа сұйықтығы","Лимфа","Гомеостаз"]],"mc":[["Ағзаның ішкі ортасына жатпайды:",["Қан","Лимфа","Ұлпа сұйықтығы","Асқазан сөлі"],3],["Лимфа қайдан түзіледі?",["Ұлпа сұйықтығынан","Өттен","Сілекейден","Зәрден"],0],["Ішкі орта құрамының тұрақтылығы:",["Гомеостаз","Иммунитет","Метаболизм","Регенерация"],0]],"tf":[["Лимфа түйіндері сүзгі қызметін атқарады",1],["Лимфа жүрек арқылы айдалады",0],["Ұлпа сұйықтығы қан плазмасынан түзіледі",1]],"gr":["кластер","«Ағзаның ішкі ортасы» кластерін құрыңдар","«Лимфа жүйесінің мүшелері» сызбасын салыңдар","«Қан – ұлпа сұйықтығы – лимфа» айналымын сызба түрінде көрсетіңдер"],"lab":"order","ord":["Ішкі орта сұйықтықтарының айналымы",["Қан плазмасы (капилляр)","Ұлпа сұйықтығы","Лимфа капиллярлары","Лимфа тамырлары","Лимфа түйіндері","Лимфа өзегі","Вена қаны"]]},"17":{"n":17,"kind":"p","title":"Қанның құрамы мен қызметі","page":76,"sec":5,"codes":["8.1.3.1","8.1.3.2"],"goal":"Қан құрамы мен қызметін сипаттау. Қанның формалы элементтерінің құрылысының ерекшеліктері","recall":"Гемоглобин дегеніміз не? Бұл нәруыз құрамында қандай металл болады? Адам ағзасында неше литр қан бар? Лейкоциттер (лимфоциттер) не үшін керек?","intro":"Қ а н н ы ң қ ы з м е т і н тасымалдау, қорғаныш және гуморальдық деп 3 топқа бөлуге болады. Тасымалдау қызметі: плазма •оттекті өкпеден ұлпа жасушаларына, ал көмір қышқыл газын жасушалардан өкпеге тасымалдайды; лейко •асқорыту мүшелерінен қоректік заттарды жасуша циттер, ларға жеткізеді; тромбо- •жасушалардан зиянды заттарды шығарып тастайды; циттер •заттардың ыдырау өнімдерін бүйрекке және басқа эритро да сыртқа шығару мүшелеріне тасымалдайды; циттер •бауыр және бұлшық еттегі жылуды тері мен өкпеге тасымалдайды. Қорғаныш қызметі: 48-сурет. •ағзаны зиянды заттардан және ауру тудыратын Қанның құрамы микроағзалардан қорғайды; • микроағзалармен күресетін заттарды қалыптастырады; •дене температ","terms":["Қан","Плазма","Физиологиялық ерітінді","Эритроциттер","Тромбоциттер","Лейкоциттер","Гемоглобин","Қаназдық (анемия)","Жалған аяқтар","Лейкоцитоздық формула","Тромб","Фибриноген","Гемофилия."],"qs":{"Білу және түсіну":["Неліктен қан плазмасында әртүрлі заттар көп болатынын түсіндіріңдер.","Тромбтың қашан және қалай түзілетінін айтыңдар.","Мынадай: «физиологиялық ерітінді, гемоглобин, жалған аяқтар, лейкоцитоздықформула»деген терминдерге анықтама беріңдер.","Қан жасушаларының әрбір типінің рөлі қандай екенін анықтаңдар."],"Талдау":["Тромбтың түзілу кезеңдерін сызба түрінде талдап, бейнелеңдер.","Қан плазмасы құрамында болатын еритін нәруыздардың рөлін мысалдар келтіріп дәлелдеңдер.","Қан жасушалары құрылысының атқаратын қызметіне тәуелділігін анықтап, талдаңдар."],"Синтез":["Қанның кез келген құрамбөлігі немесе оның жасушаларының кез келген типі жойылып кетсе не болатынын талдаңдар.","«Микробатискаф арқылы қанда саяхаттау» деген тақырыпқа фантастикалық эссе жазыңдар.","Неліктен тасбақа эритроциттері он жылдай, құстардың эритроциттері бірнеше жыл, лама мен түйелердің эритроциттері 1–2 жыл, ал адамның эритроциттері бар-жоғы 4 айдай тіршілік ететіні туралы интернет желісін пайдаланып, ақпарат табыңдар."],"Бағалау":["«Омыртқасыз және омыртқалы жануарлар қатарында қан және оның элементтерінің пайда болуы мен эволюциясы» деген тақырыпқа реферат жазыңдар.","Қан құю станциясында кальцийсіздендірілген (кальцийінен айырылған) және дефибриляцияланған (фибриногеннен айырылған) қан сақталатыны белгілі. Қандай қан сақтауға және құюға, ал қайсысы қан топтарын анықтау үшін жарамды екені туралы өз пікірлеріңді айтыңдар. Жауаптарыңды негіздеңдер.","Мынадай ерекшеліктердің маңызын бағалаңдар: қаны болмайтын омыртқасыз жануарлар, қаны көкшіл түсті жануарлар, қаны түссіз жәндіктер де бар екені белгілі. Ал барлық омыртқалы жануарлардың қаны қызыл түсті. №6 зертханалық жұмыс. Түрлі ағзалар қанының формалы элементтерін зерттеу. 251-бетті қара."]},"gl":[["Эритроциттер","қанның қызыл жасушалары."],["Лейкоциттер","қызметі бойынша әртүрлі, түссіз қан жасушалары."],["Гемоглобин","қанның қызыл тыныс алу пигменті. Оттекті тыныс алу мүшелерінен ұлпаларға және көмірқышқыл газын ұлпалардан тыныс алу мүшелеріне апарады."],["Фибриноген","қанның ұюына қатысатын нәурыз."],["Гемофилия","қан ұю жүйесінің жеткіліксіздігіне байланысты туындайтын тұқым қуалайтын ауру; қанағыштық байқалады."],["Қанның ұюы","қан плазмасында фибриногеннің ерімейтін фибринге еруі нәтижесінде сұйық қанның эластикалық ұйысқан қанға айналуы."],["Фибрин","қан плазмасының құрамында болатын қанның ұюына қатысатын нәруыз."],["Анемия","қанда эритроциттердің азайып, гемоглобиннің кемуінен болатын ауру. Анестезия, жансыздану. Анестетик күшімен сезімнен айырылу. Белгілі бір жерінің ауырғанын сезбейтіндей етіп жансыздандыру."]],"labs":[[6,"Түрлі ағзалар қанының формалы элементтерін зерттеу",251]],"bjb":false,"c":["🔴 Эритроцит","⚪ Лейкоцит","🩹 Жара","🧪 Пробирка"],"cs":["Талдау нәтижесінде науқастың қанында эритроциттер мен гемоглобин мөлшері қалыптан төмен шықты. Ол тез шаршайды, бас айналады, терісі бозарған.","Науқаста қандай жағдай байқалады?","Гемоглобиннің қызметін түсіндір.","Қандай азық-түлік гемоглобинді көтеруге көмектеседі?"],"tb":["Қанның формалы элементтері",["Жасуша","Пішіні","Ядросы","Қызметі"],["Эритроцит","Лейкоцит","Тромбоцит","Плазма"]],"mc":[["Адам эритроцитінің пішіні:",["Шар","Екі жағы ойыс диск","Жұлдыз","Таяқша"],1],["Қанның ұюына қатысатын жасушалар:",["Эритроциттер","Лейкоциттер","Тромбоциттер","Лимфоциттер"],2],["Қанның сұйық бөлігі:",["Плазма","Лимфа","Сарысу","Фибрин"],0]],"tf":[["Сүтқоректілердің жетілген эритроциттерінде ядро болмайды",1],["Бақаның эритроциттері ядросыз",0],["Плазманың 90%-ға жуығы – су",1]],"gr":["тарсия","Қанның құрамын тарсия түрінде құрастырыңдар","Адам мен бақа қанын салыстыратын тарсия құрастырыңдар","Қанның қызметтерін тарсия арқылы сәйкестендіріңдер"],"lab":"micro"},"18":{"n":18,"kind":"p","title":"Иммунитет. Гуморальдық және жасушалық иммунитет","page":80,"sec":5,"codes":["8.1.3.3","8.1.3.4"],"goal":"Лейкоциттердің түрлі типтерінің қызметтерін сипаттау; гуморальдық және жасушалық иммунитетті салыстыру","recall":"Ағзаны қандай жасушалар қорғайды? Олардың құрылысының ерекшелігі неде? Олардың амебаға қандай ұқсастығы бар? Лейкоциттік формула дегеніміз не?","intro":"Иммунитет (лат. иммунис – бір нәрседен босату) – бұл ағзаның жұқпаларға (бактериялар мен вирустарға) және кез келген бөтен бөлшектерге қарсы тұру қасиеті. Иммунитет туралы ілім негізін орыс ғалымы и.и. Мечников пен неміс ғалымы П. Эрлих жасады. Олар 1908 жылы Нобель сыйлығын алды. Ағзаны жұқпалардан қорғауды қанның ақ жасушалары – лейкоциттер қамтамасыз етеді. Олар ағзаны екі әдіспен қорғайды: 1) микробтарды жояды – фагоцитоз; 2) микробтарды жоятын немесе арнайы қорғаныш нәруыздар – антиденелерді жасайды. Жасушалық және гуморальдық иммунитет. Микробтарды жою әдістері негізінде иммунитетті жасушалық (фагоцитоз) және гуморальдық (антидене) иммунитет деп бөледі. Бірақ бұл оншалықты дұрыс емес. ","terms":["Жасушалық және гуморальдық иммунитет","Фагоцитоз","Антидене"," үсуі мүмкін. Бірақ көбінесе олар адам денесіне асқорыту және тыныс алу жолдары арқылы енеді. Тері арқылы, қан соратын жәндіктер шаққан кезде, жарақаттанғанда және т.б. жағдайда енетін қоздырушылар да бар. Зақымданған ағзаға қоздырушылардың қандай топқа жататыны, қай жолмен түскені маңызды емес. Жұқпаның ағзаға қаншалықты зиян келтіруі де оның ену жолдарымен байланысты емес. Белгілі бір жұқпалар өлімге апарып соғуы мүмкін, кейбір жұқпалар аса қауіпті емес. Себебі адам ағзасы көп жағд","terms":["Жұқпалы аурулар","Қоздырушылар","Амёба дизентериясы","Фитофтороз","Тырысқақ (холера)","Күл (дифтерия)","Лейшманиоз","Герпес."],"qs":{"Білу және түсіну":["Жұқпаның жұғу жолдары дегеніміз не? Олар көбінесе қандай болады?","Ауру кезінде жекебас гигиенасын және санитарлық талаптарды не үшін сақтау керек?","«Жұқпалы аурулар», «қоздырушылар» деген терминдерге анықтама беріңдер.","Жұқпалы аурулар қоздырушыларының түрлерін сипаттаңдар."],"Талдау":["Жұқпалы аурулардың жұғу жолдарын және олардың ену жолдарының алдын алу шараларын сызба түрінде бейнелеңдер.","Орта ғасырларда және ХХ ғасырдың басында Еуропада жаппай індет (эпидемия) кезінде жұқпалы аурулардың таралу себептері туралы пікірлеріңді айтыңдар.","Ауру жұқтырудың алдын алуда жұқпа қоздырушылары туралы ақпаратқа ие болу маңыздылығын дәлелдеңдер."],"Синтез":["Параграфта сипатталған ауруларды еркін критерий бойынша жүйе леңдер.","Өмірде естіген, кең таралған жұқпалы аурулар туралы эссе жазыңдар.","Параграфта сипатталған аурулар туралы кесте-сызба сызыңдар. Міндетті құрамбөліктерін сипаттайтын кесте бағандары мен жолдарын тұжырымдаңдар.","Мынадай жағдайдың моделін жасаңдар: сендер тұратын аймаққа сырттан алып келінген қарбызда тырысқақ ауруының қоздырушылары анықталды. Сендер қандай әрекет жасайсыңдар?"],"Бағалау":["Мемлекет деңгейінде қолданылатын жұқпалы аурулардың алдын алу шаралары туралы пікірлеріңді айтыңдар. Дұрыс ретпен орналастырыңдар.","Осы бөлім бойынша алған білімдеріңді қажет деңгейге сәйкес деп есептейсіңдер ме? Сендер қаншалықты қажет ақпарат алғандарыңды бағалаңдар. Жағдайды жақсарту үшін не істеу керек? Жауаптарыңды дәлелдеңдер."]},"gl":[["Дизентерия","тоқішекті зақымдайтын және жалпы улану байқалатын өткір жұқпалы ауру (іштің өтуі)."],["Тырысқақ, холера","тырысқақ вибрионы тудыратын карантиндік ауру. Ауру адамнан, бұзылған тамақ, лас қол және т.б. арқылы жұғады."],["Гигиена","өмір сүру және еңбек жағдайының адамның денсаулығына әсерін зерттейтін, аурулардың алдын алу, денсаулық сақтау және өмір сүру жасын ұзарту шараларын жасаумен айналысатын медицина саласы."],["Тасымалдаушылары","безгек масасы."]],"labs":[],"bjb":true,"c":["🦟 Маса","🤧 Түшкіру","😷 Бетперде","🦠 Вирус"],"cs":["Сыныпта бір оқушы қызылшамен ауырып қалды. Екпе алмаған екі оқушыда бір аптадан кейін бөртпе шықты, ал екпе алғандар ауырмады.","Қызылшаның қоздырғышы кім: бактерия ма, вирус па?","Ауру қалай берілді?","Неге екпе алғандар ауырмады?"],"tb":["Жұқпалы аурулар",["Қоздырғыш тобы","Ауру мысалы","Берілу жолы","Алдын алу"],["Вирустар","Бактериялар","Саңырауқұлақтар","Қарапайымдар"]],"mc":[["Безгекті (малярияны) тудыратын:",["Вирус","Бактерия","Қарапайым (плазмодий)","Саңырауқұлақ"],2],["Туберкулездің қоздырғышы:",["Кох таяқшасы","Тұмау вирусы","Амёба","Ашытқы"],0],["Ауа-тамшы арқылы берілетін ауру:",["Тұмау","Безгек","Дизентерия","Сіреспе"],0]],"tf":[["Антибиотиктер вирустарға әсер етпейді",1],["Безгекті вирус тудырады",0],["Қолды жуу жұқпалы аурулардың алдын алады",1]],"gr":["инфографика","«Вирустық аурулар және олардың алдын алу» инфографикасын жасаңдар","«Бактериялық аурулар» инфографикасын жасаңдар","«Қарапайымдар мен саңырауқұлақтар тудыратын аурулар» инфографикасын жасаңдар"],"lab":"sir"},"20":{"n":20,"kind":"p","title":"Туа біткен және жүре пайда болған иммунитет түрлері","page":88,"sec":5,"codes":["8.1.3.6"],"goal":"Аурудың алдын алудағы вакцинацияның рөлін бағалау","recall":"Иммунитет туралы не білесіңдер? Иммунитеттің қандай түрлері бар? Неліктен қайтадан ауру жұқтырған кезде ағза көптеген жұқпалармен жеңіл күреседі? «Иммундық есте сақтауға» қандай жасушалар жауапты? Антидене және антиген дегеніміз не?","intro":"Иммунитет құбылысын лейкоциттердің алуан түрі қамтамасыз етеді. Жасушалық иммунитетті фагоциттер тез арада жүзеге асырады: микрофагтар – нейтрофилдер мен макрофагтар – моноциттер. Сонымен қатар қоздырушыларды «танитын» және «есте сақтайтын» едәуір күрделі иммунитетті Т-лимфоциттер жүзеге асырады. Олардың жұмысынан кейін В-лимфоциттер жұмыс істейді – арнайы нәруыздарды – антиденелерді жасайды. Бұл – жасушалық иммунитет. Әрбір антидене белгілі бір қоздырушыға – антигенге қарсы арнайы жасалады. Яғни бұл нақты бір «жауға» қарсы «жеке қару». Қоздырушылармен неғұрлым жиі кездессе, оны жоятын антиденелер соғұрлым тезірек жасалады. Бірақ иммунитет тек жасушалық қана емес, ұлпалық та болады. Сонымен ","terms":["Жасанды және табиғи иммунитет","Туа біткен және жүре пайда болған иммунитет","Сарысу","Аурудың алдын алатын вакциналар."],"qs":{"Білу және түсіну":["Сарысуды не үшін енгізу керек екенін түсіндіріңдер.","Өздеріңе белгілі иммунитет түрлерін атаңдар.","Жасанды және табиғи иммунитет арасында қандай айырмашылық бар? Адамзат медицина пайда болғанға дейін иммунитеттің қандай түрлеріне ие болғанын атаңдар. қолданылуы:","Адам ағзасында жұқпалы аурудың бастапқы сатысы жүріп жатқан кезде оған не енгізу керек екенін анықтаңдар."],"Талдау":["«Иммунитет түрлері» деген сызба сызыңдар. Оларды туа біткен және жүре пайда болған иммунитет деп бөліңдер. Оған жасушалық және ұлпалық иммунитетті қосыңдар.","Табиғи жүре пайда болған иммунитеттің қалыптасу үдерісін талдаңдар. Ол қандай аурулардан пайда болады?","Иммунитет түрлері арасындағы айырмашылықты көрсетіңдер."],"Синтез":["Өздеріңе белгілі вакцина мен сарысуға мысалдар келтіріңдер.","Қосымша ақпарат көздерін пайдаланып, БЦЖ, шешек, АКДС және сіреспеге қарсы екпенің қандай вакцинаға немесе сарысуға жататынын негіздеп ұсыныңдар.","Қандай жағдайда вакцина енгізуге болмайды және себебі неде? Жауаптарыңды негіздеңдер.","Жұқпалы ауру қоздырушыларының бұзылған құрамбөліктері сарысу негізі болып табылады деп ойлайсың ба? Ал вакцина ше? Жауаптарыңды дәлелдеңдер."],"Бағалау":["Иммунитет түрлері тұрғысынан неліктен сапасыз дайындалған вакцина қауіп тудыруы мүмкін екенін бағалаңдар. Оның әсерін ауру қоздырушыларының әсерімен теңестіруге бола ма? Жауаптарыңды негіздеңдер.","Табиғаттағы табиғи иммунитет түрлерінің маңызы туралы түсіндіріңдер. Неліктен Эбола вирусымен күресуде ең тиімді деп есептелетін сарысуды жылқы қанынан алғанын түсіндіріңдер.","Мынадай құбылыстардың маңызын түсіндіріңдер: энцефалит, ұйқы ауруы сияқты кейбір жұқпалардың «табиғи ошағы» бар. Неліктен осы аурулардың қоздырушыларының табиғи тасымалдаушылары, яғни жануарлар өлмейді?"]},"gl":[["Иммунитет","ағзаның өзінің тұтастығын және биологиялық даралығын сақтау қабілеті; жұқпалы аурулармен ауырмау."],["Вакцина","жұқпалы аурулардың қоздырғыштарының әлсіздендірілген (немесе өлтірілген) себіндісінен алынған медициналық препарат. Аурулардың алдын алу және емдеу мақсатында қолданылады."],["Лимфоциттер","түйіршікті емес лейкоциттердің бір түрі."],["Туа біткен дақ","терінің дамуының кемшілігі; оның белгілі бір жасушаларының шамадан тыс өсуі. Тамырлы, пигментті, сүйелді дақ болып бөлінеді."],["Есте сақтау, жады","өткен жеке тәжірибелерді қайта жаңғырту, еске түсіру қабілеті."],["Табиғи иммунитет","ағзаның туа пайда болған ауруға қарсы тұру қабілеті."]],"labs":[],"bjb":false,"c":["👶 Нәресте","🍼 Ана сүті","💉 Вакцина","🐄 Сиыр шешегі"],"cs":["1796 жылы Эдвард Дженнер сиыр шешегімен ауырған сауыншылардың адам шешегімен ауырмайтынын байқап, балаға сиыр шешегінің іріңін екті.","Дженнердің тәжірибесі иммунитеттің қай түріне негізделген?","Вакцина мен емдік сарысудың айырмашылығы неде?","Вакцинация неге бүкіл қоғам үшін маңызды?"],"tb":["Иммунитет түрлері",["Түрі","Қалай пайда болады","Мысал"],["Туа біткен","Табиғи жүре пайда болған","Белсенді жасанды (вакцина)","Енжар жасанды (сарысу)"]],"mc":[["Вакцина құрамында болады:",["Дайын антиденелер","Әлс ектің артықшылығы неде?","Жүректің эволюциясын балықтан сүтқоректілерге дейін ретімен жаз."],"tb":["Жануарлардың жүрегі мен қан айналымы",["Топ","Жүрек камерасы","Қан айналым жүйесі","Қан араласуы"],["Балықтар","Қосмекенділер","Бауырымен жорғалаушылар","Құстар мен сүтқоректілер"]],"mc":[["Балықтардың жүрегі:",["Екі камералы","Үш камералы","Төрт камералы","Жүрек жоқ"],0],["Ашық қан айналым жүйесі тән:",["Ұлуларға","Құстарға","Балықтарға","Адамға"],0],["Жүрек қарыншасында толық емес перде бар:",["Бақа","Кесіртке","Көгершін","Ит"],1]],"tf":[["Жауынқұртта тұйық қан айналым жүйесі бар",1],["Құстардың жүрегі үш камералы",0],["Төрт камералы жүрек – жылықандылыққа негіз",1]],"gr":["постер","Омыртқасыздардың қан айналым жүйесін сызба-постерге түсіріңдер","Балық пен қосмекенділердің жүрегін салыстыратын постер жасаңдар","Бауырымен жорғалаушылар, құстар және сүтқоректілердің жүрегін салыстырыңдар"],"lab":"order","ord":["Жүректің эволюциясы",["Жүрек жоқ (құрттың жиырылатын тамыры)","Екі камералы (балық)","Үш камералы (бақа)","Перделі үш камералы (кесіртке)","Төрт камералы (құс, сүтқоректі)"]]},"23":{"n":23,"kind":"p","title":"Қан тамырлары жүйесінің түрлері және қан айналым шеңберлері","page":100,"sec":5,"codes":["8.1.3.9","8.1.3.10","8.1.3.11"],"goal":"Жануарлардың қан тамырлары жүйесінің түрлерін сипаттау","recall":"Ашық және тұйық қан айналым шеңберлерінің айырмашылығы неде екенін еске түсірейік. Ол қандай жануарларға тән? Жасушалар мен дене арасындағы зат алмасуда жасушааралық сұйықтықтың рөлі қандай?","intro":"Қан тамырлар жүйесінің түрлері. Қан тамырлар жүйелерін ашық және тұйық деп екі үлкен топқа бөледі. Буылтық құрттар мен омыртқалы жануарларда тұйық қан тамырлар жүйесі болатынын еске түсірейік. Ал ұлулар мен бунақденелілер ашық қан тамырлар жүйесіне ие. Тұйық қан тамырлар жүйесінде қан мен дене жасушаларының арасында тікелей жанасу болмайды, делдал рөлін жасушааралық сұйықтық атқарады. Ашық қан тамырлар жүйесіне ие ағзаларда ағзаның ішкі ортасы болып табылатын үш сұйықтық болмайды. Үлкен және кіші қан айналым жүйелері алғаш рет қосмекенділерде пайда болды. Барлық балықтарда (шеміршекті, сүйекті) бір шеңберлі қан айналым жүйесі болады. Бүкіл дене арқылы өтетіндіктен мұны «үлкен қан айналым шең","terms":["Ашық және тұйық қан тамырлары жүйесі","Қан айналымның үлкен және кіші шеңберлері","Аорта","Қуыс ве на","Вена қақпақшалары","Жарты ай тәрізді қақпақшалар","Өк пе артериясы","Өкпе венасы","Пульс"],"qs":{"Білу және түсіну":["Ашық және тұйық қан айналым жүйелеріне анықтама беріңдер.","Адамға қандай қан айналым жүйесі тән және олардың әрқайсысының рөлі қандай болатынын түсіндіріңдер.","үлкен қан айналым шеңбері дегеніміз не және неге олай аталды? қолданылуы:","Жақтаулы және жарты ай тәрізді қақпақшалар қайда орналасқан? Олардың арасында қандай байланыс бар екенін анықтаңдар."],"Талдау":["Жүрек бөлімдерінің қанмен толу және жүректің жиырылу кезеңдерін талқылаңдар.","Қолдың венасынан бастап қанның үлкен қан тамырларының бойымен және жүректің бөлімдерімен қозғалуын, оның қайта қолда аяқталуын сызба түрінде бейнелеңдер.","Қақпақшалардың қатысынсыз толыққанды қан айналым болуы мүмкін еместігін дәлелдеңдер."],"Синтез":["Қолқа қан тамырының орнында басқа тамыр болуы мүмкіндігін талқылаңдар. Үлкен қан айналым шеңбері екі емес, бір венамен аяқталуы мүмкін бе? Ол қандай жағдайда болуы мүмкін?","Жақтаулы және жарты ай тәрізді қақпақшалардың орналасу ында, атқаратын қызметінде, қысымға қарсы тұруында қандай айырмашылықтары болатынын атап көрсетіңдер.","Жағдайды модельдеңдер: «Тез жүгіргенде жүрек минутына 180 рет соқты». Осы кездегі жүрек бөлімдерінің жиырылу және босаңсу уақыты қалай өзгереді?"],"Бағалау":["Реферат жазыңдар. «Ұшатын динозаврлардың жүрегі төрт қуысты болды» деген көзқарасты бағалаңдар. Жауаптарыңды дәлелдеңдер."],"Пікірталас":["Денеге шектен тыс ауырлық түскенде адамның жүрегі минутына 200ден артық соға ала ма? №7 зертханалық жұмыс. Денешынықтыру жаттығуларының жүрек жұмысына әсерін зерттеу. 252-бетті қара."]},"gl":[["Аорта","омы ларының себептерін сипаттау","recall":"Жүрек-қан тамырлары жүйесіне қандай мүшелер жатады? Жүрек-қан тамырлары жүйесінің қандай ауруларын білесіңдер?","intro":"Қан айналым жүйесі мүшелерінің көптеген аурулары бар. ДДҰ (Дүниежүзілік денсаулық сақтау ұйымы) мәліметтері бойынша, ХХ ғасырдың екінші жартысынан бастап табиғи өлімге себепші аурулардың ішінде алдыңғы қатарда жүрек-қан тамырлары жүйесінің аурулары тұр. Демек, адамзаттың өмір жасын ұзартудың бір жолы – жүрек-қан тамырлары жүйесінің ауруларымен күресу. Олардың ішіндегі ең жиі кездесетін түрлерін қарастырайық. Қан қысымы жоғарылауы да, төмендеуі де мүмкін. Гипотония – қан қысымының төмендеуі. Ол тамырлар мен жүрек бұлшық етінің әлсіздігінен, төмен зат алмасуға, аз қозғалуға байланысты дамуы мүмкін. Жас ұлғайған сайын тамырлардың қабырғасы созылғыш қасиетін жоғалтып, тығыздала бастайды және арт","terms":["Гипотония","Гипертония","Инсульт","Инфаркт миокард","Жүректің ишемиялық ауруы","Атеросклероз","Тромбоз","Тахикардия"],"qs":{"Білу және түсіну":["Гипертонияға анықтама беріңдер.","Атеросклероз деген не?","Жүрек және қан тамырлар жүйесі ауруларының алдын алу неліктен маңызды екенін түсіндіріңдер. қолданылуы:","Жүректің инфаркт және ишемиялық ауруларын салыстырыңдар."],"Талдау":["Инфарктің белгілерін талдаңдар. Неліктен оның белгілерін басқа аурулармен шатастырып алуға болады?","Инфаркт орын алған жағдайда көрсетілетін бірінші көмекті сызба түрінде көрсетіңдер.","Жүрек және қан тамырлар ауруларының себептері туралы өз ойларыңды айтыңдар."],"Синтез":["Жүрек және қан тамырлар ауруларының қаупін себеп критерийлері бойынша жүйелеңдер.","Гипертония және гипотонияға жалпы сипаттама беріңдер.","Тахикардияны қалай ажырататындарыңды айтыңдар."],"Бағалау":["Жүрек және қан тамырлар ауруларының алдын алу шаралары туралы реферат жазыңдар.","Саламатты өмір салтын ұстанып, жүрек және қан тамырлар ауруларының алдын алуды бағалаңдар және пікірталас өткізіңдер.","Не үшін 65 жастан кейін инфаркт қаупі арта беретіні туралы өз ойларың с алу орталығы мидың қандай бөлімінде орналасқан? Ол неге жауап береді? Осы бөлімде тағы қандай орталықтар орналасқан? Кеуде және құрсақ қуысы арасындағы бұлшық етті қалқа қалай аталады? Ол ең алғаш қандай омыртқалы жануарларда пайда болды?","intro":"Тыныс алу және тыныс шығару механизмдері нейрогуморальды жолмен реттеледі. Тыныс алудың өзі орталық жүйке жүйесі арқылы реттеледі. Тыныс алу және тыныс шығарудың ырғақты ауысымын сопақша мида орналасқан тыныс орталығы қамтамасыз етеді. Қолқа мен ірі артерияларда қанда СО2 концентрациясы артқан кезде қозатын арнайы жасушалар – хеморецепторлар бар. Бұл қозу сезімтал жүйкелер бойынша тыныс орталығына беріледі. Алған ақпаратты өңдеген соң тыныс орталығы қозғалғыш нейрондар бойынша қабырғааралық бұлшық ет пен көкетке (диафрагмаға) команда береді. Бұл бұлшық еттер жиырылады да, кеуде жасушаларының көлемі ұлғаяды. Өкпедегі қысым төмендейді де, ауа айдалады – тыныс алады. Адам ауамен тыныс алып және","terms":["Нейрогуморальдық","Хеморецепторлар","Қорғаныш реф лекс тері","Көкет (диафрагма)","Кеуделік және құр сақ тық тыныс алу типтері."],"qs":{"Білу және түсіну":["Тыныс алу әрекетін жүзеге асыратын құрылымдарды атаңдар.","«Кеуделік және құрсақтық тыныс алу типтері» дегенді қалай түсінесіңдер? қолданылуы:","Тыныс орталығының қызметін сипаттаңдар.","Тыныс алу әрекеті мен ағзаның оттекті қажетсінуі арасындағы байланысты анықтаңдар."],"Талдау":["Тыныс алу және тыныс шығару механизмдерін сызба түрінде бейнелеңдер.","Тыныс алу, тыныс шығару, жөтелу және түшкірудің себептері, ұқсастықтары мен айырмашылықтары туралы өз пікірлеріңді айтыңдар."],"Синтез":["Оттек тыныс алу мүшелеріне емес, тікелей қанға түскенде, адам тіршілігін жалғастыра ала ма? Өз пікірлеріңді айтыңдар.","Тыныс алу және тыныс шығару механизмдерін жүзеге асырудағы әртүрлі құрылымдардың рөлін бағалаңдар."],"Бағалау":["Мынадай жағдаят туралы пікірлеріңді айтыңдар: «Ота кезінде оттек маскасын пайдаланғаннан соң, пациент шамамен 30 секундқа өздігінен тыныс алуды тоқтатты. Жа н дененің физикалық жүктемесі кезіндегі тыныс алудың минуттық көлемін анықтау","recall":"Ауа шарын үрлеп көрдіңдер ме? Қалай ойлайсыңдар, өкпеге ауаның қандай мөлшері кіретінін өлшеуге бола ма? Қандай кең таралған зиянды әдет өкпе үшін едәуір қауіпті болып табылады?","intro":"өкпе жұмысының көрсеткіштері. Өкпеге қанша оттек сыяды? Адам ең терең тыныс алғаннан кейін шығаратын ауа көлемі өкпеніңтіршілік сыйымдылығы (ӨТС) деп аталады. Әйелдерде өкпенің орташа тіршілік сыйымдылығы – 2,7 литр немесе 2700 см3 құрайды. Ер адамдарда бұл көрсеткіш жоғары және орташа 3,5 л немесе 3500 см3 болады. ӨТС – өкпе жұмысының маңызды көрсеткіші. ӨТС неғұрлым көп болса, өкпе соғұрлым жақсы жұмыс істейді. Өкпенің тіршілік сыйымдылығы өзгеруі мүмкін, ол адам денсаулығына және басқа да факторларға байланысты. ХХ ғасырлардың ортасында ер адамдарда орташа ӨТС көрсеткіші 5 литр деп есептелген. Заманауи адамның аз қозғалатын өмір салты ӨТСтің азаюын келтіріп шығарды. Дене дамуы жақсы жетіл","terms":["Тыныс алу көлемі","Спирометр","Қордағы кө лем","Қалдық көлем","1 минуттағы тыныс алу кө лемі"],"qs":{"Білу және түсіну":["ӨТС деген түсінікке анықтама беріңдер. Оның әйелдер мен ер адамдардағы орташа шамасын айтыңдар.","Темекі шегу денсаулыққа не үшін зиян екенін түсіндіріңдер.","«Тыныс алу көлемі» мен «қордағы көлем» деген терминдерге анықтама беріңдер. қолданылуы:","ӨТС, тыныс алу көлемі, минуттық көлемі, қордағы және қалдық көлемдерді салыстырыңдар."],"Талдау":["Өкпе жұмысының әртүрлі көрсеткіштерін сызба түрінде бейнелеңдер.","Мынадай есептерді шығарыңдар: егер тыныс алу көлемі 450 см3, орта есеппен 1 минутта 18 рет тыныс алу қозғалысын жасайтын болса, жасөспірім өкпесі арқылы қанша ауа өтеді?","Есепті шығару үшін тыныс алатын және шығаратын ауа құрамын еске түсіріңдер. Сыныпта 26 оқушы бар. Олардың 1 минуттағы тыныс алу көлемі орташа 9 000 см3 болса, оқушылар 45 минутта, қанша оттек сіңіреді?","Егер оқушының тыныс алу көлемі орташа 500 см3 болса, ол бір сабақта (45 мин) қанша көмірқышқыл газ
