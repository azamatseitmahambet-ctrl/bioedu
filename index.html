інде заманауи медицина көмектесе ме? Мысалдар келтіріп дәлелдеңдер."],"Синтез":["Қан топтарының құрамы мен қызметіне толық анықтама беріңдер және талқылаңдар.","Критерийлер бойынша жүйелеңдер.","«Қан топтары: бұрын және бүгін» деген тақырыпқа эссе жазыңдар.","Адам өміріндегі нәруыздардың рөлін бағалаңдар."],"Бағалау":["Неліктен қан құю керек екені туралы өз пікірлеріңді айтыңдар.","Жекетөзеалмауға анықтама беріңдер және талдаңдар."],"Пікірталас":["Агглютинация кезінде не болады және оның салдары қандай?"]},"gl":[["Агглютинация","арнайы антиденелердің (агглютининдер) әсерімен антигендердің (бактериялар, қан жасушалары, басқа жасушалар) бір-біріне жабысуы және тұнба (агглютинант) жасауы."],["Резус-фактор","қанның эритроцит жасушаларының құрамында болатын нәруыз."],["Эритроциттер","қанның қызыл жасушалары."],["Реципиент","қан қабылдайтын адам."],["Эмбрион","адам және жануардың ұрығы."]],"labs":[],"bjb":false,"c":["🅰️ А тобы","🅱️ В тобы","🩸 Донор","🏥 Қан құю"],"cs":["Жол апатына түскен адамға шұғыл қан құю керек. Оның қан тобы – II (А), Rh–. Қан банкінде I (0) Rh–, II (А) Rh+, IV (АВ) Rh– қандар бар.","Науқасқа қай қанды құюға болады?","Неге қалғандарын құюға болмайды?","Агглютинация дегеніміз не?"],"tb":["Қан топтары",["Қан тобы","Эритроциттегі антиген","Плазмадағы антидене","Кімге бере алады"],["I (0)","II (A)","III (B)","IV (AB)"]],"mc":[["Әмбебап донор:",["I (0) Rh–","IV (AB) Rh+","II (A)","III (B)"],0],["Әмбебап реципиент:",["I (0)","II (A)","III (B)","IV (AB) Rh+"],3],["Резус-конфликт қашан болуы мүмкін?",["Ана Rh+, бала Rh–","Ана Rh–, бала Rh+","Екеуі де Rh+","Екеуі де Rh–"],1]],"tf":[["I топтағы адамның эритроциттерінде А және В антигендері жоқ",1],["IV топтың плазмасында α және β антиденелері бар",0],["Қан тобын К. Ландштейнер ашқан",1]],"gr":["тарсия","Қан топтарының антиген-антидене тарсиясын құрастырыңдар","Қан құю сызбасын (кім кімге бере алады) тарсиядан құрастырыңдар","Резус-фактор және резус-конфликт сызбасын құрастырыңдар"],"lab":"blood"},"22":{"n":22,"kind":"p","title":"Жануарлардың жүрек-қан тамырлары жүйесі құрылысының ерекшеліктері мен эволюциясы","page":95,"sec":5,"codes":["8.1.3.8"],"goal":"Буылтық құрттардың, ұлулардың, буынаяқтылар мен сүтқоректілердің қан айналым мүшелерін сипаттаңдар.","recall":"Жануарлардың қан айналым жүйесі тек қан тамырларынан (жауынқұрт) (31-суретті қараңдар) немесе жүрек пен қан тамырларынан (ұлулар, буынаяқтылар) (52-сурет) тұруы мүмкін. Бүкіл омыртқалылардың жүйесі (53-сурет) адам ағзасының мысалында берілді. Естеріңде болса, эволюция барысында қан және қан айналым жүйесі ең алғаш рет буылтық құрттарда пайда болды. Оларда жүрек болмады, жүректің қызметін дененің алдыңғы жағындағы «жүрекше» деп аталатын 5 ірілеу сақиналы қан тамырлары атқарды.","intro":"а Жүректің Қан тамырлары қарыншасы Жүрекше ә Жүрек Қан тамырлары 52-сурет. Ұлу (а) және өзеншаянның (ә) қан айналым жүйесі Бассүйексіздерде де жүрек болмайды. Қандауыршада жүрек қызметін құрсақ қолқа қан тамыры атқарады. Бассүйекті (омыртқалы) жануарларда ұлулар мен буынаяқтылардағыдай қан айналым жүйесі жүрек пен қан тамырларынан тұрады. Адамның қан тамырлары қабырғаларының құрылысы. Ірі қан тамыр ларының қабырғалары 3 қабаттан түзіледі. Сыртқы қабаты қан тамырларына пішін, серпімділік және беріктік қасиет береді. Бұл қабат тығыз дәнекер ұлпасынан тұрады. Осындай қабат барлық іші қуыс мүшелерде: өңеш, асқазан, ішек, қуық, өт жолы және т.б. қабырғасында болады. Ортанғы қабаты бірыңғай салалы","terms":["Артериялар","Веналар","Капиллярлар","Қолқа","Жүрек","Перикард","Жүрек қабы","Жүрек қабындағы сұйықтық","Миокард","Эндокард"],"qs":{"Білу және түсіну":["Жүрек не үшін керек екенін түсіндіріңдер.","«Перикард, миокард, эндокард» терминдеріне анықтама беріңдер.","Қан тамырларының қабырғаларын сипаттаңдар. қолданылуы:","Омыртқасыздардың ішінде қандай ағзаларда жүрегінің қуыстары (камералары) болады?"],"Талдау":["«Омыртқасыз жануарлар жүрегінің эволюциясы» сызбасын сызыңдар.","«Омыртқалы жануарлар жүрегінің эволюциясы» сызбасын сызыңдар.","Қан тамырларының атқаратын қызметі мен құрылысының бір-бірімен байланысын талқылаңдар."],"Синтез":["Артериялар мен веналардың арасындағы айырмашылықтарды атаңдар. Құрылысы басқа болғанда өз қызметін атқара алмайтынын дәлелдеңдер. Омыртқалы жануарлардың жүрек қуыстарының ұлғаюының эволюциялық мәні неде? Төрт қуысты (камералы) жүректің артықшылығы неде?"],"Бағалау":["Қан айналым жүйесі басқа болғанда, омыртқалы жануарлар эволюциясы болуы мүмкін бе еді? Жауаптарыңды дәлелдеңдер.","Табиғатта қан тамырлары жүйесінің пайда болуының маңызын түсіндіріңдер."]},"gl":[["Артерия","қанды жүректен алып шығып, дене мүшелеріне тарататын тасымалдаушы ірі қан тамыры; оттегімен байытылған қанды жүректен ішкі мүшелерге тасымалдайтын қан тамырлары."],["Веналар","көмірқышқыл газына қаныққан, зат алмасу өнімдері, гормондар мен басқа заттар бар вена қанын мүшелер мен ұлпалардан жүрекке (артерия қанын әкелетін өкпе және кіндік венасынан басқа) апаратын қан тамырлары."],["Капиллярлар","мүшелер мен ұлпаларға енетін ұсақ тамырлар."],["Жүрек бұлшық еті","миокард."],["Перикард, жүрек қабы","жүрек орналасқан берік дәнекер ұлпалы екі қабатты қапшық."],["Миокард","жүректің бұлшық етті қабаты."],["Эндокард","жүректің эпителий ұлпасынан түзілген ішкі қабаты."],["Қанның ұюы","қан плазмасында фибриногеннің ерімейтін фибринге еруі нәтижесінде сұйық қанның эластикалық ұйысқан қанға айналуы."]],"labs":[],"bjb":false,"c":["🪱 Құрт","🐌 Ұлу","🐸 Бақа","❤️ Жүрек"],"cs":["Бақаның жүрегі үш камералы, сондықтан қарыншада артерия мен вена қаны жартылай араласады. Ал құстар мен сүтқоректілерде төрт камералы жүрек бар.","Қан араласуы бақаның тіршілігіне қалай әсер етеді?","Төрт камералы жүректің артықшылығы неде?","Жүректің эволюциясын балықтан сүтқоректілерге дейін ретімен жаз."],"tb":["Жануарлардың жүрегі мен қан айналымы",["Топ","Жүрек камерасы","Қан айналым жүйесі","Қан араласуы"],["Балықтар","Қосмекенділер","Бауырымен жорғалаушылар","Құстар мен сүтқоректілер"]],"mc":[["Балықтардың жүрегі:",["Екі камералы","Үш камералы","Төрт камералы","Жүрек жоқ"],0],["Ашық қан айналым жүйесі тән:",["Ұлуларға","Құстарға","Балықтарға","Адамға"],0],["Жүрек қарыншасында толық емес перде бар:",["Бақа","Кесіртке","Көгершін","Ит"],1]],"tf":[["Жауынқұртта тұйық қан айналым жүйесі бар",1],["Құстардың жүрегі үш камералы",0],["Төрт камералы жүрек – жылықандылыққа негіз",1]],"gr":["постер","Омыртқасыздардың қан айналым жүйесін сызба-постерге түсіріңдер","Балық пен қосмекенділердің жүрегін салыстыратын постер жасаңдар","Бауырымен жорғалаушылар, құстар және сүтқоректілердің жүрегін салыстырыңдар"],"lab":"order","ord":["Жүректің эволюциясы",["Жүрек жоқ (құрттың жиырылатын тамыры)","Екі камералы (балық)","Үш камералы (бақа)","Перделі үш камералы (кесіртке)","Төрт камералы (құс, сүтқоректі)"]]},"23":{"n":23,"kind":"p","title":"Қан тамырлары жүйесінің түрлері және қан айналым шеңберлері","page":100,"sec":5,"codes":["8.1.3.9","8.1.3.10","8.1.3.11"],"goal":"Жануарлардың қан тамырлары жүйесінің түрлерін сипаттау","recall":"Ашық және тұйық қан айналым шеңберлерінің айырмашылығы неде екенін еске түсірейік. Ол қандай жануарларға тән? Жасушалар мен дене арасындағы зат алмасуда жасушааралық сұйықтықтың рөлі қандай?","intro":"Қан тамырлар жүйесінің түрлері. Қан тамырлар жүйелерін ашық және тұйық деп екі үлкен топқа бөледі. Буылтық құрттар мен омыртқалы жануарларда тұйық қан тамырлар жүйесі болатынын еске түсірейік. Ал ұлулар мен бунақденелілер ашық қан тамырлар жүйесіне ие. Тұйық қан тамырлар жүйесінде қан мен дене жасушаларының арасында тікелей жанасу болмайды, делдал рөлін жасушааралық сұйықтық атқарады. Ашық қан тамырлар жүйесіне ие ағзаларда ағзаның ішкі ортасы болып табылатын үш сұйықтық болмайды. Үлкен және кіші қан айналым жүйелері алғаш рет қосмекенділерде пайда болды. Барлық балықтарда (шеміршекті, сүйекті) бір шеңберлі қан айналым жүйесі болады. Бүкіл дене арқылы өтетіндіктен мұны «үлкен қан айналым шең","terms":["Ашық және тұйық қан тамырлары жүйесі","Қан айналымның үлкен және кіші шеңберлері","Аорта","Қуыс ве на","Вена қақпақшалары","Жарты ай тәрізді қақпақшалар","Өк пе артериясы","Өкпе венасы","Пульс"],"qs":{"Білу және түсіну":["Ашық және тұйық қан айналым жүйелеріне анықтама беріңдер.","Адамға қандай қан айналым жүйесі тән және олардың әрқайсысының рөлі қандай болатынын түсіндіріңдер.","үлкен қан айналым шеңбері дегеніміз не және неге олай аталды? қолданылуы:","Жақтаулы және жарты ай тәрізді қақпақшалар қайда орналасқан? Олардың арасында қандай байланыс бар екенін анықтаңдар."],"Талдау":["Жүрек бөлімдерінің қанмен толу және жүректің жиырылу кезеңдерін талқылаңдар.","Қолдың венасынан бастап қанның үлкен қан тамырларының бойымен және жүректің бөлімдерімен қозғалуын, оның қайта қолда аяқталуын сызба түрінде бейнелеңдер.","Қақпақшалардың қатысынсыз толыққанды қан айналым болуы мүмкін еместігін дәлелдеңдер."],"Синтез":["Қолқа қан тамырының орнында басқа тамыр болуы мүмкіндігін талқылаңдар. Үлкен қан айналым шеңбері екі емес, бір венамен аяқталуы мүмкін бе? Ол қандай жағдайда болуы мүмкін?","Жақтаулы және жарты ай тәрізді қақпақшалардың орналасу ында, атқаратын қызметінде, қысымға қарсы тұруында қандай айырмашылықтары болатынын атап көрсетіңдер.","Жағдайды модельдеңдер: «Тез жүгіргенде жүрек минутына 180 рет соқты». Осы кездегі жүрек бөлімдерінің жиырылу және босаңсу уақыты қалай өзгереді?"],"Бағалау":["Реферат жазыңдар. «Ұшатын динозаврлардың жүрегі төрт қуысты болды» деген көзқарасты бағалаңдар. Жауаптарыңды дәлелдеңдер."],"Пікірталас":["Денеге шектен тыс ауырлық түскенде адамның жүрегі минутына 200ден артық соға ала ма? №7 зертханалық жұмыс. Денешынықтыру жаттығуларының жүрек жұмысына әсерін зерттеу. 252-бетті қара."]},"gl":[["Аорта","омыртқалылардың қан айналу жүйесіндегі ең ірі артерия қан тамыры."],["Артерия","қанды жүректен алып шығып, дене мүшелеріне тарататын тасымалдаушы ірі қан тамыры; оттегімен байытылған қанды жүректен ішкі мүшелерге тасымалдайтын қан тамырлары."],["Капиллярлар","мүшелер мен ұлпаларға енетін ұсақ тамырлар."],["Веналар","көмірқышқыл газына қаныққан, зат алмасу өнімдері, гормондар мен басқа заттар бар вена қанын мүшелер мен ұлпалардан жүрекке (артерия қанын әкелетін өкпе және кіндік венасынан басқа) апаратын қан тамырлары."],["Қанның ұюы","қан плазмасында фибриногеннің ерімейтін фибринге еруі нәтижесінде сұйық қанның эластикалық ұйысқан қанға айналуы."]],"labs":[[7,"Денешынықтыру жаттығуларының жүрек жұмысына әсерін зерттеу",252]],"bjb":false,"c":["🫀 Жүрек","🔁 Шеңбер","🫁 Өкпе","🩸 Тамыр"],"cs":["Дене шынықтыру сабағында Ерлан 30 рет отырып-тұрғаннан кейін тамыр соғысы минутына 72-ден 130-ға дейін жиіледі, ал 3 минуттан кейін 80-ге төмендеді.","Жүктемеден кейін тамыр соғысы неге жиіледі?","Пульстің тез қалпына келуі нені көрсетеді?","Жүректі шынықтырудың 2 жолын ұсын."],"tb":["Қан айналым шеңберлері",["Белгі","Үлкен шеңбер","Кіші шеңбер"],["Басталатын жері","Аяқталатын жері","Мақсаты (газ алмасу)","Негізгі тамырлары"]],"mc":[["Кіші қан айналым шеңбері басталады:",["Сол қарыншадан","Оң қарыншадан","Оң жүрекшеден","Қолқадан"],1],["Ең ірі артерия:",["Қолқа","Өкпе венасы","Қуыс вена","Капилляр"],0],["Өкпе веналарымен ағатын қан:",["Вена қаны","Артерия қаны","Аралас қан","Лимфа"],1]],"tf":[["Капиллярлар қабырғасы бір қабат жасушадан тұрады",1],["Артериялар қанды жүрекке әкеледі",0],["Веналарда қақпақшалар болады",1]],"gr":["модель","Қағаз бен жіптен үлкен қан айналым шеңберінің моделін жасаңдар","Кіші қан айналым шеңберінің моделін жасаңдар","Артерия, вена және капилляр қабырғаларының құрылысын модельде көрсетіңдер"],"lab":"pulse"},"24":{"n":24,"kind":"p","title":"Жүрек-қан тамырлары жүйесінің аурулары","page":104,"sec":5,"codes":["8.1.3.12"],"goal":"Жүрек-қан тамырлары жүйесі ауруларының себептерін сипаттау","recall":"Жүрек-қан тамырлары жүйесіне қандай мүшелер жатады? Жүрек-қан тамырлары жүйесінің қандай ауруларын білесіңдер?","intro":"Қан айналым жүйесі мүшелерінің көптеген аурулары бар. ДДҰ (Дүниежүзілік денсаулық сақтау ұйымы) мәліметтері бойынша, ХХ ғасырдың екінші жартысынан бастап табиғи өлімге себепші аурулардың ішінде алдыңғы қатарда жүрек-қан тамырлары жүйесінің аурулары тұр. Демек, адамзаттың өмір жасын ұзартудың бір жолы – жүрек-қан тамырлары жүйесінің ауруларымен күресу. Олардың ішіндегі ең жиі кездесетін түрлерін қарастырайық. Қан қысымы жоғарылауы да, төмендеуі де мүмкін. Гипотония – қан қысымының төмендеуі. Ол тамырлар мен жүрек бұлшық етінің әлсіздігінен, төмен зат алмасуға, аз қозғалуға байланысты дамуы мүмкін. Жас ұлғайған сайын тамырлардың қабырғасы созылғыш қасиетін жоғалтып, тығыздала бастайды және арт","terms":["Гипотония","Гипертония","Инсульт","Инфаркт миокард","Жүректің ишемиялық ауруы","Атеросклероз","Тромбоз","Тахикардия"],"qs":{"Білу және түсіну":["Гипертонияға анықтама беріңдер.","Атеросклероз деген не?","Жүрек және қан тамырлар жүйесі ауруларының алдын алу неліктен маңызды екенін түсіндіріңдер. қолданылуы:","Жүректің инфаркт және ишемиялық ауруларын салыстырыңдар."],"Талдау":["Инфарктің белгілерін талдаңдар. Неліктен оның белгілерін басқа аурулармен шатастырып алуға болады?","Инфаркт орын алған жағдайда көрсетілетін бірінші көмекті сызба түрінде көрсетіңдер.","Жүрек және қан тамырлар ауруларының себептері туралы өз ойларыңды айтыңдар."],"Синтез":["Жүрек және қан тамырлар ауруларының қаупін себеп критерийлері бойынша жүйелеңдер.","Гипертония және гипотонияға жалпы сипаттама беріңдер.","Тахикардияны қалай ажырататындарыңды айтыңдар."],"Бағалау":["Жүрек және қан тамырлар ауруларының алдын алу шаралары туралы реферат жазыңдар.","Саламатты өмір салтын ұстанып, жүрек және қан тамырлар ауруларының алдын алуды бағалаңдар және пікірталас өткізіңдер.","Не үшін 65 жастан кейін инфаркт қаупі арта беретіні туралы өз ойларыңды айтыңдар. 6-бөлім. Тыныс алу"]},"gl":[["Гипотония","төмен артериялық қысым."],["Гипертония,  гипертензия","жоғары артериялық қысым."],["Инсульт","мидағы қан айналымның бұзылуы (миға қан құйылу және т.б.)."],["Инфаркт","түйілу, тромбоз және т.б. (бүйрек, миокард инфарктісі және т.б.) кезінде ұлпаларда қанмен қамтамасыз етудің бұ алудың өзі орталық жүйке жүйесі арқылы реттеледі. Тыныс алу және тыныс шығарудың ырғақты ауысымын сопақша мида орналасқан тыныс орталығы қамтамасыз етеді. Қолқа мен ірі артерияларда қанда СО2 концентрациясы артқан кезде қозатын арнайы жасушалар – хеморецепторлар бар. Бұл қозу сезімтал жүйкелер бойынша тыныс орталығына беріледі. Алған ақпаратты өңдеген соң тыныс орталығы қозғалғыш нейрондар бойынша қабырғааралық бұлшық ет пен көкетке (диафрагмаға) команда береді. Бұл бұлшық еттер жиырылады да, кеуде жасушаларының көлемі ұлғаяды. Өкпедегі қысым төмендейді де, ауа айдалады – тыныс алады. Адам ауамен тыныс алып және","terms":["Нейрогуморальдық","Хеморецепторлар","Қорғаныш реф лекс тері","Көкет (диафрагма)","Кеуделік және құр сақ тық тыныс алу типтері."],"qs":{"Білу және түсіну":["Тыныс алу әрекетін жүзеге асыратын құрылымдарды атаңдар.","«Кеуделік және құрсақтық тыныс алу типтері» дегенді қалай түсінесіңдер? қолданылуы:","Тыныс орталығының қызметін сипаттаңдар.","Тыныс алу әрекеті мен ағзаның оттекті қажетсінуі арасындағы байланысты анықтаңдар."],"Талдау":["Тыныс алу және тыныс шығару механизмдерін сызба түрінде бейнелеңдер.","Тыныс алу, тыныс шығару, жөтелу және түшкірудің себептері, ұқсастықтары мен айырмашылықтары туралы өз пікірлеріңді айтыңдар."],"Синтез":["Оттек тыныс алу мүшелеріне емес, тікелей қанға түскенде, адам тіршілігін жалғастыра ала ма? Өз пікірлеріңді айтыңдар.","Тыныс алу және тыныс шығару механизмдерін жүзеге асырудағы әртүрлі құрылымдардың рөлін бағалаңдар."],"Бағалау":["Мынадай жағдаят туралы пікірлеріңді айтыңдар: «Ота кезінде оттек маскасын пайдаланғаннан соң, пациент шамамен 30 секундқа өздігінен тыныс алуды тоқтатты. Жас ассистент хирург реанимация бастамақшы болды, бірақ тәжірибелі дәрігер оны тоқтатты. 30 секундтан кейін пациент өз бетімен тыныс ала бастады». Сипатталған жағдайды бағалаңдар. Осы оқиғаны тыныс алу механизмдері тұрғысынан түсіндіріңдер.","Беліне дейін жаялықпен оралған 3–4 айлық баланың жынысын анықтауға бола ма? Талқылаңдар."]} "],["Артерия","қанды жүректен алып шығып, дене мүшелеріне тарататын тасымалдаушы ірі қан тамыры; оттегімен байытылған қанды жүректен ішкі мүшелерге тасымалдайтын қан тамырлары."],["Рецепторлар","сыртқы және ішкі ортадан тітіркендіргіштерді қабылдайтын және жүйке жүйесінің ерекше белсенділігіне түрлендіретін арнайы сезімтал түзілістер."]],"labs":[],"bjb":false,"c":["🫘 Бүйрек","💧 Су","🚽 Қуық","🧪 Зәр"],"cs":["Ыстық күні Әли футбол ойнап, көп терледі, бірақ су аз ішті. Кешке оның зәрі аз және қою түсті болды.","Зәр неге аз және қою болды?","Бүйрек ағзадағы су балансын қалай реттейді?","Бүйректі сақтаудың 2 ережесін жаз."],"tb":["Зәр шығару жүйесінің мүшелері",["Мүше","Құрылысы","Қызметі"],["Бүйрек","Несепағар","Қуық","Несепшығарғыш өзек"]],"mc":[["Бүйректің құрылымдық-қызметтік бірлігі:",["Нефрон","Нейрон","Альвеола","Бүр"],0],["Бірінші реттік зәр түзілетін бөлім:",["Нефрон капсуласы (шумақ)","Несепағар","Қуық","Бүйрек түбекшесі"],0],["Тәулігіне түзілетін соңғы зәр шамамен:",["1,5 л","150 л","15 л","0,1 л"],0]],"tf":[["Бүйректе қан сүзіледі",1],["Соңғы зәрде қалыпты жағдайда глюкоза көп болады",0],["Бүйрек – жұп мүше",1]],"gr":["тарсия","Зәр шығару жүйесінің мүшелерін тарсиядан құрастырыңдар","Нефронның бөліктерін тарсиядан құрастырыңдар","Бірінші реттік және соңғы зәрді салыстыратын тарсия құрастырыңдар"],"lab":"order","ord":["Зәрдің түзілуі мен шығарылуы",["Бүйрек артериясы","Капилляр шумағы (сүзілу)","Нефрон капсуласы (бірінші реттік зәр)","Иректелген өзекшелер (кері сіңу)","Жинағыш түтікше (соңғы зәр)","Бүйрек түбекшесі","Несепағар","Қуық"]]},"29":{"n":29,"kind":"p","title":"Терінің құрылысы мен қызметі, оның маңызы","page":122,"sec":7,"codes":["8.1.5.3"],"goal":"Терінің құрылысы мен оның бөліп шығарудағы маңызын сипаттау","recall":"Сүтқоректілердің дене жамылғысы қандай? Бұл жамылғының омыртқалы жануарлардың басқа кластарынан қандай айырмашылығы бар?","intro":"Терінің маңызы. Тері – сүтқоректілер денесінің сыртқы жамылғысы. Ол денені сыртқы әсерден қорғайды. Ересек адам терісінің ауданы шамамен 1,5–2 м2. Терінің құрылысы. Тері негізгі үш қабаттан тұрады: эпидермис, дерма және теріасты май жасұнығы (66-сурет). Сыртқы (бірінші) қабат – эпидермис – көпқабатты эпителийден түзілген. Ол бір-бірінен айырмашылығы бар екі жасуша типінен тұрады. Эпидермистің сыртқы қабаты – терінің мүйізді қабаты. Оны үнемі қабыршақ түрінде түсетін және жаңарып отыратын өлі жасушалар құрайды. Терінің мүйізді қабатының астында бөлінетін тірі жасушалар болады. Солардың үздіксіз бөлінуі есебінен терінің мүйізді қабаты, шаш пен тырнақ жаңарады. Эпидермисте жасуша құрамында мела","terms":["Эпидермис","Терінің мүйізді қабаты","Меланин","Дерма","Теріасты май жа сұны ғы","Амортизатор","Жылуоқшаулағыш","Қоректік заттар қоры","Қызметтері: қорғаныш","Термореттелу","Бө ліп шығару","Тыныс алу","Те рінің сезімталдылығы","Рецептор","D дәрумені."],"qs":{"Білу және түсіну":["үнемі қабыршақтанып, жаңарып отыратын тері қабатын атаңдар.","Неліктен D дәрумені «Тері» тақырыбында қарастырылатынын түсіндіріңдер. Оны өндіруге қатысатын затты атаңдар.","Эпидермистің қандай қабатынан тері туындылары және қандай даму кезеңінде түзілетінін түсіндіріңдер.","Терінің мүйізді қабатының майлануына жауапты құрылымдарды атаңдар. қолданылуы:"],"Талдау":["Дермада қан тамырлары мен лимфа тамырлары неліктен көп орналасқаны туралы пікірлеріңді айтыңдар.","Затты ұстаған кезде оның қатты немесе жұмсақ, жылы немесе суық екенін сеземіз. Осы үдерісті талдаңдар. Соған жауапты құрылымдарды сипаттаңдар."],"Синтез":["Тер бездерінің рөлін бағалаңдар.","Жетіспейтін элементтерді жазып, кестені толтырыңдар. Үдерісті талдаңдар. Осыған жауап беретін құрылымды сипаттаңдар. Тері қабаты Элементтер Қызметі Мүйізденген өлі жасушалар Тірі жасушалар Меланин Капиллярлар Тығыз талшықтар Бұлшық ет талшықтары Рецепторлар Май бездері Тер бездері Май жасушалары"],"Бағалау":["«Төбе шашы тік тұрды», «Денем тітіркеніп кетті» деген сөзде қандай талшықтар туралы айтылған? Олар қандай қабатта орналасқан? Бағалаңдар.","Адам терісінің қандай қызметінсіз өмір сүре алмайды? Ал қандай қызметінсіз өмір сүре алады? Мысалдар келтіріп, бағалаңдар."]},"gl":[["Эпидермис","терінің сыртқы эпителий қабаты."],["Меланхолик","адамның мінез-құлық ерекшеліктерін білдіретін темпе раменттің бір түрі."],["Дерматоз","тері және оның туындыларының – тырнақ, шаш ауруларының жинақталған атауы."],["Рецепторлар","сыртқы және ішкі ортадан тітіркендіргіштерді қабылдайтын және жүйке жүйесінің ерекше белсенділігіне түрлендіретін арнайы сезімтал түзілістер."],["Капиллярлар","мүшелер мен ұлпаларға енетін ұсақ тамырлар."]],"labs":[],"bjb":false,"c":["🧴 Тері","💦 Тер","☀️ Күйген тері","🧬 Меланин"],"cs":["Жазда теңіз жағасында көп болған Саяның терісі қараторы болып кетті, ал бір рет күнге күйіп, терісі қызарып, қабыршақтанды.","Тері неге қараяды? Қай пигмент қатысады?","Күнге күйгенде терінің қай қабаты зақымдалады?","Терінің бөліп шығару қызметін түсіндір."],"tb":["Терінің қабаттары",["Қабат","Құрылысы","Қызметі"],["Эпидермис","Дерма (нағыз тері)","Теріасты май жасұнығы","Тер және май бездері"]],"mc":[["Терінің түсін анықтайтын пигмент:",["Гемоглобин","Меланин","Хлорофилл","Каротин"],1],["Тер бездері орналасқан қабат:",["Эпидермис","Дерма","Мүйізді қабат","Тырнақ"],1],["Теріде түзілетін дәрумен:",["А","С","D","К"],2]],"tf":[["Тер арқылы су мен тұздар бөлінеді",1],["Эпидермисте қан тамырлары көп",0],["Теріасты май қабаты жылу сақтайды",1]],"gr":["кластер","«Терінің қызметтері» кластерін құрыңдар","«Терінің құрылысы» сызбасын салыңдар","«Тері – бөліп шығару мүшесі» тақырыбына дәлелдер жинаңдар"],"lab":"micro"},"30":{"n":30,"kind":"p","title":"Тері аурулары және гигиенасы","page":126,"sec":7,"codes":["8.1.5.4"],"goal":"Тері ауруларының алдын алу шараларын түсіндіру","recall":"Тері аурулары, олардың сипаттамасы. Тері үнемі ауру тудыратын микроағзалар және басқа қолайсыз сыртқы әсерлерге ұшырап отырады. Барлық тері жұқпаларын үлкен 3 топқа бөлуге болады: бактериялық, патогенді саңырауқұлақтар және паразит жануарлар тудыратын аурулар. Тері жұқпаларының қауіптілігі: қоздырушылар тері арқылы өтіп қан тамырлары мен лимфа тамырларына енуі мүмкін. Қанға өткен жұқпалар жылдам көбейіп, тереңде орналасқан ұлпалар мен мүшелерді, сүйек пен бұлшық еттерді зақымдайды. Сондықтан тері жұқпасы байқалған кезде тез дерматолог дәрігерге қаралу керек. Терінің кең таралған саңырауқұлақ тудыратын ауруларының бірі – теміреткі (стригущий лишай). Ол теріні, шаш пен тырнақты зақымдайды. Теміреткі пайда болған жерде шаш түсіп қалады. Тері толық тықырланады. Саңырауқұлақты жұқтыру көзіне өсімдіктер, жануарлар, ауру адамдар мен олардың пайдаланған заттары болуы мүм кін. Сондықтан басқа адамның тарағын, жекебас гигиенасы заттарын пайдалануға, киімі мен аяқкиімін киюге болмайды. Малшаруашылығы және үй жануарларын күту кезінде гигиена ережелерін қатаң сақтау керек. Тағы бір тері ауруы – қышыма қотыр (чесотка). Бұл ауруды өте ұсақ (ұлғайтқыш құралсыз көруге болмайды) қышыма қотыр кенесі тудырады. Кене саусақ арасында, аяқ және қолдың буын бүгілістеріндегі тері астында болуы мүмкін. Ауру белгілері – аталған жерде тоқтаусыз қышу пайда болады. Қышыма қотыр ауру адамнан тұрмыстық заттар, есік тұтқасы, қол алысып амандасқан кезде және т.б. жағдайда жұғатын жұқпалы ауру болып табылады. Қышыма қотырдың алдын алудың бастапқы шарасы – гигиена сақтау, аурудың алғашқы белгілері байқалған кезде дәрігерге қаралу керек. Ауру қоздырушылары ауада және заттардың бетінде ұзақ уақыт тіршілік етеді. Сондықтан үй-жайды зарарсыздандыратын сұйықтық (мысалы, хлораминді) қолданып, заттардың беткі жағын, есіктің тұт қаларын, еденді ылғал шүберекпен сүрту қажет. Тері зақымданған кезде кесілген жерді және басқа жараларды антисептикалық заттармен өңдеу керек. Жұқпаның кейбір қоздырушылары ауруды дамытпай, теріде (сілемейлі қабықта, тісте) ұзақ уақыт тіршілік етуі мүмкін. Егер ағза","intro":"әлсіресе, оның қорғаныш күші төмендейді. Осы кезде қоздырушылар агрессиялық кезге өтіп, ауру дамуы мүмкін. Яғни жекебас гигиенасынан басқа жалпы ағза саулығын сақтау керек. Иммунитеттің әлсіреуіне қандай да бір аурумен ауру, авитаминоз, антибиотиктерді бақылаусыз қабылдау себеп болуы мүмкін. Иммунитетті жалпы нығайту, дұрыс тамақтану, жекебас гигиенасы ережелерін сақтау – тері жұқпаларының алдын алу шарасы болып табылады. Безеу бөртпелері – терінің сыртқы (бактериялық), ішкі (зат алмасу, гормондық) себептен зақымдануы. Безеу бөртпелерімен күресудің медициналық емес әдісі – теріні таза ұстау. Тері саңылауы шаң-тозаң бөлшектерімен бекітіліп қалмауы керек, ал май бездерінің түзінділері (секрет)","terms":["Бактериялық","Саңырауқұлақ және паразит жануарлар тудыратын аурулар","Теміреткі","Қышыма қотыр","Безеу бөртпесі","А дәрумені","Дерматолог"],"qs":{"Білу және түсіну":["«Тері гигиенасы» деген түсініктің мағынасын айтыңдар.","Саңырауқұлақ тудыратын аурулар дегеніміз не? Олар қандай болады?","Неліктен тері аурулары қауіпті екенін түсіндіріңдер. қолданылуы:","Өсіп кеткен тырнақ не үшін қауіпті екенін мысалдар келтіріп дәлелдеңдер."],"Талдау":["Тері ауруларының белгілерін талдаңдар. Ауру және оны қоздырушылар арасындағы байланысты анықтаңдар.","Адамның терісінде өзіне тән түсі бар жарық (проплешины) пайда болды. Бұл жараны қандай паразит ағза тудырады?","Адамның саусақтарының арасы басылмай қышиды. Бұл ауруды қандай паразит тудырады?","Тері ауруларының пайда болу себептері мен жұғу жолдарын сызба түрінде бейнелеңдер. Сонымен қатар алдын алу шараларын көрсетіңдер."],"Синтез":["Терісінде көптеген жарықтары (проплешины) бар сиырды күтетін адамға қандай ауру жұғуы мүмкін?","Ауру қоздырушыларының жүйедегі орындарын критерий бойынша жүйелеңдер. Олар терінің қандай жұқпалы ауруларын келтіріп шығарады және олармен күресудің қандай шараларын білесіңдер?"],"Бағалау":["Адам ағзасында не жетіспегенде терісі құрғақ болады әрі жарылып кетеді?","Сыныпта мынадай мәселені талқылаңдар: адам терісіне зақым келмеу үшін қандай киім қажет?","Мына адамдардың қайсысы тері ауруларынан жақсы қорғалғаны туралы пікірлеріңді айтыңдар: 1) жиі жуынатын, тісін та у үдерістеріне қатысады. Жұту, дыбыс түзілу, көз алмасының қимылдауы, қозғалу белсенділігінің барлық типтері бұлшық еттер арқылы жүзеге асады. Қаңқамен бірге бұлшық еттер ағзаға пішін береді, дененің кеңістіктегі тік қалпын қамтамасыз етеді. Бұлшық ет ұлпасының сипаттамасы. Бұлшық еттер бұлшық ет жасушаларынан – миоциттерден түзіледі. Құрылысы бойынша олар бірыңғай салалы және көлденең жолақты (қаңқа және жүрек) бұлшық ","terms":["Бұлшық ет","Диафрагма","Миоциттер","Бірыңғай салалы бұлшық ет","Көлденең жолақты қаңқа бұлшық еті","Жүрек бұлшық еті","Қаңқа бұлшық еті","Шеңберлі бұлшық ет","Тіл бұлшық еті","Мимикалық бұлшық еті","Бұлшық ет талшығы","Шандыр","Сіңір","Антагонист-бұлшық ет","Бүгу бұлшық еті","Жазу бұлшық еті","Жиырылғыштық."],"qs":{"Білу және түсіну":["Қандай бұлшық ет жасушаларын микроскопсыз көруге болады? Анықтама беріңдер.","Адам ағзасында қанша бұлшық ет бар екенін атаңдар.","«Миоцит, бұлшық ет талшығы, бірыңғай салалы бұлшық ет, көлденең жолақты бұлшық ет ұлпасы» деген түсініктерді қалай салыстыруға болады? қолданылуы:","Шандыр мен сіңір арасындағы байланысты анықтаңдар. Олардың қызметін сипаттаңдар."],"Талдау":["Пікірлеріңді айтыңдар: «Жұмыстың ешбір түрінен қорықпайтын бала 30 минутта 50 см жерді қазды. Ал компьютерде ойнағанды ұнататын бала осы жұмысты 1 сағат бойы орындады».","Қаңқа бұлшық еті құрамына кіретін бөліктер және олардың қызметі өзара қалай байланысты екенін мысалдар келтіріп дәлелдеңдер. Бұлшық еттер сүйектерге қалай бекиді?"],"Синтез":["Бұлшық еттер бүгуді және жазуды қамтамасыз ете ала ма? Мысалдар келтіріп, дәлелдеңдер.","Мынадай критерийлер: орналасуы, жасушаларының құрылысы, қозғалу сипаты бойынша бұлшық еттерді сипаттаңдар."],"Бағалау":["Қаңқа бұлшық ет құрамына кіретін әрбір құрылым және жасуша ішіндегі микроскопиялық құрылым рөлін бағалаңдар."],"Пікірталас":["Ішекқуыстылардан бастап адамға дейін бұлшық ет жүйесі эволюциясына қандай факторлар себепші болғанын талдаңдар. №10 зертханалық жұмыс. Бұлшық ет ұлпасының құрылысын зерттеу. 255-бетті қара."]},"gl":[["Жүрек бұлшық еті","миокард."],["Шандыр, фасция","ішкі мүшелер мен бұлшық еттерді жабатын дәнекер ұлпалы қабықша."],["Сіңір","қаңқа сүйектерін немесе жеке мүшелерді байланыстыратын тығыз, дәнекер ұлпалы желі және пластиналар."]],"labs":[[10,"Бұлшық ет ұлпасының құрылысын зерттеу",255]],"bjb":false,"c":["💪 Бицепс","❤️ Жүрек еті","🔬 Миофибрилла","🏋️ Жаттығу"],"cs":["Зертханада үш бұлшық ет ұлпасының препараты берілді: біріншісінде көлденең жолақты көп ядролы талшықтар, екіншісінде ұршық тәрізді жасушалар, үшіншісінде тармақталған жолақты жасушалар бар.","Әр препарат қай бұлшық ет ұлпасына жатады?","Олар ағзаның қай мүшелерінде кездеседі?","Қай ұлпа адамның еркіне бағынады?"],"tb":["Бұлшық ет ұлпаларының түрлері",["Ұлпа","Жасуша пішіні","Ерікке бағынуы","Орналасуы"],["Көлденең жолақты қаңқа еті","Жүрек еті","Бірыңғай салалы","Жаттығудың әсері"]],"mc":[["Ішкі мүшелер қабырғасындағы бұлшық ет:",["Бірыңғай салалы","Көлденең жолақты","Жүрек","Қаңқа"],0],["Қолды бүгетін бұлшық ет:",["Екібасты (бицепс)","Үшбасты (трицепс)","Дельта тәрізді","Көкірек"],0],["Бұлшық еттің жиырылуын қамтамасыз ететін нәруыздар:",["Актин мен миозин","Гемоглобин мен инсулин","Кератин мен коллаген","Амилаза мен пепсин"],0]],"tf":[["Жүрек еті автоматизмге ие",1],["Бірыңғай салалы ет адам еркіне бағынады",0],["Бицепс пен трицепс – антагонист бұлшық еттер",1]],"gr":["инфографика","Бас пен мойын бұлшық еттерін инфографикада көрсетіңдер","Дене бұлшық еттерін инфографикада көрсетіңдер","Аяқ-қол бұлшық еттерін және олардың жұмысын инфографикада көрсетіңдер"],"lab":"micro"},"36":{"n":36,"kind":"p","title":"Гиподинамия. Сымбаттың бұзылуы және жалпақтабандылықтың пайда болу себептері. Олардың алдын алу шаралары","page":148,"sec":8,"codes":["8.1.6.7","8.1.6.8"],"goal":"Гиподинамия салдарын атау. Сымбаттың бұзылуы және жалпақтабандылықтың пайда болу себептерін анықтау","recall":"ДДҰ мәліметтері бойынша адам өліміне себеп болатын аурулардың ішінде қай жүйке аурулары алдыңғы орында тұр?","intro":"Гиподинамия – аз қозғалу. Қазіргі кезде көптеген жұмыс түрлері механикаландырылғандықтан, адамзат гипокинезияға (грек, гипо – қалыптан төмен; динамис – күш) тап болды. Бұл аз қозғалудың ауру күйі. Бұлшық ет белсенділігінің төмендеуі салдарынан жүрек, өкпе, қан тамырлары әлсіз және кез келген психикалық немесе дене жүктемесіне төзімсіз болады. ДДҰ (Дүниежүзілік денсаулық сақтау ұйымы) мәліметтері бойынша өлім-жітімге көп жағдайда жүрек-қан тамырлары аурулары (инфаркт және инсульт) басты себеп болып табылады. Спортпен шұғылданған адамдарда жаттықпаған адамдармен салыстырғанда инфаркт ауруы сирек болады. Яғни дене жүктемесі, жүрек-қан тамырлары, тыныс алу, жүйке және иммундық жүйелерге жағымды ","terms":["Гиподинамия","Гипокинезия","Жалпақтабандылық"],"qs":{"Білу және түсіну":["Табан қан тамырларының қысылуы мен өкшенің ауруы не себептен болатынын түсіндіріңдер.","Енжар өмір сүру салты бірінші кезекте қандай мүшелерге қауіпті екенін түсіндіріңдер."],"Қолданылуы":["Сіңірдің созылғыштығы, бұлшық еттің дамуы, сүйектердің беріктігі, жоғары зат алмасу, ӨТС-тің артуы, қан айналымның жақсаруының себептерін айтыңдар.","Дұрыс сымбатты қалай қалыптастыруға және сақтауға болатынын сипаттаңдар."],"Талдау":["Спарталықтар не себепті ұлы жауынгер болғаны туралы пікірлеріңді айтыңдар.","Белсенді өмір сүру салтының маңызды екенін мысалдар келтіріп көрсетіңдер. Қан тамырлары тарылғанда және атрофия (сему) кезінде қандай аурулар пайда болуы мүмкін?"],"Синтез":["Денешынықтыру жаттығулары денсаулықты нығайтуға көмектеседі деп есептеген ежелгі грек ғалымын атаңдар. Талқылаңдар.","Омыртқа жотасының қисаюын қандай ауруға жатқызуға болатынына жалпы сипаттама беріңдер."],"Бағалау":["Спортпен шұғылданатын адамдарда жүрек-қан тамырлары ауру ларының даму қаупі қаншалықты төмен болатынын бағалаңдар.","Денешынықтыру белсенділігінің пайдалылығы туралы қысқаша баян дама дайындаңдар."],"Пікірталас":["Әрбір адам үшін денешынықтыру неліктен маңызды екенін талқылаңдар."]},"gl":[["Гиподинамия","қимыл-қозғалыс белсенділігінің шектелуі, бұлшық еттің жиырылу күшінің төмендеуі кезінде ағза қызметінің (тірек-қимыл аппараты, қан айналым, тыныс алу, асқорыту) бұзылуы."],["Табан","аяқтың төменгі бөлімі."],["Инфаркт","түйілу, тромбоз және т.б. (бүйрек, миокард инфарктісі және т.б.) кезінде ұлпаларда қанмен қамтамасыз етудің бұзылу салдарынан жансыздану аймағы. Иридодиагностика (грек. иридос – кемпірқосақ) – көзінің нұрлы қабығының күйі бойынша адамның ауруын анықтау."]],"labs":[],"bjb":false,"c":["🛋️ Диван","📱 Телефон","🦶 Табан","🧍 Сымбат"],"cs":["8-сынып оқушысы күніне 6–7 сағат телефонға еңкейіп отырады, спортпен айналыспайды. Соңғы кезде арқасы ауырып, иықтары алға түсіңкі болып жүр.","Оқушыда қандай мәселе қалыптасып жатыр?","Гиподинамияның ағзаға 3 салдарын жаз.","Сымбатты түзеуге арналған күнделікті 3 жаттығу ұсын."],"tb":["Тірек-қимыл жүйесінің бұзылыстары",["Бұзылыс","Себебі","Салдары","Алдын алу"],["Гиподинамия","Сколиоз","Жалпақтабандылық","Кифоз"]],"mc":[["Омыртқа жотасының бүйірге қисаюы:",["Сколиоз","Лордоз","Кифоз","Остеохондроз"],0],["Гиподинамия дегеніміз:",["Қозғалыстың жетіспеуі","Артық қозғалыс","Тамақтанбау","Ұйқысыздық"],0],["Жалпақтабандылықтың алдын алу:",["Тар аяқкиім","Жалаң аяқ құмда, тасты жерде жүру","Көп отыру","Биік өкше"],1]],"tf":[["Дұрыс сымбат ішкі мүшелердің жұмысына әсер етеді",1],["Гиподинамия бұлшық етті нығайтады",0],["Табан күмбезі қозғалысты жұмсартады",1]],"gr":["рөлдік ойын","«Мектеп дәрігері» ретінде сыныптастардың сымбатын тексеру алгоритмін ұсыныңдар","«Фитнес-жаттықтырушы» ретінде 5 минуттық сымбат жаттығуын жасап көрсетіңдер","«Әлеуметтік жарнама» – гиподинамияға қарсы бейнеролик сценарийін жазыңдар"],"lab":"sort","srt":["Бұзылыс және оның белгісі",{"Сколиоз":"Омыртқаның бүйірге қисаюы","Кифоз":"Кеуде бөлімінің артқа шамадан тыс иілуі (бүкірлік)","Лордоз":"Бел бөлімінің алға шамадан тыс иілуі","Жалпақтабандылық":"Табан күмбезінің төмендеуі","Гиподинамия":"Қозғалыс белсенділігінің төмендеуі"}]},"37":{"n":37,"kind":"p","title":"Тік жүруге байланысты адам қозғалуының биомеханикалық ерекшеліктері","page":152,"sec":8,"codes":["8.4.4.1"],"goal":"Тік жүруге байланысты адам қозғалуының биомеханикалық ерекшеліктерін зерттеу","recall":"Приматтар – горилла мен шимпанзенің қалай жүретінін көрдіңдер ме? Адам және жануар қаңқасының қандай ұқсастықтары мен айырмашылықтары бар?","intro":"Адамның тірек-қимыл жүйесінің жоғары сатыдағы приматтардан айырмашылығы. Адам және жоғары сатыдағы адам тәрізді маймылдар дың (горилла, шимпанзе, орангутанг) қаңқасы мен бұлшық еттері ұқсас болып келеді. Олардың жалпы ұқсастықтарын атап өтейік. Адам және приматтардың жалпы ұқсастықтары: 1. Сүйектердің типтері және олардың байланысу типтерінің ұқсастығы. 2. Қаңқаның бірдей бөлімдері және сәйкес келетін сүйектер. 3. Сүйектердің химиялық құрамының ұқсастығы. 4. Бұлшық ет ұлпасы жасушалары құрылысының ұқсастығы. Адамның тірек-қимыл жүйесінің приматтардан айырмашылығын қарастырайық. 1. Омыртқа жотасы S-тәрізді пішінді 4 иілімнің болуы, екеуі алға, екеуі артқа қарай иілген. Мұндай форма тік жүктем","terms":["Примат","Горилла","Шимпанзе","S-тәрізді пішінді омыртқа жотасы"],"qs":{"Білу және түсіну":["Қандай эволюциялық өзгерістерге байланысты адам сөйлеуді үйренгенін түсіндіріңдер.","Адам және приматтардың тірек-қимыл жүйесінің ұқсастықтары мен айырмашылықтарын атаңдар. қолданылуы:","Тамақты отта пісіру қандай өзгерістер тудырғанын сипаттаңдар.","Тік жүру мен тірек-қимыл жүйесіндегі өзгерістер арасындағы байланысты анықтаңдар."],"Талдау":["Адамда табан күмбезінің қалыптасу себептері туралы пікірлеріңді айтыңдар. Ол не үшін керек?","Адам білезігінің приматтардың білезігінен қандай айырмашылықтары бар? Мысалдар келтіріп, дәлелдеңдер."],"Синтез":["Адамдарда пайда болған тірек-қимыл жүйесіндегі өзгерістерді приматтарға қатысты критерий бойынша жүйелеңдер.","S-тәрізді пішінді омыртқа жотасының рөлін бағалаңдар."],"Бағалау":["Приматтарға қарағанда адамдарда мимика не себепті дамыған? Пікірлеріңді айтыңдар."],"Пікірталас":["Адамда болашақта тірек-қимыл жүйесі қалай өзгеруі мүмкін екенін талқылаңдар. Оған қандай факторлар әсер етуі мүмкін? 9-бөлім. Координация және реттелу"]},"gl":[["Бас сүйек","бас қаңқасы."],["Табан","аяқтың төменгі бөлімі."]],"labs":[],"bjb":true,"c":["🚶 Жүріс","🦍 Маймыл","⚖️ Тепе-теңдік","🦶 Табан"],"cs":["Шимпанзе қысқа уақыт екі аяқпен жүре алады, бірақ тез шаршайды. Адам күніне 10 000 қадам жүре алады.","Тік жүруге байланысты адам қаңқасында қандай 3 ерекшелік пайда болды?","Табан күмбезі мен омыртқа иіндерінің биомеханикалық рөлін түсіндір.","Адам денесінің ауырлық центрі қайда орналасқан?"],"tb":["Адам мен маймыл қаңқасының ерекшеліктері",["Белгі","Адам","Маймыл"],["Омыртқа жотасы","Жамбас","Табан","Кеуде қуысы"]],"mc":[["Тік жүруге бейімделу белгісі:",["S-тәрізді омыртқа жотасы","Ұзын қол","Түзу табан","Жалпақ жамбас жоқ"],0],["Адам кеуде қуысы:",["Алдыңғы-артқы бағытта қысыңқы","Бүйірінен қысыңқы","Шар тәрізді","Конус тәрізді ғана"],0],["Жүрген кезде соққыны жұмсартатын:",["Табан күмбезі","Бас сүйек","Бұғана","Жауырын"],0]],"tf":[["Адамның жамбасы тостаған тәрізді кең",1],["Маймылдың омыртқасында 4 иін бар",0],["Аяқ сүйектері қол сүйектерінен массивті",1]],"gr":["зерттеу","Топ мүшелерінің қадам ұзындығын өлшеп, бойымен салыстырыңдар","Бір аяқпен тұрып тепе-теңдік уақытын өлшеңдер (көз ашық/жұмулы)","Иін тіректерін (рычаг) адам денесінен тауып, мысал келтіріңдер"],"lab":"lever"},"38":{"n":38,"kind":"p","title":"Көру мүшесінің құрылысы мен гигиенасы","page":155,"sec":9,"codes":["8.1.7.1"],"goal":"Көруді қабылдаудың ерекшеліктерін зерттеу және көру гигиенасының ережесін сипаттау","recall":"7-сынып оқулығындағы материалды (§38) еске түсіріп, мынадай сұраққа жауап беріңдер: «Көру орталығы мен тері-бұлшық ет сезімталдығы үлкен ми сыңарларының қандай бөлімінде орналасқан?»","intro":"Адам қоршаған ортаны сезім мүшелері арқылы қабылдайды. Олар: көру, есту, иіс сезу, дәм сезу және сипап сезу. Адам үшін негізгі сезім мүшесіне көру жатады. Қоршаған әлем туралы ақпараттардың басым бөлігін көру арқылы қабылдаймыз. Екінші орында есту мүшесі тұрады. Есту арқылы ақпараттың 1/3-ін алсақ та, есту мүшесінің рөлі зор. Адам үшін басқа сезім мүшелері де маңызды болып табылады. Көздің құрылысы. Оның сезімтал жасушалары – фоторецепторлар. Ол заттардан шағылысқан жарықты қабылдайды. Көздің құрамына қосымша бөліктері: қабақ, қас, кірпік, жас безі, көз бұлшық еттері, көз немесе көз алмасы кіреді (88-сурет). Көз алмасы үш қабық пен «оптикалық жүйеден» тұрады. Оптика деп жарықты өткізетін жән","terms":["Және көру гигиенасының басқа да бұзылуы кезінде пайда болады. Ол кезде алыстағы заттар бұлыңғыр болып көрінеді. Жас өскен сайын көру қабілеті өзгереді. 45–50 жастан кейін көзбұршақ эластикалығының азаюы салдарынан жақыннан көру қабілеті нашарлайды (90","Ғ-сурет). Бұл кезде сәулелер тор қабықтың сыртында шоғырланады. Алыстан көргіш адамға жақында тұрған заттар бұлыңғыр болып көрінеді. Аккомодация бұзылған кезде линзасы әртүрлі көзәйнек қолда нылады. Жақыннан көргіштік кезінде бейнелер торлы қабықта емес","Оның алдында қалыптасады. Сондықтан екі жағы ойыс шашырататын линза (кө зәйнек) қажет. Алыстан көргіштік кезінде бейне тор қабықтың сыртында қалыптасады. Сон дық тан екі жағы дөңес жинақтаушы линза керек. Дальтонизм – түсті ажырата алмау – тұқым қуалайтын ауру. Көбінесе ондай адам қызыл және жасыл түсті","Кейде жеке түстердің реңдерін ажырата алмайды. Конъюктивит – көздің кең таралған жұқпалы ауруы. Бұл сілемейлі қабықтың – қасаң қабықтың жоғары қабатының бактериялық қабынуы. Конъюктивитке жұқпадан басқа көздің ластануы: оған шаң-тозаңның","Құмның","Қоқымның және т.б. түсуі де себеп болады. Көру гигиенасы. Көздің көру қабілетін сақтау: • көзді бөгде денелердің түсуінен","Зақымданудан қорғау керек","• жарық режімін реттеу: жарық жарқыраған немесе көмескі болмауы тиіс","• оқу және жазу кезінде жарық сол жақтан түсуі керек","• кітап пен көз арақашықтығы 30–35 см болуы тиіс","• теледидарды көру ұзақтығы 2","5–3 сағат","Ал оған дейінгі қашықтық 3 м-ден кем болмауы керек","• А дәруменіне бай тағамдарды пайдалану","• ақыл-ой еңбегі мен дене еңбегін кезектестіре шұғылданған жөн","• темекі тарту және алкогольді ішімдік ішу зиянды әсер етеді","• жатып немесе көлікте кітап оқуға болмайды","• Көзге қышқыл","Сілті және бөгде зат түскен жағдайда оны сыртқы жа ғынан ішке қарай жуыңдар. Көзді таза әрі жұмсақ орамалмен (сүлгімен) сүрту керек. Фоторецепторлар","Көз алмасы","Қасаң қабық","Тор қабық","Ақ қабық","Тамырлы қабық","Алдыңғы камера","Көзбұршақ","Шыны тәрізді дене","Соқыр дақ","Сары дақ","Көру жүйкесі","Конъюктивит","Дальтонизм","Аккомодация","Жақыннан көргіштік","Алыстан көргіштік"],"qs":{"Білу және түсіну":["«Рецептор» деген түсінікке анықтама беріңдер. Сезім мүшелерінде олардың қанша типі орналасқан?","Көз қабықтарын және олардың бөліктерін атаңдар.","Көру мүшесінің «қосымша бөліктері» деген сөз тіркесін қалай түсінесіңдер? қолданылуы:","Көруді сақтауға мүмкіндік беретін ережелерді атаңдар."],"Талдау":["Көз құрылымдары арқылы жарық сәулелерінің өту кезеңдерін талдаңдар.","88-суретті қараңдар және көз алмасы құрылымының орналасуын түсіндіріңдер."],"Синтез":["Талқылаңдар: эволюция барысында көзбұршағы қалыптаспаған ағзалардың жарық пен қараңғылықты ажырата алуын, бірақ заттарды көрмеуін талдаңдар.","Көздің әрбір оптикалық жүйесінің құрылысы мен қызметі арасындағы өзара байланысты анықтаңдар. Мәліметтерді кесте түрінде рәсімдеуге болады."],"Бағалау":["Заттардан жарықтың шағылысуынан бастап, көрген бейнені сезінумен аяқтап, көру қабылдауы кезінде жүретін үдерістерді дұрыс ретпен орналастырыңдар."],"Пікірталас":["«Көру қабілетін өмір бойы сақтауға болады» деген резолюция бойынша сыныпта дебат ұйымдастырыңдар. №11 зертханалық жұмыс. Көру қабілетін зерттеу. 256-бетті қара."]},"gl":[["Соқыр дақ","көру жүйкесінің көздің торлы қабығынан шығатын орны, оның түбінде орналасқан."],["Сары дақ","фоторецепторлардың барынша көп шоғырланған және көздің тор қабығындағы көру жітілігі ең жоғары аймағы."],["Конъюктива, көздің шырышты қабығы","көздің дәнекер ұлпалы, мөлдір, шырышты қабықшасы."],["Дальтонизм","туа біткен түсті айыра алмау, негізінен, қызыл және жасыл түсті айыра алмау қабілеті."],["Нұрлы қабық","ортасында қарашық тесігі бар көздің жұқа, қозғалмалы диафрагмасы."],["Қарашық","көзге жарық сәулесі енетін нұрлы қабықтағы тесік."],["Гигиена","өмір сүру және еңбек жағдайының адамның денсаулығына әсерін зерттейтін, аурулардың алдын алу, денсаулық сақтау және өмір сүру жасын ұзарту шараларын жасаумен айналысатын медицина саласы."],["Конъюктивит, көз қарығуы","конъюктиваның қабынуы."]],"labs":[[11,"Көру қабілетін зерттеу",256]],"bjb":false,"c":["👁️ Көз","👓 Көзілдірік","💡 Жарық","📖 Кітап"],"cs":["Әсем сабақта тақтадағы жазуды анық көрмей, көзін қысып қарайды, ал кітапты жақыннан жақсы оқиды.","Әсемде қандай көру ақауы бар?","Бұл жағдайда кескін тордың қай жерінде түзіледі?","Оған қандай линзалы көзілдірік керек? Көз гигиенасына 2 кеңес бер."],"tb":["Көздің құрылысы",["Бөлігі","Құрылысы","Қызметі"],["Қасаң қабық","Нұрлы қабық және қарашық","Көз бұршағы","Торлы қабық"]],"mc":[["Алыстан көрмеушілік (миопия) кезінде кескін түзіледі:",["Тордың алдында","Тордың артында","Торда","Соқыр дақта"],0],["Көзге түсетін жарық мөлшерін реттейтін:",["Қарашық","Көз бұршағы","Шыны тәрізді дене","Склера"],0],["Соқыр дақта:",["Рецепторлар жоқ","Тек құтышалар бар","Тек таяқшалар бар","Қан тамырлары жоқ"],0]],"tf":[["Миопияда шашыратқыш (ойыс) линза қолданылады",1],["Сары дақта рецепторлар болмайды",0],["Кітапты көзден 30–35 см қашықтықта ұстау керек",1]],"gr":["тарсия","Көз алмасының құрылысын тарсиядан құрастырыңдар","Жарық сәулесінің көздегі жолын тарсиядан құрастырыңдар","Көру ақаулары мен түзету тәсілдерін тарсия арқылы сәйкестендіріңдер"],"lab":"blind"},"39":{"n":39,"kind":"p","title":"Есту мүшесінің құрылысы мен гигиенасы","page":160,"sec":9,"codes":["8.1.7.2"],"goal":"Дыбысты қабылдау ерекшеліктерін зерттеу және есту гигиенасының ережелерін сипаттау","recall":"Есту орталығы үлкен ми сыңарларының қандай бөлімінде орналасқан? Қандай жануарда және неге байланысты ең алғаш ортанғы құлақ, ал қандай жануарда сыртқы құлақ пайда болды?","intro":"Есту мүшесінің құрылысы. Құлақ – есту мүшесі. Басқа сүт қоректілердегі сияқты адамда құлақ үш бөлімнен: сыртқы, ортанғы және ішкі құлақтан тұрады. Сыртқы құлақ ең алғаш эволюция барысында тек сүтқоректілерде пайда болды. Оған құлақ қалқаны, сыртқы есту жолы және дабыл жарғағы кіреді. Құлақ қалқаны дыбысты қабылдап, құлақтың ішіне бағыттайды. Есту жолы дыбысты өткізеді. Сонымен қатар есту жолының терісінде құлық бөлетін бездер болады. Ол қорғаныш рөлін атқарып, шаң-тозаң мен зиянды микробтарды ұстап қалады. Есту жолы қалқамен – тығыз, қатты тартылған дабыл жарғағымен аяқталады (91-сурет). Жануарлардың барлық кластарында: қосмекенділер, жорғалаушылар, құстарда дабыл жарғағы ортанғы құлаққа жат","terms":["Сыртқы құлақ","Құлақ қалқаны","Есту жолы","Дабыл жарғағы","Ортанғы құлақ","Есту немесе Евстахий түтігі","Есту сүйекшелері: балғашық","Төстік","Үзеңгі","Ұлудене","Ішкі құлақ","Жартылай иірім өзектер","Вестибула аппараты"],"qs":{"Білу және түсіну":["Есту сүйекшелері дегеніміз не?","Неліктен сыртқы, ортанғы және ішкі құлақ деп бөледі? Олардың қандай айырмашылығы бар?","Құлақтың құрылысы бойынша дыбыс тербелістерінің өту реті қандай?"],"Қолданылуы":["Ортанғы құлақ қызметін сипаттаңдар.","Сыртқы құлақтың құрылысы мен қызметінің ерекшеліктері арасындағы байланысты анықтаңдар.","Вестибула аппараты мен ұлудене құрылысын салыстырыңдар. Ұқсастықтары мен айырмашылықтарын айтыңдар."],"Талдау":["Естудің нашарлау себептері туралы пікірлеріңді айтыңдар.","Өзара байланысын талдаңдар.","Құлақтың құрылысы мен қызметі. Кестені толтырыңдар. Бөлімі Құрылысының ерекшеліктері Қызметі Сыртқы құлақ Ортанғы құлақ Ішкі құлақ"],"Синтез":["«Дыбыс толқындарының құлақ құрылымдары арқылы өтуі» деген тақырыпқа эссе жазыңдар.","Құлақ құрылымындағы элементтердің әрқайсысының рөлін баға лаңдар."],"Бағалау":["Мынадай мәліметтерді бағалаңдар.","Ғалымдар жануарларға жасалған экс ор пигменттерінің де түсі болады, мысалы, көз қарашығының қоңыр, қара, жасыл түсті болуы. Рецептор пигментінің мәні мынада: кванттармен әсерлескеннен кейін қызыл сары түстен олар биохимиялық түске айналған. Нәтижесінде жасушаларда жүйке импульсін түзетін механизмдер пайда бо","terms":["Таяқша тәрізді жасушалар","Құтыша тәрізді жасушалар","Йодопсин","Родопсин","Сары дақ","Түкті жасушалар"],"qs":{"Білу және түсіну":["Таяқшалар не үшін керек, ал құтышалар ше?","Есту рецепторларында қозу неге байланысты жүреді және олар қайда орналасқан?"],"Қолданылуы":["Сары дақ пен соқыр дақтың ұқсастығы мен айырмашылығын айтыңдар.","Есту рецепторлары және вестибула аппараттың арасындағы байланыс ты сипаттаңдар. Олар механорецепторлар екеніне дәлел келтіріңдер."],"Талдау":["Есту анализаторлары арқылы дыбыс, механикалық, электрлік (жүйке импульсі) толқындарының өту сатыларын талдаңдар. Мұның есту мүшесі арқылы өту айырмашылығы неде?","Есту анализаторы арқылы дыбыс, механикалық және электрлік (жүйке импульсі) толқындарының өтуін сызба түрінде бейнелеңдер."],"Синтез":["Талқылаңдар. Ғалымдар жануарларға тәжірибе жасай отырып, жертесер, көртышқан және егеуқұйрықтарда көру мүшесі өте нашар немесе тіпті көрмейтінін дәлелдеген. Кірпілермен салыстырғанда олардың құлақ қалқандары да нашар дамыған. Оның себебі неде екенін түсіндіріп көріңдер.","Фоторецепторларды критерийлері бойынша жүйелеңдер: пигмент типі, торлы қабықтағы орны, жарықты қабылдау, түстерді қабылдау сапасы мен ерекшелігі.","Оларды салыстырыңдар және кестеге түсіріңдер."],"Бағалау":["Австралиялық зерттеуші көз бұршағының дәлме-дәл көшірмесі тәрізді көзәйнек ойлап тапты. Ол көзәйнекті киген кезде қоршаған орта төң керіліп көрінді. Көзәйнекті шамамен бір ай бойы шешпей киген ол кеңістікте бағдарлай отырып, өз бетінше тамақ жеп, жүріп, велосипед теуіп үйренді. Ол көзәйнекті шешкенде қоршаған орта қайта төңкеріліп түскендей болды. Оның қайта бейімделуіне 10 күндей уақыт қажет болды. Бұл тәжірибенің логикасын түсіндіріңдер және оған ба дар"],"lab":"blind"},"41":{"n":41,"kind":"p","title":"Гормондар арқылы гуморальды реттелу","page":167,"sec":9,"codes":["8.1.7.4","8.1.7.5"],"goal":"Эндокринді, экзокринді және аралас бездердің орналасқан орнын анықтау. Бездердің негізгі қызметтерін түсіндіру","recall":"Адам ағзасының қызметін қандай мүшелер жүйесі реттеп отырады? Барлық жануарларда бұл ағзалар жүйесі дамыған ба? Мұндай мүшелер жүйесі дамымаған жануарлар, әртүрлі өсімдіктер ағзасының қызметі қалай реттеледі?","intro":"Бездердің секреция типтері бойынша жіктелуі. Бездер дегеніміз – безді эпителий жасушаларынан тұратын мүшелер. Бұл жасушаларда қандай да белгілі бір заттар секреттеледі. Бездердің ішінде түзілетін заттарды секреция, ал бөлінетін заттарды секрет деп атайды. Олар түзіліп болған соң, безді эпителий жасушаларының мембранасы арқылы бөлінеді. Безді эпителий жасушаларынан түзілген секреттердің қайда бөлінуіне байланысты бездерді үш топқа бөледі. Сыртқы секреция бездері (экзокринді) дегеніміз – жасушаларында түзілген сұйықтық арнайы өзекшелер арқылы қуыс мүшелерге немесе сыртқа шығарылады. Сыртқа бөліп шығарушы мүшелерге бауыр, сүт, тер, сілекей, май бездері мен қарын және ішек бездері (асқорыту) жат","terms":["Гормондар – ағзаның және жасушалар тобының қызметін өзгертетін","Бір мезгілде бірнеше үдеріске әсер ететін арнайы заттар. Мысалы","Көңіл күй гормоны – адреналин. Ол жүйке жүйесінің симпатикалық бөлімі сияқты жүректің соғу жиілігін арттырады","Қан қысымын көтеріп","Жүректің капиллярларын кеңейтеді","Терінің және асқорыту мүшелер жүйесінің капиллярларын тарылтады","Энергия көзі болып табылатын қанның құрамындағы глюкоза мөлшерін арттырады және т.б. Гуморальды реттелуден басқа біздің ағзамызға жүйкелік реттелу де (ми мен басқа да орталық жүйке жүйесінің бөлімдері арқылы) тән. Ағзаның барлық мүшелерінің жұмысына эндокриндік және жүйке жүйесі бірлесіп әсер етеді. Олардың қызметтері бірін-бірі толықтырып отырады","Демек","Ағза мүшелерінің қызметі нейрогуморальды жолмен реттеледі. Бездер","Секреция","Сыртқы секреция бездері (экзо крин ді)","Ішкі секреция бездері (эндокринді)","Гормондар","Аралас бездер","Гуморальды реттелу","Адреналин","Жүйкелік реттелу","Нейрогуморальды реттелу"],"qs":{"Білу және түсіну":["«Гормон», «бездер», «секрет» сөздеріне анықтама беріңдер.","Сендер сыртқы, ішкі және аралас бездер дегенді қалай түсінесіңдер?","Өсімдіктер, омыртқасыз жануарлар, омыртқалы жануарларда өзін-өзі реттеу қалай жүзеге асатынын сипаттап жазыңдар. қолданылуы:","«Гормон, секрет, өзегі, сыртқы секреция, ішкі секреция» сөздерінің арасында қандай байланыс бар?"],"Талдау":["Адам ағзасының өздерің білетін бездерінің қызметін сызба түрінде түрлі түспен бейнелеңдер.","Неге ішкі және сыртқы секреция бездері сөлдерін сұйықтықтарға бөледі? Өз пікірлеріңді айтыңдар.","Мысалдар келтіріп, дәлелдеңдер."],"Синтез":["Бездер қандай ұлпаға жатады?","Ағза жұмысының реттелуін белгілері бойынша жүйелеңдер. Реттелудің қай түрі бірінші пайда болды, неге?"],"Бағалау":["Табиғатта болатын реттелудің түрлерін түсіндіріңдер.","Адам өміріндегі бездердің маңызын түсіндіріңдер."]},"gl":[["Секреция","безді жасушалардың секрет түзуі және бөлуі."],["Гормондар","ішкі секреция бездері бөлетін биологиялық белсенді заттар. Басқа мүшелер мен ұлпаларға мақсатты әсер етеді."],["Гуморальды реттеу","биологиялық белсенді заттар көмегімен сұйық орта (қан, лимфа, ұлпа сұйықтығы) арқылы жүзеге асырылатын ағзадағы тіршілік әрекеттері үдерісін үйлестіретін механизмдердің бірі."],["Адреналин","бүйрекүсті бездерінен бөлінетін гормон."],["Секрет","безді жасушалар өндіретін және жасайтын заттар (гормондар, тері майы, сүт және т.б.)."],["Сыртқы секреция бездері","арнайы өзектері арқылы сөл бөлетін бездер."],["Айырша без, тимус","иммундық жүйенің орталық мүшесі. Кеуде қуысының көкірек аймағында орналасқан."],["Гипофиз","мидың негізінде орналасқан ішкі секреция бездері."]],"labs":[],"bjb":false,"c":["🦋 Қалқанша без","🧪 Гормон","🩸 Қан","🧠 Гипофиз"],"cs":["Емтихан алдында Аружанның жүрегі қатты соғып, алақаны терлеп, қолы дірілдеді.","Бұл белгілерді қай гормон тудырды?","Ол гормон қай безден бөлінеді?","Гуморальдық реттелудің жүйкелік реттелуден айырмашылығы қандай?"],"tb":["Без түрлері",["Без түрі","Өнімін қайда бөледі","Мысал"],["Эндокриндік (ішкі секреция)","Экзокриндік (сыртқы секреция)","Аралас","Гипофиз"]],"mc":[["Аралас безге жатады:",["Ұйқы безі","Қалқанша без","Тер безі","Гипофиз"],0],["Гормондар таралады:",["Қан арқылы","Өзек арқылы сыртқа","Тері арқылы","Ішекке"],0],["«Бездердің бастығы» деп аталатын без:",["Гипофиз","Эпифиз","Бүйрекүсті","Айырша"],0]],"tf":[["Сілекей бездері – сыртқы секреция бездері",1],["Гормондар өзек арқылы ішекке құйылады",0],["Адреналин бүйрекүсті безінен бөлінеді",1]],"gr":["тарсия","Ішкі секреция бездерінің орналасуын тарсия арқылы адам денесіне орналастырыңдар","Бездер мен гормондарды тарсия арқылы сәйкестендіріңдер","Ішкі, сыртқы және аралас бездерді тарсия арқылы жіктеңдер"],"lab":"glucose"},"42":{"n":42,"kind":"p","title":"Эндокринді безінің қызметі және оларға байланысты аурулар","page":170,"sec":9,"codes":["8.1.7.6"],"goal":"Эндокринді бездер қызметінің бұзылуынан туындаған ауруларды атау","recall":"Эндокринді бездер ағзаның басқа да мүшелері сияқты ауруға шалдығуы мүмкін. Олардың қызметінің бұзылуын үлкен екі топқа бөлуге болады: Ағзада гормондар мөлшерінен көп бөлінсе гиперфункция, мөл шерінен аз бөлінсе гипофункция деп атайды. Гормондардың мөлшерден тыс көп бөлінуі де, аз бөлінуі де қауіпті. Кез келген бездің гипер және гипофункциясы қауіпті ауру тудыруы мүмкін. Ішкі сек реция бездеріне гипофиз, қалқанша без, қалқаншамаңы бездері, айырша без, бүйрекүсті бездері және т.б. бездер жатады. Гипофиз – негізгі ішкі секреция безі (95-суретті қараңдар). Ол аралық мидың астыңғы жағына жіңішке өсінді арқылы бекінеді. Пішіні үрмебұршақ тәрізді, ересек адамдарда салмағы 0,5–0,65 г-ға жетеді. Бұл без 25 түрлі гормон бөледі. Оның гормондары ұйқы безінен басқа бүкіл ішкі секреция бездерінің қызметін басқарады. Гипофиздің соматотропин (өсу) гормоны барлық ұлпа мен ағзаға әсер етеді. Өсу гормоны қаңқа мен бұлшық еттің өсуіне әсер ете отырып, ағзаны дамытады. Егер өсу гормоны жеткіліксіз мөлшерде түзілетін болса, адамның бойы өспей, ергежейлілік пайда болады. Ал артық түзілген жағдайда (гиперфункция) алыптық ауруына шалдығады. Адамның сүйектері 25 жасқа дейін ұзарып өседі. Акромегалия – ересек адамдарда өсу гормонының көп бөлінуінен пайда болатын ауру. Бұл жағдайда адамның саусақтары, аяқ және бет сүйектері ұзарып өседі. Қалқанша без тироксин гормонын бөледі (96-сурет). Тироксин гормоны қалыпты түзілуі үшін ағзада йод жеткілікті болуы керек. Егер де ересек адам тамақпен және сумен жеткілікті мөлшерде йод алып отырмаса, эндемиялық зоб ауруына шалдығады. Бұл – қалқанша безінің ісінуі. Жас балаларда йодтың жетіспеуінен кретинизм ауруы пайда болады. Тироксин ағзадағы зат алмасудың негізгі бөлігін реттейді. Оның қызметіне байланысты ағзада қоректік заттар қорға жиналады (ағзаға қажетті нәруыздар, майлар түзіледі) немесе ыдырап энергия түзіледі. Егер ағзада тироксин аз мөлшерде түзілетін болса, қоректік заттардың барлығы қорға жиналады. Соның салдарынан микседема ауруы пайда болады. Адам семіреді. Оның дене температурасы 35°С болып, үнемі тоңады, күш-қуаты аз, әлсіз болып, ұйқысы келе береді.","intro":"Æîғàðû қàëқàíøàìàңû áåçäåði Қàëқàíøà áåçi 96-сурет. Қалқанша және қалқаншамаңы Òөìåíãi бездері қàëқàíøàìàңû áåçäåði Тироксин мөлшерден көп бөлінген жағдайда қоректік заттардың өте көп бөлігі энергияға жұмсалады. Содан Базедов (бадырақ көз) ауруы пайда болады. Ауру адамның жүйке жүйесі шектен тыс қозады, жүрегі жиі соғып, тыныс алуы жиілейді, дене температурасы 37–38°С болады, ұйқысы қашады, арықтайды, көп тамақ жейді, бірақ жеген тамағы ағзаға сіңбейді. Көздің бұлшық еттеріне күш түсіп, көзі бақырайып кетеді. Мұндай адамдардың жүрегі және басқа да мүшелері тез ауруға шалдығады. Қазақстанда қалқанша безі ауруларының санын азайту мақ сатында йод тапшылығының алдын алуы туралы заң қабылданған. ","terms":["Гиперфункция","Гипофункция","Өсу гормоны","Соматотропин","Адреналин","Норадреналин","Кортикоидтар","Минералокортикоидтар","Глюкокорти коидтар"],"qs":{"Білу және түсіну":["Неліктен қанның құрамындағы көмірсу мөлшері жеген тағам түріне, оның құрамына қарамастан тұрақты болатынын түсіндіріңдер.","Қандай гормондар ағзада зат алмасуға қатысады және олар қандай бездерде түзіледі? қолданылуы:","Гормондардың артық бөлінуінен немесе жетіспеушілігінен пайда болатын аурулардың бір-бірімен байланысын сипаттаңдар. Нақты мысалдар келтіріңдер.","Екінші реттік жыныстық жетілудің белгілері, жыныс бездері бөлетін гормондарды атаңдар."],"Талдау":["Гликогеннің қандай мүшелерде қорға жиналатынын, оның глюкозаға айналуын және оған қандай гормондар қатысатынын сызба түрінде бейнелеңдер.","Эндемиялық зоб пен кретинизм ауруларының пайда болу себебі неде? Аурулардың пайда болуын қандай бездің жұмысымен байланыстыруға болады?","Соматотропты гормондардың түзілуі және оның мөлшерінің өзгерулеріне байланысты пайда болатын аурулардың белгілеріне талдау жасаңдар."],"Синтез":["Ойланып талдаңдар: біздің ағзамызда қандай без гипофизге тәуелсіз және неліктен?","Бүйрекүсті бездерін белгілері бойынша жүйелеңдер. 1. Қай қабатында түзіледі? 2. Әсер ету жылдамдығы қандай? 3. Көңіл күйге немесе зат алмасуға байланысы. 4. Эволюциялық маңызы."],"Бағалау":["Берілген өзгерістерді бағалаңдар: 1. Бірнеше минут ішінде көздің қарашығы үлкейеді, тыныс алу, жүрек соғуы, бұлшық еттің жиырылуы жылдамдайды. 2. Жоғарыдағыдай белгілермен қоса дене температурасы аздап көтеріледі, салмағы кемиді, ұзақ уақыт бойы ұйқысыздық мазалайды. 3. Денедегі ісік, тері астына судың жиналуы, ауа жетіспеушілігі, артық салмақ, үнемі тоңып жүру, ұйқының қанбауы және енжар болу қандай ауру түрін білдіреді?"],"Пікірталас":["«гипофиз ішкі секреция бездерінің ең маңыздысы ма?»"]},"gl":[["Өсу гормоны","гипофиз безінің алдыңғы бөлімінен түзіліп, ағзаның қалыпты өсуі мен зат алмасуды реттейді."],["Адреналин","бүйрекүсті бездерінен бөлінетін гормон."],["Гормондар", o":"Адам денесінің рецепторлары. Адам денесінде сезіну мүшелерінде орналасқан рецепторлардан басқа ішкі мүшелерден миға ақпарат жеткізетін рецепторлар бар. Бұлар тітіркендіргіш қабылдауына байланысты тері рецепторларына ұқсас болады. Тері рецепторлары. Әртүрлі рецепторлардың көмегімен түрлі сезінулер пайда болады. Тері арқылы біз нені сеземіз? Теріде төрт түрлі тітіркенгіштікті қабылдайтын рецепторлар болады: 1) жанасу (қысым); 2) ауруды сезіну; 3) суықты сезіну; 4) жылыны сезіну. Құрылысы мен атқаратын қызметіне және орналасуына байланысты тері рецепторлары әртүрлі болады. Мысалы, қысымды қабылдайтын рецепторлар бірдей емес. Терінің беткі қабатында орналасқан рецепторлар жеңіл жанасуды қабылдай","terms":["Рецепторлар – терморецепторлар","Механорецепторлар","Ноцицепторлар"],"qs":{"Білу және түсіну":["Мынадай терминдерге анықтама беріңдер: терморецепторлар, механорецепторлар, ноцицепторлар.","Өңеш арқылы өткен тамақтың температурасын және таңертең оянғанда көзімізді ашпай-ақ денеміздің қалпын неге байланысты сезетінімізді түсіндіріңдер. қолданылуы:","Неліктен кейбір қысым рецепторлары терінің беткі қабатында, кейбіреулері тереңірек орналасқан? Олардың айырмашылығы неде?"],"Талдау":["Неліктен көзі көрмейтіндер үшін механорецепторлардың маңызы зор?","Температураны қанша рецептор анықтайды? Оларды атаңдар."],"Синтез":["Теріде қандай терморецепторлар көп болады? Мысал келтіріңдер.","Олардың арасында қандай айырмашылықтар болатынын атаңдар. Сезім мүшелерінен тыс жерде орналасқан рецепторларды атаңдар."],"Бағалау":["Рецепторлардың белгілі бір тобымен немесе шектен тыс күшпен әсер еткенде ауруды сезіну қалай пайда болатыны туралы өз пікірлеріңді айтыңдар. №14 зертханалық жұмыс. Терінің сезімталдығын зерттеу. 259-бетті қара."]},"gl":[["Рецепторлар","сыртқы және ішкі ортадан тітіркендіргіштерді қабылдайтын және жүйке жүйесінің ерекше белсенділігіне түрлендіретін арнайы сезімтал түзілістер."],["Қабылдау","тірі ағзалардың көру, есту, түйсіну, дәм және иіс сезу қабілеті."],["Сің а жасушалары мен олардың екінші ұрпағындағы хромосома жиынтығының түзілуін сызба түрінде бейнелеңдер.","Эволюция барысында жасушалардың әртүрлі бөлінуі мен гаплоидты және диплоидты жиынтығы бар жасушалардың түзілуі туралы өз пікірлеріңді айтыңдар.","Жоғары сатыда дамыған, ұрықтануға қабілетті кез келген ағзалар үшін хромосома жиынтығының өзгеруі, митоздық және мейоздық бөліну керек екенін нақты мысалдар келтіре отырып дәлелдеңдер."],"Синтез":["Митоз және мейоз құбылыстарын ұқсастығы мен айырмашылық белгілері бойынша жіктеңдер.","Тірі материяның дамуындағы үлкен эволюциялық жетістіктер ретінде мейоздың рөлі туралы эссе жазыңдар.","Денесінде тек ғана гаплоидты жиынтықты хромосомасы бар және ешқашан мейоздық бөліну жүрмейтін ағзалар болуы мүмкін бе?","Биологиялық үдерістерді қамтамасыз етудегі митоздың рөлін бағалаңдар."],"Бағалау":["Жасушалар бөлінуінің әртүрлі үш типі: митоз, мейоз және амитоз туралы реферат жазыңдар.","Білімнің қосымша дереккөздерін пайдалана отырып, «редукцияның үш типі»: зиготалық, гаметалық, споралық туралы өз пікірлеріңді айтыңдар.","Митоз бен мейоз құбылысының табиғаттағы маңызы қандай?"],"Пікірталас":["«Соматикалық редукция» болуы мүмкін бе?"]},"gl":[["Хромосомалар","гендерді тасымалдайтын және жасуша мен ағзаның тұқым қуалайтын қасиеттерін анықтайтын жасуша ядросының органоиды."],["Аналық без","жұмыртқа жасушалары түзілетін және жетілетін аналық жыныс безі."],["Жұмыртқа","жұп аталық жыныс безі."],["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."]],"labs":[],"bjb":false,"c":["🧬 Хромосома","➗ Бөліну","🌱 Өсу","👶 Ұрпақ"],"cs":["Адамның тері жасушасында 46 хромосома бар. Жасуша митозбен бөлінгенде және мейозбен бөлінгенде түзілетін жасушаларды салыстыру керек.","Митоздан кейін неше жасуша, әрқайсысында неше хромосома болады?","Мейоздан кейін ше?","Неге жыныс жасушаларында хромосома саны екі есе аз?"],"tb":["Митоз бен мейозды салыстыру",["Белгі","Митоз","Мейоз"],["Бөліну саны","Түзілетін жасушалар саны","Хромосома жиынтығы","Биологиялық маңызы"]],"mc":[["Хромосомалар экватор бойына тізілетін фаза:",["Профаза","Метафаза","Анафаза","Телофаза"],1],["Мейоз нәтижесінде түзіледі:",["Дене жасушалары","Гаметалар (жыныс жасушалары)","Ұлпалар","Мүшелер"],1],["Митоздың маңызы:",["Өсу және қалпына келу","Гамета түзу","Хромосома санын азайту","Ұрықтану"],0]],"tf":[["Митозда аналық жасушаға ұқсас 2 жасуша түзіледі",1],["Мейоз бір рет бөлінуден тұрады",0],["Мейозда кроссинговер жүреді",1]],"gr":["модель","Пластилиннен митоз фазаларының моделін жасаңдар","Пластилиннен мейоздың I бөлінуінің моделін жасаңдар","Митоз бен мейозды Венн диаграммасымен салыстырыңдар"],"lab":"order","ord":["Митоздың фазалары",["Интерфаза (ДНҚ екі еселенуі)","Профаза","Метафаза","Анафаза","Телофаза","Цитокинез"]]},"46":{"n":46,"kind":"p","title":"Тірі ағзалардың көбею түрлері","page":184,"sec":10,"codes":["8.2.1.1"],"goal":"Жануарлардың көбею тәсілдерін салыстыру","recall":"Жыныстық және жыныссыз көбеюдің бір-бірінен қандай айырмашылықтары бар? Өсімдіктердің вегетативті көбеюінің ерекшелігі неде? Жануарларда да осындай құбылыс болуы мүмкін бе? Жынысты көбеюде жабықтұқымды өсімдіктердің басты мүшесі қандай? Партеногенез деген не? Ол қандай өсімдіктерде жүреді?","intro":"Көбею – жалпы тірі ағзаларға тән қасиет. Тіршілік иелері әртүрлі жолмен көбейеді. Оларды екі түрлі топқа біріктіреді: жыныстық және жыныссыз көбею. Көбеюдің ертерек пайда болған түрі – жыныссыз көбею. Ең алғашқы біржасушалы ағзалар – бактериялар (прокариоттар) жыныссыз жолмен көбейген. Жыныссыз көбейгенде жыныс жасушалары – гаметалар түзілмейді. Жыныстық жолмен көбейгенде гаплоидты хромосомалы гаметалар түзіледі. Бұл жыныс жасушалары ұрықтану үдерісіне қатысады. Табиғатта партеногенез және өздігінен ұрықтану сияқты көбеюдің ерекше түрлері де кездеседі. Жануарлардың жыныссыз көбею түрлері. Біржасушалылардың негізгі көбею жолы – митоз немесе бөліну. Амеба, жасыл эвглена сияқты жәндіктермен бір","terms":["Жыныстық және жыныссыз көбею","Бүршіктену","Бөл шектену (стробиляция)","Қосжыныстылық","Ұрық тану","Партеногенез."],"qs":{"Білу және түсіну":["Жыныстық және жыныссыз көбеюге анықтама беріңдер.","Бүршіктену және бөлшектену дегеніміз не?","«Партеногенез, өздігінен ұрықтану» деген түсініктерге анықтама беріңдер.","Ағзалардың көбею түрлерін сипаттаңдар. қолданылуы:"],"Талдау":["Ағзалардың түр даралары санының артуы мен көбею түрінің арасында қандай байланыс бар екенін анықтаңдар.","Жыныстық көбею анағұрлым ілгерінді жүретінін дәлелдеңдер.","Жыныстық көбею сатыларын талдаңдар.","Жыныстық көбеюдің түрлері: ұрықтану – өздігінен, айқас, қосжыныстылық, әртүрлі жыныстық, партеногенезді сызба түрінде бейнелеңдер."],"Синтез":["Көбею түрлерін шығуы және белгілері бойынша жіктеңдер: 1) атааналарының саны; 2) өзгергіштік дәрежесі; 3) хромосома жиынтығында айырмашылығы бар көбеюге қатысатын жасушалары бойынша; 4) митоз және мейоз; 5) ұрпақ санының көптігі; 6) эволюциялық артықшылығы; 7) жағдайларға тәуелсіздігі бойынша.","Көбеюдің түрлері мен тәсілдері өзара қалай байланысты? Өзгергіштік тұрғысынан партеногенезді жыныссыз жолмен теңестіруге бола ма? Себебі неде және неліктен?","Жыныстық көбеюдің эволюциялық мәні неде? Оның қандай артықшылықтары бар?","Эволюция барысында жыныстық көбею ешқашан пайда болмаған жағдайды модельдеңдер. Егер эволюция барысында жыныссыз көбею ешқашан пайда болмаса ше?"],"Бағалау":["Мынадай құбылыстардың мәнін бағалаңдар. «Қандай жағдайда әртүрлі түр дараларының арасында генетикалық материалдардың алмасуы жүреді? Қандай жағдайда тек гаметалар түзіледі?","Көптеген ғалымдардың айтуынша, омыртқалы жануарлардың арасында партеногенез – өте сирек кездесетін жағдай (түрлердің 0,1%- нан көбі). Ол сүтқоректілерде мүлдем кездеспейді. Сүтқоректілердің дамуында және эволюциялық құбылыс ретінде партеногенездің даму дәрежесі туралы қандай қорытынды шығаруға болады? Ғалым дар Солтүстік Америкада тіршілік ететін жартасты кесірткелерде аталықтары болмайтынын тапқан. Олар шын мәнінде комод айдаһары сияқты партеногенез жолымен көбейетін шығар. Талқылаңдар. Мұны анықтау үшін қандай зерттеулер жүргізуге болады? Қосымша оқуға арналған материал Споралы өсімдіктер. Жер бетінде тіршілік ететін ағзаларды үлкен екі топқа: тұқымды және споралы деп бөледі. Споралы өсімдіктерге мыналар жатады: мүктер, қырықбуындар, плаундар және қырықжапырақтар. Көбінесе қырықбуындар, плаундар және қырықжапырақтарды қырықжапырақтәрізділер тобына біріктіреді. Споралы өсімдіктердің ең маңызды белгісі – спора түзуі. Споралар – көбеюге қабілетті, қолайсыз жағдайлардан қорғайтын қалың қабықшамен қапталған, мамандандырылған жасуша. Көптеген өсімдіктердің споралары ұзақ уақыт құрғақшылық пен суыққа төзе алады. Олар ондаған және мыңдаған жылдар бойы тіршілік қабілетін жоғалтпайды. Споралы өсімдіктер денесі әртүрлі ұлпалар мен мүшелерден тұратын, алғаш рет жер бетінде тіршілік етуге бейімделген жоғары сатыдағы өсімдіктер болып табылады. Құрлықта тіршілік етуге бейімделген споралы өсімдіктер – көпжасушалы жасыл балдырлардың тікелей ұрпағы. Гаплоидты және диплоидты жасушалы өсімдіктер. Төменгі сатыдағы өсімдіктерге балдырлар жатады. Олардың денесі ұлпаларға және мүшелерге бөлінбейді, тек бірдей жасушалардан тұрады. Бұл жағдайда жасыл балдырлардың денесінің жасушалары гаплоидты болады. Яғни дене жасушалары бірдей хромосомалардан тұрады. Мұндай ағзалардың гаметалары митоз жолымен түзіледі. Содан соң гаплоидты гаметалар қосылып, ұрықтанады. Спермий мен жұмыртқа жасушасының гаплоидты хромосомаларының қосылуынан жұп хромосомалы жасушалар – диплоидты зигота түзіледі. Содан соң зиготаның өзі мейоз жолымен бөліне бастайды. 4 гаплоидты жасушалар түзіледі. Олардың әрқайсысы балдырдың еншілес жатқан жас жасушаларының бастамасы болады. Ең алғаш құрлыққа шыққан өсімдіктердің денесі гаплоидты хромосомалы болған деген болжам бар. Осы уақытқа дейін бұл құрылыс мүктерде сақталған. Біз табиғатта кездестіретін мүктердің дене жасушалары бірдей хромосомалардан тұрады. Қазіргі уақытта жер бетіндегі барлық басқа ез":"Бал арасының аталығы","Спора түзу":"Мүк, қырықжапырақ"}]},"47":{"n":47,"kind":"p","title":"Споралы өсімдіктердің тіршілік циклі","page":189,"sec":10,"codes":["8.2.1.2"],"goal":"Мүктер мен қырықжапырақтардың мысалында жынысты және жыныссыз ұрпақтарының ерекшеліктерін түсіндіру","recall":"Гаплоидты және диплоидты, митоз және мейоз, гаметалар және зигота дегеніміз не? Олардың арасында қандай байланыс бар? 6-параграфтағы материалдарды еске түсіріп, мүктер мен қырықжапырақтардың ерекшеліктерін айтыңдар.","intro":"Гаметофит және спорофит. Споралы өсімдіктер – мүктер мен қырық жапырақтардың тіршілік циклі екі фазадан тұрады: спорофит және гаметофит. Спорофит – өсімдіктердің тіршілік цикліндегі жыныссыз ұрпақ. Бұл – өсімдіктердің спора түзу сатысы. Спорофит – әрқашан диплоидты, ал споралар әрқашан гаплоидты болады. Сондықтан споралар мейоз жолымен түзіледі. Спорофит – аталық пен аналықтың (сперматозоид және жұмыртқа жасушасы) қосылуынан пайда болған зиготадан түзіледі. Сондықтан спорофит жасушаларында хромосоманың жиынтығы екі еселенген болады. Гаметофит – өсімдіктердің тіршілік цикліндегі жынысты ұрпақ. Бұл сатыда гаметалар түзіледі. Гаметофиттердің жасушалары гаплоидты, гаметалары жасушалардан митоз ж","terms":["Спорофит","Өсінді","Гаметофит","Өскінше","Гаплоидты","Диплоидты","Гаметалар","Зигота"],"qs":{"Білу және түсіну":["«Спорофит» және «гаметофит» түсініктеріне анықтама беріңдер.","«Өсімдіктердіңтіршілікцикліндеядролықфазалардыңөзгеруі» деген сөзді қалай түсінесіңдер?","Споралы өсімдіктерде жасушалардың қандай жолмен бөлінуінен гаметалар, ал қандай жолмен бөлінуінен споралар түзіледі?","Мынадай терминдерге анықтама беріңдер: «спора»,«гамета»,«спорофит»,«гаметофит»."],"Талдау":["Жасушаларындағы хромосома жиынтығын, митоз, мейоз, спорангийлер, споралар, гаметалар, зигота, ұрықтану, өсінді, өскіншені көрсете отырып, «мүктердің тіршілік циклінің» сызбасын сызыңдар.","Жасушаларындағы хромосома жиынтығын, митоз, мейоз, спорангийлер, споралар, гаметалар, зигота, ұрықтан ,"Спорофит түрі","Ұрықтану шарты"]],"mc":[["Мүктің жасыл өсімдігі:",["Гаметофит","Спорофит","Зигота","Спорангий"],0],["Қырықжапырақтың өскіні (проталлий):",["Гаметофит","Спорофит","Спора","Тамыр"],0],["Споралы өсімдіктердің ұрықтануына қажет:",["Су","Жел","Жәндік","Құс"],0]],"tf":[["Мүктің қорапшасы – спорофит",1],["Қырықжапырақта гаметофит басым",0],["Споралар мейоз арқылы түзіледі",1]],"gr":["постер","Мүктің тіршілік циклінің сызбасын салыңдар","Қырықжапырақтың тіршілік циклінің сызбасын салыңдар","Мүк пен қырықжапырақтың тіршілік циклін салыстырыңдар"],"lab":"order","ord":["Мүктің тіршілік циклі",["Спора","Протонема","Гаметофит (жасыл өсімдік)","Гаметалар (сперматозоид, жұмыртқа жасуша)","Ұрықтану (сумен)","Зигота","Спорофит (қорапша)","Спора (мейоз)"]]},"48":{"n":48,"kind":"p","title":"Ашықтұқымды және жабықтұқымды өсімдіктердің тіршілік циклі","page":194,"sec":10,"codes":["8.2.1.3"],"goal":"Ашықтұқымды және жабықтұқымды өсімдіктердің тіршілік циклінің ерекшеліктерін түсіндіру","recall":"Гүлді өсімдіктердің ұрықтануының ерекшеліктері неде? Ашықтұқымды және жабықтұқымды өсімдіктердің ерекшеліктерін атаңдар. Оларда спора түзіле ме? Олардың негізгі көбею мүшелері қандай?","intro":"Тұқымды өсімдіктер. Тұқымды өсімдіктер ашықтұқымдылар (қылқанжапырақтылар) және жабықтұқымдылар (гүлді өсімдіктер) деп екі үлкен топқа бөлінеді. Тұқымды өсімдіктердің споралы өсімдіктерден айырмашылығы – спора түзбейді, олардың көбею мүшелері көпжасушалы тұқым болып табылады. Тұқымды өсімдіктерде гаметофит және спорофит кезеңдері болмайды. Яғни қырықжапырақтәрізділердегі сияқты жеке өсетін өскін кезеңі және мүктерден қоректік заттарды соратын «паразитті қауашағы» болмайды. Себебі, споралар мен гаметофиттердің гаплоидты кезеңдері бүрлердің немесе гүлдің ішінде бірнеше жасуша көлеміне дейін кішірейген. Барлық тұқымды өсімдіктердің тіршілік циклінде спорофиттің диплоидты кезеңі басым болады. Қы","terms":["Мегаспорофит","Мегагаметофит","Мегаспорогенез","Микрогаметогенез","Бүр","Вегетативті және генеративті жасушалар."],"qs":{"Білу және түсіну":["«Бүр, тұқым, мегаспорогенез, микрогаметогенез, микроспорогенез, мегагаметогенез» деген түсініктерге анықтама беріңдер.","«Тұқымды өсімдіктердің тіршілік циклінде ядролық фазаларының ауысуы» деген ұғымды қалай түсінесіңдер?","Жасушалар қандай әдіспен бөлінген кезде тұқымды өсімдіктерде гаметалар түзіледі?","Ашықтұқымды өсімдіктердің аталық, аналық гаметалары және микро-, мега споралары қашан, қайда (қандай құрылымдарда), қашан түзіледі?"],"Қолданылуы":["Неліктен тұқымды өсімдіктердің тіршілік циклінде гаплоидты кезеңі көрінбейді және жеке құрылым ретінде қатыспайды?","Ашықтұқымдылардың бүрлері қандай қызмет атқарады?","Жабықтұқымдылардың гүлі қандай қызмет атқарады?","Ашықтұқымдылар мен жабықтұқымдылардың ұрықтануы, гаметалары мен спораларының түзілу үдерісі қайда жүретінін салыстырыңдар."],"Талдау":["Жасушалардағы хромосома санын, митоз және мейоз, микрожәне мегаспорангийлер, гаметалар, зигота, ұрықтану, көпжасушалы эмбрионды көрсете отырып, «гүлді өсімдіктердің тіршілік циклі» деген сызба сызыңдар.","Жасушалардағы хромосома санын, митоз және мейоз, микрожәне мегаспорангийлер, гаметалар, зигота, ұрықтану, көпжасушалы эмбрионды көрсете отырып, «ашықтұқымды өсімдіктердің тіршілік циклі» деген сызба сызыңдар.","Ашықтұқымдылар мен жабықтұқымдылардың көбеюіндегі айырмашылықты көрсетіңдер."],"Синтез":["Жер бетінде споралы өсімдіктерден бұрын тұқымды өсімдіктердің пайда болу мүмкіндігін талдаңдар.","Тұқымды өсімдіктердің тіршілік цикліне жалпы сипаттама беріңдер.","Тұқымның түзілуінің эволюциялық маңызы қандай? Оның артықшылығы неде?"],"Пікірталас":["Тұқымды өсімдіктер өзінің тіршілік циклімен бірден балдырлардан пайда болуы мүмкін деп ойлайсыңдар ма? 11-бөлім. Өсу және даму"]},"gl":[["Аталық без","сперматозоидтер мен жыныс гормондары (тестостерон және т.б.) түзілетін аталық жыныс бездері."],["Аналық без","жұмыртқа жасушалары түзілетін және жетілетін аналық жыныс безі."],["Жұмыртқа","жұп аталық жыныс безі."],["Көбею, р нейрулла және органогенез деген не екенін еске түсіріңдер.","intro":"Эмбриогенездің негізгі сатылары. Естеріңде болса, ағзалардың жеке дамуы эмбриогенез және постэмбриогенез деп екіге бөлінеді. Эмбриогенездің негізгі сатыларын сызба түрінде көрсетуге болады: Зигота Бөлшектену Бластула Гаструла Нейрула Органогенез Егер ағза жынысты жолмен көбею нәтижесінде түзілетін болса, эмбрионды (ұрықтық) дамуы ұрықтанған жұмыртқа жасушасынан, зигота түзілу сатысынан басталады. Егер ағза партеногенез жолымен түзілген болса, дамудың бірінші сатысы ұрықтанбаған жұмыртқа жасушасының бөлінуінен басталады. Егер ағза жыныссыз көбею нәтижесінде түзілген болса, онда эмбриогенездік даму жүрмейді, себебі ол кезде ұрық түзілмейді. Ағзалардың көптеген түрлерінде ұрықтанғаннан кейін зи","terms":["Эмбриогенез","Постэмбриогенез","Зигота","Бөлшектену","Бластула","Гаструла","Нейрула","Органогенез","Эктодерма","Мезодерма","Энтодерма"],"qs":{"Білу және түсіну":["Мынадай терминдерге анықтама беріңдер: «эмбриогенез», «бластула», «бөлшектену», «зигота».","Гаструла және нейрула деген не?","Неліктен гаструла ерте және соңғы деп бөлінеді?","Ұрық жапырақшалары не үшін керек екенін түсіндіріңдер. қолданылуы:"],"Талдау":["Эмбрионның даму сатыларын (кезеңдерін) талдаңдар.","Белгілі бір ұрық жапырақшаларынан белгілі бір мүшелердің даму себебін түсіндіріңдер.","Кестені толтырыңдар. № Мүше Эктодерма Мезодерма Энтодерма 1 Ми 2 Қаңқа бұлшық еттері 3 Бауыр 4 Ашішектің эпителийі 5 Терінің эпителийі 6 Ішкі секреция бездері 7 Май және тер бездері 8 Жүрек 9 Өкпе 10 Бүйректер 11 Сүйектер"],"Синтез":["Неліктен жыныссыз жолмен көбейетін ағзаларда эмбриогенездің сатылары болмайтынын талқылаңдар.","Эмбрионды даму сатыларына жалпы сипаттама беріңдер.","Белгілі бір ұрық жапырақшаларынан белгілі бір мүшелердің дамуының эволюциялық алғышарттары неде?","Біржасушалы егіздер бластуланың бастапқы сатысындағы жасушаларының бөлінуінен пайда болады. Екі жасушадан екі жұмыртқалы егіздер, ал үш жасушадан үш жұмыртқалы егіздер және т.б. пайда болады. Неліктен біржұмыртқалы егіздер гаструладан түзілмейтінін дәлелдеңдер."],"Бағалау":["Биогенетикалық заңның мәні: «Онтогенез дегеніміз – филогенездің қысқамерзімді және толық емес қайталануы» туралы өз пікірлеріңді айтыңдар.","Биогенетикалық заң туралы және оның авторы, оны дәлелдейтін зерттеу жұмыстары туралы реферат жазыңдар."],"Пікірталас":["Биогенетикалық заң әмбебап деп ойлайсыңдыр ма? Ол заң өсімдіктерге де қатысты ма? Жауаптарыңды дәлелдеңдер. 12-бөлім. Тұқымқуалаушылық және өзгергіштік заңдылықтары"]},"gl":[["Гастрит","асқазанның шырышты қабықшасының қабынуы. Гематология (грек. гемо – қан және логос – ілім, ғылым) – қан жүйесінің құрылысы мен қызметін зерттейтін медицинаның бөлімі."],["Эмбрион","адам және жануардың ұрығы."],["Жұмыртқа","жұп аталық жыныс безі."],["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."],["Соңғы ми, үлкен ми","үлкен ми сыңарларын түзетін мидың ең ірі және басты бөлімі; мидың басқа бөлімдерінің және жұлынның қызметін басқаратын ОЖЖнің жоғары бөлімі."],["Сіңір","қаңқа сүйектерін немесе жеке мүшелерді байланыстыратын тығыз, дәнекер ұлпалы желі және пластиналар."],["Шеміршек","тірек-механикалық қызмет атқаратын дәнекер ұлпаның бір түрі."],["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."]],"labs":[],"bjb":true,"c":["🥚 Зигота","🫧 Бластула","🧫 Гаструла","👶 Ұрық"],"cs":["Бақаның уылдырығын аквариумда бақылаған оқушылар бір жасушадан көпжасушалы шарға, кейін екі қабатты құрылымға айналуын байқады.","Бақылаған кезеңдердің атауын ретімен жаз.","Эктодермадан қандай мүшелер дамиды?","Эндодермадан қандай мүшелер дамиды?"],"tb":["Ұрық жапырақшалары және олардан дамитын мүшелер",["Ұрық жапырақшасы","Дамитын мүшелер/ұлпалар"],["Эктодерма","Мезодерма","Эндодерма","Нейрула кезеңі"]],"mc":[["Жүйке жүйесі дамитын ұрық жапырақшасы:",["Эктодерма","Мезодерма","Эндодерма","Бластодерма"],0],["Бластула дегеніміз:",["Бір қабатты көпжасушалы ұрық","Екі қабатты ұрық","Зигота","Ли
