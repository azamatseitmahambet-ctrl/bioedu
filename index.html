ің арасында қандай айырмашылық бар екенін түсіндіріңдер.","Тірі табиғатта бейімделмеген ағзалар болуы мүмкін бе? қолданылуы:"],"Талдау":["Эволюция барысында өзгергіштіктің қай түрінің рөлі аз және неге олай екенін талдаңдар, оны түсіндіріңдер.","Эволюция үдерісі мен бейімделу қалыптасуының себептері туралы өз пікірлеріңді айтыңдар.","Пайдалы тұқым қуалайтын өзгергіштік ұзаққа созылатынын мысалдар келтіре отырып дәлелдеңдер."],"Синтез":["Эколог ғалымдар неліктен «адам табиғи сұрыпталуға қарсы сұрыпталу жүргізіп жатыр» деп айтатынын талқылаңдар.","Бейімделудің қоректік, климаттық, қорғаушы, көбеюге байланысты әртүрлі типтерін жүйелеңдер.","Эволюциялық үдерістегі тұқымқуалаушылық пен өзгергіштіктің рөлі туралы эссе жазыңдар."],"Бағалау":["Өздерің тұратын жердегі өсімдіктерге немесе жануарларға тән тұқым қуалайтын және тұқым қуаламайтын бейімделу туралы реферат жазыңдар."],"Пікірталас":["Өз пікірлеріңді айтыңдар: «Неліктен арыстандар, киттер, піл, ақбөкен сияқты және т.б. жануарлар жақсы бейімделгендігіне қарамастан жойылып кету қаупінде тұр?»","Ч. Дарвиннің айтуы бойынша: «Табиғи сұрыпталу – эволюцияның басты факторы, эволюцияның қозғаушы күші» деген пікірді бағалаң дар. Сендер онымен келісесіңдер ме? Дарвиннің пікіріне дәлелдер келтіре отырып, «қарсымын», «қарсы емеспін» деп талқылаңдар."]},"gl":[["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."],["Мутациялар","табиғи немесе жасанды түрде пайда болатын ағзаның генетикалық материалындағы – хромосомалары мен гендеріндегі қайта құрулар мен бұзылуы нәтижесінде тұқым қуалайтын қасиеттерінің өзгерістері."],["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."]],"labs":[],"bjb":false,"c":["👨‍👩‍👧 Отбасы","🫛 Асбұршақ","🧬 Ген","🔀 Өзгергіштік"],"cs":["Ата-анасының көзі қоңыр, ал баласының көзі көк болып туды. Отбасы таңғалды.","Бұл қалай мүмкін? Ата-ананың генотипін жаз (А – қоңыр).","Пеннет торымен ұрпақтың ықтималдығын есепте.","Тұқымқуалаушылық пен өзгергіштіктің айырмашылығы неде?"],"tb":["Өзгергіштік түрлері",["Түрі","Себебі","Тұқым қуалай ма","Мысал"],["Модификациялық","Мутациялық","Комбинативтік","Мейоздағы кроссинговер"]],"mc":[["Генетика ғылымының негізін салушы:",["Г. Мендель","Ч. Дарвин","Т. Морган","Н. Вавилов"],0],["Аа × Аа шағылыстыруда рецессивті белгілі ұрпақ үлесі:",["25%","50%","75%","0%"],0],["Тұқым қуаламайтын өзгергіштік:",["Модификациялық","Мутациялық","Комбинативтік","Генотиптік"],0]],"tf":[["Мутациялар тұқым қуалайды",1],["Фенотип тек генотипке байланысты, ортаға тәуелсіз",0],["Өзгергіштік табиғи сұрыпталуға материал береді",1]],"gr":["зерттеу","Сыныптастардың құлақ сырғалығы, тілді түтікше ету белгілерін зерттеп, кестеге түсіріңдер","Бір өсімдіктің 20 жапырағының ұзындығын өлшеп, вариациялық қатар құрыңдар","Асбұршақтың моногибридті шағылыстыру есебін шешіп, Пеннет торын салыңдар"],"lab":"punnett"},"51":{"n":51,"kind":"p","title":"Қолдан сұрыптау","page":206,"sec":12,"codes":["8.2.4.2"],"goal":"Ағзалар селекциясы үшін қолдан сұрыптаудың маңызын сипаттау","recall":"Эволюция дегеніміз не? Табиғи сұрыпталу деген не? Қолдан сұрыптауды кім жүргізеді?","intro":"Селекция, эволюция және сұрыптау. Ч. Дарвиннің пікірінше, эво люцияның басты қозғаушы күші – табиғи сұрыпталу. Табиғи сұрыпталу белгілі бір табиғи жағдайда тіршілік етуге бейімделген ағзалардың тіршілік үшін күресінің нәтижесі. Табиғи сұрыпталудың нәтижесінде өзіне пайдалы көптеген бейімделушілік ерекшеліктері бар ағзалардың белгілі бір түрлері мен даралары тірі қалып, көбейе алады. Ал нашар бейімделген түрлер мен ағзалар табиғи сұрыпталудың нәтижесінде толығымен тіршілігін жояды. Қолдан сұрыптаудың нәтижесінде өсімдіктер мен жануарлардың адамға қажетті белгі-қасиеттері дамиды. Қолдан сұрыптау табиғатта емес, адамның қатысуымен жүреді. Оның нәтижесінде жануарлардың жаңа қолтұқымдары мен өсім","terms":["Эволюция","Селекция","Қолдан сұрыптау: жаппай және жеке","Жағымды және жағымсыз"],"qs":{"Білу және түсіну":["Селекция дегеніміз не?","Қолдан сұрыптау неліктен селекцияның негізгі әдісі екенін түсіндіріңдер.","Қолдан сұрыптаудың түрлерін сипаттаңдар.","Селекция ғылымының қашан және қалай дамығанын түсіндіріңдер. қолданылуы:"],"Талдау":["Жеке және жағымды сұрыптауға қарағанда жаппай және жағымсыз сұрыптаудың нәтижесі төмен болатындығы туралы өз пікірлеріңді айтыңдар.","Қолдан сұрыптаудың нәтижесінде пайда болған ағзалардың (іріктемелер, қолтұқымдар) табиғи жағдайға бейімделуі олардың жабайы туыстарына қарағанда анағұрлым төмен болатынын мысалдар келтіре отырып дәлелдеңдер.","«Жануарлар селекциясы» мен «өсімдіктер селекциясының» сызбасын сызыңдар."],"Синтез":["«Мен селекционер болғанымда...» тақырыбына эссе жазыңдар.","Адамдарды азық-түлікпен қамтамасыз етудегі селекция ғылымының рөлін бағалаңдар.","Қолдан және табиғи сұрыптау үдерістерінің арасында қандай ұқсастықтар мен айырмашылықтар бар екенін атаңдар. Көрсеткіш терін кестеге жазыңдар.","«Жыныстық сұрыптау» және «клондау» терминдерімен толықтыра отырып, «Қолдан сұрыптаудың түрлері» деген тақырыпқа сызба сызыңдар."],"Бағалау":["«Селекция – адам қолымен жасалатын эволюция» деген пікірдің дұрыс екендігін талқылаңдар.","«Қолдан сұрыптаудың нәтижесінде алынған өсімдіктердің жаңа іріктемелері мен жануарлардың жаңа қолтұқымдарының тіршілік қабілеті табиғи жағдайда табиғи сұрыптаудың нәтижесінде пайда болған жаңа түрлерге қарағанда әлсіз болатыны» туралы өз пікірлеріңді айтыңдар."]},"gl":[["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."]],"labs":[],"bjb":false,"c":["🐄 Сиыр","🌾 Бидай","✂️ Іріктеу","🏆 Тұқым"],"cs":["Фермер ең көп сүт беретін сиырларды ғана көбейтіп, 20 жыл ішінде табынның орташа сүт беруін екі есе арттырды.","Фермер қандай әдісті қолданды?","Бұл әдістің табиғи сұрыпталудан айырмашылығы неде?","Қолдан сұрыптаудың тағы 2 мысалын келтір."],"tb":["Табиғи және қолдан сұрыптау",["Белгі","Табиғи сұрыптау","Қолдан сұрыптау"],["Сұрыптаушы фактор","Кімге пайдалы","Нәтижесі","Жылдамдығы"]],"mc":[["Қолдан сұрыптауды жүзеге асырады:",["Адам","Табиғат","Жыртқыштар","Климат"],0],["Жаппай сұрыптау қолданылады:",["Айқас тозаңданатын өсімдіктерге","Тек жануарларға","Тек бактерияларға","Саңырауқұлақтарға"],0],["Селекция ғылымының міндеті:",["Жаңа сорт пен тұқым шығару","Жаңа түр табу","Қазба зерттеу","Ауруды емдеу"],0]],"tf":[["Жеке сұрыптауда әр дарақтың ұрпағы тексеріледі",1],["Қолдан сұрыптауда ағзаның өзіне пайдалы белгілер сақталады",0],["Будандастыру – селекция әдісі",1]],"gr":["рөлдік ойын","«Селекционер-өсімдік шаруашылығы» ретінде бидайдың жаңа сортын шығару жоспарын құрыңдар","«Селекционер-мал шаруашылығы» ретінде қой тұқымын жақсарту жоспарын құрыңдар","«Табиғат» ретінде табиғи сұрыпталудың нәтижесін көрсетіңдер"],"lab":"selection"},"52":{"n":52,"kind":"p","title":"Мәдени өсімдіктер мен үй жануарларының шығу орталықтары","page":209,"sec":12,"codes":["8.2.4.3"],"goal":"Мәдени өсімдіктер мен үй жануарларының шығу орталықтарын зерттеу","recall":"Өсімдіктер мен жануарлар селекциясының бірінші кезеңі қандай? Н.И. Вавилов туралы не білесіңдер?","intro":"Селекция ғылымының маңызды бөлігі түрлердің арғытектері туралы ілім. Оның негізін салуға атақты орыс ғалымы, генетик Николай Иванович Вавиловтың қосқан үлесі зор. Ол ХХ ғасырдың 20–30-жылдарында қызметкерлерімен бірлесіп, дүниежүзінің әр түкпіріне 60-тан астам экспедиция жасады. Зерттеу барысында Австралиядан басқа барлық кон14–3459 209 тиненттерден мәдени өсімдіктердің арғытектері болып табылатын материалдар жинады. Жабайы түрлердің барлық мүмкіндігі бар тұқымдық материалдарының жиынтығы осы көпжылдық зерттеулердің нәтижесі болып табылады. Ол қазір Санкт-Петербургтегі Өсімдік шаруашылығы институтында сақтаулы тұр. Институт ұжымы бұл құнды генетикалық материалдарды 1942–1943 жылдары Ленингра","terms":["Мәдени өсімдіктердің шығу орталығы және жануар ларды қолға үйрету."],"qs":{"Білу және түсіну":["Мәдени өсімдіктер мен үй жануарларының шығу орталығын зерттеу не үшін керек екенін түсіндіріңдер.","Әртүрлі орталықтардан шыққан өсімдіктердің түрлеріне және олардың шығу тегіне сипаттама беріңдер.","Мәдени өсімдіктер мен үй жануарлары қашан және қалай пайда болғанын түсіндіріңдер.","Мәдени өсімдіктердің шығу орталықтарын қай ғалым ашты?"],"Қолданылуы":["Оңтүстік Азия қандай өсімдіктердің шығу орталығы болып табылады?","Оңүстік-Батыс Азия орталығы қандай жануарлардың шығу орталығы болып табылады?","Әртүрлі орталықтан шыққан мәдени өсімдіктердің түр санын салыстырыңдар."],"Талдау":["«Мәдени өсімдіктердің және үй жануарларының шығу орталықтары, сол түрдің ежелгі өркениетті шығу орталығы» деген сызба сызыңдар.","Үй жануарларының шығу тегін қолға үйретілген реті бойынша талдаңдар.","Қазіргі кездегі өсімдіктердің мәдени түрлері мен жабайы түрлерінің арасындағы айырмашылықты көрсетіңдер.","Қазіргі кездегі жануарлардың қолтұқымдары мен ежелгі арғы тегінің арасындағы айырмашылықты көрсетіңдер."],"Синтез":["Азиядағы орталықтарда шығарылған өсімдіктерге жалпы сипаттама беріңдер.","Еуропа мен Африкадағы орталықтарда шығарылған өсімдіктерге жалпы сипаттама беріңдер.","Жаңа әлем аумағындағы орталықтарда шығарылған өсімдіктерге жалпы сипаттама беріңдер.","Жағдайды модельдеңдер. Қазіргі кездегі қолдан шығарылған өсімдіктер мен жануарлардың қасиеттері қалай өзгереді? Оларды шығаруда қандай әдістер қолданылуы мүмкін?"],"Бағалау":["«Жасыл революция» тақырыбына реферат жазыңдар. Бұл үдеріс «Мәдени өсімдіктердің шығу орталықтары мен мәдени өсімдіктердің алғашқы және арғы тегі болып табылатын өсімдік тұқымдарының жинақтамасын жинау» туралы ілім болмаса, жүзеге асуы мүмкін бе?","Мәдени өсімдіктерді шығарудың адам өміріндегі және табиғаттағы маңызы қандай екенін бағалаңдар.","Жануарларды қолға үйретудің адам өміріндегі және табиғаттағы маңызы қандай екенін бағалаңдар."]},"gl":[["Генетика","ағзалардың тұқым қуалау және өзгергіштік заңдары мен оларды басқару әдістері туралы ғылым."]],"labs":[],"bjb":false,"c":["🗺️ Карта","🌽 Жүгері","🐎 Жылқы","🍎 Алма"],"cs":["Н.И. Вавилов алманың шығу тегін іздеп, Алматы маңындағы тау бөктерінде Сиверс алмасының жабайы ормандарын тапты.","Вавилов мәдени өсімдіктердің шығу орталығын қалай анықтады?","Қазақстан қай шығу орталығына жақын орналасқан?","Жабайы туыстарды сақтаудың селекция үшін маңызы неде?"],"tb":["Мәдени өсімдіктердің шығу орталықтары",["Орталық","Мәдени өсімдіктер (мысал)"],["Оңтүстік-Азиялық тропиктік","Шығыс-Азиялық","Оңтүстік-Батыс Азиялық","Оңтүстік-Американдық"]],"mc":[["Мәдени өсімдіктердің шығу орталықтарын анықтаған ғалым:",["Н.И. Вавилов","Г. Мендель","Ч. Дарвин","И. Мечников"],0],["Картоп пен томаттың отаны:",["Оңтүстік Америка","Үндістан","Қытай","Африка"],0],["Жылқыны алғаш қолға үйреткен деп есептелетін мәдениет (Қазақстан):",["Ботай","Египет","Рим","Майя"],0]],"tf":[["Сиверс алмасы – мәдени алманың ата-тегі",1],["Жүгерінің отаны – Африка",0],["Шығу орталықтарында сорттардың әртүрлілігі жоғары",1]],"gr":["карта","Контур картаға өсімдіктердің шығу орталықтарын түсіріңдер","Контур картаға үй жануарларының шығу орталықтарын түсіріңдер","Қазақстанның жабайы туыстары (алма, қызғалдақ т.б.) картасын жасаңдар"],"lab":"sort","srt":["Өсімдік пен шығу орталығы",{"Картоп":"Оңтүстік-Американдық","Күріш":"Оңтүстік-Азиялық тропиктік","Соя":"Шығыс-Азиялық","Бидай":"Оңтүстік-Батыс Азиялық","Жүгері":"Орталық Американдық","Зәйтүн":"Жерорта теңіздік"}]},"53":{"n":53,"kind":"p","title":"Қазақстандағы селекция жетістіктері","page":214,"sec":12,"codes":["8.2.4.4"],"goal":"Маңызды мәдени өсімдіктер іріктемелері мен үй жануарларының қолтұқымын сипаттау","recall":"Қазақстанның ең ірі аграрлық саласы – өсімдік шаруашылығы. Ауылшаруашылық дақылдарының егістік алқаптары бойынша дәнді дақылдар – 66%, олардың ішінде қатты бидай – 62% құрайды. Елімізде басқа да дәнді дақылдар: арпа, сұлы, тары, күріш, жүгері, дәнді-бұршақты дақылдар және т.б. өсіріледі. Сырдария, Іле және Қаратал өзендерінің сағаларында күріштің суғармалы алқаптары бар. Қазақстанның оңтүстігі мен оңтүстік шығысында техникалық дақылдар өсіріледі. Олардың ішінде мақта өсімдігі, қант қызылшасы, зығыр, күнбағыс және т.б. аса маңызды. Сонымен қатар бау-бақша және жүзім шаруашылығы да дамыған. Қазақстан Республикасы ауылшаруашылық жерлерінің төрттен үш бөлігін жайылым алып жатыр. Малшаруашылығы – еліміздің ауылшаруашылығының ежелгі және негізгі саласының бірі. Оның маңызды саласы – қойшаруашылығы мен ірі қара өсіру. Сондай-ақ құс, жылқы, түйе өсіру де жақсы дамыған. Қазақстандағы селекция ерекшеліктері. Қазақстандағы селекция ның мақсаты – біздің елімізге тән ерекше табиғи-климаттық жағ дайларға бейімделген мәдени өсімдіктер мен үй жануарларының түрлерінің шығару үдерісі. Дәстүрлі түрде Қазақстан аумағында халық селекциясы нәтижесінде мәдени өсімдіктер мен үй жануарларының көптеген сұрыптары мен тұқымдары (қолтұқымдары) алынған. Халық селекциясы нәтижесінде мүйізді ұсақ малдардан құйрықты қой тұқымы дамыды. Ал өсімдіктерден бидай, алма және т.б. сұрыптары шығарылды. Қазақстан ғалымдарының өсімдіктер мен жануарлар селекциясы саласындағы жетістіктері. Өсімдіктер селекциясын дамытуға ҚР ҰҒАның академигі, профессор В.П. Кузьмин елеулі үлес қосты. Ол Солтүстік Қазақстанда дәнді, майлы және басқа дақылдар селекциясы мен тұқымшаруашылығының бірқатар теориялық әрі әдістемелік негіздерін дамытты. Профессор Н.Л. Удольская (1906–1986) өсімдіктердің құрғақшылыққа төзімділігіне теориялық тұрғыда жаңа көзқарасты негіздеді. Ол бидайдың аудандастырылған төрт және «Казахстанская-126» сұрыптары бойынша моносомдық сұрыптармақ сериясының авторы болып табылады. «Ка-","intro":"захстанская-126» – жаздық бидайдың қатты сұрыбы. Ол жергілікті жағдайларға жақсы бейімделген. ХХ ғасырдың соңынан бастап бұл сұрып аудандастырылған аймақта (Орал, Ақтөбе және Шығыс Қазақстан өңірінде) жетекші орында және жаздық бидай егісінің шамамен 80%-ын алады. Ол жапырылуға (жатып қалуға) тұрақты, дәні төгілмейді, жеңіл бастырылады. Ауруларға төзімді. Дәнді дақылдар селекциясын дамытуға Р.А. Оразалиев те үлкен үлес қосты. Ол күздік бидайдың жоғары өнімді ондаған сұрыбын шығарды. «Алмалы» және «Стекловидная-24» күздік бидай сұрыптары суыққа, құрғақшылыққа төзімді. Дәні төгіліп қалмайды және жапырылмайды. Дәнінің массасы бойынша «Богарная-56», «Безостая-1», «Одесская-120» сұрыптарынан арты","terms":["Биотехнология","Гендік инженерия","Криоконсервация"],"qs":{"Білу және түсіну":["«Заманауи селекцияның жетістіктері» деген пікірді қалай түсінесіңдер?","Әрбір елде селекцияны қолға алу не үшін қажет екенін түсіндіріңдер.","Қазақстанның өсімдіктер селекциясы саласындағы селекционерғалымдарды атаңдар.","Қазақстанның жануарлар селекциясы саласындағы селекционерғалымдарды атаңдар."],"Талдау":["Біздің елімізде селекцияның қалыптасу кезеңдерін талдаңдар.","Қазақстандағы селекция кезеңдерін сызба түрінде бейнелеңдер.","Қазақстандағы селекцияның даму үдерісін талдаңдар."],"Синтез":["Қазақстандағы заманауи селекция бағыттарын критерий бойынша жүйелеңдер.","«Егер мен заманауи селекционер болсам» деген тақырыпқа эссе жазыңдар.","Қазақстандағы ауылшаруашылығының дамуындағы селекция рөлін бағалаңдар."],"Бағалау":["Берілген үш тақырыптың біріне реферат жазыңдар.","Қазақстандағы заманауи өсімдіктер селекциясындағы жетістіктер.","Қазақстандағы заманауи жануарлар селекциясындағы жетістіктер.","Қазақстандағы заманауи микроағзалар, биотехнология және гендік инженерия саласындағы жетістіктер."],"Пікірталас":["Егер сендер Қазақстандағы биотехнологтардың жұмыс бағытын бас қарсаңдар, осы саладағы ғалымдардың алдына қандай мақсат қояр едіңдер? 13-бөлім. Биосфера, экожүйе, популяция"]},"gl":[["Эмбрион","адам және жануардың ұрығы."]],"labs":[],"bjb":true,"c":["🐑 Қой","🐎 Жылқы","🌾 Бидай","🇰🇿 Қазақстан"],"cs":["Қазақстанның ғалымдары жергілікті қойларды меринос қошқарларымен будандастырып, биік таулы жайылымға бейімделген, жүні сапалы жаңа тұқым шығарды.","Бұл қай тұқым болуы мүмкін?","Селекцияда будандастыру неге қолданылады?","Қазақстанның тағы 2 селекция жетістігін ата."],"tb":["Қазақстандағы селекция жетістіктері",["Сала","Сорт/тұқым","Ерекшелігі"],["Қой шаруашылығы","Ірі қара","Жылқы шаруашылығы","Өсімдік шаруашылығы"]],"mc":[["Қазақ олданылуы:","Мутуализм барысындағы ағзалардың өзара әсерін анықтаңдар. Оны нақты мысалдармен көрсетіңдер.","Пәтерлестік пен комменсализмді салыстырыңдар."],"Талдау":["Ағзалардың жағымды әсерлерін және олардың түрлері мен өзара айырмашылықтарын сызба түрінде бейнелеңдер.","Табиғатта симбиоздың түзілу себептері туралы өз пікірлеріңді айтыңдар."],"Синтез":["Жағымды әсерлердің әр түріне мысалдар келтіріңдер. Олардың бірбірінен қандай айырмашылықтары бар?","Жағымды әсерлердің эволюциялық маңызы қандай? Ағзалардың дамуына қандай жеңілдіктер тудырады?"],"Бағалау":["«Микориза және оның тұрақты орман бірлестігін түзудегі рөлі» тақырыбына реферат жазыңдар.","Әртүрлі жануарлардың асқорыту жүйесінде симбиозды тіршілік ететін эукариотты және прокариотты біржасушалы ағзалар болады. Құрттарда кірпікшелілер, тұяқты жануарларда кірпікшелілер мен бактериялар, жыртқыштарда бактериялар. «Симбионаттарсыз толыққанды асқорыту мүлдем болмайды», – деген жалпы түсінік туралы өз пікірлеріңді айтыңдар. Эволюция барысында мұндай қарымқатынастар қалай қалыптасады?"]},"gl":[["Симбиоз","әр түрге жататын екі ағзаның бірлесіп тіршілік ету формасы."],["Мутуализм","симбионттардың бірі екіншісіне қандай да бір пайда әкелетін симбиоздың бір түрі."],["Комменсализм, серіктестік","симбионттардың бірі басқасының есебінен оған қандай да бір зиян тигізбестен тіршілік ететін селбесудің (симбиоз) бір түрі."]],"labs":[],"bjb":false,"c":["🐝 Ара","🌸 Гүл","🦈 Акула","🐟 Балық"],"cs":["Өсімдік биті мен құмырсқа арасында қызық байланыс бар: құмырсқалар өсімдік битін жыртқыштардан қорғайды, ал бит құмырсқаларға тәтті бөліндісін береді.","Бұл қарым-қатынастың түрін анықта.","Екі жақ та пайда ала ма? Дәлелде.","Мутуализм мен комменсализмге бір-бір мысал келтір."],"tb":["Тірі ағзалардың қарым-қатынас түрлері",["Түрі","1-ағзаға","2-ағзаға","Мысал"],["Мутуализм","Комменсализм","Бәсекелестік","Бейтараптық"]],"mc":[["Екі түрге де пайдалы қарым-қатынас:",["Мутуализм","Паразитизм","Бәсекелестік","Жыртқыштық"],0],["Жабысқақ балық пен акула:",["Комменсализм","Паразитизм","Бәсекелестік","Жыртқыштық"],0],["Бұршақ тұқымдас пен түйнек бактериялары:",["Мутуализм (симбиоз)","Паразитизм","Бейтараптық","Бәсекелестік"],0]],"tf":[["Қыналар – саңырауқұлақ пен балдырдың селбесуі",1],["Бәсекелестікте екі түр де пайда көреді",0],["Бейтараптықта түрлер бір-біріне тікелей әсер етпейді",1]],"gr":["тарсия","Қарым-қатынас түрлері мен анықтамаларын тарсия арқылы сәйкестендіріңдер","Қарым-қатынас түрлері мен мысалдарды тарсия арқылы сәйкестендіріңдер","«+ / – / 0» белгілерімен қарым-қатынас кестесін тарсиядан құрастырыңдар"],"lab":"sort","srt":["Қарым-қатынас түрі және мысал",{"Мутуализм":"Ара мен гүл","Комменсализм":"Жабысқақ балық пен акула","Паразитизм":"Бит пен адам","Жыртқыштық":"Қасқыр мен қоян","Бәсекелестік":"Бір жайылымдағы сиыр мен жылқы","Бейтараптық":"Тиін мен бұлан"}]},"57":{"n":57,"kind":"p","title":"Тірі ағзалардың бір-біріне жағымсыз әсерлері","page":231,"sec":13,"codes":["8.3.1.5"],"goal":"Жыртқыш-құрбан қарым-қатынасы мысалында популяция санының өзгеру себептерін анықтау","recall":"Сендер ағзалардың өзара қарым-қатынас түрлері туралы қандай мысалдар білесіңдер? Олардың қайсыбірі жағымсыз?","intro":"Тірі ағзалардың бір-біріне жағымсыз әсері әртүрлі формада болуы мүмкін. Жыртқыштық түрлердің арасындағы кең тараған жағымсыз әсерлердің бір түрі болып табылады. Жыртқыштық дегеніміз – жануарлардың (өсімдіктердің кейбір түрлерінде де болады) бірін-бірі қорек етуі. Жырт қыштыққа мыналар мысал бола алады. Арыс тан мен киік, қасқыр мен қоян, құстар мен бу нақденелілердің және т.б. тірі ағзалардың өзара қарым-қатынасы (112-сурет). Жыртқыштық біржасушалылардың арасында да кездеседі. Жыртқыштықтың кең тараған түрі – кан 112-сурет. Жыртқыштық – нибализм, бір түрдің арасында бірін-бірі қорек жануарлардың қоректену әдісі етуі. Бұл кезде жас ағзаларды ересектерінің қорек етуі (шортан) немесе аналықтардың аталықтарды жеп қоюы (көптеген өрмекшітәрізділер мен бунақденелілер) кездеседі. Эволюция барысында «жыртқыш-жемтік» қарым-қатынасы ертеден келе жатқан тіршілік үшін күрестің бір түрі болып табылады","terms":["Жыртқыштық","Паразитизм","Бәсекелестік","Бей та раптық (нейтрализм)."],"qs":{"Білу және түсіну":["Жағымсыз қарым-қатынас дегеніміз не? Мысалдар келтіріңдер.","Жағымсыз қарым-қатынас түрлерін атаңдар. қолданылуы:","Тіршілік үшін күрес, табиғи сұрыпталу және жағымсыз қарымқатынас түрлерін атаңдар.","Жыртқыштық пен паразитизмді салыстырыңдар. Олардың ұқсастықтары мен айырмашылықтарын табыңдар."],"Талдау":["Жағымсыз қарым-қатынастың қалыптасу себептері туралы өз пікірлеріңді айтыңдар.","Жағымсыз қарым-қатынастар эволюциялық түр түзілуге әсер ететінін мысалдар келтіре отырып дәлелдеңдер."],"Синтез":["Жағымсыз қарым-қатынастарды белгілері бойынша жіктеңдер.","Экожүйенің тұрақтылығын сақтаудағы жағымсыз қарым-қатынастардың рөлі туралы эссе жазыңдар."],"Бағалау":["Паразитизм пайда болуының эволюциялық механизмі туралы өз пікірлеріңді айтыңдар.","Көптеген зерттеушілердің пікірі бойынша, неліктен жыртқыштар немесе симбионаттар паразитті тіршілік етуге көшеді? Бұл құбылысты талқылаңдар.","Табиғаттағы жағымсыз қарым-қатынастардың маңызын бағалаңдар. Жағымсыз қарым-қатынасы жоқ экожүйе болуы мүмкін бе? Өз болжамдарыңды дәлелдеңдер және талқылаңдар."],"Пікірталас":["«Паразиттерсіз өмір» болуы мүмкін бе? Осы тақырыпқа сыныпта пікірталас ұйымдастырыңдар."]},"gl":[["Паразиттік аурулар","инвазиялық аурулар."],["Жұмыртқа","жұп аталық жыныс безі."]],"labs":[],"bjb":false,"c":["🐺 Қасқыр","🐇 Қоян","🦠 Паразит","📉 График"],"cs":["Канадада 90 жыл бойы терісі сатып алынған сілеусін мен ақ қоян санының өзгерісі тіркелген: қоян көбейгеннен кейін 1–2 жылдан соң сілеусін көбейіп, кейін қоян саны азайған.","Неге сілеусін саны қоян санынан кейін өзгереді?","Қоян саны азайғанда сілеусінмен не болады?","Жыртқыштар популяция үшін қандай пайда әкеледі?"],"tb":["Жағымсыз қарым-қатынас түрлері",["Түрі","Сипаттамасы","Мысал"],["Жыртқыштық","Паразитизм","Бәсекелестік","Аменсализм"]],"mc":[["Жыртқыш пен жемтік санының өзгерісі:",["Циклдік, кешігумен","Мүлдем өзгермейді","Бір мезетте өседі","Тек жыртқыш өседі"],0],["Эндопаразит:",["Жалпақ құрт (таспа құрт)","Бит","Кене","Бүрге"],0],["Бәсекелестік күшті болады:",["Бір экологиялық тауашадағы түрлер арасында","Әртүрлі ортадағы түрлер арасында","Продуцент пен редуцент арасында","Ешқашан"],0]],"tf":[["Жыртқыштар ауру және әлсіз жемтіктерді жиі ұстайды",1],["Паразит әдетте иесін бірден өлтіреді",0],["Бәсекелестік – түрішілік және түраралық болады",1]],"gr":["зерттеу","«Жыртқыш–жемтік» модельдеу ойынын (карточкалармен) өткізіп, нәтижені кестеге түсіріңдер","Нәтижелер бойынша популяция санының графигін салыңдар","Табиғаттағы «жыртқыш–жемтік» мысалдарын Қазақстан фаунасынан келтіріңдер"],"lab":"predator"},"58":{"n":58,"kind":"p","title":"Тірі ағзалардың қоршаған орта жағдайларына бейімделуі","page":234,"sec":13,"codes":["8.3.1.7"],"goal":"Тірі ағзалардың қоршаған ортаның өзгермелі жағдайларына бейімделу механизмдерін түсіндіру","recall":"Бейімделу деген не? Сендер бейімделудің қандай түрлерін білесіңдер? Жануарлар мен өсімдіктердің тіршілігін қандай факторлар шектейді?","intro":"Бейімделгіштік – тірі ағзалардың қоршаған ортаның нақты бір жағдайында тірі қалу мүмкіндігін арттыратын құрылысындағы, мінезқұлқындағы, физиологиясындағы қасиеттері. Барлық тірі ағзалардың міндеті – тіршілік үшін күресте өз экология лық қуысын табу. Сонымен, эволюция нәтижелерінің бірі – тірі ағзалардың қоршаған орта жағдайларына бейімделуі. Қоршаған орта – өзара күрделі әрекет ететін және бір-біріне әсер көрсететін жанды (тірі) және жансыз (өлі) нысандардың кешені. Орманда мекендейтін қоян өсімдіктермен және түлкімен тікелей әрекеттеседі. Топырақпен, топырақ ылғалының мөлшерімен жанама (өсімдіктер арқылы) әсерлеседі. Кез келген жануарлар мен өсімдіктер бейімделгіштікке мысал болып табылады.","terms":["Бейімделу","Экологиялық қуыс","Суккуленттер","Жы лу сүйгіш","Суыққа төзімді ағзалар","Ылғалсүйгіш","Құр ғақ шылыққа төзімді ағзалар"],"qs":{"Білу және түсіну":["Шектеуші, оптималды және максималды факторларға анықтама беріңдер.","Шөл өсімдіктерінің қоршаған орта жағдайларына бейімделуін сипаттаңдар. қолданылуы:","Қызыл балдырлардың үлкен тереңдікке түсу себебін айтыңдар.","Қандай ағзалар дене температурасын қалыпты сақтайды, ал қайсылары жоқ."],"Талдау":["Неліктен солтүстікте (борсық, аю) және ыстық аймақтарда жануарлар мекендейтін (дала тасбақасы) ұйқыға кетеді?","Неге көптеген шөл өсімдіктерінің жапырақтары өзгеріске ұшыраған?"],"Синтез":["Ағзалардың белгілі абиотикалық жағдайларға бейімделуіне мысалдар келтіріңдер."],"Бағалау":["Түйелердің түйе тікенді және кесірткелердің шөл өсімдіктерінің етжеңді жапырақтарын жеуі туралы өз пікірлеріңді айтыңдар.","Тірі ағзалардың экстремалды температурада тірі қалуына көмектесетін механизмдер туралы талқылаңдар. 14-бөлім. Адам қызметінің қоршаған ортаға әсері"]},"gl":[["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."]],"labs":[],"bjb":true,"c":["🐫 Түйе","🐻‍❄️ Ақ аю","🌵 Кактус","🦎 Кесіртке"],"cs":["Түйе шөлде 2 аптаға дейін сусыз жүре алады, ал ақ аю –40 °C аязда тоңбайды.","Түйенің шөлге 3 бейімделуін ата.","Ақ аюдың суыққа 3 бейімделуін ата.","Бейімделудің физиологиялық, морфологиялық және мінез-құлықтық түрлеріне мысал келтір."],"tb":["Ағзалардың бейімделу түрлері",["Түрі","Сипаттамасы","Мысал"],["Морфологиялық","Физиологиялық","Мінез-құлықтық","Қорғаныш бояу (мимикрия)"]],"mc":[["Кактус жапырағының тікенге айналуы:",["Морфологиялық бейімделу","Мінез-құлықтық","Физиологиялық","Мутация"],0],["Аюдың қысқы ұйқысы:",["Физиологиялық-мінез-құлықтық бейімделу","Морфологиялық","Мимикрия","Комменсализм"],0],["Зиянсыз шыбынның араға ұқсауы:",["Мимикрия","Камуфляж","Бәсекелестік","Гомеостаз"],0]],"tf":[["Ақ қоянның қыста ағаруы – маусымдық бейімделу",1],["Бейімделу – абсолютті, кез келген жағдайда пайдалы",0],["Құстардың жылы жаққа ұшуы – мінез-құлықтық бейімделу",1]],"gr":["постер","«Шөлдегі тіршілік» – бейімделулер постерін жасаңдар","«Арктикадағы тіршілік» – бейімделулер постерін жасаңдар","«Су ортасындағы тіршілік» – бейімделулер постерін жасаңдар"],"lab":"sort","srt":["Бейімделу және оның түрі",{"Кактустың тікені":"Морфологиялық","Түйенің майды суға айналдыруы":"Физиологиялық","Құстардың маусымдық ұшуы":"Мінез-құлықтық","Шыбынның араға ұқсауы":"Мимикрия","Ақ қоянның қыста ағаруы":"Маусымдық түс өзгерісі"}]},"59":{"n":59,"kind":"p","title":"Адамның табиғаттағы рөлі","page":239,"sec":14,"codes":["8.3.2.1","8.3.2.2"],"goal":"Биологиялық әртүрлілікті сақтаудың және қолдауды қажеттіліктің себептерін негіздеу. Дүниежүзілік тұқым қорының маңызын бағалау","recall":"Атмосферада көмірқышқыл газының жинақталуынан қандай өзгеріс туындайды? МКС деген не? Озон қабаты қайда орналасқан? Қышқыл жауын дегеніміз не? «Жасылдар» дегеніміз кімдер?","intro":"Адамның табиғатқа әсері үнемі артып отырады. Ол табиғатқа жағымды әсер етумен қатар, зиянды да әсер етеді. Қоршаған орта – ауа, су, топырақ тез ластанады. Атмосфераға жинақталған көмірқышқыл газының көп мөлшері ауаға бөлінеді. Нәтижесінде жылыжайлық әсері (парниковый эффект) пайда болды. Соңғы он жылда Жерде температура 10С-қа көтерілді. Бұл мұздықтар мен мәңгілік жерасты мұздықтарының жылдам еруіне және Дүниежүзілік мұхит суы деңгейінің көтерілуіне себеп болуы мүмкін. Газдардың әсіресе фреондардың ауаға бөлінуінен озон қабаты бұзылады. Озон қабаты Жердегі барлық тіршілік атаулыны Күннің ультракүлгін сәулелерінен қорғайды. МКС пен Жер серіктерінен бақылаған кезде Арктика мен Антарктиканың үс","terms":["Жылыжайлық әсер","Озон тесіктері","Қышқыл жауын","Биологиялық алуантүрлілік туралы конвенция","Дү ниежүзілік тұқым банкі","Н.И. Вавиловтың тұқым дар топтамасы"],"qs":{"Білу және түсіну":["Неліктен адамдардың табиғатқа әсері артып отырғанын түсіндіріңдер.","Табиғи ресурстарды тиімді пайдалану дегенді қалай түсінесіңдер? қолданылуы:","Дүниежүзілік тұқым банкінің атқаратын қызметін сипаттаңдар. 16–3459 241","Көмірқышқыл газының, фреонның, күкірт пен азот оксидтерінің ауаға бөлінуі мен адамзаттың жаһандық экологиялық мәселелері: озон қабатының тесілуі, қышқыл жауын, жылыжайлық әсер арасында қандай байланыс бар екенін анықтаңдар."],"Талдау":["Адамдардың табиғатқа жағымсыз әсерлерінен туындайтын мәселелер, оның себеп-салдарын сызба түрінде бейнелеңдер.","Неліктен адамзаттың ғылымдағы ашқан жаңалықтары, жаңа тех нологиялар осы уақытқа дейін экологиялық мәселелерді шеше алмау себептері туралы өз пікірлеріңді айтыңдар.","Әрбір адам табиғатты сақтауға өз үлестерін қоса алатындығына мысалдар келтіріп дәлелдеңдер."],"Синтез":["Дүниежүзілік тұқым банкі мен ертеден келе жатқан Н.И. Вавиловтың дүниежүзілік тұқымдар топтамасының ұқсастығы мен айырмашылығын жүйелеңдер.","Талқылаңдар: 1) Қандай дамыған елдерде жылыжайлық әсер өте қауіпті және неліктен? 2) Қолда бар биологиялық алуантүрлілікті адамзат сақтай ала ма? 3) Жағдайды модельдеңдер:«Адамзат жаңа, экологиялық таза, тегін және таусылмайтын энергия көзін тапты». Бұның экология және экономика саласына қандай әсері болады?"],"Бағалау":["Экологиялық мәселелерді шешу және одан сақтандыру туралы «Рим клубы» ұйымы, Киото хаттамасы құжатын (ол қашан күшіне енді?) қашан және қандай мақсатта халықаралық Greenpeace ұйымы құрылғанын айта отырып реферат жазыңдар."]},"gl":[["Қышқыл жаңбыр","ауа құрамында SO2, NO2, HCl және т.б. өнеркәсіптік шығарындылар болғандықтан қышқылданған атмосфералық жауын-шашын."],["Генетика","ағзалардың тұқым қуалау және өзгергіштік заңдары мен оларды басқару әдістері туралы ғылым."],["Соңғы ми, үлкен ми","үлкен ми сыңарларын түзетін мидың ең ірі және басты бөлімі; мидың басқа бөлімдерінің және жұлынның қызметін басқаратын ОЖЖнің жоғары бөлімі."]],"labs":[],"bjb":false,"c":["🌍 Жер","🏭 Зауыт","🌳 Қорық","🌱 Тұқым қоймасы"],"cs":["Норвегиядағы Шпицберген аралында мәңгі тоң астында «Ақырзаман тұқым қоймасы» салынған. Онда әлемнің мыңдаған сорттарының тұқымдары сақталады.","Бұл қойма не үшін салынған?","Биоәртүрлілікті сақтау адам үшін неге маңызды?","Қазақстандағы ерекше қорғалатын 2 табиғи аумақты ата."],"tb":["Адамның та . Осы аумақтағы жұртшылық пен көптеген т","terms":["Полигон","Экологиялық қозғалыс","Мораторий","Эколо гиялық апат."],"qs":{"Білу және түсіну":["Экологиялық мәселелер дегеніміз не? Неліктен олай атайды?","«Семей полигоны» деген не?","Қазақстанның экологиялық мәселелерін атап өтіңдер. Олардың әрқайсысының қандай зардабы бар?"],"Қолданылуы":["Арал теңізінің тартылуы мен оның себептерінің арасында қандай байланыс бар екенін аңықтаңдар.","Республикамыздағы Арал теңізінен басқа экологиялық апатқа ұшыраған су алқаптарын (бассейндерін) салыстырыңдар.","Семей полигонында қанша жыл ядролық сынақ жүргізілді? Ал АҚШтағы Невадада қанша жыл жүргізілгенін салыстырыңдар."],"Талдау":["Қазақстанның кез келген экологиялық мәселелерінің қалыптасу кезеңдерін талдаңдар.","Қазақстан Республикасында экологиялық мәселелердің пайда болу себептері туралы өз пікірлеріңді айтыңдар.","Біздің еліміздегі экологиялық мәселелерді шешу мүмкіндігінің бар екенін мысалдармен дәлелдеңдер."],"Синтез":["«Өзімнің ауылымдағы (қаламдағы), облысымдағы экологиялық мәселелерді шешуге қосатын үлесім» тақырыбына эссе жазыңдар.","«Невада–Семей» қозғалысын басқарған және ядролық сынақтарға қарсы мораторий жариялаған адамдардың рөлін бағалаңдар."],"Бағалау":[]},"gl":[],"labs":[],"bjb":true,"c":["🏜️ Арал","☢️ Полигон","🏭 Түтін","♻️ Қайта өңдеу"],"cs":["Арал теңізі 1960 жылдан бері он есе дерлік кішірейді. Теңіз түбінен көтерілген тұзды шаң маңайдағы тұрғындардың денсаулығына әсер етуде.","Арал апатының басты себебі не?","Апаттың адам денсаулығына және табиғатқа 2 салдарын жаз.","Солтүстік Арал теңізін сақтау үшін қандай шара қабылданды?"],"tb":["Қазақстанның экологиялық мәселелері",["Мәселе","Себебі","Салдары","Шешу жолы"],["Арал теңізінің тартылуы","Семей ядролық полигоны","Ауаның ластануы (ірі қалалар)","Тұрмыстық қалдықтар"]],"mc":[["Семей ядролық сынақ полигоны жабылған жыл:",["1991","1985","2000","1975"],0],["Солтүстік Аралды сақтау үшін салынған:",["Көкарал бөгеті","Капшағай СЭС","Медеу","Бұқтырма бөгеті"],0],[ function matchPairs(L) {
  let pairs = (L.srt ? Object.entries(L.srt[1]) : []);
  if (pairs.length < 4) pairs = pairs.concat(L.gl.map(g => [g[0], g[1].split(/(?<=\.)\s/)[0]]));
  if (pairs.length < 4) pairs = pairs.concat(L.mc.map(m => [m[1][m[2]], m[0].replace(/:$/, '')]));
  return pairs.slice(0, 6);
}

/* ---------- inclusive ---------- */
let INCL = 'visual';
const INCL_M = { visual: 'Көруі нашар', hearing: 'Естуі нашар', sen: 'Оқуда қиналатын (ЕБҚ)', adhd: 'Зейіні тұрақсыз', gifted: 'Дарынды оқушы' };
function simple(L) { const s = (L.intro || L.goal).split(/(?<=[.!?])\s+/).filter(x => x.length > 20).slice(0, 3).join(' '); return s || L.goal; }
function speak(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'kk-KZ'; u.rate = .9; const v = speechSynthesis.getVoices().find(v => /kk|kaz/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /ru/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) { toast('Бұл браузерде дауыстап оқу қолжетімсіз'); } }
function cloze(L) {
  return L.tf.filter(x => x[1]).concat(L.mc.map(m => [m[0].replace(/:$/, '') + ' – ' + m[1][m[2]], 1])).slice(0, 3).map(([s]) => {
    const w = s.replace(/[«»().,–:]/g, ' ').split(/\s+/).filter(x => x.length > 4).sort((a, b) => b.length - a.length)[0] || s.split(' ')[0];
    return { text: s.replace(w, '______'), word: w };
  });
}

function wordsearch(box, words, seed) {
  words = [...new Set(words)].slice(0, 7);
  if (words.length < 2) { box.innerHTML = '<p class="note">Сөздер жеткіліксіз, «Бөлім» не «Тоқсан» аумағын таңдаңыз.</p>'; return; }
  const N = 11, g = Array.from({ length: N }, () => Array(N).fill('')), r = rng(seed), placed = [];
  for (const w of words) {
    for (let t = 0; t < 120; t++) {

      let ok = true; for (let k = 0; k < w.length; k++) { const c = g[y + dir[0] * k][x + dir[1] * k]; if (c && c !== w[k]) { ok = false; break; } }
      if (!ok) continue; for (let k = 0; k < w.length; k++) g[y + dir[0] * k][x + dir[1] * k] = w[k];

  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!g[y][x]) g[y][x] = AB[Math.floor(r() * AB.length)];
  box.innerHTML = `<div class="tw"><div class="wordsearch" style="grid-template-columns:repeat(${N},28px)">${g.flatMap((row, y) => row.map((c, x) => `<span data-y="${y}" data-x="${x}">${c}</span>`)).join('')}</div></div><p>Табылды: <b id="fwc">0</b> / ${placed.length}. <span class="note">${placed.map(p => p.w).join(', ')}</span></p>`;
  let first = null, found = 0;
  $$('span[data-y]', box).forEach(s => s.onclick = () => {

function wordHTML(node) {
  const c = node.cloneNode(true);
  $$('.noprint,button,.note.noprint', c).forEach(e => e.remove());
  $$('.print-only', c).forEach(e => e.style.display = 'inline');
  $$('input', c).forEach(e => e.replaceWith(document.createTextNode(e.type === 'date' ? fmt(e.value) : (e.type === 'radio' ? '○' : e.value))));
  $$('a', c).forEach(a => { if (a.getAttribute('href').startsWith('#')) a.replaceWith(document.createTextNode(a.textContent)); });
  $$('table', c).forEach(t => { t.setAttribute('border', '1'); t.style.cssText = 'border-collapse:collapse;width:100%'; });
  $$('td,th', c).forEach(t => t.style.cssText = 'border:1px solid #000;padding:4px;vertical-align:top;color:#000;background:#fff');
  $$('.cue i', c).forEach(e => e.style.cssText = 'font-size:20pt;display:block');
  return `<html><head><meta charset="utf-8"></head><body style="font-family:'Times New Roman';font-size:14pt;color:#000">${c.innerHTML}</body></html>`;
}
async function copyNode(sel) {
  const node = $(sel); if (!node) return;
  const html = wordHTML(node), text = node.innerText;
  try {
    if (window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
    else await navigator.clipboard.writeText(text);
    toast('Көшірілді. Word-та альбомдық бетке қойыңыз (Ctrl+V), шрифт – Times New Roman 14.');
  } catch (e) {
    const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    toast('Мәтін белгіленді, Ctrl+C басып, Word-қа қойыңыз.');
  }
}

   <div class="actions"><button class="btn pri" type="button" id="sGo">Бастау</button></div>
   <div class="readout" id="sOut"></div>
   <p class="note">Көк – сау (ауруға бейім), қызыл – ауру, сұр – жазылған, жасыл – вакцина алған. Вакцинация үлесін өзгертіп, ұжымдық иммунитеттің әсерін бақылаңыз.</p></div></div>`,
  init() {
    const cv = $('#sc'), c = canvasFit(cv, 600, 320); let raf;
    const run = () => {
      cancelAnimationFrame(raf);
      const V = +$('#sV').value / 100, P = +$('#sP').value / 100, r = rng(Date.now() & 0xffff), N = 220;
      const A = Array.from({ length: N }, (_, k) => ({ x: r() * 600, y: r() * 320, vx: (r() - .5) * 2, vy: (r() - .5) * 2, s: k < 3 ? 'I' : r() < V ? 'V' : 'S', t: 0 }));

        const ill = A.filter(a => a.s === 'I').length, ever = A.filter(a => a.s === 'I' || a.s === 'R').length;
        $('#sOut').textContent = `Қазір ауырып жатқандар: ${ill}\nБарлығы ауырғандар: ${ever} / ${N} (${(ever / N * 100).toFixed(0)}%)\nВакцина алғандар: ${A.filter(a => a.s === 'V').length}`;
        if (ill > 0 && tick < 1800) raf = requestAnimationFrame(step);

  }

LAB.selection = {
  title: 'Қолдан сұрыптау: сиыр табынының сүт беруі (модель)',
  html: () => `<div class="lab-wrap"><div class="lab-stage"><canvas id="slc"></canvas></div><div class="ctrl">
   ${rangeC('slP', 'Көбейтуге іріктелетін ең жақсы үлес (%)', 5, 100, 5, 20)}${rangeC('slH', 'Тұқым қуалау коэффициенті h² (×100)', 10, 60, 5, 30)}${rangeC('slG', 'Ұрпақ саны', 1, 20, 1, 10)}
   <div class="readout" id="slOut"></div><p class="note">Сұрыптау реакциясы R = h² × S (S – іріктелгендер мен табын орташасының айырмасы).</p></div></div>`,
  init() {
    bindRange(['slP', 'slH', 'slG'], () => {
      const p = +$('#slP').value / 100, h = +$('#slH').value / 100, G = +$('#slG').value, sd = 3; let m = 15; const d = [[0, m]], ctrl = [[0, 15]];
      const i = p >= 1 ? 0 : Math.exp(-Math.pow(-Math.sqrt(2) * erfinv(2 * (1 - p) - 1), 2) / 2) / Math.sqrt(2 * Math.PI) / p;
      for (let g = 1; g <= G; g++) { m += h * i * sd; d.push([g, m]); ctrl.push([g, 15]); }
      lineChart($('#slc'), [{ data: d, color: cssv('--eosin'), label: 'Сұрыптаумен', dots: true }, { data: ctrl, color: cssv('--muted'), label: 'Сұрыптаусыз' }], { xl: 'ұрпақ', yl: 'л/тәулік', ymin: 10 });
      $('#slOut').textContent = `Бастапқы орташа: 15,0 л/тәулік\n${G} ұрпақтан кейін: ${m.toFixed(1)} л/тәулік\nБір ұрпақтағы өсім: ${(h * i * sd).toFixed(2)} л`;
    });
  }
};
function erfinv(x) { const a = .147, ln = Math.log(1 - x * x), t = 2 / (Math.PI * a) + ln / 2; return Math.sign(x) * Math.sqrt(Math.sqrt(t * t - ln / a) - t); }

  html: () => `<div class="lab-wrap"><div class="lab-stage"><canvas id="pgc"></canvas></div><div class="ctrl">
   ${rangeC('pgR', 'Өсу жылдамдығы r (×100)', 5, 80, 5, 30)}${rangeC('pgK', 'Орта сыйымдылығы K (дарақ)', 100, 2000, 100, 1000)}${rangeC('pgN', 'Бастапқы саны', 2, 100, 2, 10)}
   <div class="readout" id="pgOut"></div><p class="note">Экспоненциалды өсу – ресурс шексіз болғанда; логистикалық өсу – орта сыйымдылығы шектегенде (S-тәрізді қисық).</p></div></div>`,
  init() {
    bindRange(['pgR', 'pgK', 'pgN'], () => {
      const r = +$('#pgR').value / 100, K = +$('#pgK').value, N0 = +$('#pgN').value; const lg = [], ex = []; let n = N0, e = N0;
      for (let t = 0; t <= 40; t++) { lg.push([t, n]); if (e < K * 1.6) ex.push([t, e]); n += r * n * (1 - n / K); e *= 1 + r; }
      lineChart($('#pgc'), [{ data: lg, color: cssv('--ok'), label: 'Логистикалық' }, { data: ex, color: cssv('--eosin'), label: 'Экспоненциалды' }], { xl: 'уақыт (ұрпақ)', yl: 'дарақ саны', ymax: K * 1.6 });
      $('#pgOut').textContent = `40 ұрпақтан кейін: ${n.toFixed(0)} дарақ (K = ${K})\nЕң жылдам өсу N ≈ K/2 = ${K / 2} кезінде`;
    });
  }
};
LAB.predator = {
  title: '«Жыртқыш – жемтік» популяциялық моделі',
  html: () => `<div class="lab-wrap"><div class="lab-stage"><canvas id="prc"></canvas></div><div class="ctrl">
   ${rangeC('prA', 'Қоянның көбеюі (×100)', 20, 120, 5, 60)}${rangeC('prB', 'Аулау тиімділігі (×1000)', 5, 40, 1, 20)}${rangeC('prD', 'Сілеусіннің өлімі (×100)', 10, 100, 5, 40)}
   <div class="readout" id="prOut"></div><p class="note">Жемтік саны артқаннан кейін біраз кешігіп жыртқыш саны артады, сосын жемтік азаяды – тербелістер циклдік түрде қайталанады.</p></div></div>`,
  init() {
    bindRange(['prA', 'prB', 'prD'], () => {
      const a = +$('#prA').value / 100, b = +$('#prB').value / 1000, d = +$('#prD').value / 100, g = .01; let x = 40, y = 9; const X = [], Y = [], dt = .02;
      for (let k = 0; k <= 3000; k++) { if (k % 15 === 0) { X.push([k * dt, x]); Y.push([k * dt, y]); } const dx = a * x - b * x * y, dy = g * x * y - d * y; x = Math.max(.1, x + dx * dt); y = Math.max(.1, y + dy * dt); }
      lineChart($('#prc'), [{ data: X, color: cssv('--ok'), label: 'Қоян (жемтік)' }, { data: Y, color: cssv('--bad'), label: 'Сілеусін (жыртқыш)' }], { xl: 'уақыт (жыл)', yl: 'дарақ саны' });
      $('#prOut').textContent = `Қоянның ең көп саны: ${Math.max(...X.map(p => p[1])).toFixed(0)}\nСілеусіннің ең көп саны: ${Math.max(...Y.map(p => p[1])).toFixed(0)}`;
    });
  }
};

/* ---------- lab page ---------- */
const BOOK_LABS = Object.values(D.lessons).flatMap(L => (L.labs || []).map(l => [l, L]));
function engineFor(L) { if (L.lab === 'key' && !KEYS[L.n]) return 'sort'; if (L.lab === 'order' && !L.ord) return 'sort'; return LAB[L.lab] ? L.lab : 'sort'; }
function renderLab(i) {
  const L = getL(i), en = engineFor(L), E = LAB[en];
  return `<div class="sheet"><div class="lesson-head"><div><div class="eyebrow">Виртуалды зертхана · ${i + 1}-сабақ</div><h2>${esc(E.title)}</h2><p class="note">${esc(lessonLabel(i))}</p></div></div>
   ${E.html(L)}
   <div class="ext">${extLinks(L).filter(x => !/Wordwall|Quizizz|Өз видеоңыз/.test(x[0])).map(([t, u]) => link(t, u)).join('')}</div></div>
   <div class="sheet"><h3>Оқулықтағы 14 зертханалық жұмыс</h3><ul>${BOOK_LABS.map(([l, LL]) => { const si = SEQ.findIndex(s => s.ref === String(LL.n)); return `<li>№${l[0]}. ${inner('lab', si, l[1])} <span class="note">(§${LL.n}, ${l[2]}-бет)</span></li>`; }).join('')}</ul></div>`;
}
function afterLab(i) { const L = getL(i), en = engineFor(L); if (LAB[en].init) LAB[en].init(L); }

readHash(); render();

</script>
