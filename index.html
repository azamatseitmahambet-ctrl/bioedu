уарлар ағзасынан қандай заттар және қай мүшелер арқылы шығарылады? Олар қайдан алынады? Қандай үдерістер нәтижесінде түзіледі? Сүтқоректі жануарлардың бөліп шығару жүйесіне қандай мүшелер жатады? Нефрон дегеніміз не?","intro":"Бөліп шығару жүйесінің рөлі. Бөліп шығару мүшелері арқылы судың, тұздар мен құрамында азот бар зиянды заттардың артық мөлшері шығарылады. Құрамында азот бар қосылыстар нәруыздар толық ыдыраған кезде түзіледі. Оларға несепнәр (мочевина), аммиак, зәр қышқылы жатады. Бөліп шығарудың орталық мүшесі – бүйректер. Бүйректер – бұршақ пішінді жұп мүше. Олар бел бөлімінде омыртқа жотасының екі жағында орналасқан (63, 64-суреттер). Бүйректе 2 қабат болады: 1) сыртқы қоңыр қызыл – қыртысты қабаты; 2) ішкі ашық қоңыр – ми қабаты. 1 3 4 4 2 5 64-сурет. Бүйректің жарып көрсе тілгендегі құрылысы: 1 – қыртысты 63-сурет. Зәр шығару жүйесі: 1 – оң жақ бүйрек; зат; 2 – пирамидалар; 3 – бүйрек 2 – бүйрекүсті без","terms":["Бүйректер","Қыртысты қабат","Ми қабаты","Дәнекер ұл палы қабат: бірыңғай салалы бұлшық ет","Эпителий","Нефрон","Капсула","Ирек өзекше","Тоста ған ша","Астау","Пирамидалар","Реабсорбция","Бірінші жә не екінші реттік зәр"],"qs":{"Білу және түсіну":["«Нефрон, бірінші реттік және екінші реттік зәр» деген түсінікке анықтама беріңдер.","Ми және қыртысты қабат дегеніміз не? қолданылуы:","Нефрон бөліктері мен оның қызметі арасындағы байланысты анықтаңдар.","Адамның зәр шығару жүйесі неден тұрады?"],"Талдау":["Зәр түзілу кезеңдерін талдаңдар.","Нефрон капсуласында және ирек өзекшеде жүретін үдерістерді сызба түрінде бейнелеңдер.","Кестені толтырыңдар: Мүше Құрылысының ерекшеліктері Қызметі Бүйректер Несепнәр Қуық Зәр шығару түтігі"],"Синтез":["Бүйректің ми және қыртысты қабаты арасындағы айырмашылықтарын атаңдар.","Құрылысы мен оларда жүретін үдерістерді ескеріңдер.","Тостағанша, астау, несепағар, зәр шығару түтігі, қуықтың құрылысы мен рөлін бағалаңдар. Олардың ауа жолдарымен ұқсастығы бар ма? Жауаптарыңды негіздеңдер."],"Бағалау":["Қарапайымдардан бастап жануарлардың зәр шығару жүйесінің эволюциясы туралы реферат жазыңдар.","Бүйрек артериясының қанына зиянды заттардың (несепнәр) түсуінен бастап жүретін үдерістер мен құрылымдарды дұрыс ретпен орналастырыңдар.","Адам ағзасы үшін зәр шығару маңызын түсіндіріңдер."]},"gl":[["Капиллярлар","мүшелер мен ұлпаларға енетін ұсақ тамырлар."],["Артерия","қанды жүректен алып шығып, дене мүшелеріне тарататын тасымалдаушы ірі қан тамыры; оттегімен байытылған қанды жүректен ішкі мүшелерге тасымалдайтын қан тамырлары."],["Рецепторлар","сыртқы және ішкі ортадан тітіркендіргіштерді қабылдайтын және жүйке жүйесінің ерекше белсенділігіне түрлендіретін арнайы сезімтал түзілістер."]],"labs":[],"bjb":false,"c":["🫘 Бүйрек","💧 Су","🚽 Қуық","🧪 Зәр"],"cs":["Ыстық күні Әли футбол ойнап, көп терледі, бірақ су аз ішті. Кешке оның зәрі аз және қою түсті болды.","Зәр неге аз және қою болды?","Бүйрек ағзадағы су балансын қалай реттейді?","Бүйректі сақтаудың 2 ережесін жаз."],"tb":["Зәр шығару жүйесінің мүшелері",["Мүше","Құрылысы","Қызметі"],["Бүйрек","Несепағар","Қуық","Несепшығарғыш өзек"]],"mc":[["Бүйректің құрылымдық-қызметтік бірлігі:",["Нефрон","Нейрон","Альвеола","Бүр"],0],["Бірінші реттік зәр түзілетін бөлім:",["Нефрон капсуласы (шумақ)","Несепағар","Қуық","Бүйрек түбекшесі"],0],["Тәулігіне түзілетін соңғы зәр шамамен:",["1,5 л","150 л","15 л","0,1 л"],0]],"tf":[["Бүйректе қан сүзіледі",1],["Соңғы зәрде қалыпты жағдайда глюкоза көп болады",0],["Бүйрек – жұп мүше",1]],"gr":["тарсия","Зәр шығару жүйесінің мүшелерін тарсиядан құрастырыңдар","Нефронның бөліктерін тарсиядан құрастырыңдар","Бірінші реттік және соңғы зәрді салыстыратын тарсия құрастырыңдар"],"lab":"order","ord":["Зәрдің түзілуі мен шығарылуы",["Бүйрек артериясы","Капилляр шумағы (сүзілу)","Нефрон капсуласы (бірінші реттік зәр)","Иректелген өзекшелер (кері сіңу)","Жинағыш түтікше (соңғы зәр)","Бүйрек түбекшесі","Несепағар","Қуық"]]},"29":{"n":29,"kind":"p","title":"Терінің құрылысы мен қызметі, оның маңызы","page":122,"sec":7,"cod ["8.1.5.4"],"goal":"Тері ауруларының алдын алу шараларын түсіндіру","recall":"Тері аурулары, олардың сипаттамасы. Тері үнемі ауру тудыратын микроағзалар және басқа қолайсыз сыртқы әсерлерге ұшырап отырады. Барлық тері жұқпаларын үлкен 3 топқа бөлуге болады: бактериялық, патогенді саңырауқұлақтар және паразит жануарлар тудыратын аурулар. Тері жұқпаларының қауіптілігі: қоздырушылар тері арқылы өтіп қан тамырлары мен лимфа тамырларына енуі мүмкін. Қанға өткен жұқпалар жылдам көбейіп, тереңде орналасқан ұлпалар мен мүшелерді, сүйек пен бұлшық еттерді зақымдайды. Сондықтан тері жұқпасы байқалған кезде тез дерматолог дәрігерге қаралу керек. Терінің кең таралған саңырауқұлақ тудыратын ауруларының бірі – теміреткі (стригущий лишай). Ол теріні, шаш пен тырнақты зақымдайды. Теміреткі пайда болған жерде шаш түсіп қалады. Тері толық тықырланады. Саңырауқұлақты жұқтыру көзіне өсімдіктер, жануарлар, ауру адамдар мен олардың пайдаланған заттары болуы мүм кін. Сондықтан басқа адамның тарағын, жекебас гигиенасы заттарын пайдалануға, киімі мен аяқкиімін киюге болмайды. Малшаруашылығы және үй жануарларын күту кезінде гигиена ережелерін қатаң сақтау керек. Тағы бір тері ауруы – қышыма қотыр (чесотка). Бұл ауруды өте ұсақ (ұлғайтқыш құралсыз көруге болмайды) қышыма қотыр кенесі тудырады. Кене саусақ арасында, аяқ және қолдың буын бүгілістеріндегі тері астында болуы мүмкін. Ауру белгілері – аталған жерде тоқтаусыз қышу пайда болады. Қышыма қотыр ауру адамнан тұрмыстық заттар, есік тұтқасы, қол алысып амандасқан кезде және т.б. жағдайда жұғатын жұқпалы ауру болып табылады. Қышыма қотырдың алдын алудың бастапқы шарасы – гигиена сақтау, аурудың алғашқы белгілері байқалған кезде дәрігерге қаралу керек. Ауру қоздырушылары ауада және заттардың бетінде ұзақ уақыт тіршілік етеді. Сондықтан үй-жайды зарарсыздандыратын сұйықтық (мысалы, хлораминді) қолданып, заттардың беткі жағын, есіктің тұт қаларын, еденді ылғал шүберекпен сүрту қажет. Тері зақымданған кезде кесілген жерді және басқа жараларды антисептикалық заттармен өңдеу керек. Жұқпаның кейбір қоздырушылары ауруды дамытпай, теріде (сілемейлі қабықта, тісте) ұзақ уақыт тіршілік етуі мүмкін. Егер ағза","intro":"әлсіресе, оның қорғаныш күші төмендейді. Осы кезде қоздырушылар агрессиялық кезге өтіп, ауру дамуы мүмкін. Яғни жекебас гигиенасынан басқа жалпы ағза саулығын сақтау керек. Иммунитеттің әлсіреуіне қандай да бір аурумен ауру, авитаминоз, антибиотиктерді бақылаусыз қабылдау себеп болуы мүмкін. Иммунитетті жалпы нығайту, дұрыс тамақтану, жекебас гигиенасы ережелерін сақтау – тері жұқпаларының алдын алу шарасы болып табылады. Безеу бөртпелері – терінің сыртқы (бактериялық), ішкі (зат алмасу, гормондық) себептен зақымдануы. Безеу бөртпелерімен күресудің медициналық емес әдісі – теріні таза ұстау. Тері саңылауы шаң-тозаң бөлшектерімен бекітіліп қалмауы керек, ал май бездерінің түзінділері (секрет)","terms":["Бактериялық","Саңырауқұлақ және паразит жануарлар тудыратын аурулар","Теміреткі","Қышыма қотыр","Безеу бөртпесі","А дәрумені","Дерматолог"],"qs":{"Білу және түсіну":["«Тері гигиенасы» деген түсініктің мағынасын айтыңдар.","Саңырауқұлақ тудыратын аурулар дегеніміз не? Олар қандай болады?","Неліктен тері аурулары қауіпті екенін түсіндіріңдер. қолданылуы:","Өсіп кеткен тырнақ не үшін қауіпті екенін мысалдар келтіріп дәлелдеңдер."],"Талдау":["Тері ауруларының белгілерін талдаңдар. Ауру және оны қоздырушылар арасындағы байланысты анықтаңдар.","Адамның терісінде өзіне тән түсі бар жарық (проплешины) пайда болды. Бұл жараны қандай паразит ағза тудырады?","Адамның саусақтарының арасы басылмай қышиды. Бұл ауруды қандай паразит тудырады?","Тері ауруларының пайда болу себептері мен жұғу жолдарын сызба түрінде бейнелеңдер. Сонымен қатар алдын алу шараларын көрсетіңдер."],"Синтез":["Терісінде көптеген жарықтары (проплешины) бар сиырды күтетін адамға қандай ауру жұғуы мүмкін?","Ауру қоздырушыларының жүйедегі орындарын критерий бойынша жүйелеңдер. Олар терінің қандай жұқпалы ауруларын келтіріп шығарады және олармен  шамалы қозғалмалы буындарды атаңдар. Мысалдар келтіріп, түсіндіріңдер.","Жартылай буын қандай сүйектерге бекитінін айтып, мысал келтіріңдер."],"Бағалау":["«Буындардың әртүрлі типтерінің құрылысы, орналасуы және қызметі» деген тақырыпқа реферат жазыңдар.","Мынадай құбылыстың маңызын бағалаңдар: буынның қандай типі кезінде үш бағытта қозғалыс жасауға болады? Оларды атаңдар."]},"gl":[["Шеміршек","тірек-механикалық қызмет атқаратын дәнекер ұлпаның бір түрі."],["Сіңір","қаңқа сүйектерін немесе жеке мүшелерді байланыстыратын тығыз, дәнекер ұлпалы желі және пластиналар."]],"labs":[],"bjb":false,"c":["🦵 Тізе","⚙️ Топса","🔩 Шар","🏀 Секіру"],"cs":["Баскетболшы секіріп түскенде тізесі қатты ауырып, ісініп кетті. Дәрігер буын байламы созылғанын айтты.","Буынның қандай бөлігі зақымданды?","Алғашқы көмектің 3 қадамын жаз.","Буын сұйықтығының маңызы неде?"],"tb":["Буын түрлері",["Буын пішіні","Қозғалыс осі","Мысал"],["Шар тәрізді","Топса тәрізді","Ер тәрізді","Жалпақ"]],"mc":[["Буын қуысындағы сұйықтықтың қызметі:",["Үйкелісті азайту","Қан түзу","Сүйекті өсіру","Қорғау"],0],["Иық буыны пішіні бойынша:",["Шар тәрізді","Топса тәрізді","Жалпақ","Цилиндр"],0],["Буынның шығуы дегеніміз:",["Сүйектің сынуы","Буын беттерінің орнынан ығысуы","Бұлшық еттің созылуы","Тері жарақаты"],1]],"tf":[["Буын беті шеміршекпен қапталған",1],["Буын шыққанда оны өз бетімен орнына салу керек",0],["Тізе буыны – топса тәрізді",1]],"gr":["модель","Шар тәрізді буынның моделін (пластилин, шар) жасаңдар","Топса тәрізді буынның моделін жасаңдар","Буынның құрылысын (капсула, шеміршек, сұйықтық) модельде көрсетіңдер"],"lab":"lever"},"35":{"n":35,"kind":"p","title":"Бұлшық ет ұлпаларының құрылысы мен қызметі. Адам денесінің бұлшық еттерін жіктеу","page":143,"sec":8,"codes":["8.1.6.5","8.1.6.6"],"goal":"Бұлшық ет ұлпасының түрлері мен қызметтерін сипаттау. Адам бұлшық еттерінің топтарын және талшықтарының құрылысын зерттеу","recall":"Адамның бұлшық ет ұлпасы туралы не білесіңдер? Барлық қуыс ішкі мүшелердің екінші қабаты неден түзілген? Миокард дегеніміз не?","intro":"Бұлшық еттің маңызы. Бұлшық ет – әртүрлі қозғалысқа жауап беретін тірек-қимыл жүйесінің бөлімі. Адам ағзасында 600-ден астам бұлшық ет бар. Дененің тепе-теңдігін бұлшық еттер қамтамасыз етеді. Көкет (төс және құрсақ қуысын бөліп тұрады) және қабырғааралық бұлшық еттер тыныс алу үдерістеріне қатысады. Жұту, дыбыс түзілу, көз алмасының қимылдауы, қозғалу белсенділігінің барлық типтері бұлшық еттер арқылы жүзеге асады. Қаңқамен бірге бұлшық еттер ағзаға пішін береді, дененің кеңістіктегі тік қалпын қамтамасыз етеді. Бұлшық ет ұлпасының сипаттамасы. Бұлшық еттер бұлшық ет жасушаларынан – миоциттерден түзіледі. Құрылысы бойынша олар бірыңғай салалы және көлденең жолақты (қаңқа және жүрек) бұлшық ","terms":["Бұлшық ет","Диафрагма","Миоциттер","Бірыңғай салалы бұлшық ет","Көлденең жолақты қаңқа бұлшық еті","Жүрек бұлшық еті","Қаңқа бұлшық еті","Шеңберлі бұлшық ет","Тіл бұлшық еті","Мимикалық бұлшық еті","Бұлшық ет талшығы","Шандыр","Сіңір","Антагонист-бұлшық ет","Бүгу бұлшық еті","Жазу бұлшық еті","Жиырылғыштық."],"qs":{"Білу және түсіну":["Қандай бұлшық ет жасушаларын микроскопсыз көруге болады? Анықтама беріңдер.","Адам ағзасында қанша бұлшық ет бар екенін атаңдар.","«Миоцит, бұлшық ет талшығы, бірыңғай салалы бұлшық ет, көлденең жолақты бұлшық ет ұлпасы» деген түсініктерді қалай салыстыруға болады? қолданылуы:","Шандыр мен сіңір арасындағы байланысты анықтаңдар. Олардың қызметін сипаттаңдар."],"Талдау":["Пікірлеріңді айтыңдар: «Жұмыстың ешбір түрінен қорықпайтын бала 30 минутта 50 см жерді қазды. Ал компьютерде ойнағанды ұнататын бала осы жұмысты 1 сағат бойы орындады».","Қаңқа бұлшық еті құрамына кіретін бөліктер және олардың қызметі өзара қалай байланысты екенін мысалдар келтіріп дәлелдеңдер. Бұлшық еттер сүйектерге қалай бекиді?"],"Синтез":["Бұлшық еттер бүгуді және жазуды қамтамасыз ете ала ма? Мысалдар келтіріп, дәлелдеңдер.","Мынадай критерийлер: орналасуы, жасушаларының құрылысы, қозғалу сипаты бойынша бұлшық еттерді сипаттаңдар."],"Бағалау":["Қаңқа бұлшық ет құрамына кіретін әрбір құрылым және жасуша ішіндегі микроскопиялық құрылым рөлін бағалаңдар."],"Пікірталас":["Ішекқуыстылардан бастап адамға дейін бұлшық ет жүйесі эволюциясына қандай факторлар себепші болғанын талдаңдар. №10 зертханалық жұмыс. Бұлшық ет ұлпасының құрылысын зерттеу. 255-бетті қара."]},"gl":[["Жүрек бұлшық еті","миокард."],["Шандыр, фасция","ішкі мүшелер мен бұлшық еттерді жабатын дәнекер ұлпалы қабықша."],["Сіңір","қаңқа сүйектерін немесе жеке мүшелерді байланыстыратын тығыз, дәнекер ұлпалы желі және пластиналар."]],"labs":[[10,"Бұлшық ет ұлпасының құрылысын зерттеу",255]],"bjb":false,"c":["💪 Бицепс","❤️ Жүрек еті","🔬 Миофибрилла","🏋️ Жаттығу"],"cs":["Зертханада үш бұлшық ет ұлпасының препараты берілді: біріншісінде көлденең жолақты көп ядролы талшықтар, екіншісінде ұршық тәрізді жасушалар, үшіншісінде тармақталған жолақты жасушалар бар.","Әр препарат қай бұлшық ет ұлпасына жатады?","Олар ағзаның қай мүшелерінде кездеседі?","Қай ұлпа адамның еркіне бағынады?"],"tb":["Бұлшық ет ұлпаларының түрлері",["Ұлпа","Жасуша пішіні","Ерікке бағынуы","Орналасуы"],["Көлденең жолақты қаңқа еті","Жүрек еті","Бірыңғай салалы","Жаттығудың әсері"]],"mc":[["Ішкі мүшелер қабырғасындағы бұлшық ет:",["Бірыңғай салалы","Көлденең жолақты","Жүрек","Қаңқа"],0],["Қолды бүгетін бұлшық ет:",["Екібасты (бицепс)","Үшбасты (трицепс)","Дельта тәрізді","Көкірек"],0],["Бұлшық еттің жиырылуын қамтамасыз ететін нәруыздар:",["Актин мен миозин","Гемоглобин мен инсулин","Кератин мен коллаген","Амилаза мен пепсин"],0]],"tf":[["Жүрек еті автоматизмге ие",1],["Бірыңғай салалы ет адам еркіне бағынады",0],["Бицепс пен трицепс – антагонист бұлшық еттер",1]],"gr":["инфографика","Бас пен мойын бұлшық еттерін инфографикада көрсетіңдер","Дене бұлшық еттерін инфографикада көрсетіңдер","Аяқ-қол бұлшық еттерін және олардың жұмысын инфографикада көрсетіңдер"],"lab":"micro"},"36":{"n":36,"kind":"p","title":"Гиподинамия. Сымбаттың бұзылуы және жалпақтабандылықтың пайда болу себептері. Олардың алдын алу шаралары","page":148,"sec":8,"codes":["8.1.6.7","8.1.6.8"],"goal":"Гиподинамия салдарын атау. Сымбаттың бұзылуы және жалпақтабандылықтың пайда болу себептерін анықтау","recall":"ДДҰ мәліметтері бойынша адам өліміне себеп болатын аурулардың ішінде қай жүйке аурулары алдыңғы орында тұр?","intro":"Гиподинамия – аз қозғалу. Қазіргі кезде көптеген жұмыс түрлері механикаландырылғандықтан, адамзат гипокинезияға (грек, гипо – қалыптан төмен; динамис – күш) тап болды. Бұл аз қозғалудың ауру күйі. Бұлшық ет белсенділігінің төмендеуі салдарынан жүрек, өкпе, қан тамырлары әлсіз және кез келген психикалық немесе дене жүктемесіне төзімсіз болады. ДДҰ (Дүниежүзілік денсаулық сақтау ұйымы) мәліметтері бойынша өлім-жітімге көп жағдайда жүрек-қан тамырлары аурулары (инфаркт және инсульт) басты себеп болып табылады. Спортпен шұғылданған адамдарда жаттықпаған адамдармен салыстырғанда инфаркт ауруы сирек болады. Яғни дене жүктемесі, жүрек-қан тамырлары, тыныс алу, жүйке және иммундық жүйелерге жағымды ","terms":["Гиподинамия","Гипокинезия","Жалпақтабандылық"],"qs":{"Білу және түсіну":["Табан қан тамырларының қысылуы мен өкшенің ауруы не себептен болатынын түсіндіріңдер.","Енжар өмір сүру салты бірінші кезекте қандай мүшелерге қауіпті екенін түсіндіріңдер."],"Қолданылуы":["Сіңірдің созылғыштығы, бұлшық еттің дамуы, сүйектердің беріктігі, жоғары зат алмасу, ӨТС-тің артуы, қан айналымның жақсаруының себептерін айтыңдар.","Дұрыс сымбатты қалай қалыптастыруға және сақтауға болатынын сипаттаңдар."],"Талдау":["Спарталықтар не себепті ұлы жауынгер болғаны туралы пікірлеріңді айтыңдар.","Белсенді өмір сүру салтының маңызды екенін мысалдар келтіріп көрсетіңдер. Қан тамырлары тарылғанда және атрофия (сему) кезінде қандай аурулар пайда болуы мүмкін?"],"Синтез":["Денешынықтыру жаттығулары денсаулықты нығайтуға көмектеседі деп есептеген ежелгі грек ғалымын атаңдар. Талқылаңдар.","Омыртқа жотасының қисаюын қандай ауруға жатқызуға болатынына жалпы сипаттама беріңдер."],"Бағалау":["Спортпен шұғылданатын адамдарда жүрек-қан тамырлары ауру ларының даму қаупі қаншалықты төмен болатынын бағалаңдар.","Денешынықтыру белсенділігінің пайдалылығы туралы қысқаша баян дама дайындаңдар."],"Пікірталас":["Әрбір адам үшін денешынықтыру неліктен маңызды екенін талқылаңдар."]},"gl":[["Гиподинамия","қимыл-қозғалыс белсенділігінің шектелуі, бұлшық еттің жиырылу күшінің төмендеуі кезінде ағза қызметінің (тірек-қимыл аппараты, қан айналым, тыныс алу, асқорыту) бұзылуы."],["Табан","аяқтың төменгі бөлімі."],["Инфаркт","түйілу, тромбоз және т.б. (бүйрек, миокард инфарктісі және т.б.) кезінде ұлпаларда қанмен қамтамасыз етудің бұзылу салдарынан жансыздану аймағы. Иридодиагностика (грек. иридос – кемпірқосақ) – көзінің нұрлы қабығының күйі бойынша адамның ауруын анықтау."]],"labs":[],"bjb":false,"c":["🛋️ Диван","📱 Телефон","🦶 Табан","🧍 Сымбат"],"cs":["8-сынып оқушысы күніне 6–7 сағат телефонға еңкейіп отырады, спортпен айналыспайды. Соңғы кезде арқасы ауырып, иықтары алға түсіңкі болып жүр.","Оқушыда қандай мәселе қалыптасып жатыр?","Гиподинамияның ағзаға 3 салдарын жаз.","Сымбатты түзеуге арналған күнделікті 3 жаттығу ұсын."],"tb":["Тірек-қимыл жүйесінің бұзылыстары",["Бұзылыс","Себебі","Салдары","Алдын алу"],["Гиподинамия","Сколиоз","Жалпақтабандылық","Кифоз"]],"mc":[["Омыртқа жотасының бүйірге қисаюы:",["Сколиоз","Лордоз","Кифоз","Остеохондроз"],0],["Гиподинамия дегеніміз:",["Қозғалыстың жетіспеуі","Артық қозғалыс","Тамақтанбау","Ұйқысыздық"],0],["Жалпақтабандылықтың алдын алу:",["Тар аяқкиім","Жалаң аяқ құмда, тасты жерде жүру","Көп отыру","Биік өкше"],1]],"tf":[["Дұрыс сымбат ішкі мүшелердің жұмысына әсер етеді",1],["Гиподинамия бұлшық етті нығайтады",0],["Табан күмбезі қозғалысты жұмсартады",1]],"gr":["рөлдік ойын","«Мектеп дәрігері» ретінде сыныптастардың сымбатын тексеру алгоритмін ұсыныңдар","«Фитнес-жаттықтырушы» ретінде 5 минуттық сымбат жаттығуын жасап көрсетіңдер","«Әлеуметтік жарнама» – гиподинамияға қарсы бейнеролик сценарийін жазыңдар"],"lab":"sort","srt":["Бұзылыс және оның белгісі",{"Сколиоз":"Омыртқаның бүйірге қисаюы","Кифоз":"Кеуде бөлімінің артқа шамадан тыс иілуі (бүкірлік)","Лордоз":"Бел бөлімінің алға шамадан тыс иілуі","Жалпақтабандылық":"Табан күмбезінің төмендеуі","Гиподинамия":"Қозғалыс белсенділігінің төмендеуі"}]},"37":{"n":37,"kind":"p","title":"Тік жүруге байланысты адам қозғалуының биомеханикалық ерекшеліктері","page":152,"sec":8,"codes":["8.4.4.1"],"goal":"Тік жүруге байланысты адам қозғалуының биомеханикалық ерекшеліктерін зерттеу","recall":"Приматтар – горилла мен шимпанзенің қалай жүретінін көрдіңдер ме? Адам және жануар қаңқасының қандай ұқсастықтары мен айырмашылықтары бар?","intro":"Адамның тірек-қимыл жүйесінің жоғары сатыдағы приматтардан айырмашылығы. Адам және жоғары сатыдағы адам тәрізді маймылдар дың (горилла, шимпанзе, орангутанг) қаңқасы мен бұлшық еттері ұқсас болып келеді. Олардың жалпы ұқсастықтарын атап өтейік. Адам және приматтардың жалпы ұқсастықтары: 1. Сүйектердің типтері және олардың байланысу типтерінің ұқсастығы. 2. Қаңқаның бірдей бөлімдері және сәйкес келетін сүйектер. 3. Сүйектердің химиялық құрамының ұқсастығы. 4. Бұлшық ет ұлпасы жасушалары құрылысының ұқсастығы. Адамның тірек-қимыл жүйесінің приматтардан айырмашылығын қарастырайық. 1. Омыртқа жотасы S-тәрізді пішінді 4 иілімнің болуы, екеуі алға, екеуі артқа қарай иілген. Мұндай форма тік жүктем","terms":["Примат","Горилла","Шимпанзе","S-тәрізді пішінді омыртқа жотасы"],"qs":{"Білу және түсіну":["Қандай эволюциялық өзгерістерге байланысты адам сөйлеуді үйренгенін түсіндіріңдер.","Адам және приматтардың тірек-қимыл жүйесінің ұқсастықтары мен айырмашылықтарын атаңдар. қолданылуы:","Тамақты отта пісіру қандай өзгерістер тудырғанын сипаттаңдар.","Тік жүру мен тірек-қимыл жүйесіндегі өзгерістер арасындағы байланысты анықтаңдар."],"Талдау":["Адамда табан күмбезінің қалыптасу себептері туралы пікірлеріңді айтыңдар. Ол не үшін керек?","Адам білезігінің приматтардың білезігінен қандай айырмашылықтары бар? Мысалдар келтіріп, дәлелдеңдер."],"Синтез":["Адамдарда пайда болған тірек-қимыл жүйесіндегі өзгерістерді приматтарға қатысты критерий бойынша жүйелеңдер.","S-тәрізді пішінді омыртқа жотасының рөлін бағалаңдар."],"Бағалау":["Приматтарға қарағанда адамдарда мимика не себепті дамыған? Пікірлеріңді айтыңдар."],"Пікірталас":["Адамда болашақта тірек-қимыл жүйесі қалай өзгеруі мүмкін екенін талқылаңдар. Оған қандай факторлар әсер етуі мүмкін? 9-бөлім. Координация және реттелу"]},"gl":[["Бас сүйек","бас қаңқасы."],["Табан","аяқтың төменгі бөлімі."]],"labs":[],"bjb":true,"c":["🚶 Жүріс","🦍 Маймыл","⚖️ Тепе-теңдік","🦶 Табан"],"cs":["Шимпанзе қысқа уақыт екі аяқпен жүре алады, бірақ тез шаршайды. Адам күніне 10 000 қадам жүре алады.","Тік жүруге байланысты адам қаңқасында қандай 3 ерекшелік пайда болды?","Табан күмбезі мен омыртқа иіндерінің биомеханикалық рөлін түсіндір.","Адам денесінің ауырлық центрі қайда орналасқан?"],"tb":["Адам мен маймыл қаңқасының ерекшеліктері",["Белгі","Адам","Маймыл"],["Омыртқа жотасы","Жамбас","Табан","Кеуде қуысы"]],"mc":[["Тік жүруге бейімделу белгісі:",["S-тәрізді омыртқа жотасы","Ұзын қол","Түзу табан","Жалпақ жамбас жоқ"],0],["Адам кеуде қуысы:",["Алдыңғы-артқы бағытта қысыңқы","Бүйірінен қысыңқы","Шар тәрізді","Конус тәрізді ғана"],0],["Жүрген кезде соққыны жұмсартатын:",["Табан күмбезі","Бас сүйек","Бұғана","Жауырын"],0]],"tf":[["Адамның жамбасы тостаған тәрізді кең",1],["Маймылдың омыртқасында 4 иін бар",0],["Аяқ сүйектері қол сүйектерінен массивті",1]],"gr":["зерттеу","Топ мүшелерінің қадам ұзындығын өлшеп, бойымен салыстырыңдар","Бір аяқпен тұрып тепе-теңдік уақытын өлшеңдер (көз ашық/жұмулы)","Иін тіректерін (рычаг) адам денесінен тауып, мысал келтіріңдер"],"lab":"lever"},"38":{"n":38,"kind":"p","title":"Көру мүшесінің құрылысы мен гигиенасы","page":155,"sec":9,"codes":["8.1.7.1"],"goal":"Көруді қабылдаудың ерекшеліктерін зерттеу және көру гигиенасының ережесін сипаттау","recall":"7-сынып оқулығындағы материалды (§38) еске түсіріп, мынадай сұраққа жауап беріңдер: «Көру орталығы мен тері-бұлшық ет сезімталдығы үлкен ми сыңарларының қандай бөлімінде орналасқан?»","intro":"Адам қоршаған ортаны сезім мүшелері арқылы қабылдайды. Олар: көру, есту, иіс сезу, дәм сезу және сипап сезу. Адам үшін негізгі сезім мүшесіне көру жатады. Қоршаған әлем туралы ақпараттардың басым бөлігін көру арқылы қабылдаймыз. Екінші орында есту мүшесі тұрады. Есту арқылы ақпараттың 1/3-ін алсақ та, есту мүшесінің рөлі зор. Адам үшін басқа сезім мүшелері де маңызды болып табылады. Көздің құрылысы. Оның сезімтал жасушалары – фоторецепторлар. Ол заттардан шағылысқан жарықты қабылдайды. Көздің құрамына қосымша бөліктері: қабақ, қас, кірпік, жас безі, көз бұлшық еттері, көз немесе көз алмасы кіреді (88-сурет). Көз алмасы үш қабық пен «оптикалық жүйеден» тұрады. Оптика деп жарықты өткізетін жән","terms":["Және көру гигиенасының басқа да бұзылуы кезінде пайда болады. Ол кезде алыстағы заттар бұлыңғыр болып көрінеді. Жас өскен сайын көру қабілеті өзгереді. 45–50 жастан кейін көзбұршақ эластикалығының азаюы салдарынан жақыннан көру қабілеті нашарлайды (90","Ғ-сурет). Бұл кезде сәулелер тор қабықтың сыртында шоғырланады. Алыстан көргіш адамға жақында тұрған заттар бұлыңғыр болып көрінеді. Аккомодация бұзылған кезде линзасы әртүрлі көзәйнек қолда нылады. Жақыннан көргіштік кезінде бейнелер торлы қабықта емес","Оның алдында қалыптасады. Сондықтан екі жағы ойыс шашырататын линза (кө зәйнек) қажет. Алыстан көргіштік кезінде бейне тор қабықтың сыртында қалыптасады. Сон дық тан екі жағы дөңес жинақтаушы линза керек. Дальтонизм – түсті ажырата алмау – тұқым қуалайтын ауру. Көбінесе ондай адам қызыл және жасыл түсті","Кейде жеке түстердің реңдерін ажырата алмайды. Конъюктивит – көздің кең таралған жұқпалы ауруы. Бұл сілемейлі қабықтың – қасаң қабықтың жоғары қабатының бактериялық қабынуы. Конъюктивитке жұқпадан басқа көздің ластануы: оған шаң-тозаңның","Құмның","Қоқымның және т.б. түсуі де себеп болады. Көру гигиенасы. Көздің көру қабілетін сақтау: • көзді бөгде денелердің түсуінен","Зақымданудан қорғау керек","• жарық режімін реттеу: жарық жарқыраған немесе көмескі болмауы тиіс","• оқу және жазу кезінде жарық сол жақтан түсуі керек","• кітап пен көз арақашықтығы 30–35 см болуы тиіс","• теледидарды көру ұзақтығы 2","5–3 сағат","Ал оған дейінгі қашықтық 3 м-ден кем болмауы керек","• А дәруменіне бай тағамдарды пайдалану","• ақыл-ой еңбегі мен дене еңбегін кезектестіре шұғылданған жөн","• темекі тарту және алкогольді ішімдік ішу зиянды әсер етеді","• жатып немесе көлікте кітап оқуға болмайды","• Көзге қышқыл","Сілті және бөгде зат түскен жағдайда оны сыртқы жа ғынан ішке қарай жуыңдар. Көзді таза әрі жұмсақ орамалмен (сүлгімен) сүрту керек. Фоторецепторлар","Көз алмасы","Қасаң қабық","Тор қабық","Ақ қабық","Тамырлы қабық","Алдыңғы камера","Көзбұршақ","Шыны тәрізді дене","Соқыр дақ","Сары дақ","Көру жүйкесі","Конъюктивит","Дальтонизм","Аккомодация","Жақыннан көргіштік","Алыстан көргіштік"],"qs":{"Білу және түсіну":["«Рецептор» деген түсінікке анықтама беріңдер. Сезім мүшелерінде олардың қанша типі орналасқан?","Көз қабықтарын және олардың бөліктерін атаңдар.","Көру мүшесінің «қосымша бөліктері» деген сөз тіркесін қалай түсінесіңдер? қолданылуы:","Көруді сақтауға мүмкіндік беретін ережелерді атаңдар."],"Талдау":["Көз құрылымдары арқылы жарық сәулелерінің өту кезеңдерін талдаңдар.","88-суретті қараңдар және көз алмасы құрылымының орналасуын түсіндіріңдер."],"Синтез":["Талқылаңдар: эволюция барысында көзбұршағы қалыптаспаған ағзалардың жарық пен қараңғылықты ажырата алуын, бірақ заттарды көрмеуін талдаңдар.","Көздің әрбір оптикалық жүйесінің құрылысы мен қызметі арасындағы өзара байланысты анықтаңдар. Мәліметтерді кесте түрінде рәсімдеуге болады."],"Бағалау":["Заттардан жарықтың шағылысуынан бастап, көрген бейнені сезінумен аяқтап, көру қабылдауы кезінде жүретін үдерістерді дұрыс ретпен орналастырыңдар."],"Пікірталас":["«Көру қабілетін өмір бойы сақтауға болады» деген резолюция бойынша сыныпта дебат ұйымдастырыңдар. №11 зертханалық жұмыс. Көру қабілетін зерттеу. 256-бетті қара."]},"gl":[["Соқыр дақ","көру жүйкесінің көздің торлы қабығынан шығатын орны, оның түбінде орналасқан."],["Сары дақ","фоторецепторлардың барынша көп шоғырланған және көздің тор қабығындағы көру жітілігі ең жоғары аймағы."],["Конъюктива, көздің шырышты қабығы","көздің дәнекер ұлпалы, мөлдір, шырышты қабықшасы."],["Дальтонизм","туа біткен түсті айыра алмау, негізінен, қызыл және жасыл түсті айыра алмау қабілеті."],["Нұрлы қабық","ортасында қарашық тесігі бар көздің жұқа, қозғалмалы диафрагмасы."],["Қарашық","көзге жарық сәулесі енетін нұрлы қабықтағы тесік."],["Гигиена","өмір сүру және еңбек жағдайының адамның денсаулығына әсерін зерттейтін, аурулардың алдын алу, денсаулық сақтау және өмір сүру жасын ұзарту шараларын жасаумен айналысатын медицина саласы."],["Конъюктивит, көз қарығуы","конъюктиваның қабынуы."]],"labs":[[11,"Көру қабілетін зерттеу",256]],"bjb":false,"c":["👁️ Көз","👓 Көзілдірік","💡 Жарық","📖 Кітап"],"cs":["Әсем сабақта тақтадағы жазуды анық көрмей, көзін қысып қарайды, ал кітапты жақыннан жақсы оқиды.","Әсемде қандай көру ақауы бар?","Бұл жағдайда кескін тордың қай жерінде түзіледі?","Оған қандай линзалы көзілдірік керек? Көз гигиенасына 2 кеңес бер."],"tb":["Көздің құрылысы",["Бөлігі","Құрылысы","Қызметі"],["Қасаң қабық","Нұрлы қабық және қарашық","Көз бұршағы","Торлы қабық"]],"mc":[["Алыстан көрмеушілік (миопия) кезінде кескін түзіледі:",["Тордың алдында","Тордың артында","Торда","Соқыр дақта"],0],["Көзге түсетін жарық мөлшерін реттейтін:",["Қарашық","Көз бұршағы","Шыны тәрізді дене","Склера"],0],["Соқыр дақта:",["Рецепторлар жоқ","Тек құтышалар бар","Тек таяқшалар бар","Қан тамырлары жоқ"],0]],"tf":[["Миопияда шашыратқыш (ойыс) линза қолданылады",1],["Сары дақта рецепторлар болмайды",0],["Кітапты көзден 30–35 см қашықтықта ұстау керек",1]],"gr":["тарсия","Көз алмасының құрылысын тарсиядан құрастырыңдар","Жарық сәулесінің көздегі жолын тарсиядан құрастырыңдар","Көру ақаулары мен түзету тәсілдерін тарсия арқылы сәйкестендіріңдер"],"lab":"blind"},"39":{"n":39,"kind":"p","title":"Есту мүшесінің құрылысы мен гигиенасы","page":160,"sec":9,"codes":["8.1.7.2"],"goal":"Дыбысты қабылдау ерекшеліктерін зерттеу және есту гигиенасының ережелерін сипаттау","recall":"Есту орталығы үлкен ми сыңарларының қандай бөлімінде орналасқан? Қандай жануарда және неге байланысты ең алғаш ортанғы құлақ, ал қандай жануарда сыртқы құлақ пайда болды?","intro":"Есту мүшесінің құрылысы. Құлақ – есту мүшесі. Басқа сүт қоректілердегі сияқты адамда құлақ үш бөлімнен: сыртқы, ортанғы және ішкі құлақтан тұрады. Сыртқы құлақ ең алғаш эволюция барысында тек сүтқоректілерде пайда болды. Оған құлақ қалқаны, сыртқы есту жолы және дабыл жарғағы кіреді. Құлақ қалқаны дыбысты қабылдап, құлақтың ішіне бағыттайды. Есту жолы дыбысты өткізеді. Сонымен қатар есту жолының терісінде құлық бөлетін бездер болады. Ол қорғаныш рөлін атқарып, шаң-тозаң мен зиянды микробтарды ұстап қалады. Есту жолы қалқамен – тығыз, қатты тартылған дабыл жарғағымен аяқталады (91-сурет). Жануарлардың барлық кластарында: қосмекенділер, жорғалаушылар, құстарда дабыл жарғағы ортанғы құлаққа жат","terms":["Сыртқы құлақ","Құлақ қалқаны","Есту жолы","Дабыл жарғағы","Ортанғы құлақ","Есту немесе Евстахий түтігі","Есту сүйекшелері: балғашық","Төстік","Үзеңгі","Ұлудене","Ішкі құлақ","Жартылай иірім өзектер","Вестибула аппараты"],"qs":{"Білу және түсіну":["Есту сүйекшелері дегеніміз не?","Неліктен сыртқы, ортанғы және ішкі құлақ деп бөледі? Олардың қандай айырмашылығы бар?","Құлақтың құрылысы бойынша дыбыс тербелістерінің өту реті қандай?"],"Қолданылуы":["Ортанғы құлақ қызметін сипаттаңдар.","Сыртқы құлақтың құрылысы мен қызметінің ерекшеліктері арасындағы байланысты анықтаңдар.","Вестибула аппараты мен ұлудене құрылысын салыстырыңдар. Ұқсастықтары мен айырмашылықтарын айтыңдар."],"Талдау":["Естудің нашарлау себептері туралы пікірлеріңді айтыңдар.","Өзара байланысын талдаңдар.","Құлақтың құрылысы мен қызметі. Кестені толтырыңдар. Бөлімі Құрылысының ерекшеліктері Қызметі Сыртқы құлақ Ортанғы құлақ Ішкі құлақ"],"Синтез":["«Дыбыс толқындарының құлақ құрылымдары арқылы өтуі» деген тақырыпқа эссе жазыңдар.","Құлақ құрылымындағы элементтердің әрқайсысының рөлін баға лаңдар."],"Бағалау":["Мынадай мәліметтерді бағалаңдар.","Ғалымдар жануарларға жасалған экспериментте жапалақ пен жарғанатты әртүрлі заттар бар, қараңғы ангарға жібереді. Оларды қараңғыда жұмыс істейтін арнайы камералар арқылы бақылады. Жапалақтар қалыпты ұша алмай заттарға соғылып, құлады. Ал жарғанаттар емін-еркін ұшып жүрді. Осыны түсіндіріп көріңдер.","Ғалымдар жануарларға жасаған экспериментте құлақты үкінің басындағы қауырсындарын жұлып тастады. Осыдан кейін құс нашар еститін болды. Себебін айтыңдар."],"Пікірталас":["Сипатталған эксперимент нәтижесін талқылаңдар. №12 зертханалық жұмыс. Есту қабілетін анықтау. 257-бетті қара."]},"gl":[["Сыртқы құлақ","есту жүйесінің сыртқы бөлімі; құлақ қалқаны мен сыртқы есту түтігінен тұрады."],["Ортанғы құлақ","есту жүйесінің бөлімі. Дабыл жарғағынан, ауа толы дабыл қуысынан, ондағы есту сүйекшелерінен (балғашық, төстік, үзеңгі) және жұтқыншақпен жалғасқан евстахий (есту) түтікшесінен тұрады."],["Төстік","дыбыс тербелісін балғашықтан үзеңгіге өткізетін ортанғы құлақтың есту сүйекшесі."],["Үзеңгі","ортанғы құлақтың есту сүйекшелерінің бірі; дыбыс тербелістерін төстіктен ішкі құлаққа береді."],["Вестибула аппараты","кеңістікте бас пен дененің қалпының өзгеруін, сондайақ қозғалу бағытын қабылдайтын сезім мүшесі. Жартылай өзек пен ішкі құлақтың қапшықтарында орналасқан."],["Балғашық","ортанғы құлақтың есту сүйекшесі; дыбыс тербелісін дабыл жарғағынан төстік пен үзеңгіге өткізеді."],["Рецепторлар","сыртқы және ішкі ортадан тітіркендіргіштерді қабылдайтын және жүйке жүйесінің ерекше белсенділігіне түрлендіретін арнайы сезімтал түзілістер."],["Гигиена","өмір сүру және еңбек жағдайының адамның денсаулығына әсерін зерттейтін, аурулардың алдын алу, денсаулық сақтау және өмір сүру жасын ұзарту шарал мпульсінің әсерінен пайда болған биохимиялық мехнизм өте күрделі болады. Бұл биохимиялық өзгеріс, жалпы алғанда, кейбір заттардың жүйке жасушаларындағы өзгерісі болып табылады. Құтышалар тәрізді таяқшаларда да арнайы заттар – көру пигменттері болады. Пигменттер дегенде біз белгілі бір затқа түс беретін заттар деп түсінеміз. Рецептор пигменттерінің де түсі болады, мысалы, көз қарашығының қоңыр, қара, жасыл түсті болуы. Рецептор пигментінің мәні мынада: кванттармен әсерлескеннен кейін қызыл сары түстен олар биохимиялық түске айналған. Нәтижесінде жасушаларда жүйке импульсін түзетін механизмдер пайда бо","terms":["Таяқша тәрізді жасушалар","Құтыша тәрізді жасушалар","Йодопсин","Родопсин","Сары дақ","Түкті жасушалар"],"qs":{"Білу және түсіну":["Таяқшалар не үшін керек, ал құтышалар ше?","Есту рецепторларында қозу неге байланысты жүреді және олар қайда орналасқан?"],"Қолданылуы":["Сары дақ пен соқыр дақтың ұқсастығы мен айырмашылығын айтыңдар.","Есту рецепторлары және вестибула аппараттың арасындағы байланыс ты сипаттаңдар. Олар механорецепторлар екеніне дәлел келтіріңдер."],"Талдау":["Есту анализаторлары арқылы дыбыс, механикалық, электрлік (жүйке импульсі) толқындарының өту сатыларын талдаңдар. Мұның есту мүшесі арқылы өту айырмашылығы неде?","Есту анализаторы арқылы дыбыс, механикалық және электрлік (жүйке импульсі) толқындарының өтуін сызба түрінде бейнелеңдер."],"Синтез":["Талқылаңдар. Ғалымдар жануарларға тәжірибе жасай отырып, жертесер, көртышқан және егеуқұйрықтарда көру мүшесі өте нашар немесе тіпті көрмейтінін дәлелдеген. Кірпілермен салыстырғанда олардың құлақ қалқандары да нашар дамыған. Оның себебі неде екенін түсіндіріп көріңдер.","Фоторецепторларды критерийлері бойынша жүйелеңдер: пигмент типі, торлы қабықтағы орны, жарықты қабылдау, түстерді қабылдау сапасы мен ерекшелігі.","Оларды салыстырыңдар және кестеге түсіріңдер."],"Бағалау":["Австралиялық зерттеуші көз бұршағының дәлме-дәл көшірмесі тәрізді көзәйнек ойлап тапты. Ол көзәйнекті киген кезде қоршаған уді қамтамасыз етеді",1],["Құтышалар әлсіз жарықта ғана жұмыс істейді",0],["Түкті жасушалар механикалық тербелісті жүйке импульсіне айналдырады",1]],"gr":["модель","Көру анализаторының сызбасын (рецептор → жүйке → ми бөлімі) құрыңдар","Есту анализаторының сызбасын құрыңдар","Таяқша мен құтышаны салыстыратын Венн диаграммасын жасаңдар"],"lab":"blind"},"41":{"n":41,"kind":"p","title":"Гормондар арқылы гуморальды реттелу","page":167,"sec":9,"codes":["8.1.7.4","8.1.7.5"],"goal":"Эндокринді, экзокринді және аралас бездердің орналасқан орнын анықтау. Бездердің негізгі қызметтерін түсіндіру","recall":"Адам ағзасының қызметін қандай мүшелер жүйесі реттеп отырады? Барлық жануарларда бұл ағзалар жүйесі дамыған ба? Мұндай мүшелер жүйесі дамымаған жануарлар, әртүрлі өсімдіктер ағзасының қызметі қалай реттеледі?","intro":"Бездердің секреция типтері бойынша жіктелуі. Бездер дегеніміз – безді эпителий жасушаларынан тұратын мүшелер. Бұл жасушаларда қандай да белгілі бір заттар секреттеледі. Бездердің ішінде түзілетін заттарды секреция, ал бөлінетін заттарды секрет деп атайды. Олар түзіліп болған соң, безді эпителий жасушаларының мембранасы арқылы бөлінеді. Безді эпителий жасушаларынан түзілген секреттердің қайда бөлінуіне байланысты бездерді үш топқа бөледі. Сыртқы секреция бездері (экзокринді) дегеніміз – жасушаларында түзілген сұйықтық арнайы өзекшелер арқылы қуыс мүшелерге немесе сыртқа шығарылады. Сыртқа бөліп шығарушы мүшелерге бауыр, сүт, тер, сілекей, май бездері мен қарын және ішек бездері (асқорыту) жат","terms":["Гормондар – ағзаның және жасушалар тобының қызметін өзгертетін","Бір мезгілде бірнеше үдеріске әсер ететін арнайы заттар. Мысалы","Көңіл күй гормоны – адреналин. Ол жүйке жүйесінің симпатикалық бөлімі сияқты жүректің соғу жиілігін арттырады","Қан қысымын көтеріп","Жүректің капиллярларын кеңейтеді","Терінің және асқорыту мүшелер жүйесінің капиллярларын тарылтады","Энергия көзі болып табылатын қанның құрамындағы глюкоза мөлшерін арттырады және т.б. Гуморальды реттелуден басқа біздің ағзамызға жүйкелік реттелу де (ми мен басқа да орталық жүйке жүйесінің бөлімдері арқылы) тән. Ағзаның барлық мүшелерінің жұмысына эндокриндік және жүйке жүйесі бірлесіп әсер етеді. Олардың қызметтері бірін-бірі толықтырып отырады","Демек","Ағза мүшелерінің қызметі нейрогуморальды жолмен реттеледі. Бездер","Секреция","Сыртқы секреция бездері (экзо крин ді)","Ішкі секреция бездері (эндокринді)","Гормондар","Аралас бездер","Гуморальды реттелу","Адреналин","Жүйкелік реттелу","Нейрогуморальды реттелу"],"qs":{"Білу және түсіну":["«Гормон», «бездер», «секрет» сөздеріне анықтама беріңдер.","Сендер сыртқы, ішкі және аралас бездер дегенді қалай түсінесіңдер?","Өсімдіктер, омыртқасыз жануарлар, омыртқалы жануарларда өзін-өзі реттеу қалай жүзеге асатынын сипаттап жазыңдар. қолданылуы:","«Гормон, секрет, өзегі, сыртқы секреция, ішкі секреция» сөздерінің арасында қандай байланыс бар?"],"Талдау":["Адам ағзасының өздерің білетін бездерінің қызметін сызба түрінде түрлі түспен бейнелеңдер.","Неге ішкі және сыртқы секреция бездері сөлдерін сұйықтықтарға бөледі? Өз пікірлеріңді айтыңдар.","Мысалдар келтіріп, дәлелдеңдер."],"Синтез":["Бездер қандай ұлпаға жатады?","Ағза жұмысының реттелуін белгілері бойынша жүйелеңдер. Реттелудің қай түрі бірінші пайда болды, неге?"],"Бағалау":["Табиғатта болатын реттелудің түрлерін түсіндіріңдер.","Адам өміріндегі бездердің маңызын түсіндіріңдер."]},"gl":[["Секреция","безді жасушалардың секрет түзуі және бөлуі."],["Гормондар","ішкі секреция бездері бөлетін биологиялық белсенді заттар. Басқа мүшелер мен ұлпаларға мақсатты әсер етеді."],["Гуморальды реттеу","биологиялық белсенді заттар көмегімен сұйық орта (қан, лимфа, ұлпа сұйықтығы) арқылы жүзеге асырылатын ағзадағы тіршілік әрекеттері үдерісін үйлестіретін механизмдердің бірі."],["Адреналин","бүйрекүсті бездерінен бөлінетін гормон."],["Секрет","безді жасушалар өндіретін және жасайтын заттар (гормондар, тері майы, сүт және т.б.)."],["Сыртқы секреция бездері","арнайы өзектері арқылы сөл бөлетін бездер."],["Айырша без, тимус","иммундық жүйенің орталық мүшесі. Кеуде қуысының көкірек аймағында орналасқан."],["Гипофиз","мидың негізінде орналасқан ішкі секреция бездері."]],"labs":[],"bjb":false,"c":["🦋 Қалқанша без","🧪 Гормон","🩸 Қан","🧠 Гипофиз"],"cs":["Емтихан алдында Аружанның жүрегі қатты соғып, алақаны терлеп, қолы дірілдеді.","Бұл белгілерді қай гормон тудырды?","Ол гормон қай безден бөлінеді?","Гуморальдық реттелудің жүйкелік реттелуден айырмашылығы қандай?"],"tb":["Без түрлері",["Без түрі","Өнімін қайда бөледі","Мысал"],["Эндокриндік (ішкі секреция)","Экзокриндік (сыртқы секреция)","Аралас","Гипофиз"]],"mc":[["Аралас безге жатады:",["Ұйқы безі","Қалқанша без","Тер безі","Гипофиз"],0],["Гормондар таралады:",["Қан арқылы","Өзек арқылы сыртқа","Тері арқылы","Ішекке"],0],["«Бездердің бастығы» деп аталатын без:",["Гипофиз","Эпифиз","Бүйрекүсті","Айырша"],0]],"tf":[["Сілекей бездері – сыртқы секреция бездері",1],["Гормондар өзек арқылы ішекке құйылады",0],["Адреналин бүйрекүсті безінен бөлінеді",1]],"gr":["тарсия","Ішкі секреция бездерінің орналасуын тарсия арқылы адам денесіне орналастырыңдар","Бездер мен гормондарды тарсия арқылы сәйкестендіріңдер","Ішкі, сыртқы және аралас бездерді тарсия арқылы жіктеңдер"],"lab":"glucose"},"42":{"n":42,"kind":"p","title":"Эндокринді безінің қызметі және оларға байланысты аурулар","page":170,"sec":9,"codes":["8.1.7.6"],"goal":"Эндокринді бездер қызметінің бұзылуынан туындаған ауруларды атау","recall":"Эндокринді бездер ағзаның басқа да мүшелері сияқты ауруға шалдығуы мүмкін. Олардың қызметінің бұзылуын үлкен екі топқа бөлуге болады: Ағзада гормондар мөлшерінен көп бөлінсе гиперфункция, мөл шерінен аз бөлінсе гипофункция деп атайды. Гормондардың мөлшерден тыс көп бөлінуі де, аз бөлінуі де қауіпті. Кез келген бездің гипер және гипофункциясы қауіпті ауру тудыруы мүмкін. Ішкі сек реция бездеріне гипофиз, қалқанша без, қалқаншамаңы бездері, айырша без, бүйрекүсті бездері және т.б. бездер жатады. Гипофиз – негізгі ішкі секреция безі (95-суретті қараңдар). Ол аралық мидың астыңғы жағына жіңішке өсінді арқылы бекінеді. Пішіні үрмебұршақ тәрізді, ересек адамдарда салмағы 0,5–0,65 г-ға жетеді. Бұл без 25 түрлі гормон бөледі. Оның гормондары ұйқы безінен басқа бүкіл ішкі секреция бездерінің қызметін басқарады. Гипофиздің соматотропин (өсу) гормоны барлық ұлпа мен ағзаға әсер етеді. Өсу гормоны қаңқа мен бұлшық еттің өсуіне әсер ете отырып, ағзаны дамытады. Егер өсу гормоны жеткіліксіз мөлшерде түзілетін болса, адамның бойы өспей, ергежейлілік пайда болады. Ал артық түзілген жағдайда (гиперфункция) алыптық ауруына шалдығады. Адамның сүйектері 25 жасқа дейін ұзарып өседі. Акромегалия – ересек адамдарда өсу гормонының көп бөлінуінен пайда болатын ауру. Бұл жағдайда адамның саусақтары, аяқ және бет сүйектері ұзарып өседі. Қалқанша без тироксин гормонын бөледі (96-сурет). Тироксин гормоны қалыпты түзілуі үшін ағзада йод жеткілікті болуы керек. Егер де ересек адам тамақпен және сумен жеткілікті мөлшерде йод алып отырмаса, эндемиялық зоб ауруына шалдығады. Бұл – қалқанша безінің ісінуі. Жас балаларда йодтың жетіспеуінен кретинизм ауруы пайда болады. Тироксин ағзадағы зат алмасудың негізгі бөлігін реттейді. Оның қызметіне байланысты ағзада қоректік заттар қорға жиналады (ағзаға қажетті нәруыздар, майлар түзіледі) немесе ыдырап энергия түзіледі. Егер ағзада тироксин аз мөлшерде түзілетін болса, қоректік заттардың барлығы қорға жиналады. Соның салдарынан микседема ауруы пайда болады. Адам семіреді. Оның дене температурасы 35°С болып, үнемі тоңады, күш-қуаты аз, әлсіз болып, ұйқысы келе береді.","intro":"Æîғàðû қàëқàíøàìàңû áåçäåði Қàëқàíøà áåçi 96-сурет. Қалқанша және қалқаншамаңы Òөìåíãi бездері қàëқàíøàìàңû áåçäåði Тироксин мөлшерден көп бөлінген жағдайда қоректік заттардың өте көп бөлігі энергияға жұмсалады. Содан Базедов (бадырақ көз) ауруы пайда болады. Ауру адамның жүйке жүйесі шектен тыс қозады, жүрегі жиі соғып, тыныс алуы жиілейді, дене температурасы 37–38°С болады, ұйқысы қашады, арықтайды, көп тамақ жейді, бірақ жеген тамағы ағзаға сіңбейді. Көздің бұлшық еттеріне күш түсіп, көзі бақырайып кетеді. Мұндай адамдардың жүрегі және басқа да мүшелері тез ауруға шалдығады. Қазақстанда қалқанша безі ауруларының санын азайту мақ сатында йод тапшылығының алдын алуы туралы заң қабылданған. ","terms":["Гиперфункция","Гипофункция","Өсу гормоны","Соматотропин","Адреналин","Норадреналин","Кортикоидтар","Минералокортикоидтар","Глюкокорти коидтар"],"qs":{"Білу және түсіну":["Неліктен қанның құрамындағы көмірсу мөлшері жеген тағам түріне, оның құрамына қарамастан тұрақты болатынын түсіндіріңдер.","Қандай гормондар ағзада зат алмасуға қатысады және олар қандай бездерде түзіледі? қолданылуы:","Гормондардың артық бөлінуінен немесе жетіспеушілігінен пайда болатын аурулардың бір-бірімен байланысын сипаттаңдар. Нақты мысалдар келтіріңдер.","Екінші реттік жыныстық жетілудің белгілері, жыныс бездері бөлетін гормондарды атаңдар."],"Талдау":["Гликогеннің қандай мүшелерде қорға жиналатынын, оның глюкозаға айналуын және оған қандай гормондар қатысатынын сызба түрінде бейнелеңдер.","Эндемиялық зоб пен кретинизм ауруларының пайда болу себебі неде? Аурулардың пайда болуын қандай бездің жұмысымен байланыстыруға болады?","Соматотропты гормондардың түзілуі және оның мөлшерінің өзгерулеріне байланысты пайда болатын аурулардың белгілеріне талдау жасаңдар."],"Синтез":["Ойланып талдаңдар: біздің ағзамызда қандай без гипофизге тәуелсіз және неліктен?","Бүйрекүсті бездерін белгілері бойынша жүйелеңдер. 1. Қай қабатында түзіледі? 2. Әсер ету жылдамдығы қандай? 3. Көңіл күйге немесе зат алмасуға байланысы. 4. Эволюциялық маңызы."],"Бағалау":["Берілген өзгерістерді бағалаңдар: 1. Бірнеше минут ішінде көздің қарашығы үлкейеді, тыныс алу, жүрек соғуы, бұлшық еттің жиырылуы жылдамдайды. 2. Жоғарыдағыдай белгілермен қоса дене температурасы аздап көтеріледі, салмағы кемиді, ұзақ уақыт бойы ұйқысыздық мазалайды. 3. Денедегі ісік, тері астына судың жиналуы, ауа жетіспеушілігі, артық салмақ, үнемі тоңып жүру, ұйқының қанбауы және енжар болу қандай ауру түрін білдіреді?"],"Пікірталас":["«гипофиз ішкі секреция бездерінің ең маңыздысы ма?»"]},"gl":[["Өсу гормоны","гипофиз безінің алдыңғы бөлімінен түзіліп, ағзаның қалыпты өсуі мен зат алмасуды реттейді."],["Адреналин","бүйрекүсті бездерінен бөлінетін гормон."],["Гормондар","ішкі секреция бездері бөлетін биологиялық белсенді заттар. Басқа мүшелер мен ұлпаларға мақсатты әсер етеді."],["Қанның ұюы","қан плазмасында фибриногеннің ерімейтін фибринге еруі нәтижесінде сұйық қанның эластикалық ұйысқан қанға айналуы."],["Инсулин","ұйқы безі бөлетін нәруызды гормон."],["Паратгормон","қалқанша маңы бездерінен бөлініп, қандағы кальций мен фосфор мөлшерінің қалыпты болуын реттейтін гормон."],["Айырша без, тимус","иммундық жүйенің орталық мүшесі. Кеуде қуысының көкірек аймағында орналасқан."],["Гипофиз","мидың негізінде орналасқан ішкі секреция бездері."]],"labs":[],"bjb":false,"c":["🦋 Жемсау","🍬 Қант","📏 Бой","🧂 Йод"],"cs":["Таулы аймақта тұратын тұрғындардың көбінде мойын тұсы ісініп, жемсау пайда болған. Ол жердің суы мен топырағында йод аз.","Бұл ауру қай бездің қызметіне байланысты?","Йодтың рөлі қандай?","Аурудың алдын алудың 2 жолын ұсын."],"tb":["Эндокриндік бездердің аурулары",["Без","Гормон аз бөлінсе","Гормон көп бөлінсе"],["Гипофиз (өсу гормоны)","Қалқанша без","Ұйқы безі (инсулин)","Бүйрекүсті безі"]],"mc":[["Қант диабеті қай гормон жетіспегенде болады?",["Инсулин","Тироксин","Адреналин","Өсу гормоны"],0],["Балалық шақта өсу гормоны аз бөлінсе:",["Ергежейлілік","Алыптық","Базедов ауруы","Микседема"],0],["Базедов ауруы қай без қызметі күшейгенде дамиды?",["Қалқанша без","Ұйқы безі","Гипофиз","Эпифиз"],0]],"tf":[["Йодталған тұз эндемиялық жемсаудың алдын алады",1],["Инсулин қандағы глюкозаны арттырады",0],["Акромегалия ересекте өсу гормоны артық болғанда дамиды",1]],"gr":["рөлдік ойын","«Эндокринолог қабылдауы» – қант диабетінің белгілерін түсіндіріңдер","«Эндокринолог қабылдауы» – қалқанша без ауруларын түсінді талар","Зигота","Споралар","Партеногенез"],"qs":{"Білу және түсіну":["Митозға анықтама беріңдер.","Гаметалар дегеніміз не?","Неліктен жыныстық үдерістерге мейоздық бөліну қажет?","Хромосомалардың гаплоидты және диплоидты жиынтығы дегенді қалай түсінесіңдер?"],"Талдау":["Сүтқоректі жануарлардың (адамның) ұрықтанбаған аналық жұмыртқа жасушалары мен олардың екінші ұрпағындағы хромосома жиынтығының түзілуін сызба түрінде бейнелеңдер.","Эволюция барысында жасушалардың әртүрлі бөлінуі мен гаплоидты және диплоидты жиынтығы бар жасушалардың түзілуі туралы өз пікірлеріңді айтыңдар.","Жоғары сатыда дамыған, ұрықтануға қабілетті кез келген ағзалар үшін хромосома жиынтығының өзгеруі, митоздық және мейоздық бөліну керек екенін нақты мысалдар келтіре отырып дәлелдеңдер."],"Синтез":["Митоз және мейоз құбылыстарын ұқсастығы мен айырмашылық белгілері бойынша жіктеңдер.","Тірі материяның дамуындағы үлкен эволюциялық жетістіктер ретінде мейоздың рөлі туралы эссе жазыңдар.","Денесінде тек ғана гаплоидты жиынтықты хромосомасы бар және ешқашан мейоздық бөліну жүрмейтін ағзалар болуы мүмкін бе?","Биологиялық үдерістерді қамтамасыз етудегі митоздың рөлін бағалаңдар."],"Бағалау":["Жасушалар бөлінуінің әртүрлі үш типі: митоз, мейоз және амитоз туралы реферат жазыңдар.","Білімнің қосымша дереккөздерін пайдалана отырып, «редукцияның үш типі»: зиготалық, гаметалық, споралық туралы өз пікірлеріңді айтыңдар.","Митоз бен мейоз құбылысының табиғаттағы маңызы қандай?"],"Пікірталас":["«Соматикалық редукция» болуы мүмкін бе?"]},"gl":[["Хромосомалар","гендерді тасымалдайтын және жасуша мен ағзаның тұқым қуалайтын қасиеттерін анықтайтын жасуша ядросының органоиды."],["Аналық без","жұмыртқа жасушалары түзілетін және жетілетін аналық жыныс безі."],["Жұмыртқа","жұп аталық жыныс безі."],["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."]],"labs":[],"bjb":false,"c":["🧬 Хромосома","➗ Бөліну","🌱 Өсу","👶 Ұрпақ"],"cs":["Адамның тері жасушасында 46 хромосома бар. Жасуша митозбен бөлінгенде және мейозбен бөлінгенде түзілетін жасушаларды салыстыру керек.","Митоздан кейін неше жасуша, әрқайсысында неше хромосома болады?","Мейоздан кейін ше?","Неге жыныс жасушаларында хромосома саны екі есе аз?"],"tb":["Митоз бен мейозды салыстыру",["Белгі","Митоз","Мейоз"],["Бөліну саны","Түзілетін жасушалар саны","Хромосома жиынтығы","Биологиялық маңызы"]],"mc":[["Хромосомалар экватор бойына тізілетін фаза:",["Профаза","Метафаза","Анафаза","Телофаза"],1],["Мейоз нәтижесінде түзіледі:",["Дене жасушалары","Гаметалар (жыныс жасушалары)","Ұлпалар","Мүшелер"],1],["Митоздың маңызы:",["Өсу және қалпына келу","Гамета түзу","Хромосома санын азайту","Ұрықтану"],0]],"tf":[["Митозда аналық жасушаға ұқсас 2 жасуша түзіледі",1],["Мейоз бір рет бөлінуден тұрады",0],["Мейозда кроссинговер жүреді",1]],"gr":["модель","Пластилиннен митоз фазаларының моделін жасаңдар","Пластилиннен мейоздың I бөлінуінің моделін жасаңдар","Митоз бен мейозды Венн диаграммасымен салыстырыңдар"],"lab":"order","ord":["Митоздың фазалары",["Интерфаза (ДНҚ екі еселенуі)","Профаза","Метафаза","Анафаза","Телофаза","Цитокинез"]]},"46":{"n":46,"kind":"p","title":"Тірі ағзалардың көбею түрлері","page":184,"sec":10,"codes":["8.2.1.1"],"goal":"Жануарлардың көбею тәсілдерін салыстыру","recall":"Жыныстық және жыныссыз көбеюдің бір-бірінен қандай айырмашылықтары бар? Өсімдіктердің вегетативті көбеюінің ерекшелігі неде? Жануарларда да осындай құбылыс болуы мүмкін бе? Жынысты көбеюде жабықтұқымды өсімдіктердің басты мүшесі қандай? Партеногенез деген не? Ол қандай өсімдіктерде жүреді?","intro":"Көбею – жалпы тірі ағзаларға тән қасиет. Тіршілік иелері әртүрлі жолмен көбейеді. Оларды екі түрлі топқа біріктіреді: жыныстық және жыныссыз көбею. Көбеюдің ертерек пайда болған түрі – жыныссыз көбею. Ең алғашқы біржасушалы ағзалар – бактериялар (прокариоттар) жыныссыз жолмен көбейген. Жыныссыз көбейгенде жыныс жасушалары – гаметалар түзілмейді. Жыныстық жолмен көбейгенде гаплоидты хромосомалы гаметалар түзіледі. Бұл жыныс жасушалары ұрықтану үдерісіне қатысады. Табиғатта партеногенез және өздігінен ұрықтану сияқты көбеюдің ерекше түрлері де кездеседі. Жануарлардың жыныссыз көбею түрлері. Біржасушалылардың негізгі көбею жолы – митоз немесе бөліну. Амеба, жасыл эвглена сияқты жәндіктермен бір","terms":["Жыныстық және жыныссыз көбею","Бүршіктену","Бөл шектену (стробиляция)","Қосжыныстылық","Ұрық тану","Партеногенез."],"qs":{"Білу және түсіну":["Жыныстық және жыныссыз көбеюге анықтама беріңдер.","Бүршіктену және бөлшектену дегеніміз не?","«Партеногенез, өздігінен ұрықтану» деген түсініктерге анықтама беріңдер.","Ағзалардың көбею түрлерін сипаттаңдар. қолданылуы:"],"Талдау":["Ағзалардың түр даралары санының артуы мен көбею түрінің арасында қандай байланыс бар екенін анықтаңдар.","Жыныстық көбею анағұрлым ілгерінді жүретінін дәлелдеңдер.","Жыныстық көбею сатыларын талдаңдар.","Жыныстық көбеюдің түрлері: ұрықтану – өздігінен, айқас, қосжыныстылық, әртүрлі жыныстық, партеногенезді сызба түрінде бейнелеңдер."],"Синтез":["Көбею түрлерін шығуы және белгілері бойынша жіктеңдер: 1) атааналарының саны; 2) өзгергіштік дәрежесі; 3) хромосома жиынтығында айырмашылығы бар көбеюге қатысатын жасушалары бойынша; 4) митоз және мейоз; 5) ұрпақ санының көптігі; 6) эволюциялық артықшылығы; 7) жағдайларға тәуелсіздігі бойынша.","Көбеюдің түрлері мен тәсілдері өзара қалай байланысты? Өзгергіштік тұрғысынан партеногенезді жыныссыз жолмен теңестіруге бола ма? Себебі неде және неліктен?","Жыныстық көбеюдің эволюциялық мәні неде? Оның қандай артықшылықтары бар?","Эволюция барысында жыныстық көбею ешқашан пайда болмаған жағдайды модельдеңдер. Егер эволюция барысында жыныссыз көбею ешқашан пайда болмаса ше?"],"Бағалау":["Мынадай құбылыстардың мәнін бағалаңдар. «Қандай жағдайда әртүрлі түр дараларының арасында генетикалық материалдардың алмасуы жүреді? Қандай жағдайда тек гаметалар түзіледі?","Көптеген ғалымдардың айтуынша, омыртқалы жануарлардың арасында партеногенез – өте сирек кездесетін жағдай (түрлердің 0,1%- нан көбі). Ол сүтқоректілерде мүлдем кездеспейді. Сүтқоректілердің дамуында және эволюциялық құбылыс ретінде партеногенездің даму дәрежесі туралы қандай қорытынды шығаруға болады? Ғалым дар Солтүстік Америкада тіршілік ететін жартасты кесірткелерде аталықтары болмайтынын тапқан. Олар шын мәнінде комод айдаһары сияқты партеногенез жолымен көбейетін шығар. Талқылаңдар. Мұны анықтау үшін қандай зерттеулер жүргізуге болады? Қосымша оқуға арналған материал Споралы өсімдіктер. Жер бетінде тіршілік ететін ағзаларды үлкен екі топқа: тұқымды және споралы деп бөледі. Споралы өсімдіктерге мыналар жатады: мүктер, қырықбуындар, плаундар және қырықжапырақтар. Көбінесе қырықбуындар, плаундар және қырықжапырақтарды қырықжапырақтәрізділер тобына біріктіреді. Споралы өсімдіктердің ең маңызды белгісі – спора түзуі. Споралар – көбеюге қабілетті, қолайсыз жағдайлардан қорғайтын қалың қабықшамен қапталған, мамандандырылған жасуша. Көптеген өсімдіктердің споралары ұзақ уақыт құрғақшылық пен суыққа төзе алады. Олар ондаған және мыңдаған жылдар бойы тіршілік қабілетін жоғалтпайды. Споралы өсімдіктер денесі әртүрлі ұлпалар мен мүшелерден тұратын, алғаш рет жер бетінде тіршілік етуге бейімделген жоғары сатыдағы өсімдіктер болып табылады. Құрлықта тіршілік етуге бейімделген споралы өсімдіктер – көпжасушалы жасыл балдырлардың тікелей ұрпағы. Гаплоидты және диплоидты жасушалы өсімдіктер. Төменгі сатыдағы өсімдіктерге балдырлар жатады. Олардың денесі ұлпаларға және мүшелерге бөлінбейді, тек бірдей жасушалардан тұрады. Бұл жағдайда жасыл балдырлардың денесінің жасушалары гаплоидты болады. Яғни дене жасушалары бірдей хромосомалардан тұрады. Мұндай ағзалардың гаметалары митоз жолымен түзіледі. Содан соң гаплоидты гаметалар қосылып, ұрықтанады. Спермий мен жұмыртқа жасушасының гаплоидты хромосомаларының қосылуынан жұп хромосомалы жасушалар – диплоидты зигота түзіледі. Содан соң зиготаның өзі мейоз жолымен бөліне бастайды. 4 гаплоидты жасушалар түзіледі. Олардың әрқайсысы балдырдың еншілес жатқан жас жасушаларының бастамасы болады. Ең алғаш құрлыққа шыққан өсімдіктердің денесі гаплоидты хромосомалы болған деген болжам бар. Осы уақытқа дейін бұл құрылыс мүктерде сақталған. Біз табиғатта кездестіретін мүктердің дене жасушалары бірдей хромосомалардан тұрады. Қазіргі уақытта жер бетіндегі барлық басқа өсімдіктер диплоидты жасушалардан пайда болған. Олардың не споралары, не гаметалары споралы болуы мүмкін."]},"gl":[["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."],["Аналық без","жұмыртқа жасушалары түзілетін және жетілетін аналық жыныс безі."],["Аталық без","сперматозоидтер мен жыныс гормондары (тестостерон және т.б.) түзілетін аталық жыныс бездері."],["Жұмыртқа","жұп аталық жыныс безі."],["Гермафродитизм (Гермафродитос","мифтік қосжынысты тіршілік иесі, ежелгі грек құдайлары – Гермес пен Афродитаның баласы) – бір дарада аталық әрі аналық мүшелердің болуы."],["Жұмыртқа жасушалары","ұрықтану нәтижесінде немесе партеногенез жолымен жаңа ағза дамитын аналық жыныс жасушасы."]],"labs":[],"bjb":false,"c":["🥚 Жұмыртқа","🪸 Гидра","🐛 Құрт","🍓 Құлпынай"],"cs":["Аквариумдағы гидраның денесінде бүршік пайда болып, кейін ол бөлініп жаңа гидра түзілді. Күзде сол гидрада аталық және аналық жыныс жасушалары түзілді.","Гидра көбеюдің қандай екі түрін көрсетті?","Неге күзде жынысты көбеюге көшеді?","Жынысты көбеюдің артықшылығы неде?"],"tb":["Көбею тәсілдері",["Тәсіл","Ерекшелігі","Мысал"],["Бөліну","Бүршіктену","Вегетативтік","Жынысты"]],"mc":[["Бүршіктену арқылы көбейеді:",["Гидра","Тауық","Бақа","Ит"],0],["Партеногенез дегеніміз:",["Ұрықтанбаған жұмыртқадан даму","Бүршіктену","Бөліну","Споралану"],0],["Жыныссыз көбеюде ұрпақ:",["Ата-анасына генетикалық ұқсас","Әртүрлі","Мутант","Тек аналық"],0]],"tf":[["Жынысты көбею генетикалық әртүрлілікті арттырады",1],["Бактериялар жынысты жолмен ғана көбейеді",0],["Гермафродиттерде аталық және аналық жыныс бездері бір дарақта болады",1]],"gr":["кл  болмайды. Себебі, споралар мен гаметофиттердің гаплоидты кезеңдері бүрлердің немесе гүлдің ішінде бірнеше жасуша көлеміне дейін кішірейген. Барлық тұқымды өсімдіктердің тіршілік циклінде спорофиттің диплоидты кезеңі басым болады. Қы","terms":["Мегаспорофит","Мегагаметофит","Мегаспорогенез","Микрогаметогенез","Бүр","Вегетативті және генеративті жасушалар."],"qs":{"Білу және түсіну":["«Бүр, тұқым, мегаспорогенез, микрогаметогенез, микроспорогенез, мегагаметогенез» деген түсініктерге анықтама беріңдер.","«Тұқымды өсімдіктердің тіршілік циклінде ядролық фазаларының ауысуы» деген ұғымды қалай түсінесіңдер?","Жасушалар қандай әдіспен бөлінген кезде тұқымды өсімдіктерде гаметалар түзіледі?","Ашықтұқымды өсімдіктердің аталық, аналық гаметалары және микро-, мега споралары қашан, қайда (қандай құрылымдарда), қашан түзіледі?"],"Қолданылуы":["Неліктен тұқымды өсімдіктердің тіршілік циклінде гаплоидты кезеңі көрінбейді және жеке құрылым ретінде қатыспайды?","Ашықтұқымдылардың бүрлері қандай қызмет атқарады?","Жабықтұқымдылардың гүлі қандай қызмет атқарады?","Ашықтұқымдылар мен жабықтұқымдылардың ұрықтануы, гаметалары мен спораларының түзілу үдерісі қайда жүретінін салыстырыңдар."],"Талдау":["Жасушалардағы хромосома санын, митоз және мейоз, микрожәне мегаспорангийлер, гаметалар, зигота, ұрықтану, көпжасушалы эмбрионды көрсете отырып, «гүлді өсімдіктердің тіршілік циклі» деген сызба сызыңдар.","Жасушалардағы хромосома санын, митоз және мейоз, микрожәне мегаспорангийлер, гаметалар, зигота, ұрықтану, көпжасушалы эмбрионды көрсете отырып, «ашықтұқымды өсімдіктердің тіршілік циклі» деген сызба сызыңдар.","Ашықтұқымдылар мен жабықтұқымдылардың көбеюіндегі айырмашылықты көрсетіңдер."],"Синтез":["Жер бетінде споралы өсімдіктерден бұрын тұқымды өсімдіктердің пайда болу мүмкіндігін талдаңдар.","Тұқымды өсімдіктердің тіршілік цикліне жалпы сипаттама беріңдер.","Тұқымның түзілуінің эволюциялық маңызы қандай? Оның артықшылығы неде?"],"Пікірталас":["Тұқымды өсімдіктер өзінің тіршілік циклімен Өскін","Ересек өсімдік"]]},"49":{"n":49,"kind":"p","title":"Мүшелер жүйесінің дамуы – эмбриогенездің сатылары","page":198,"sec":11,"codes":["8.2.3.1","8.2.3.2"],"goal":"Эмбрионалдық даму кезеңдерін сипаттау. Әртүрлі ұрық жапырақшаларынан қалыптасатын ұлпалар мен мүшелердің дифференциялануын сипаттау","recall":"Бластула, гаструла, нейрулла және органогенез деген не екенін еске түсіріңдер.","intro":"Эмбриогенездің негізгі сатылары. Естеріңде болса, ағзалардың жеке дамуы эмбриогенез және постэмбриогенез деп екіге бөлінеді. Эмбриогенездің негізгі сатыларын сызба түрінде көрсетуге болады: Зигота Бөлшектену Бластула Гаструла Нейрула Органогенез Егер ағза жынысты жолмен көбею нәтижесінде түзілетін болса, эмбрионды (ұрықтық) дамуы ұрықтанған жұмыртқа жасушасынан, зигота түзілу сатысынан басталады. Егер ағза партеногенез жолымен түзілген болса, дамудың бірінші сатысы ұрықтанбаған жұмыртқа жасушасының бөлінуінен басталады. Егер ағза жыныссыз көбею нәтижесінде түзілген болса, онда эмбриогенездік даму жүрмейді, себебі ол кезде ұрық түзілмейді. Ағзалардың көптеген түрлерінде ұрықтанғаннан кейін зи","terms":["Эмбриогенез","Постэмбриогенез","Зигота","Бөлшектену","Бластула","Гаструла","Нейрула","Органогенез","Эктодерма","Мезодерма","Энтодерма"],"qs":{"Білу және түсіну":["Мынадай терминдерге анықтама беріңдер: «эмбриогенез», «бластула», «бөлшектену», «зигота».","Гаструла және нейрула деген не?","Неліктен гаструла ерте және соңғы деп бөлінеді?","Ұрық жапырақшалары не үшін керек екенін түсіндіріңдер. қолданылуы:"],"Талдау":["Эмбрионның даму сатыларын (кезеңдерін) талдаңдар.","Белгілі бір ұрық жапырақшаларынан белгілі бір мүшелердің даму себебін түсіндіріңдер.","Кестені толтырыңдар. № Мүше Эктодерма Мезодерма Энтодерма 1 Ми 2 Қаңқа бұлшық еттері 3 Бауыр 4 Ашішектің эпителийі 5 Терінің эпителийі 6 Ішкі секреция бездері 7 Май және тер бездері 8 Жүрек 9 Өкпе 10 Бүйректер 11 Сүйектер"],"Синтез":["Неліктен жыныссыз жолмен көбейетін ағзаларда эмбриогенездің сатылары болмайтынын талқылаңдар." рақшалары және олардан дамитын мүшелер",["Ұрық жапырақшасы","Дамитын мүшелер/ұлпалар"],["Эктодерма","Мезодерма","Эндодерма","Нейрула кезеңі"]],"mc":[["Жүйке жүйесі дамитын ұрық жапырақшасы:",["Эктодерма","Мезодерма","Эндодерма","Бластодерма"],0],["Бластула дегеніміз:",["Бір қабатты көпжасушалы ұрық","Екі қабатты ұрық","Зигота","Личинка"],0],["Қаңқа мен бұлшық еттер дамиды:",["Мезодермадан","Эктодермадан","Эндодермадан","Сарыуыздан"],0]],"tf":[["Ұсақталу – зиготаның митозбен бөлінуі",1],["Эндодермадан тері эпидермисі дамиды",0],["Гаструлада ұрық жапырақшалары түзіледі",1]],"gr":["модель","Пластилиннен зигота → бластула кезеңдерінің моделін жасаңдар","Пластилиннен гаструла моделін жасап, қабаттарын белгілеңдер","Ұрық жапырақшалары мен мүшелердің кластерін құрыңдар"],"lab":"order","ord":["Эмбриогенез кезеңдері",["Зигота","Ұсақталу","Бластула","Гаструла","Нейрула","Органогенез"]]},"50":{"n":50,"kind":"p","title":"Тұқымқуалаушылық және өзгергіштік заңдылықтары","page":203,"sec":12,"codes":["8.2.4.1"],"goal":"Тұқымқуалаушылық пен өзгергіштіктің эволюциядағы рөлін дәйектеу","recall":"Тұқымқуалаушылыққа қандай жасушалар мен құрылымдар жауап береді? Мутация мен модификация нәтижесінде пайда болған тұқымқуалаушылық белгілері мен тұқымқуалаушылықтың айырмашылығы неде?","intro":"Тұқымқуалаушылық пен өзгергіштік – тірі ағзаларға тән ортақ қасиет. Тұқымқуалаушылық – тірі ағзалардың ата-аналарына ұқсау қабілеті (105-сурет). Яғни ататектеріне тән қасиеттерді сақтап, ол белгілерді ұрпақтарына береді. Көбею кезінде тірі ағзалардың бұл қасиеттері ДНҚ-ның бөлінуі (репликациясы) арқылы генетикалық ақпараттардың ұрпақтарына берілуін қамтамасыз етеді. Өзгергіштік – тірі ағзалардың өз ата-аналарынан ерекшелену қасиеті. Түр даралары жынысты жолмен көбейген кезде ата-аналарының белгілерін толығымен көшіріп ала алмайды. Олар ата-аналарының екеуінің де қасиеттерін өз ағзасында біріктіреді. Шынында, жыныссыз көбею кезінде де даралар ата-аналарының толық көшірмесі бола алмайды. Өзгер","terms":["Тұқымқуалаушылық","Өзгергіштік","Эволюция","Тұқым қуалайтын өзгергіштік","Мутациялық","Үйлесімді (комбинативтік) және модификациялық (тұқым қуаламайтын) өзгергіштік","Бейімделу"],"qs":{"Білу және түсіну":["Тұқымқуалаушылық және өзгергіштік деген түсінікке анықтама беріңдер.","Бейімделу деген не?","Тұқымқуалаушылық пен өзгергіштіктің арасында қандай айырмашылық бар екенін түсіндіріңдер.","Тірі табиғатта бейімделмеген ағзалар болуы мүмкін бе? қолданылуы:"],"Талдау":["Эволюция барысында өзгергіштіктің қай түрінің рөлі аз және неге олай екенін талдаңдар, оны түсіндіріңдер.","Эволюция үдерісі мен бейімделу қалыптасуының себептері туралы өз пікірлеріңді айтыңдар.","Пайдалы тұқым қуалайтын өзгергіштік ұзаққа созылатынын мысалдар келтіре отырып дәлелдеңдер."],"Синтез":["Эколог ғалымдар неліктен «адам табиғи сұрыпталуға қарсы сұрыпталу жүргізіп жатыр» деп айтатынын талқылаңдар.","Бейімделудің қоректік, климаттық, қорғаушы, көбеюге байланысты әртүрлі типтерін жүйелеңдер.","Эволюциялық үдерістегі тұқымқуалаушылық пен өзгергіштіктің рөлі туралы эссе жазыңдар."],"Бағалау":["Өздерің тұратын жердегі өсімдіктерге немесе жануарларға тән тұқым қуалайтын және тұқым қуаламайтын бейімделу туралы реферат жазыңдар."],"Пікірталас":["Өз пікірлеріңді айтыңдар: «Неліктен арыстандар, киттер, піл, ақбөкен сияқты және т.б. жануарлар жақсы бейімделгендігіне қарамастан жойылып кету қаупінде тұр?»","Ч. Дарвиннің айтуы бойынша: «Табиғи сұрыпталу – эволюцияның басты факторы, эволюцияның қозғаушы күші» деген пікірді бағалаң дар. Сендер онымен келісесіңдер ме? Дарвиннің пікіріне дәлелдер келтіре отырып, «қарсымын», «қарсы емеспін» деп талқылаңдар."]},"gl":[["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."],["Мутациялар","табиғи немесе жасанды түрде пайда болатын ағзаның генетикалық материалындағы – хромосомалары мен гендеріндегі қайта құрулар мен бұзылуы нәтижесінде тұқым қуалайтын қасиеттерінің өзгерістері."],["Көбею, репродукция","тіршіліктің үздіксіздігі мен сабақтастығын қамтамасыз ететін, өзіне ұқсас ұрпақ беру қасиеті."]],"labs":[],"bjb":false,"c":["👨‍👩‍👧 Отбасы","🫛 Асбұршақ","🧬 Ген","🔀 Өзгергіштік"],"cs":["Ата-анасының көзі қоңыр, ал баласының көзі көк болып туды. Отбасы таңғалды.","Бұл қалай мүмкін? Ата-ананың генотипін жаз (А – қоңыр).","Пеннет торымен ұрпақтың ықтималдығын есепте.","Тұқымқуалаушылық пен өзгергіштіктің айырмашылығы неде?"],"tb":["Өзгергіштік түрлері",["Түрі","Себебі","Тұқым қуалай ма","Мысал"],["Модификациялық","Мутациялық","Комбинативтік","Мейоздағы кроссинговер"]],"mc":[["Генетика ғылымының негізін салушы:",["Г. Мендель","Ч. Дарвин","Т. Морган","Н. Вавилов"],0],["Аа × Аа шағылыстыруда рецессивті белгілі ұрпақ үлесі:",["25%","50%","75%","0%"],0],["Тұқым қуаламайтын өзгергіштік:",["Модификациялық","Мутациялық","Комбинативтік","Генотиптік"],0]],"tf":[["Мутациялар тұқым қуалайды",1],["Фенотип тек генотипке байланысты, ортаға тәуелсіз",0],["Өзгергіштік табиғи сұрыпталуға материал береді",1]],"gr":["зерттеу","Сыныптастардың құлақ сырғалығы, тілді түтікше ету белгілерін зерттеп, кестеге түсіріңдер","Бір өсімдіктің 20 жапырағының ұзындығын өлшеп, вариациялық қатар құрыңдар","Асбұршақтың моногибридті шағылыстыру есебін шешіп, Пеннет торын салыңдар"],"lab":"punnett"},"51":{"n":51,"kind":"p","title":"Қолдан сұрыптау","page":206,"sec":12,"codes":["8.2.4.2"],"goal":"Ағзалар селекциясы үшін қолдан сұрыптаудың маңызын сипаттау","recall":"Эволюция дегеніміз не? Табиғи сұрыпталу деген не? Қолдан сұрыптауды кім жүргізеді?","intro":"Селекция, эволюция және сұрыптау. Ч. Дарвиннің пікірінше, эво люцияның басты қозғаушы күші – табиғи сұрыпталу. Табиғи сұрыпталу белгілі бір табиғи жағдайда тіршілік етуге бейімделген ағзалардың тіршілік үшін күресінің нәтижесі. Табиғи сұрыпталудың нәтижесінде өзіне пайдалы көптеген бейімделушілік ерекшеліктері бар ағзалардың белгілі бір түрлері мен даралары тірі қалып, көбейе алады. Ал нашар бейімделген түрлер мен ағзалар табиғи сұрыпталудың нәтижесінде толығымен тіршілігін жояды. Қолдан сұрыптаудың нәтижесінде өсімдіктер мен жануарлардың адамға қажетті белгі-қасиеттері дамиды. Қолдан сұрыптау табиғатта емес, адамның қатысуымен жүреді. Оның нәтижесінде жануарлардың жаңа қолтұқымдары мен өсім","terms":["Эволюция","Селекция","Қолдан сұрыптау: жаппай және жеке","Жағымды және жағымсыз"],"qs":{"Білу және түсіну":["Селекция дегеніміз не?","Қолдан сұрыптау неліктен селекцияның негізгі әдісі екенін түсіндіріңдер.","Қолдан сұрыптаудың түрлерін сипаттаңдар.","Селекция ғылымының қашан және қалай дамығанын түсіндіріңдер. қолданылуы:"],"Талдау":["Жеке және жағымды сұрыптауға қарағанда жаппай және жағымсыз сұрыптаудың нәтижесі төмен болатындығы туралы өз пікірлеріңді айтыңдар.","Қолдан сұрыптаудың нәтижесінде пайда болған ағзалардың (іріктемелер, қолтұқымдар) табиғи жағдайға бейімделуі олардың жабайы туыстарына қарағанда анағұрлым төмен болатынын мысалдар келтіре отырып дәлелдеңдер.","«Жануарлар селекциясы» мен «өсімдіктер селекциясының» сызбасын сызыңдар."],"Синтез":["«Мен селекционер болғанымда...» тақырыбына эссе жазыңдар.","Адамдарды азық-түлікпен қамтамасыз етудегі селекция ғылымының рөлін бағалаңдар.","Қолдан және табиғи сұрыптау үдерістерінің арасында қандай ұқсастықтар мен айырмашылықтар бар екенін атаңдар. Көрсеткіш терін кестеге жазыңдар.","«Жыныстық сұрыптау» және «клондау» терминдерімен толықтыра отырып, «Қолдан сұрыптаудың түрлері» деген тақырыпқа сызба сызыңдар."],"Бағалау":["«Селекция – адам қолымен жасалатын эволюция» деген пікірдің дұрыс екендігін талқылаңдар.","«Қолдан сұрыптаудың нәтижесінде алынған өсімдіктердің жаңа іріктемелері мен жануарлардың жаңа қолтұқымдарының тіршілік қабілеті табиғи жағдайда табиғи сұрыптаудың нәтижесінде пайда болған жаңа түрлерге қарағанда әлсіз болатыны» туралы өз пікірлеріңді айтыңдар."]},"gl":[["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."]],"labs":[],"bjb":false,"c":["🐄 Сиыр","🌾 Бидай","✂️ Іріктеу","🏆 Тұқым"],"cs":["Фермер ең көп сүт беретін сиырларды ғана көбейтіп, 20 жыл ішінде табынның орташа сүт беруін екі есе арттырды.","Фермер қандай әдісті қолданды?","Бұл әдістің табиғи сұрыпталудан айырмашылығы неде?","Қолдан сұрыптаудың тағы 2 мысалын келтір."],"tb":["Табиғи және қолдан сұрыптау",["Белгі","Табиғи сұрыптау","Қолдан сұрыптау"],["Сұрыптаушы фактор","Кімге пайдалы","Нәтижесі","Жылдамдығы"]],"mc":[["Қолдан сұрыптауды жүзеге асырады:",["Адам","Табиғат","Жыртқыштар","Климат"],0],["Жаппай сұрыптау қолданылады:",["Айқас тозаңданатын өсімдіктерге","Тек жануарларға","Тек бактерияларға","Саңырауқұлақтарға"],0],["Селекция ғылымының міндеті:",["Жаңа сорт пен тұқым шығару","Жаңа түр табу","Қазба зерттеу","Ауруды емдеу"],0]],"tf":[["Жеке сұрыптауда әр дарақтың ұрпағы тексеріледі",1],["Қолдан сұрыптауда ағзаның өзіне пайдалы белгілер сақталады",0],["Будандастыру – селекция әдісі",1]],"gr":["рөлдік ойын","«Селекционер-өсімдік шаруашылығы» ретінде бидайдың жаңа сортын шығару жоспарын құрыңдар","«Селекционер-мал шаруашылығы» ретінде қой тұқымын жақсарту жоспарын құрыңдар","«Табиғат» ретінде табиғи сұрыпталудың нәтижесін көрсетіңдер"],"lab":"selection"},"52":{"n":52,"kind":"p","title":"Мәдени өсімдіктер мен үй жануарларының шығу орталықтары","page":209,"sec":12,"codes":["8.2.4.3"],"goal":"Мәдени өсімдіктер мен үй жануарларының шығу орталықтарын зерттеу","recall":"Өсімдіктер мен жануарлар селекциясының бірінші кезеңі қандай? Н.И. Вавилов туралы не білесіңдер?","intro":"Селекция ғылымының маңызды бөлігі түрлердің арғытектері туралы ілім. Оның негізін салуға атақты орыс ғалымы, генетик Николай Иванович Вавиловтың қосқан үлесі зор. Ол ХХ ғасырдың 20–30-жылдарында қызметкерлерімен бірлесіп, дүниежүзінің әр түкпіріне 60-тан астам экспедиция жасады. Зерттеу барысында Австралиядан басқа барлық кон14–3459 209 тиненттерден мәдени өсімдіктердің арғытектері болып табылатын материалдар жинады. Жабайы түрлердің барлық мүмкіндігі бар тұқымдық материалдарының жиынтығы осы көпжылдық зерттеулердің нәтижесі болып табылады. Ол қазір Санкт-Петербургтегі Өсімдік шаруашылығы институтында сақтаулы тұр. Институт ұжымы бұл құнды генетикалық материалдарды 1942–1943 жылдары Ленингра","terms":["Мәдени өсімдіктердің шығу орталығы және жануар ларды қолға үйрету."],"qs":{"Білу және түсіну":["Мәдени өсімдіктер мен үй жануарларының шығу орталығын зерттеу не үшін керек екенін түсіндіріңдер.","Әртүрлі орталықтардан шыққан өсімдіктердің түрлеріне және олардың шығу тегіне сипаттама беріңдер.","Мәдени өсімдіктер мен үй жануарлары қашан және қалай пайда болғанын түсіндіріңдер.","Мәдени өсімдіктердің шығу орталықтарын қай ғалым ашты?"],"Қолданылуы":["Оңтүстік Азия қандай өсімдіктердің шығу орталығы болып табылады?","Оңүстік-Батыс Азия орталығы қандай жануарлардың шығу орталығы болып табылады?","Әртүрлі орталықтан шыққан мәдени өсімдіктердің түр санын салыстырыңдар."],"Талдау":["«Мәдени өсімдіктердің және үй жануарларының шығу орталықтары, сол түрдің ежелгі өркениетті шығу орталығы» деген сызба сызыңдар.","Үй жануарларының шығу тегін қолға үйретілген реті бойынша талдаңдар.","Қазіргі кездегі өсімдіктердің мәдени түрлері мен жабайы түрлерінің арасындағы айырмашылықты көрсетіңдер.","Қазіргі кездегі жануарлардың қолтұқымдары мен ежелгі арғы тегінің арасындағы айырмашылықты көрсетіңдер."],"Синтез":["Азиядағы орталықтарда шығарылған өсімдіктерге жалпы сипаттама беріңдер.","Еуропа мен Африкадағы орталықтарда шығарылған өсімдіктерге жалпы сипаттама беріңдер.","Жаңа әлем аумағындағы орталықтарда шығарылған өсімдіктерге жалпы сипаттама беріңдер.","Жағдайды модельдеңдер. Қазіргі кездегі қолдан шығарылған өсімдіктер мен жануарлардың қасиеттері қалай өзгереді? Оларды шығаруда қандай әдістер қолданылуы мүмкін?"],"Бағалау":["«Жасыл революция» тақырыбына реферат жазыңдар. Бұл үдеріс «Мәдени өсімдіктердің шығу орталықтары мен мәдени өсімдіктердің алғашқы және арғы тегі болып табылатын өсімдік тұқымдарының жинақтамасын жинау» туралы ілім болмаса, жүзеге асуы мүмкін бе?","Мәдени өсімдіктерді шығарудың адам өміріндегі және табиғаттағы маңызы қандай екенін бағалаңдар.","Жануарларды қолға үйретудің адам өміріндегі және табиғаттағы ма дар: арпа, сұлы, тары, күріш, жүгері, дәнді-бұршақты дақылдар және т.б. өсіріледі. Сырдария, Іле және Қаратал өзендерінің сағаларында күріштің суғармалы алқаптары бар. Қазақстанның оңтүстігі мен оңтүстік шығысында техникалық дақылдар өсіріледі. Олардың ішінде мақта өсімдігі, қант қызылшасы, зығыр, күнбағыс және т.б. аса маңызды. Сонымен қатар бау-бақша және жүзім шаруашылығы да дамыған. Қазақстан Республикасы ауылшаруашылық жерлерінің төрттен үш бөлігін жайылым алып жатыр. Малшаруашылығы – еліміздің ауылшаруашылығының ежелгі және негізгі саласының бірі. Оның маңызды саласы – қойшаруашылығы мен ірі қара өсіру. Сондай-ақ құс, жылқы, түйе өсіру де жақсы дамыған. Қазақстандағы селекция ерекшеліктері. Қазақстандағы селекция ның мақсаты – біздің елімізге тән ерекше табиғи-климаттық жағ дайларға бейімделген мәдени өсімдіктер мен үй жануарларының түрлерінің шығару үдерісі. Дәстүрлі түрде Қазақстан аумағында халық селекциясы нәтижесінде мәдени өсімдіктер мен үй жануарларының көптеген сұрыптары мен тұқымдары (қолтұқымдары) алынған. Халық селекциясы нәтижесінде мүйізді ұсақ малдардан құйрықты қой тұқымы дамыды. Ал өсімдіктерден бидай, алма және т.б. сұрыптары шығарылды. Қазақстан ғалымдарының өсімдіктер мен жануарлар селекциясы саласындағы жетістіктері. Өсімдіктер селекциясын дамытуға ҚР ҰҒАның академигі, профессор В.П. Кузьмин елеулі үлес қосты. Ол Солтүстік Қазақстанда дәнді, майлы және басқа дақылдар селекциясы мен тұқымшаруашылығының бірқатар теориялық әрі әдістемелік негіздерін дамытты. Профессор Н.Л. Удольская (1906–1986) өсімдіктердің құрғақшылыққа төзімділігіне теориялық тұрғыда жаңа көзқарасты негіздеді. Ол бидайдың аудандастырылған төрт және «Казахстанская-126» сұрыптары бойынша моносомдық сұрыптармақ сериясының авторы болып табылады. «Ка-","intro":"захстанская-126» – жаздық бидайдың қатты сұрыбы. Ол жергілікті жағдайларға жақсы бейімделген. ХХ ғасырдың соңынан бастап бұл сұрып аудандастырылған аймақта (Орал, Ақтөбе және Шығыс Қазақстан өңірінде) жетекші орында және е болатынын болжаңдар.","Суретке қараңдар. Мына популяциялардың құрылымы туралы не айта аласыңдар? Ол неге дәлел бола алады?"],"Талдау":["Кжәне rстратегияларының бір-бірінен айырмашылығын сызба түрінде бейнелеңдер.","Жүктіліктің ұзақ мерзімі, тәрбиелеу және жақсы бейімделген түрлердің тірі қалуы қандай стратегияға жататыны туралы өз пікірлеріңді айтыңдар."],"Синтез":["Эндемиктердің популяциялық сипаттамасының ерекшелігі неде екенін талқылаңдар.","Тұрақты, қысқаратын, жойылатын және анық болмаған популяциялар арасындағы айырмашылықтар неден тұратынын анықтаңдар."],"Бағалау":["Басқа жануарларға қарағанда маймылдар ұрпағына ұзағырақ қамқорлық жасайтыны туралы өз пікірлеріңді айтыңдар. Бұл стратегияның қандай түрі екенін дәлелдеңдер.","Үдерісті талдаңдар. Кенгуру ұрықтанғаннан кейін шамамен бір айдан кейін туады. Ұрпағы туған кезде толық дамымаған болып, оның келесі дамуы анасының қалтасында жалғасады. Осы уақыттың барлығында анасының сүтімен қоректенеді. Бұл уақытта анасының ағзасында басқа екінші жүктілік кезеңі басталады. Бірақ қалтасындағы төлі анасының сүтімен қоректенуін тоқтатып және қалтаны босатпайынша, пайда болған жаңа зигота дамымайды. Қалай ойлайсыңдар, бұл мысалды стратегиялардың біреуіне жатқызуға бола ма? Жауаптарыңды негіздеңдер."]},"gl":[["Эндемик, жергілікті түрлер","салыстырмалы түрде шағын аумақта таралған өсімдіктер мен жануарлар түрлері."],["Аналық без","жұмыртқа жасушалары түзілетін және жетілетін аналық жыныс безі."],["Аталық без","сперматозоидтер мен жыныс гормондары (тестостерон және т.б.) түзілетін аталық жыныс бездері."],["Жастық шақ","бал дәурен шақтан кейінгі есейген кезге дейінгі өмір кезеңі; ағзаның тіршілік ету күші жинақталады және дамиды."],["Эволюция","тірі табиғаттың қайтымсыз тарихи дамуы."],["Эндемия","қандай да бір аумақта белгілі бір ауру түрінің (көбінесе жұқпалы) үнемі болуы."]],"labs":[],"bjb":false,"c":["🦌 Киік","👥 Топ","📈 График","🗺️ Аумақ"],"cs":["Бетпақдала киіктерінің саны 2015 жылы аурудан күрт азайды, бірақ кейінгі жыл
